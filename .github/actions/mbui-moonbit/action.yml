# MoonBit for a job, as the moonbit workflow put its latest release in the Actions cache (each release once, by its
# downloads' ETags): restored, never downloaded here. No cached release for this runner's OS and architecture: the job
# fails saying so (run the moonbit workflow), not a download that now and then breaks off (cli.moonbitlang.com's
# SSL_ERROR_SYSCALL, 2026-10-20). Into the runner's own tool cache (moon-ci). MOON_HOME and PATH for the
# steps after it; `moon version --all` said.
name: MoonBit
description: The latest MoonBit, from the cache the moonbit workflow fills
runs:
  using: composite
  steps:
    # The newest release put in, looked up only: nothing downloaded yet
    - uses: actions/cache/restore@v4
      id: newest
      with:
        # (in the runner's own tool cache: two runners on one machine (Mini1's) shared ~/.moon-ci, and one's restore wrote
        # over the MoonBit the other's tests were running with: moon test said nothing, run 39532570138. A self-hosted
        # runner's put in and taken out at moon-ci-put, in its workspace, then moved there: an entry is found only by the
        # path it was saved at, as written, and each of Mini1's runners has a tool cache of its own, so only the one the
        # moonbit workflow put it in from ever found it, the others failing at each new release once theirs was gone:
        # main's web deploy on mini1-2, twice, 2026-10-31, 41173735373)
        path: ${{ runner.environment == 'self-hosted' && 'moon-ci-put' || format('{0}/moon-ci', runner.tool_cache) }}
        # (no key is this one: the newest of this prefix, the latest release the moonbit workflow put in)
        key: moonbit-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-none
        restore-keys: moonbit-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
        lookup-only: true
    # A self-hosted runner's tool cache stays from one job to the next: the release restored there before (its key in
    # moon-ci.key beside it) is not downloaded again. Mini1's mbui jobs each took the same ~104 MB from the Actions
    # cache through the proxy its DNS sends GitHub to, ~13 GB a day (2026-10-23). GitHub's runners start with none.
    - id: kept
      shell: bash
      env:
        KEY: ${{ steps.newest.outputs.cache-matched-key }}
      run: |
        t="$RUNNER_TOOL_CACHE"; [ "${{ runner.os }}" != Windows ] || t=$(cygpath -u "$t")
        if [ -n "$KEY" ] && [ "$(cat "$t/moon-ci.key" 2>/dev/null)" = "$KEY" ] && { [ -x "$t/moon-ci/bin/moon" ] || [ -x "$t/moon-ci/bin/moon.exe" ]; }; then
          echo "MoonBit $KEY kept in the tool cache: not downloaded again"
          echo "kept=true" >> "$GITHUB_OUTPUT"
        fi
    # (its key said only once it is restored: a download that breaks off is a warning of actions/cache's, the files
    # left as they were)
    - if: steps.newest.outputs.cache-matched-key != '' && steps.kept.outputs.kept != 'true'
      shell: bash
      run: |
        t="$RUNNER_TOOL_CACHE"; [ "${{ runner.os }}" != Windows ] || t=$(cygpath -u "$t")
        rm -f "$t/moon-ci.key"
    - if: steps.newest.outputs.cache-matched-key != '' && steps.kept.outputs.kept != 'true'
      uses: actions/cache/restore@v4
      id: moon
      with:
        path: ${{ runner.environment == 'self-hosted' && 'moon-ci-put' || format('{0}/moon-ci', runner.tool_cache) }}
        key: ${{ steps.newest.outputs.cache-matched-key }}
    - shell: bash
      env:
        KEY: ${{ steps.newest.outputs.cache-matched-key }}
        RESTORED: ${{ steps.moon.outputs.cache-matched-key }}
      run: |
        t="$RUNNER_TOOL_CACHE"; [ "${{ runner.os }}" != Windows ] || t=$(cygpath -u "$t")
        m="$t/moon-ci"
        # (a self-hosted runner's, restored in its workspace: moved into its tool cache, over the release kept there)
        if [ -d moon-ci-put ]; then rm -rf "$m" && mv moon-ci-put "$m"; fi
        if [ ! -x "$m/bin/moon" ] && [ ! -x "$m/bin/moon.exe" ]; then
          echo "::error::no MoonBit for ${{ runner.os }} ${{ runner.arch }} in the Actions cache: run the moonbit workflow (it puts each new release in once)"
          exit 1
        fi
        [ -z "$KEY" ] || [ "$RESTORED" != "$KEY" ] || printf '%s' "$KEY" > "$t/moon-ci.key"
        echo "MoonBit: $KEY"
        if [ "${{ runner.os }}" = Windows ]; then m=$(cygpath -w "$m"); echo "$m\\bin" >> "$GITHUB_PATH"; else echo "$m/bin" >> "$GITHUB_PATH"; fi
        echo "MOON_HOME=$m" >> "$GITHUB_ENV"
    - shell: bash
      run: moon version --all
    # mbui's tools (scripts/mbc, chk, detlint, apk: each built when there is none built from its own sources, by content)
    # kept here each by its own key, what its script says it is built from (`scripts/<tool> key`), the tool's program
    # alone: a job saves only the tools it ran, each built from the sources its key names, so a key restored is a tool
    # up to date. (Kept together by a hash of all tools/, a key was saved by the job that ended first, with the tools
    # that job never ran as stale as what it had restored: main's android job built mbc and chk again in every run,
    # 65 s of its 185, a key restored that had neither from its sources, 2026-10-25, 40141156498.)
    - id: tools
      shell: bash
      # (none in a checkout without mbui's tools: nothing kept)
      run: |
        [ -d apps/mbui/mbui/tools ] || exit 0
        for t in mbc chk detlint apk; do echo "$t=$(sh apps/mbui/mbui/scripts/$t key)" >> "$GITHUB_OUTPUT"; done
        # (the app's: scripts/testexe, a test program's runs for scripts/test.sh)
        [ ! -f apps/mbui/scripts/testexe ] || echo "testexe=$(bash apps/mbui/scripts/testexe key)" >> "$GITHUB_OUTPUT"
    - if: steps.tools.outputs.mbc != ''
      uses: actions/cache@v4
      with:
        path: |
          apps/mbui/mbui/tools/_build/native/release/build/mbc/mbc.exe
          apps/mbui/mbui/tools/_build/native/release/build/mbc/mbc.exe.src
        key: mbui-tool-mbc-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.mbc }}
    - if: steps.tools.outputs.testexe != ''
      uses: actions/cache@v4
      with:
        path: |
          apps/mbui/tools/_build/native/release/build/sftools/testexe/testexe.exe
          apps/mbui/tools/_build/native/release/build/sftools/testexe/testexe.exe.src
        key: mbui-tool-testexe-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.testexe }}
    - if: steps.tools.outputs.chk != ''
      uses: actions/cache@v4
      with:
        path: |
          apps/mbui/mbui/tools/_build/native/release/build/chk/chk.exe
          apps/mbui/mbui/tools/_build/native/release/build/chk/chk.exe.src
        key: mbui-tool-chk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.chk }}
    - if: steps.tools.outputs.detlint != ''
      uses: actions/cache@v4
      with:
        path: |
          apps/mbui/mbui/tools/_build/native/release/build/detlint/detlint.exe
          apps/mbui/mbui/tools/_build/native/release/build/detlint/detlint.exe.src
        key: mbui-tool-detlint-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.detlint }}
    - if: steps.tools.outputs.apk != ''
      uses: actions/cache@v4
      with:
        path: |
          apps/mbui/mbui/tools/_build/native/release/build/apk/apk.exe
          apps/mbui/mbui/tools/_build/native/release/build/apk/apk.exe.src
        key: mbui-tool-apk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.apk }}
