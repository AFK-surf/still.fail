name: node
description: The Node the repository pins (.node-version), from the runner's tool cache, the Actions cache or nodejs.org once a version
runs:
  using: composite
  steps:
    # The pinned Node put in the runner's tool cache when its image has none there (macos-15 and ubuntu-24.04 have no
    # 24.22.1, xcode-27 has), for setup-node to find: nodejs.org's tarball, checked against the release's
    # SHASUMS256.txt, unpacked in place. setup-node's own download unpacked it and copied it there file by file: 8.8 s
    # of the mac job (2026-10-24, 40076678382); on Linux it fetched it from github.com's releases every job, and
    # github.com answering 504 held each fetch 20 s or more before its retry (setup-node's step 43-72 s of plan's and
    # mbui-check's jobs, 2026-11-09, 42570024810, 42571040247).
    # (Each curl here given up and tried again when its connection stalls, under 1 KB/s for 20 s: --retry alone acts only
    # on an error, and a stalled download is none; nodejs.org's tarball held the mac job until its 10 minutes ran out,
    # main 91434fca, 40642483751.)
    # Kept in the Actions cache by its version once fetched (a key never made again: whichever run fetched it first
    # saves it), so nodejs.org is reached once a version and system, not every run's jobs'.
    - id: node-dir
      if: runner.os != 'Windows'
      shell: bash
      run: |
        v=$(tr -d 'v[:space:]' < .node-version); a=$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')
        o=$(uname -s | tr '[:upper:]' '[:lower:]')
        d="$RUNNER_TOOL_CACHE/node/$v/$a"
        echo "dir=$d" >> "$GITHUB_OUTPUT"
        echo "key=node-$o-$a-$v" >> "$GITHUB_OUTPUT"
        [ ! -f "$d.complete" ] || echo "kept=true" >> "$GITHUB_OUTPUT"
    - if: runner.os != 'Windows' && steps.node-dir.outputs.kept != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.node-dir.outputs.dir }}
          ${{ steps.node-dir.outputs.dir }}.complete
        key: ${{ steps.node-dir.outputs.key }}
    - if: runner.os != 'Windows'
      shell: bash
      run: |
        t0=$(date +%s)
        v=$(tr -d 'v[:space:]' < .node-version); a=$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')
        o=$(uname -s | tr '[:upper:]' '[:lower:]')
        d="$RUNNER_TOOL_CACHE/node/$v/$a"
        [ ! -f "$d.complete" ] || exit 0
        f=node-v$v-$o-$a.tar.gz
        curl -fsSL --retry 3 --speed-limit 1024 --speed-time 20 -o "$RUNNER_TEMP/$f" "https://nodejs.org/dist/v$v/$f"
        curl -fsSL --retry 3 --speed-limit 1024 --speed-time 20 "https://nodejs.org/dist/v$v/SHASUMS256.txt" | grep " $f\$" > "$RUNNER_TEMP/$f.sha256"
        (cd "$RUNNER_TEMP" && shasum -a 256 -c --quiet "$f.sha256") || { echo "$f: not the SHA-256 nodejs.org lists"; exit 1; }
        rm -rf "$d" && mkdir -p "$d" && tar -xzf "$RUNNER_TEMP/$f" --strip-components 1 -C "$d" && touch "$d.complete"
        rm -f "$RUNNER_TEMP/$f"
        echo "Node $v in the tool cache in $(( $(date +%s) - t0 )) s"
    # Windows: the image's Node of that version, from its tool cache, put on the PATH as it is. setup-node prints npm's
    # and yarn's versions, their first start on the runner: 45 s of the release's Windows job beside cl compiling the
    # app (main dd3caeef, 40599181003; preview.yml's own Node step says the same of 29-81 s, 2026-10-25). Where the
    # image has it not (windows-2025 had no 24.22.1 by 2026-11-05), kept in the Actions cache by its version under
    # preview.yml's key, setup-node's fetch of it saved there once: from github.com's releases each run it waited out
    # three 504s, 70 s of the release's Windows setup (main 241a3b0b, 42581442882, 2026-11-09).
    - id: win-dir
      if: runner.os == 'Windows'
      shell: bash
      run: |
        v=$(tr -d 'v[:space:]' < .node-version); d="$RUNNER_TOOL_CACHE/node/$v/x64"
        echo "dir=$d" >> "$GITHUB_OUTPUT"
        echo "key=node-win32-x64-$v" >> "$GITHUB_OUTPUT"
        [ ! -x "$(cygpath -u "$d")/node.exe" ] || echo "kept=true" >> "$GITHUB_OUTPUT"
    - if: runner.os == 'Windows' && steps.win-dir.outputs.kept != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.win-dir.outputs.dir }}
          ${{ steps.win-dir.outputs.dir }}.complete
        key: ${{ steps.win-dir.outputs.key }}
    - id: win-node
      if: runner.os == 'Windows'
      shell: bash
      run: |
        d="$(cygpath -u "$RUNNER_TOOL_CACHE")/node/$(tr -d 'v[:space:]' < .node-version)/x64"
        [ -x "$d/node.exe" ] || exit 0
        cygpath -w "$d" >> "$GITHUB_PATH"
        echo "kept=true" >> "$GITHUB_OUTPUT"
    - if: steps.win-node.outputs.kept != 'true'
      uses: actions/setup-node@v5
      with:
        # The Node the station ships (.node-version), not whichever 24 the runner has cached: node:sqlite on Linux
        # bound TextEncoder's empty Uint8Array as NULL in 24.13 (core-ts's bridge test, 2026-10-04), not in 24.15.
        node-version-file: .node-version
        package-manager-cache: false
