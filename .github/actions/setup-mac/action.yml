# What every job on mini1's runners starts with (after its checkout): the toolchains on PATH, and Rust built in a
# Cargo target of the job's own (under RUNNER_TEMP, emptied before each job), through sccache, whose cache of compiled
# crates (~/stillfail-ci/sccache) is what is kept between jobs.
# No target is kept and shared: the runners check out to paths of their own, so a vendored crate (vendor/iroh, a lib
# and a cdylib, its .dylib named without a hash) is another build from each, and builds of other branches and features
# piled up beside one another; rustc took the wrong one (E0308, "multiple different versions of crate iroh_relay",
# 2026-10-02 and 03), with kache as the wrapper and without it, in one target for all and in one per set of
# dependencies. sccache keys each crate's build by all that goes into it, and builds the rest anew.
name: setup
description: Toolchains and caches on mini1's runners
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # rustup's (wasm32, aarch64-linux-android, wasm-bindgen) ahead of Homebrew's rust; node 24 and pnpm in ~/.local/bin.
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
        echo "JAVA_HOME=/opt/homebrew/opt/openjdk@17" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=/opt/homebrew/bin/sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_DIR=$HOME/stillfail-ci/sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_CACHE_SIZE=25G" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        # The targets kept before (target-*, check-*, linux-*): no job reads them now.
        find "$HOME/stillfail-ci" -mindepth 1 -maxdepth 1 -type d \( -name 'target*' -o -name 'check-*' -o -name 'linux*' \) -mmin +240 -exec rm -rf {} + 2>/dev/null || true
        # Rust's tests a few at a time: three runners share the machine, and the core's timing tests fail under load.
        echo "RUST_TEST_THREADS=4" >> "$GITHUB_ENV"
