name: setup
description: Reproducible toolchains on disposable GitHub-hosted runners
inputs:
  native:
    description: Install Rust and WebAssembly tooling
    default: 'false'
  android:
    description: Install the Android SDK and NDK
    default: 'false'
  ndk:
    description: With android, the NDK too (what packs the app strips its native parts with; lint does without it)
    default: 'true'
  gradle-read-only:
    description: With android, Gradle's home read, never written (on main too)
    default: 'false'
  cross:
    description: Install Linux station cross compilers
    default: 'false'
  pnpm:
    description: pnpm and its store (false for a job that installs no packages, as mbui's Apple jobs when the core's bytecode is kept)
    default: 'true'
runs:
  using: composite
  steps:
    # The pinned Node put in the runner's tool cache when its image has none there (macos-15 has no 24.22.1, xcode-27
    # has), for setup-node to find: nodejs.org's tarball, checked against the release's SHASUMS256.txt, unpacked in
    # place. setup-node's own download unpacked it and copied it there file by file: 8.8 s of the mac job (2026-10-24,
    # 40076678382).
    # (Each curl here given up and tried again when its connection stalls, under 1 KB/s for 20 s: --retry alone acts only
    # on an error, and a stalled download is none; nodejs.org's tarball held the mac job until its 10 minutes ran out,
    # main 91434fca, 40642483751.)
    # Kept in the Actions cache by its version once fetched (a key never made again: whichever run fetched it first
    # saves it), so nodejs.org is reached once a version, not every run's mac job's.
    - id: mac-node
      if: runner.os == 'macOS'
      shell: bash
      run: |
        v=$(tr -d 'v[:space:]' < .node-version); a=$(uname -m | sed 's/x86_64/x64/')
        d="$RUNNER_TOOL_CACHE/node/$v/$a"
        echo "dir=$d" >> "$GITHUB_OUTPUT"
        echo "key=node-darwin-$a-$v" >> "$GITHUB_OUTPUT"
        [ ! -f "$d.complete" ] || echo "kept=true" >> "$GITHUB_OUTPUT"
    - if: runner.os == 'macOS' && steps.mac-node.outputs.kept != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.mac-node.outputs.dir }}
          ${{ steps.mac-node.outputs.dir }}.complete
        key: ${{ steps.mac-node.outputs.key }}
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        t0=$(date +%s)
        v=$(tr -d 'v[:space:]' < .node-version); a=$(uname -m | sed 's/x86_64/x64/')
        d="$RUNNER_TOOL_CACHE/node/$v/$a"
        [ ! -f "$d.complete" ] || exit 0
        f=node-v$v-darwin-$a.tar.gz
        curl -fsSL --retry 3 --speed-limit 1024 --speed-time 20 -o "$RUNNER_TEMP/$f" "https://nodejs.org/dist/v$v/$f"
        curl -fsSL --retry 3 --speed-limit 1024 --speed-time 20 "https://nodejs.org/dist/v$v/SHASUMS256.txt" | grep " $f\$" > "$RUNNER_TEMP/$f.sha256"
        (cd "$RUNNER_TEMP" && shasum -a 256 -c --quiet "$f.sha256") || { echo "$f: not the SHA-256 nodejs.org lists"; exit 1; }
        rm -rf "$d" && mkdir -p "$d" && tar -xzf "$RUNNER_TEMP/$f" --strip-components 1 -C "$d" && touch "$d.complete"
        rm -f "$RUNNER_TEMP/$f"
        echo "Node $v in the tool cache in $(( $(date +%s) - t0 )) s"
    # Windows: the image's Node of that version, from its tool cache, put on the PATH as it is. setup-node prints npm's
    # and yarn's versions, their first start on the runner: 45 s of the release's Windows job beside cl compiling the
    # app (main dd3caeef, 40599181003; mbui.yml's own Node step says the same of 29-81 s, 2026-10-25). setup-node when
    # the image has not that Node.
    - id: node
      if: runner.os == 'Windows'
      shell: bash
      run: |
        d="$(cygpath -u "$RUNNER_TOOL_CACHE")/node/$(tr -d 'v[:space:]' < .node-version)/x64"
        [ -x "$d/node.exe" ] || exit 0
        cygpath -w "$d" >> "$GITHUB_PATH"
        echo "kept=true" >> "$GITHUB_OUTPUT"
    - if: steps.node.outputs.kept != 'true'
      uses: actions/setup-node@v5
      with:
        # The Node the station ships (.node-version), not whichever 24 the runner has cached: node:sqlite on Linux
        # bound TextEncoder's empty Uint8Array as NULL in 24.13 (core-ts's bridge test, 2026-10-04), not in 24.15.
        node-version-file: .node-version
        package-manager-cache: false
    # Windows' pnpm.exe kept in the Actions cache by its version: github.com's release fetched once a version, not every
    # run's (one run's fetch could not connect to github.com for 21 s, main c6764347, 40661676439)
    - id: win-pnpm
      if: inputs.pnpm == 'true' && runner.os == 'Windows'
      shell: bash
      run: echo "key=pnpm-win-x64-$(node -p 'require("./package.json").packageManager.split("@")[1]')" >> "$GITHUB_OUTPUT"
    - if: inputs.pnpm == 'true' && runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/pnpm/pnpm.exe
        key: ${{ steps.win-pnpm.outputs.key }}
    - if: inputs.pnpm == 'true'
      shell: bash
      run: |
        # The pnpm every package.json names (packageManager, one version for all: a mix had each install switch
        # versions, and installs side by side raced to fetch the other one, 2026-10-04).
        version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
        if [ "$RUNNER_OS" = Windows ]; then
          # (Windows: pnpm's own single executable of that version, from its release, checked against the SHA-256 kept
          # here for it; npm's global install took 16-18 s there, 1 s on Linux, 2026-10-20. A new packageManager
          # version: its pnpm-win-x64.exe's digest, as the release lists it, here.)
          case "$version" in
            10.33.0) sha=afc96009dc39fe23a835d65192049e6a995f342496b175585dc2beda7d42d33f ;;
            *) echo "no SHA-256 here for pnpm $version's pnpm-win-x64.exe (.github/actions/setup/action.yml)"; exit 1 ;;
          esac
          dir="$(cygpath -u "$RUNNER_TEMP")/pnpm"
          mkdir -p "$dir"
          # (kept: the Actions cache's, as checked as a fetched one)
          [ -f "$dir/pnpm.exe" ] ||
            curl -fsSL --retry 3 --speed-limit 1024 --speed-time 20 -o "$dir/pnpm.exe" "https://github.com/pnpm/pnpm/releases/download/v$version/pnpm-win-x64.exe"
          echo "$sha  $dir/pnpm.exe" | sha256sum -c --quiet || { echo "pnpm-win-x64.exe $version: not the SHA-256 kept for it"; exit 1; }
          cygpath -w "$dir" >> "$GITHUB_PATH"
          export PATH="$dir:$PATH"
          [ "$(pnpm --version)" = "$version" ] || { echo "pnpm.exe is not $version"; exit 1; }
        else
          npm install --global "pnpm@$version"
        fi
        echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    # pnpm's store, which every install here links from: kept between runs by the lockfiles. The lockfiles are named,
    # not found by '**/': a walk of the whole checkout races a job's own build writing into it (Windows' app build runs
    # in the background from before this step, and hashFiles failed on a file it removed, 39538551764). A new
    # lockfile is added here. (Not for a job without pnpm: mbui's mac job spent 6-22 s restoring its ~58 MB for packages
    # it did not install, 2026-10-24, 40076678382.)
    - if: inputs.pnpm == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'client/core-ts/pnpm-lock.yaml', 'cloud/pnpm-lock.yaml', 'media/core/pnpm-lock.yaml', 'media/test/pnpm-lock.yaml', 'station/pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-
    - if: inputs.native == 'true'
      shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/.ci-target" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"
        echo "RUST_TEST_THREADS=2" >> "$GITHUB_ENV"
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustup target add wasm32-unknown-unknown
        if [ "$RUNNER_OS" = macOS ]; then
          brew list llvm >/dev/null 2>&1 || brew install llvm
          echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
        else
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev pkg-config
        fi
    - if: inputs.native == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/wasm-bindgen*
          ~/.cargo/bin/cargo-zigbuild
          ~/.cargo/.crates*
          .ci-target
        key: native-${{ runner.os }}-${{ runner.arch }}-${{ inputs.android }}-${{ inputs.cross }}-${{ hashFiles('**/Cargo.lock', '.github/actions/setup/action.yml') }}
    - if: inputs.native == 'true'
      shell: bash
      run: |
        version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("client/Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
        if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version)" != "wasm-bindgen $version" ]; then
          cargo install wasm-bindgen-cli --version "$version" --locked --force
        fi
    - if: inputs.android == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    # The runner's own SDK tools (ubuntu-24.04 has cmdline-tools/latest, platform-tools and the licenses): setup-android
    # fetched a newer cmdline-tools from Google each run, and a download that hung there took 347 s of a lint job's
    # 422 (2026-10-19).
    - if: inputs.android == 'true'
      shell: bash
      run: |
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
    # Gradle's own downloads and its build cache, kept between runs (main writes them, a branch reads; the build cache
    # is on in apps/android/gradle.properties): a run without them spent ~2 min fetching and compiling what had not
    # changed. A branch writing them too spent ~10 s saving at every end, for caches its next run seldom needed.
    - if: inputs.android == 'true'
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ inputs.gradle-read-only == 'true' || github.ref != 'refs/heads/main' }}
    # The NDK is a gigabyte from Google's servers: fetched once, then from the Actions cache (a download cut short failed
    # a lint job on main, 2026-10-19, and check-android, 2026-10-21: "Error on ZipFile unknown archive")
    - if: inputs.android == 'true' && inputs.ndk == 'true' && runner.os == 'Linux'
      id: ndk
      uses: actions/cache/restore@v4
      with:
        path: /usr/local/lib/android/sdk/ndk/28.2.13676358
        key: android-ndk-28.2.13676358-${{ runner.os }}-${{ runner.arch }}
    - if: inputs.android == 'true'
      shell: bash
      run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' ${{ inputs.ndk == 'true' && steps.ndk.outputs.cache-hit != 'true' && '''ndk;28.2.13676358''' || '' }}
    - if: inputs.android == 'true' && inputs.ndk == 'true' && runner.os == 'Linux' && steps.ndk.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /usr/local/lib/android/sdk/ndk/28.2.13676358
        key: android-ndk-28.2.13676358-${{ runner.os }}-${{ runner.arch }}
    - if: inputs.cross == 'true'
      shell: bash
      run: |
        brew list zig >/dev/null 2>&1 || brew install zig
        rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
        command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked
