name: Agent notes component evidence (temporary)
on:
  push:
    branches: [codex/agent-notes-evidence-c-e3e65a1dbb]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: evidence
      - uses: actions/checkout@v5
        with:
          path: project
          ref: eb250d6dd89bed9a19a22c3efc01e0cbe928aeda
      - uses: actions/setup-node@v5
        with:
          node-version-file: project/.node-version
      - uses: ./project/.github/actions/mbui-moonbit
      - name: Build the component scene
        working-directory: project
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = eb250d6dd89bed9a19a22c3efc01e0cbe928aeda
          tar -xzf ../evidence/evidence/agent-notes-input.tar.gz
          task_key=$(node scripts/native.ts key mbui-film-wasm darwin-arm64)
          test "$task_key" = e22d113c24ea75e2d072d6e3
          bash apps/mbui/scripts/wasm-film-build.sh "$RUNNER_TEMP/notes-renderer"
          jq -n --arg key "$task_key" '{part:"mbui-film-wasm",target:"darwin-arm64",key:$key,commit:"eb250d6dd89bed9a19a22c3efc01e0cbe928aeda",from:"temporary isolated component evidence scene"}' > "$RUNNER_TEMP/notes-renderer/manifest.json"
          shasum -a 256 "$RUNNER_TEMP/notes-renderer/scene.wasm"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-notes-runtime-eb250d6
          path: ${{ runner.temp }}/notes-renderer/
          if-no-files-found: error
          retention-days: 3
  pictures:
    needs: build
    runs-on: macos-15
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: narrow
            size: 280x180
            platform: 2
            native: finger
            theme: light
            dark: 0
          - width: narrow
            size: 280x180
            platform: 2
            native: finger
            theme: dark
            dark: 1
          - width: wide
            size: 800x180
            platform: 0
            native: mouse
            theme: light
            dark: 0
          - width: wide
            size: 800x180
            platform: 0
            native: mouse
            theme: dark
            dark: 1
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: agent-notes-runtime-eb250d6
          path: renderer
      - name: Draw old and new with the same data
        shell: bash
        run: |
          set -eu
          chmod +x renderer/sffilm
          mkdir -p pictures
          printf 'exit\n' > notes.drive
          for component in old new; do
            MBUI_FIXTURE="notes-$component" MBUI_WIN='${{ matrix.size }}' MBUI_FILM_PLATFORM='${{ matrix.platform }}' \
              MBUI_NATIVE_INPUT='${{ matrix.native }}' MBUI_FILM_SCALE=2 MBUI_DARK='${{ matrix.dark }}' \
              MBUI_MEDIA_RECORD='{"scene":"isolated notes component using synthetic sample data","scene_harness":"temporary dirty source"}' \
              bash renderer/media.sh picture "$PWD/pictures/$component-${{ matrix.width }}-${{ matrix.theme }}.png" "$PWD/notes.drive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: agent-notes-${{ matrix.width }}-${{ matrix.theme }}-eb250d6
          path: pictures/
          if-no-files-found: error
          retention-days: 7
