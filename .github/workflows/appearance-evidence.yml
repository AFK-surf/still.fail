name: Appearance evidence (temporary hosted)
on:
  push:
    branches: [codex/appearance-ci-c512729a0d]
permissions:
  contents: read
jobs:
  pictures:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 5876fa3066a681094b4b3295daefd15e87c19891
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/mbui-moonbit
      - name: Render the original page at each screen size
        shell: bash
        run: |
          set -eu
          renderer=$(node scripts/native.ts file mbui-film-wasm darwin-arm64)
          mkdir -p "$RUNNER_TEMP/appearance-evidence"
          printf 'until 主题\nexit\n' > "$RUNNER_TEMP/appearance-evidence/top.drive"
          printf 'until 主题\nwheel 3000\nuntil 语言\nexit\n' > "$RUNNER_TEMP/appearance-evidence/bottom.drive"
          for spec in 'small 390x844 2 finger' 'medium 800x900 2 finger' 'large 1280x900 0 mouse'; do
            set -- $spec
            for scene in top bottom dark; do
              drive=top
              dark=0
              if [ "$scene" = bottom ]; then drive=bottom; fi
              if [ "$scene" = dark ]; then dark=1; fi
              env MBUI_MEDIA_RUNTIME="$renderer" MBUI_FIXTURE=settings-appearance MBUI_WIN="$2" \
                MBUI_FILM_PLATFORM="$3" MBUI_NATIVE_INPUT="$4" MBUI_FILM_SCALE=2 MBUI_DARK="$dark" \
                bash apps/mbui/scripts/media.sh picture "$RUNNER_TEMP/appearance-evidence/$1-$scene.png" \
                "$RUNNER_TEMP/appearance-evidence/$drive.drive"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-baseline-hosted
          path: ${{ runner.temp }}/appearance-evidence/
          if-no-files-found: error
