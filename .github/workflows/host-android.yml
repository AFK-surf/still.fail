# The host's and the text's contracts on Android (docs/determinism.md, "What is compared, and where"; scripts/
# host_contract.sh): kitdemo's controls page run on an x86_64 emulator with its scripted taps, its tape made a
# Tester's test and run here (every frame the same), then the committed tape's text (android_controls) asked of the
# emulator's text system again (every answer the same). When Android's host changes.
name: host-android
on:
  pull_request:
    paths: &paths
      - "src/host/android_host.c"
      - "android/**"
      - "scripts/android.sh"
      - "scripts/host_contract.sh"
      - "scripts/textrec_test.py"
      - "test/host/**"
      - "src/kitdemo/textcheck.mbt"
      - "src/kitdemo/textrec_android_*"
      - ".github/workflows/host-android.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

env:
  MOON_HOME: ${{ github.workspace }}/../.moon

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME=$MOON_HOME bash
          echo "$MOON_HOME/bin" >> $GITHUB_PATH
      - name: kitdemo's APK for an x86_64 emulator
        run: ABI=x86_64 scripts/host_contract.sh android build
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: "The host's contract (a run's tape = a Tester's frames), then the text's (android_controls = the system's)"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          # the system's animations as a phone has them (off, motion would be reduced: not what a Tester plays)
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/host_contract.sh android record && bash scripts/host_contract.sh android text
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-android
          path: out/host/
          if-no-files-found: ignore
