name: ink-mbc-diagnostic
on:
  push:
    branches: [codex/next-code-ink-c9fae101]
    paths: [.github/workflows/ink-mbc-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MBC_STORE: ${{ github.workspace }}/apps/mbui/_build/native/release/mbc-store
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: ./.github/actions/mbui-moonbit
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/mbui/_build
            !${{ env.MBC_STORE }}
            !apps/mbui/_build/**/*.mbc
          key: mbui-moon-build-app-56d8a5520e3815ea501377684ccc75ae5244a0a2
      - run: bash apps/mbui/scripts/moon-mtimes.sh
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.MBC_STORE }}
          key: mbui-linux-store-app-sfapp-m-e78874b19ebdd61b
      - run: mkdir -p "$MBC_STORE" && mv "$MBC_STORE" "$RUNNER_TEMP/store-main"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.MBC_STORE }}
          key: mbui-linux-store-app-sfapp-a-34e1db770c4685a6
      - run: mkdir -p "$MBC_STORE" && mv "$MBC_STORE" "$RUNNER_TEMP/store-arch"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.MBC_STORE }}
          key: mbui-linux-store-app-sfapp-b-47a58a0e867c60d0
      - run: |
          mkdir -p "$MBC_STORE"
          cp -a -n "$RUNNER_TEMP/store-main/." "$MBC_STORE/"
          cp -a -n "$RUNNER_TEMP/store-arch/." "$MBC_STORE/"
      - name: Reproduce app build
        id: build
        run: |
          set +e
          TIMES=1 MBC_REAL_CC=clang TARGETS=native PARTS=app APP_GROUP=1/4 APP_BUILD_OUT="$RUNNER_TEMP/app-test" SFAPP_SHARDS=4 LINES_OUT=40 bash apps/mbui/scripts/test.sh > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          tail -60 "$RUNNER_TEMP/build.log"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Compare the split units and objects
        run: |
          d=apps/mbui/_build/native/release/test/stillfail/sfapp/__moonbit_link_core__/sfapp.blackbox_test.mbc
          mkdir -p "$RUNNER_TEMP/ink-diagnostic"
          for f in src/core_builtin_13_13.c src/mbui_ui_7.c u_core_builtin_13_13.o u_mbui_ui_7.o u_core_builtin_13_13.o.mbc u_mbui_ui_7.o.mbc; do
            if [ -f "$d/$f" ]; then
              sha256sum "$d/$f"
              cp "$d/$f" "$RUNNER_TEMP/ink-diagnostic/$(basename "$f")"
            fi
          done
          for f in u_core_builtin_13_13.o u_mbui_ui_7.o; do
            if [ -f "$d/$f" ]; then
              echo "symbols: $f"
              nm -g --defined-only "$d/$f" | head -20
            fi
          done
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/ink-diagnostic/build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: ink-mbc-diagnostic
          path: ${{ runner.temp }}/ink-diagnostic
          retention-days: 1
      - name: Report the reproduced build
        run: exit "${{ steps.build.outputs.code }}"
