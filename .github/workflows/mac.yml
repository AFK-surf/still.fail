# The macOS apps (demo, textdiff, kitdemo) with their screenshot against goldens/mac.png, the text against Core
# Text's own and the offscreen render check (all three reported, not gating), and the iOS simulator app: on Mini1
# (mbui's runner there, label mbui-render; GitHub's macOS runners are not used), out of ci.yml so that it runs only when
# what the apps are built of changes. The MoonBit itself on native is ci.yml's native job (every push), its types every
# package's in ci.yml's test (moon check): what is left here is the Apple hosts, the apps' own packages and the
# scripts that build them. Mini1's one runner already queued its jobs (median 38 s, p90 133 s, 2026-10-20): every
# push's ~1.4 min more would add to that.
name: mac
on:
  pull_request:
    paths: &paths
      - "src/host/**"
      - "src/demo/**"
      - "src/textdiff/**"
      - "src/kitdemo/**"
      - "src/render/**"
      - "ios/**"
      - "goldens/mac*.png"
      - "moon.mod"
      - "scripts/mac.sh"
      - "scripts/ios.sh"
      - "scripts/env.sh"
      - "scripts/errs.py"
      - "scripts/mbc.py"
      - "scripts/csplit.py"
      - "scripts/cc_apple.sh"
      - "scripts/shots.sh"
      - "scripts/imgdiff.mjs"
      - "scripts/textdiff.sh"
      - "scripts/textdiff.mjs"
      - "scripts/render_check.sh"
      - ".github/workflows/mac.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos:
    # (a machine of ours: never a fork's pull request)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mbui-render]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit (the latest, as the other jobs)
        run: |
          export MOON_HOME=$RUNNER_TEMP/moon
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME=$MOON_HOME bash
          echo "MOON_HOME=$MOON_HOME" >> $GITHUB_ENV
          echo "$MOON_HOME/bin" >> $GITHUB_PATH
      - name: macOS apps
        run: |
          for app in demo textdiff kitdemo; do
            /usr/bin/time -p env APP=$app scripts/mac.sh build 2>&1 | tail -4
          done
      - name: Screenshot against the golden
        continue-on-error: true
        run: scripts/shots.sh mac kit
      - name: "Text against Core Text's own (scripts/textdiff.sh mac; Studio's run is the one that gates)"
        continue-on-error: true
        run: |
          mkdir -p out/node && (cd out/node && { [ -f package.json ] || npm init -y >/dev/null; } && npm i pngjs >/dev/null)
          scripts/textdiff.sh mac
      - name: "A Tester's draw list drawn offscreen (mbui-render) against the host's own picture of it (scripts/render_check.sh); its md5, to compare machines"
        continue-on-error: true
        run: scripts/render_check.sh
      - name: iOS simulator app
        run: scripts/ios.sh build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-shots
          path: |
            out/shots/
            out/textdiff/
            out/render-check/
          if-no-files-found: ignore
