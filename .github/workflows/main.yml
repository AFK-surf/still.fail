# main's gate before a deploy. Most checks run where changes are made (scripts/check.sh from .githooks, whoever
# commits or pushes); this runs only what those machines may lack the toolchain for, and only for what the push
# changed: the web against the real wasm core and the tests that drive it, the clients' shapes, Rust, Android.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.what.outputs.web }}
      shapes: ${{ steps.what.outputs.shapes }}
      rust: ${{ steps.what.outputs.rust }}
      android: ${{ steps.what.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: what
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Everything on a manual run or a new branch; otherwise what this push changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          touches() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }
          echo "web=$(touches '^(web|client|test)/|^(package\.json|pnpm-lock\.yaml|tsconfig\.json)$')" >> "$GITHUB_OUTPUT"
          echo "shapes=$(touches '^client/shapes/|^web/src/core/shapes\.ts$|/data/Shapes\.kt$')" >> "$GITHUB_OUTPUT"
          echo "rust=$(touches '^(mesh|client|vendor)/')" >> "$GITHUB_OUTPUT"
          echo "android=$(touches '^(apps/android|client)/')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  web:
    name: web with the real wasm core, tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client, key: wasm }
      # Must match client/wasm/Cargo.toml's pinned wasm-bindgen.
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-bindgen-cli@0.2.129 }
      - run: pnpm install --frozen-lockfile
      - name: wasm core
        run: LLVM_BIN=/usr/lib/llvm-18/bin sh client/wasm/build.sh
      - run: pnpm exec tsgo -p tsconfig.json
      - run: pnpm exec tsgo -p web/tsconfig.json
      - run: pnpm test
      - name: station page
        run: pnpm exec vite build --config web/vite.config.ts

  shapes:
    name: clients' shapes
    needs: changes
    if: needs.changes.outputs.shapes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with: { tool: typeshare-cli@1.13.4 }
      - run: sh scripts/shapes.sh --check

  rust:
    name: Rust (station, client core)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "mesh\nclient" }
      - name: station
        run: cargo test --workspace
        working-directory: mesh
      - name: client core
        run: cargo test --workspace --exclude ember-core-wasm
        working-directory: client

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client, key: android }
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - run: python3 apps/android/build.py --tasks :app:compileDebugKotlin :core:testDebugUnitTest

  # What the deploy waits on: every gate that ran passed (one not needed is skipped, which is fine).
  gate:
    needs: [changes, web, shapes, rust, android]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "main is good to deploy"
