name: mbc-cache-diagnosis
on:
  push:
    branches: [audit/mbc-cache-diagnosis-20261107]
permissions:
  contents: read
jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Compare the launcher and the selected compiler
        shell: bash
        run: |
          set -eu
          sw_vers
          actual=$(xcrun --find clang)
          echo "Selected compiler: $actual"
          shasum -a 256 /usr/bin/cc "$actual"
          /usr/bin/cc --version
          "$actual" --version
          xcrun --sdk macosx --show-sdk-path
          xcode-select -p
          env | LC_ALL=C sort | grep -E '^(DEVELOPER_DIR|SDKROOT|MACOSX_DEPLOYMENT_TARGET)=' || true
          export MACOSX_DEPLOYMENT_TARGET=12.0
          mkdir -p "$RUNNER_TEMP/cc-compare"
          cd "$RUNNER_TEMP/cc-compare"
          printf '#include <stdio.h>\n#include <stdint.h>\n#include <math.h>\ndouble demo(uint64_t x) { return sin((double)x); }\n' > probe.c
          flags=(-fwrapv -fno-strict-aliasing -ffp-contract=off -Wno-unused-value -O2 -DMOONBIT_ALLOCATOR=MOONBIT_ALLOCATOR_MIMALLOC -MD -MT probe.o -c probe.c)
          /usr/bin/cc -### "${flags[@]}" -MF probe.d -o probe.o 2>launcher.driver
          "$actual" -### "${flags[@]}" -MF probe.d -o probe.o 2>compiler.driver
          cat launcher.driver
          cmp launcher.driver compiler.driver
          /usr/bin/cc "${flags[@]}" -MF launcher.d -o launcher.o
          "$actual" "${flags[@]}" -MF compiler.d -o compiler.o
          /usr/bin/cc -E -dM -x c probe.c > launcher.macros
          "$actual" -E -dM -x c probe.c > compiler.macros
          shasum -a 256 launcher.o compiler.o launcher.d compiler.d launcher.macros compiler.macros
          cmp launcher.o compiler.o
          cmp launcher.d compiler.d
          cmp launcher.macros compiler.macros
          echo 'launcher and selected clang: final driver command, object, dependencies and predefined macros match'
