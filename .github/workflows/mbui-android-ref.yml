# The mbui app held to still.fail's Android app, screen by screen (apps/mbui/scripts/android-ref.sh): each screen of
# client/fixtures/screens (the core's JSON) drawn by both, and the mbui app's pictures compared with Android's pixel by
# pixel: the regions client/fixtures/screens/allowed.json lets differ left out, the pixels it says are still to do
# (`left`) at most. Android's pictures are kept in the repository (client/fixtures/screens/android, with the emulator's
# system they were taken on): taken anew only where its app or the screens changed, a change to them committed in the
# PR from this run's artifact. The mbui app's are not taken of the app running: each screen is drawn in the Tester
# over the Android host's text (src/sfscreens/android_ref_wbtest.mbt; text it lacks recorded once, committed) and its
# draw list drawn offscreen by mbui-render on the same emulator, once: a picture is kept (the Actions cache) by its
# key, the draw list's bytes and what draws it (android-ref.sh lists). No emulator is started where every screen's
# picture is kept and neither Android's pictures nor the Android text are to be taken.
# A free runner: ubuntu with KVM, the emulator's system image named here (x86_64): mbui-render built for it,
# Android's (arm64 alone: its core's engine) run through the image's ARM translation.
# In jobs of 10 minutes at most: `plan` says what is to be done (and does it where no emulator is needed); the apps
# are built each in a job of its own, once; the screens are drawn on emulators a few at a time (`shard`, each its own
# emulator), and `report` says how they went together.
name: mbui-android-ref
on:
  pull_request:
    paths:
      - "apps/mbui/**"
      - "apps/android/**"
      - "client/fixtures/screens/**"
      - "client/core-ts/src/shapes/**"
      - ".github/workflows/mbui-android-ref.yml"
  push:
    branches: [main]
    paths:
      - "apps/mbui/**"
      - "apps/android/**"
      - "client/fixtures/screens/**"
      - "client/core-ts/src/shapes/**"
      - ".github/workflows/mbui-android-ref.yml"
concurrency:
  group: mbui-android-ref-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  plan:
    if: github.repository == 'AFK-surf/still.fail'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MBUI_FRESH: 1
    outputs:
      refs: ${{ steps.what.outputs.refs }}
      lacks: ${{ steps.text.outputs.lacks }}
      on: ${{ steps.emu.outputs.on }}
      key: ${{ steps.changed.outputs.key }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Android's pictures taken anew: the screens changed since main (on main: in the push, or Android's app), or the
      # emulator they are taken on (this workflow's lines naming it, the emulator action's); not where pictures taken over all of
      # that as it is now came out the same as those kept (`key`: Android's code, the screens and their pictures kept,
      # the emulator; a run whose take matched keeps a mark of it)
      - id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then base=${{ github.event.before }}; else base=$(git merge-base origin/main HEAD); fi
          # (allowed.json the mbui app's, not Android's; Android's app changed: its pictures taken on main, after the
          # merge, not in each of its pull requests, which seldom touch these screens: a change there fails main's run,
          # saying to commit them)
          if [ "$GITHUB_EVENT_NAME" = push ]; then whose='^(apps/android/|client/fixtures/screens/)'; else whose='^client/fixtures/screens/'; fi
          if git diff --name-only "$base" HEAD | grep -v -x client/fixtures/screens/allowed.json \
              | grep -qE "$whose" \
            || git diff -U0 "$base" HEAD -- .github/workflows/mbui-android-ref.yml \
              | grep -qE '^[-+] .*(mbui-android-emulator|with: [{] api:)'; then
            echo "refs=1" >> "$GITHUB_OUTPUT"; else echo "refs=0" >> "$GITHUB_OUTPUT"; fi
          key=$({ git ls-files -s -- apps/android client/fixtures/screens | grep -v 'client/fixtures/screens/allowed.json$'
            grep -E 'mbui-android-emulator|with: [{] api:' .github/workflows/mbui-android-ref.yml
            git ls-files -s -- .github/actions/mbui-android-emulator; } | sha256sum | cut -c1-32)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: same
        if: steps.changed.outputs.refs == '1'
        with:
          path: .ci/android-refs-same
          key: mbui-android-refs-same-${{ steps.changed.outputs.key }}
          lookup-only: true
      - id: what
        run: |
          if [ "${{ steps.changed.outputs.refs }}" = 1 ] && [ "${{ steps.same.outputs.cache-hit }}" != true ]; then
            echo "refs=1" >> "$GITHUB_OUTPUT"; echo "Android's pictures taken anew"
          elif [ "${{ steps.changed.outputs.refs }}" = 1 ]; then
            echo "refs=0" >> "$GITHUB_OUTPUT"; echo "Android's pictures as kept: taken over all this already, the same"
          else echo "refs=0" >> "$GITHUB_OUTPUT"; echo "Android's pictures as kept"; fi
      - uses: ./.github/actions/mbui-moonbit
      # the screens drawn in the Tester over the Android host's text (src/sfscreens/android_ref_wbtest.mbt), their draw
      # lists and their pictures' keys (android-ref.sh lists); text it lacks is recorded on the emulator (the mbui app
      # run once a screen; the run's artifacts have it, committed in the PR)
      - name: The screens' draw lists
        id: text
        run: |
          if bash apps/mbui/scripts/android-ref.sh lists; then echo "lacks=0" >> "$GITHUB_OUTPUT"
          else echo "lacks=1" >> "$GITHUB_OUTPUT"; fi
      # the mbui pictures drawn before, by their keys (main's, and this branch's own)
      - uses: actions/cache/restore@v4
        with:
          path: apps/mbui/out/android-ref-pics
          key: mbui-android-ref-pics-${{ hashFiles('apps/mbui/out/android-ref/dl/*.key') }}
          restore-keys: mbui-android-ref-pics-
      # the emulator only where something is to be drawn on it: Android's pictures, the Android text the Tester lacks,
      # or a screen whose picture is not kept for its key (its draw list, or what draws it, changed)
      - name: What the emulator is for
        id: emu
        run: |
          need=""; [ "${{ steps.text.outputs.lacks }}" = 1 ] || need=$(bash apps/mbui/scripts/android-ref.sh need | tr '\n' ' ')
          echo "to draw: ${need:-none}"
          if [ "${{ steps.what.outputs.refs }}" = 1 ] || [ "${{ steps.text.outputs.lacks }}" = 1 ] || [ -n "$need" ]; then
            echo "on=1" >> "$GITHUB_OUTPUT"; else echo "on=0" >> "$GITHUB_OUTPUT"; fi
      # the screens a few at a time, an emulator each (Android's pictures, the text, the mbui app's pictures: each of
      # those for six screens fits a job's ten minutes)
      - name: The screens shared out
        id: shards
        run: |
          names=$(cd client/fixtures/screens && ls *.json | sed 's/\.json$//' | grep -v -x allowed | LC_ALL=C sort)
          echo "shards=$(echo $names | tr ' ' '\n' | paste -d' ' - - - - - - | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - name: The screens compared, every picture kept (no emulator)
        if: steps.emu.outputs.on == '0'
        run: bash apps/mbui/scripts/android-ref.sh ci
      - uses: actions/upload-artifact@v4
        if: always() && steps.emu.outputs.on == '0'
        with:
          name: mbui-android-ref
          path: |
            apps/mbui/out/android-ref/
            apps/mbui/screens/text-android.textrec
            client/fixtures/screens/android/
          if-no-files-found: ignore
  # Android's app and its tests (ScreensRefTest), where its pictures are taken anew
  android:
    needs: plan
    if: needs.plan.outputs.on == '1' && needs.plan.outputs.refs == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # (read only, on main too: it restores the newest Gradle home of the OS (mbui's android job writes one), and its own
      # writes, ~1 GB a commit with their parts, pushed out of the 10 GB the toolchain caches the jobs need)
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true }
      - uses: ./.github/actions/setup
        with: { android: 'true', ndk: 'true' }
      # Android's build directories as pipeline's check-android left them (this branch's, else main's; read only, that
      # job keeps them): what did not change is up to date
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/android/.gradle
            apps/android/build
            apps/android/app/build
            apps/android/core/build
            apps/android/shared/build
            apps/android/settings/build
            apps/android/chat/build
            apps/android/drive/build
          key: android-build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            android-build-${{ github.ref_name }}-
            android-build-main-
      - name: Android's app and its tests (ScreensRefTest)
        env:
          ORG_GRADLE_PROJECT_motionTest: 1
        run: python3 apps/android/build.py --tasks :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: mbui-android-ref-android-apks
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 1
  # the mbui apps for the x86_64 emulator: mbui-render's (it draws the screens' draw lists), and the mbui app where its
  # Android text is lacking
  mbui:
    needs: plan
    if: needs.plan.outputs.on == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MBUI_FRESH: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mbui-moonbit
      - uses: ./.github/actions/setup
        with: { android: 'true', ndk: 'false' }
      - uses: ./.github/actions/mbui-apk
      - name: The mbui app, for the text it lacks (APP=sffix, debug)
        if: needs.plan.outputs.lacks == '1'
        run: ABI=x86_64 APP=sffix bash apps/mbui/scripts/android.sh build
      - name: mbui-render's app, which draws the screens' draw lists
        working-directory: apps/mbui/mbui
        run: ABI=x86_64 APP=render MBUI_ANDROID_HOOK=$PWD/scripts/render_android_hook.sh bash scripts/android.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: mbui-android-ref-mbui-apks
          path: |
            apps/mbui/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mbui/mbui/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
  shard:
    needs: [plan, android, mbui]
    if: always() && needs.plan.outputs.on == '1' && needs.mbui.result == 'success' && needs.android.result != 'failure' && needs.android.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        names: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      MBUI_FRESH: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mbui-android-emulator
        with: { api: "36", target: google_apis, profile: pixel_7, phase: start }
      - uses: ./.github/actions/mbui-moonbit
      - uses: actions/download-artifact@v4
        with: { pattern: "mbui-android-ref-*-apks", path: .ci/apks }
      - uses: actions/cache/restore@v4
        with:
          path: apps/mbui/out/android-ref-pics
          key: mbui-android-ref-pics-none
          restore-keys: mbui-android-ref-pics-
      - uses: ./.github/actions/mbui-android-emulator
        with: { api: "36", target: google_apis, profile: pixel_7, phase: wait }
      - name: The screens, Android's and the mbui app's, compared (${{ matrix.names }})
        env:
          REFS: ${{ needs.plan.outputs.refs }}
          TEXT: ${{ needs.plan.outputs.lacks }}
          ANDROID_APK: ${{ needs.plan.outputs.refs == '1' && format('{0}/.ci/apks/mbui-android-ref-android-apks/debug/app-debug.apk', github.workspace) || '' }}
          ANDROID_TEST_APK: ${{ needs.plan.outputs.refs == '1' && format('{0}/.ci/apks/mbui-android-ref-android-apks/androidTest/debug/app-debug-androidTest.apk', github.workspace) || '' }}
          MBUI_APK: ${{ needs.plan.outputs.lacks == '1' && format('{0}/.ci/apks/mbui-android-ref-mbui-apks/android/app/build/outputs/apk/debug/app-debug.apk', github.workspace) || '' }}
          RENDER_APK: ${{ github.workspace }}/.ci/apks/mbui-android-ref-mbui-apks/mbui/android/app/build/outputs/apk/debug/app-debug.apk
        run: bash apps/mbui/scripts/android-ref.sh ci ${{ matrix.names }}
      # Android's pictures taken over all this came out as those kept: marked, not taken again for it
      - name: Android's pictures the same as kept, marked
        if: always() && needs.plan.outputs.refs == '1' && hashFiles('apps/mbui/out/android-ref/refs-same') != ''
        run: mkdir -p .ci/android-refs-same && cp apps/mbui/out/android-ref/refs-same .ci/android-refs-same/
      - name: The pictures kept, this shard's screens'
        id: pics
        if: always()
        run: |
          cd apps/mbui/out
          keep=$(for f in android-ref/dl/*.key; do n=$(basename $f .key); echo "$(cat $f)-$n.png"; done)
          for p in android-ref-pics/*.png; do echo "$keep" | grep -qx "$(basename $p)" || rm -f "$p"; done
          echo "key=$(echo "$keep" | shasum -a 256 | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: apps/mbui/out/android-ref-pics
          key: mbui-android-ref-pics-${{ steps.pics.outputs.key }}-${{ github.run_id }}-${{ strategy.job-index }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbui-android-ref-${{ strategy.job-index }}
          path: |
            apps/mbui/out/android-ref/
            apps/mbui/screens/text-android.textrec
            client/fixtures/screens/android/
            .ci/android-refs-same/
          if-no-files-found: ignore
  # the shards together: every one compared as allowed, and Android's pictures, when taken anew, the same as kept
  # for all of them (then marked, not taken again over this)
  report:
    needs: [plan, shard]
    if: always() && needs.plan.outputs.on == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "mbui-android-ref-[0-9]*", path: shards }
      - id: same
        run: |
          n=$(ls -d shards/*/ 2>/dev/null | wc -l)
          s=$(ls shards/*/.ci/android-refs-same/refs-same 2>/dev/null | wc -l)
          cat shards/*/apps/mbui/out/android-ref/report.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          [ "$n" -gt 0 ] && [ "$s" = "$n" ] && { mkdir -p .ci/android-refs-same && echo same > .ci/android-refs-same/refs-same; }
          [ "${{ needs.shard.result }}" = success ] || { echo "the screens: a shard failed (each one's artifact says why)"; exit 1; }
      - uses: actions/cache/save@v4
        if: needs.plan.outputs.refs == '1' && hashFiles('.ci/android-refs-same/refs-same') != ''
        with:
          path: .ci/android-refs-same
          key: mbui-android-refs-same-${{ needs.plan.outputs.key }}
