# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# What the emulator jobs boot (.github/actions/android-emulator), put in the Actions cache once each: the emulator's
# build the references were made with (16428233, from Google's repository as a zip) and the x86_64 system images
# (API 34; API 29, the oldest the apps run on), each by its revision (sdkmanager's, here alone): the one put in kept, a newer
# only by taking it out. Asked each day; what is in already, nothing done. A download that breaks off fails this run
# alone, the jobs going on with what is in.
name: mbui-android-sdk
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/mbui-android-sdk.yml"
      - ".github/actions/mbui-android-emulator/**"
  # (a change to it tried on its pull request: what it puts in is that pull request's own)
  pull_request:
    paths: *paths


jobs:
  put:
    strategy:
      fail-fast: false
      matrix:
        # (each job's device: pixel_6 on default)
        include:
          - { api: 34, target: default, profile: pixel_6, avd: ci-default-pixel_6, keyed: "" }
          # (the oldest the apps run on, minSdk's: mbui-ci's android-oldest)
          - { api: 29, target: default, profile: pixel_6, avd: ci-29-default-pixel_6, keyed: "29-" }
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v4
        id: emu
        with:
          path: ~/android-emu
          key: android-emulator-16428233
          lookup-only: true
      - name: The emulator's build 16428233
        if: steps.emu.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/android-emu && cd ~/android-emu
          curl -fsSL --retry 3 -o emu.zip https://dl.google.com/android/repository/emulator-linux_x64-16428233.zip
          unzip -q emu.zip && rm emu.zip
          grep -a '^Pkg.Revision' emulator/source.properties
      - if: steps.emu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/android-emu
          key: android-emulator-16428233
      # the image as put in already, of whatever revision (the jobs' references were made on it: a newer one is put in
      # only by taking this one out); none: the latest installed and put in. Nothing downloaded where it is in (an
      # install each run, to read its revision, broke off now and then: "Error on ZipFile unknown archive", 39673756645)
      - uses: actions/cache/restore@v4
        id: img
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/${{ matrix.target }}/x86_64
          key: android-image-${{ matrix.api }}-${{ matrix.target }}-x86_64-none
          restore-keys: android-image-${{ matrix.api }}-${{ matrix.target }}-x86_64-
          lookup-only: true
      - name: The image's revision (as put in, else the latest installed)
        id: rev
        run: |
          pkg="system-images;android-${{ matrix.api }};${{ matrix.target }};x86_64"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          kept="${{ steps.img.outputs.cache-matched-key }}"
          if [ -n "$kept" ]; then
            rev=${kept##*-}; echo "put=0" >> "$GITHUB_OUTPUT"
          else
            sdk=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
            yes | $sdk --licenses > /dev/null || true
            $sdk --install "$pkg" --channel=0 > /dev/null
            rev=$(sed -n 's/^Pkg.Revision=//p' $ANDROID_HOME/system-images/android-${{ matrix.api }}/${{ matrix.target }}/x86_64/source.properties)
            [ -n "$rev" ] || { echo "::error::no revision for the image"; exit 1; }
            echo "put=1" >> "$GITHUB_OUTPUT"
          fi
          echo "key=android-image-${{ matrix.api }}-${{ matrix.target }}-x86_64-$rev" >> "$GITHUB_OUTPUT"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "revision $rev"
      - if: steps.rev.outputs.put == '1'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/${{ matrix.target }}/x86_64
          key: ${{ steps.rev.outputs.key }}
      - uses: actions/cache/restore@v4
        id: avd
        with:
          path: ~/.android/avd
          key: android-avd-${{ matrix.keyed }}${{ matrix.target }}-${{ matrix.profile }}-${{ steps.rev.outputs.rev }}
          lookup-only: true
      # no AVD over it yet: made (avdmanager, which asks for the SDK's emulator package: the image's install brought
      # one) over the image (the one put in, taken out of the cache where it was not installed here), as a job boots
      # it: config.ini's device, sizes and image by name; made once a revision, never in a job
      - if: steps.avd.outputs.cache-hit != 'true' && steps.rev.outputs.put != '1'
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/${{ matrix.target }}/x86_64
          key: ${{ steps.rev.outputs.key }}
      - name: The AVD (${{ matrix.avd }})
        if: steps.avd.outputs.cache-hit != 'true'
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          rm -rf "$ANDROID_AVD_HOME" && mkdir -p "$ANDROID_AVD_HOME"
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd --force -n ${{ matrix.avd }} \
            --package "${{ steps.rev.outputs.pkg }}" --device ${{ matrix.profile }}
          ls "$ANDROID_AVD_HOME"
      - if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/avd
          key: android-avd-${{ matrix.keyed }}${{ matrix.target }}-${{ matrix.profile }}-${{ steps.rev.outputs.rev }}
      # (what a job gets: the action over what was put in, booted)
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/actions }
      - name: Boot once (the action as the jobs take it)
        run: sudo rm -rf /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/${{ matrix.target }}/x86_64 ~/.android/avd
      - uses: ./.github/actions/mbui-android-emulator
        with: { api: "${{ matrix.api }}", target: "${{ matrix.target }}", profile: "${{ matrix.profile }}" }
