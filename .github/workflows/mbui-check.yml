# The mbui app's check and tests (apps/mbui/scripts/check.sh, test.sh), on native: a branch's in its pipeline
# (pipeline.yml's check-mbui calls this, its gate waits for it), main's here on its own (on a push to the app). On main
# they hold nothing back (the preview app is preview.yml's, done waits for neither) and were the last of its pipeline run
# in half of them: as part of it, the run after waited for them, 16 of 40 runs a median 88 s (2026-10-20).
name: mbui-check
on:
  workflow_call:
  push:
    branches: [main]
    paths: ["apps/mbui/**", ".github/workflows/mbui-check.yml"]
  # (once a day: sfapp's page tests all in one process, below)
  schedule:
    - cron: "53 3 * * *"
  # arch/next's units kept where every branch can take them: a run on main's ref after each of its pipelines, building
  # its commit (a branch off it took main's store alone, the other architecture's, and compiled 494 of the replay's 600
  # units, 145 s, cancelled at the 5 minutes: ed42f90964, 2026-11-05; a cache a branch's push keeps is its own alone,
  # GitHub's, main's are everyone's)
  workflow_run:
    workflows: [pipeline]
    types: [completed]
    branches: [arch/next]
# main: one run at a time, the newest waiting (a red one seen, as every commit's was in the pipeline); called, the
# caller's own (a branch's newest push stops its run before). A call from main (mbui-testflight.yml) keeps its own too:
# in main's group the next push's run, waiting, cancelled the release's waiting tests (2026-11-02).
concurrency:
  group: ${{ github.event_name != 'workflow_run' && github.workflow == 'mbui-check' && github.ref == 'refs/heads/main' && format('mbui-check-{0}', github.ref) || format('mbui-check-call-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # The mbui app's check and tests (apps/mbui/scripts/check.sh, test.sh: still.fail's design system and pages over the
  # fixtures, the screens, the media screens, the core client, and the end-to-end flows seen again over their recorded
  # cores, src/sfreplay), on native, as the apps are built (2026-10-22, as asked: "我们只用原生"; js is no longer
  # tested), against mbui's fake host: no window, no station. On GitHub's Linux: a test's program links no host's
  # code (its host the Tester's fake, mbui/hostapi; the platforms' hosts are an app's main's alone), built with clang
  # (gcc took the 16 GB runner's memory on the largest units and the job was killed). The units each test is split
  # into kept in the Actions cache by content (MBC_STORE: main's newest and a branch's own together): 667 tests,
  # ~170 s a part with them, ~390 s without (2026-10-22). A merge's evidence and main's, apart from the preview app (preview.yml),
  # which its tests do not hold back (as asked, 2026-10-19). The latest MoonBit (.github/actions/mbui-moonbit); mbui in
  # apps/mbui/mbui. Its tests' two parts (scripts/test.sh's PARTS) on a runner each, the check with the app's: no macOS
  # runner (a test's program is the same C on any system; the Apple toolchain builds the apps, pipeline.yml's desktop and preview.yml's ios). No ThinLTO
  # parts: the apps are not built with it (scripts/mbc's lto_for, 2026-10-24).
  native:
    name: native (${{ matrix.part }}${{ matrix.group && format(' {0}', matrix.group) || '' }}${{ matrix.fps && format(' at {0} fps', matrix.fps) || '' }})
    runs-on: ubuntu-24.04
    # (a push's 5 minutes, the pipeline's call of a branch's push too; the day's, its pages in one process, 10)
    timeout-minutes: ${{ github.event_name == 'push' && 5 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        # (the app part on four runners, APP_GROUP: its runs on one runner's four cores were 188 s, each of its sweeps
        # slowed by the eight beside it, and the job 250-330 s with its build; scripts/test.sh app_group_of says which is
        # where. Each builds sfapp's program itself; the first the small packages' too, its units kept apart from the other three's,
        # which take its when they have none of their own yet)
        # (sfapp's program itself built once, app-build below, and its groups' runs on it in the app job since: each
        # of five runners compiled the same program again, 60-150 s each, more than half of a push's runner time, and
        # four branches pushed at once waited up to 4 minutes for runners, 2026-10-31, as asked)
        include:
          - { part: app, group: pkgs, store: app-pkgs }
          - { part: replay, group: "", store: replay }
          # (and again with frames drawn on run_for's way while the app asks for them, at 120 a second, at 60, and at
          # 24 then 7, a runner each (MBUI_TEST_FPS, mbui's scripts/fps_check.sh): the same results, what a test asserts
          # at a moment what is so at it however many frames came before)
          - { part: app, group: pkgs, store: app-pkgs, fps: "120" }
          - { part: app, group: pkgs, store: app-pkgs, fps: "60" }
          - { part: app, group: pkgs, store: app-pkgs, fps: "24 7" }
          # (the flows at the other rates: replay-fps below, on the program replay-build makes once)
    env:
      PART: ${{ matrix.part }}
      GROUP: ${{ matrix.group }}
      FPS: ${{ matrix.fps }}
      MBC_STORE: ${{ github.workspace }}/apps/mbui/_build/native/release/mbc-store
      CACHE_PREFIX: mbui-linux-store-${{ matrix.store }}-
      # (main's units under m-, a branch's under b-: a branch takes main's newest and its own, below)
      OWN: ${{ github.event_name == 'workflow_run' && 'a-' || github.ref == 'refs/heads/main' && 'm-' || 'b-' }}
    steps: &native-steps
      - uses: actions/checkout@v5
        # (arch/next's commit, on main's ref: workflow_run, above)
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - name: The core takes input and due timers in order
        # (once a push, on the replay runner at the default rate: a frame rate is nothing to it)
        if: env.PART == 'replay' && env.FPS == '' && env.GROUP != 'build'
        run: |
          clang++ -std=c++20 -O2 apps/mbui/engine/tests/ready_queue.cpp -o "$RUNNER_TEMP/core-ready-queue-test"
          "$RUNNER_TEMP/core-ready-queue-test"
      - uses: ./.github/actions/node
      # (from the Actions cache the moonbit workflow fills, never downloaded here)
      - uses: ./.github/actions/mbui-moonbit
      # moon's own build (moonc's C and what it checked) as main's newest run left it: without, moonc made all of it
      # again each run, 46-53 s of the tests' build with every unit and link kept, and the check's type-check from
      # nothing (2026-10-23, 40018743319); over it, moon makes again what changed (on a branch over its own: the app
      # part's build 29 s to 20, the check 24 s to 5 after it, the replay's build 26 s to 13-17). Main's only (75-180 MB
      # a part): a branch takes main's. Without each test program's objects (<test>.mbc: the units' store keeps them):
      # with them, a run took its units from there and left the store's untouched, so it kept none of them, and a
      # branch from before this took main's store of 68 units and compiled the rest (files-browse, 40038188859).
      - uses: actions/cache/restore@v4
        id: moon
        with:
          path: |
            apps/mbui/_build
            !${{ env.MBC_STORE }}
            !apps/mbui/_build/**/*.mbc
          key: mbui-moon-build-${{ env.PART }}-${{ github.sha }}
          restore-keys: mbui-moon-build-${{ env.PART }}-
      # (each file an mtime of its content: moon builds again only what changed since that build, not all of it after
      # the checkout's new mtimes: the replay's 170 tasks over main's last build, 0b0e29e8, 41381222307, 2026-11-02)
      - run: bash apps/mbui/scripts/moon-mtimes.sh
      # The units main's newest run kept, and on a branch its own last run's beside them (a store by content: the two
      # together, nothing of one replaces the other's). A branch's own alone, after it took main's newer commits in
      # (a rebase), compiled again all main had changed since: 253 s of the app part where its push before was 82 s
      # (mbui-wide-sidebar, 39991582878, 2026-10-23).
      - uses: actions/cache/restore@v4
        id: main
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.CACHE_PREFIX }}m-${{ github.sha }}
          # (m- only: GitHub looks through all the restore-keys on the branch before main's, and a fallback to any of the
          # kind took the branch's own here too, main's never: mbui-wide-workspace, 39995406305, 234 s)
          # (and the three app runners that build sfapp's program alone take the first's, a superset, until they have kept theirs)
          restore-keys: |
            ${{ env.CACHE_PREFIX }}m-
            mbui-linux-store-${{ env.PART }}-m-
      - if: env.OWN != 'm-'
        run: |
          mkdir -p "$MBC_STORE"
          mv "$MBC_STORE" "$RUNNER_TEMP/store-main"
      # (and a branch's, arch/next's newest beside main's: a branch off it has most of its units there, none of main's)
      - uses: actions/cache/restore@v4
        if: env.OWN == 'b-'
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.CACHE_PREFIX }}a-${{ github.sha }}
          restore-keys: ${{ env.CACHE_PREFIX }}a-
      - if: env.OWN == 'b-'
        run: |
          mkdir -p "$MBC_STORE"
          mv "$MBC_STORE" "$RUNNER_TEMP/store-arch"
      - uses: actions/cache/restore@v4
        id: own
        if: env.OWN != 'm-'
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.CACHE_PREFIX }}${{ env.OWN }}${{ github.sha }}
          restore-keys: ${{ env.CACHE_PREFIX }}${{ env.OWN }}
      - if: env.OWN != 'm-'
        run: |
          mkdir -p "$MBC_STORE" "$RUNNER_TEMP/store-arch"
          cp -a -n "$RUNNER_TEMP/store-main/." "$MBC_STORE/"
          cp -a -n "$RUNNER_TEMP/store-arch/." "$MBC_STORE/"
          echo "units: $(find "$MBC_STORE" -mindepth 2 -maxdepth 2 -type d | wc -l) (main's $(find "$RUNNER_TEMP/store-main" -mindepth 2 -maxdepth 2 -type d | wc -l), arch/next's $(find "$RUNNER_TEMP/store-arch" -mindepth 2 -maxdepth 2 -type d | wc -l))"
      - name: The mbui app's tests and the flows seen again (native, ${{ env.PART }})
        id: tests
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/start"
          # (mbc's account of each program's build, its units compiled and its link, said after: moon shows a
          # compiler's output only when it fails, and where a part's time went was not to be seen)
          export MBC_LOG="$RUNNER_TEMP/mbc.log"
          # (sfapp's page tests, on a push, in four processes side by side, its files dealt round them (SFAPP_SHARDS=4):
          # the runner's four cores, one of them working while the other three waited when all 162 files ran in one,
          # the app's fourth group the longest job of every mbui push, its pages 110-196 s of its 190-300, 2026-10-31,
          # as asked. Once a day in one process (SFAPP_SHARDS=1), their files one after another: what one file leaves
          # behind that a later one trips on shows there, which shards' fewer files each partly hide. The screen
          # sweeps a process each beside them either way, test.sh)
          # (each of FPS's rates in its turn, MBUI_TEST_FPS; none said: once, as by default)
          code=0
          for r in ${FPS:-default}; do
            if [ $r = default ]; then unset MBUI_TEST_FPS; else export MBUI_TEST_FPS=$r; echo "=== at $r frames a second"; fi
            TIMES=1 MBC_REAL_CC=clang TARGETS=native PARTS=${{ env.PART }} APP_GROUP=${{ env.GROUP == 'build' && '1/4' || env.GROUP }} APP_BUILD_OUT=${{ env.GROUP == 'build' && env.PART == 'app' && format('{0}/app-test', runner.temp) || '' }} REPLAY_BUILD_OUT=${{ env.GROUP == 'build' && env.PART == 'replay' && format('{0}/replay-test', runner.temp) || '' }} SFAPP_SHARDS=${{ github.event_name == 'schedule' && 1 || 4 }} LINES_OUT=40 bash apps/mbui/scripts/test.sh 2>&1 | tee -a "$RUNNER_TEMP/mbui-test.log" || code=1
          done
          exit $code
      # (sfapp's test program and its tests' list, for the app job's runs)
      - if: env.GROUP == 'build' && env.PART == 'app'
        uses: actions/upload-artifact@v4
        with: { name: "mbui-app-test-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/app-test", retention-days: 1, compression-level: 1 }
      # (the flows' test program and its tests' list, for the replay-fps job's runs)
      - if: env.GROUP == 'build' && env.PART == 'replay'
        uses: actions/upload-artifact@v4
        with: { name: "mbui-replay-test-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/replay-test", retention-days: 1, compression-level: 1 }
      - name: The mbui app's check (detlint, then native type-checked)
        # (on the default rate's replay runner alone: the same check on each rate's was 17-21 s of each of their 200-300
        # in the same push, 2026-11-09)
        if: env.PART == 'replay' && env.FPS == '' && env.GROUP != 'build'
        # (after the tests: its type-check over the tests' build, not the build after it, 2026-10-23. On the replay
        # part's runner: the app part was 184-187 s with it, the replay part 77-100 s, 2026-10-24)
        run: moon version && bash apps/mbui/scripts/check.sh
      - name: Where the build's time went (mbc)
        if: always()
        run: |
          grep -E ' compiled \(|^mbc: linked' "$RUNNER_TEMP/mbc.log" | cut -c1-220 || true
      # (the units this run used, older ones gone, kept under a key by what they are: main's, and a branch's for its next
      # push, which restores its own with main's: without, each push compiled all the branch had changed again, 125 of
      # 282 units of sfapp's tests for a branch on it, 108 s of the app part's 151, 2026-10-23. Older ones go only after
      # a run that went through: one stopped early used few or none, and kept so its store was empty, main's restored by
      # every branch after it, which then compiled all again, d610a8c0's 5 KB, 2026-10-30)
      - name: The units kept
        if: always()
        run: |
          S=$MBC_STORE
          [ ! -d $S ] || find $S -name '*.lock' -delete
          # (arch/next's run after a red test too: its tests ran on all it built, and red ones are its own to mend, its
          # store grown with each push else)
          went=${{ steps.tests.outcome }}
          [ "$OWN" != a- ] || [ "$went" != failure ] || went=success
          [ ! -d $S ] || [ "$went" != success ] || find $S -mindepth 2 -maxdepth 2 -type d ! -newer "$RUNNER_TEMP/start" -exec rm -rf {} +
          c=$( (cd $S 2>/dev/null && find . -mindepth 2 -maxdepth 2 -type d | sort) | sha256sum | cut -c1-16)
          echo "BUILD_KEY=$CACHE_PREFIX$OWN$c" >> "$GITHUB_ENV"
      - if: always() && env.BUILD_KEY != steps.main.outputs.cache-matched-key && env.BUILD_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.BUILD_KEY }}
      - if: always() && env.OWN == 'm-' && steps.moon.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/mbui/_build
            !${{ env.MBC_STORE }}
            !apps/mbui/_build/**/*.mbc
          key: mbui-moon-build-${{ env.PART }}-${{ github.sha }}
      # What failed, and in which commit, where everyone sees it (main is pushed to directly too: red, said whose)
      - name: What failed
        if: failure()
        run: |
          failed=$(grep -a 'test .* failed' "$RUNNER_TEMP/mbui-test.log" | sed 's/^\[stillfail\] test //; s/ failed.*//' | sort -u)
          why=$(grep -a '^flow: \|assert_idle: not' "$RUNNER_TEMP/mbui-test.log" | grep -v 'not checked idle' | sort -u | head -10)
          subject=$(git log -1 --format='%h %an: %s' "$GITHUB_SHA")
          echo "::error title=check-mbui (${{ env.PART }}${{ env.GROUP && format(' {0}', env.GROUP) || '' }}${{ env.FPS && format(' at {0} fps', env.FPS) || '' }}) failed at ${GITHUB_SHA:0:9}::$(printf '%s' "$failed" | tr '\n' ';')"
          {
            echo "### check-mbui (${{ env.PART }}${{ env.GROUP && format(' {0}', env.GROUP) || '' }}${{ env.FPS && format(' at {0} fps', env.FPS) || '' }}) failed at $subject"
            echo
            echo '```'
            printf '%s\n' "${failed:-(no test named: the check or the build failed, see the log)}"
            echo '```'
            [ -z "$why" ] || { echo '```'; printf '%s\n' "$why" | cut -c1-300; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"

  # sfapp's test program built once (scripts/test.sh APP_BUILD_OUT), its units kept as the native job keeps its own
  app-build:
    name: native (app build)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PART: app
      GROUP: build
      MBC_STORE: ${{ github.workspace }}/apps/mbui/_build/native/release/mbc-store
      CACHE_PREFIX: mbui-linux-store-app-sfapp-
      OWN: ${{ github.event_name == 'workflow_run' && 'a-' || github.ref == 'refs/heads/main' && 'm-' || 'b-' }}
    steps: *native-steps

  # The flows' test program built once for their runs at the other rates (scripts/test.sh REPLAY_BUILD_OUT): each
  # rate's runner built the same program again, 104-177 s apiece of their 200-300, replay at 60 fps 300 s of its five
  # minutes on main 097da882 (42644588583), 2026-11-10; sfapp's is built once the same way (app-build, as asked
  # 2026-10-31). The default rate's replay runner builds its own beside it, with the core's tests and the check.
  replay-build:
    name: native (replay build)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PART: replay
      GROUP: build
      MBC_STORE: ${{ github.workspace }}/apps/mbui/_build/native/release/mbc-store
      CACHE_PREFIX: mbui-linux-store-replay-
      OWN: ${{ github.event_name == 'workflow_run' && 'a-' || github.ref == 'refs/heads/main' && 'm-' || 'b-' }}
    steps: *native-steps

  # The flows seen again at 120, 60, 24 and 7 frames a second (MBUI_TEST_FPS), each on the program replay-build made
  # (REPLAY_EXE: nothing built here, no MoonBit, no units: a checkout, the program, the runs)
  replay-fps:
    name: native (replay at ${{ matrix.fps }} fps)
    needs: replay-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        fps: ["120", "60", "24", "7"]
    env:
      MBUI_TEST_FPS: ${{ matrix.fps }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/download-artifact@v4
        with: { name: "mbui-replay-test-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/replay-test" }
      - name: The flows seen again (native, at ${{ matrix.fps }} fps, on replay-build's program)
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/replay-test/flows.blackbox_test.exe" "$RUNNER_TEMP/replay-test/testexe"
          TESTEXE="$RUNNER_TEMP/replay-test/testexe" \
          REPLAY_EXE="$RUNNER_TEMP/replay-test/flows.blackbox_test.exe" REPLAY_INFO="$RUNNER_TEMP/replay-test/__blackbox_test_info.json" \
            TIMES=1 TARGETS=native PARTS=replay LINES_OUT=40 bash apps/mbui/scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/mbui-test.log"
      - name: What failed
        if: failure()
        run: |
          failed=$(grep -a 'test .* failed' "$RUNNER_TEMP/mbui-test.log" | sed 's/^\[stillfail[^]]*\] test //; s/ failed.*//' | sort -u)
          echo "::error title=check-mbui (replay at ${{ matrix.fps }} fps) failed at ${GITHUB_SHA:0:9}::$(printf '%s' "$failed" | tr '\n' ';')"

  # sfapp's tests, the app part's groups (scripts/test.sh app_group_of), each run on the program app-build made
  # (APP_EXE: nothing built here, no MoonBit, no units: a checkout, the program, the runs)
  app:
    name: native (app ${{ matrix.group }}${{ matrix.fps && format(' at {0} fps', matrix.fps) || '' }}${{ matrix.part && format(' part {0}', matrix.part) || '' }})
    needs: app-build
    # (arch/next's run keeps its units: its tests are its pipeline's)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    # (a push's 5 minutes; the day's, its pages in one process, 10)
    timeout-minutes: ${{ github.event_name == 'push' && 5 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        # (and the page tests again with frames drawn on run_for's way (MBUI_TEST_FPS), as the native job's above)
        group: [1/4, 2/4, 3/4, 4/4, contrast, corners]
        fps: [""]
        include:
          - { group: 1/4, fps: "120" }
          # (the second's too: 288 s of its pages and 299 s in all on a branch, 2026-11-09, 42635671188; 268 s on main,
          # its time spread over many files' frames at 120, no one test's to take out)
          - { group: 2/4, fps: "120", part: 1/2 }
          - { group: 2/4, fps: "120", part: 2/2 }
          - { group: 3/4, fps: "120" }
          # (the fourth's pages at 120 in two halves: 315 s and stopped at its five minutes in one, 2026-11-09)
          - { group: 4/4, fps: "120", part: 1/2 }
          - { group: 4/4, fps: "120", part: 2/2 }
          - { group: 1/4, fps: "60" }
          - { group: 2/4, fps: "60" }
          - { group: 3/4, fps: "60" }
          - { group: 4/4, fps: "60" }
          - { group: 1/4, fps: "24 7" }
          - { group: 2/4, fps: "24 7" }
          - { group: 3/4, fps: "24 7" }
          - { group: 4/4, fps: "24 7" }
    env:
      FPS: ${{ matrix.fps }}
      APP_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: "mbui-app-test-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/app-test" }
      - name: The mbui app's tests (native, app ${{ matrix.group }}, on app-build's program)
        id: tests
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/app-test/sfapp.whitebox_test.exe" "$RUNNER_TEMP/app-test/testexe"
          # (each of FPS's rates in its turn, MBUI_TEST_FPS; none said: once, as by default)
          code=0
          for r in ${FPS:-default}; do
            if [ $r = default ]; then unset MBUI_TEST_FPS; else export MBUI_TEST_FPS=$r; echo "=== at $r frames a second"; fi
            TESTEXE="$RUNNER_TEMP/app-test/testexe" \
            APP_EXE="$RUNNER_TEMP/app-test/sfapp.whitebox_test.exe" APP_INFO="$RUNNER_TEMP/app-test/__whitebox_test_info.json" \
              TIMES=1 TARGETS=native PARTS=app APP_GROUP=${{ matrix.group }} SFAPP_SHARDS=${{ github.event_name == 'schedule' && 1 || 4 }} LINES_OUT=40 \
              bash apps/mbui/scripts/test.sh 2>&1 | tee -a "$RUNNER_TEMP/mbui-test.log" || code=1
          done
          exit $code
      - name: What failed
        if: failure()
        run: |
          failed=$(grep -a 'test .* failed' "$RUNNER_TEMP/mbui-test.log" | sed 's/^\[stillfail[^]]*\] test //; s/ failed.*//' | sort -u)
          why=$(grep -a '^flow: \|assert_idle: not' "$RUNNER_TEMP/mbui-test.log" | grep -v 'not checked idle' | sort -u | head -10)
          subject=$(git log -1 --format='%h %an: %s' "$GITHUB_SHA")
          echo "::error title=check-mbui (app ${{ matrix.group }}${{ matrix.fps && format(' at {0} fps', matrix.fps) || '' }}) failed at ${GITHUB_SHA:0:9}::$(printf '%s' "$failed" | tr '\n' ';')"
          {
            echo "### check-mbui (app ${{ matrix.group }}${{ matrix.fps && format(' at {0} fps', matrix.fps) || '' }}) failed at $subject"
            echo
            echo '```'
            printf '%s\n' "${failed:-(no test named: see the log)}"
            echo '```'
            [ -z "$why" ] || { echo '```'; printf '%s\n' "$why" | cut -c1-300; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
