# The mbui app's check and tests (apps/mbui/scripts/check.sh, test.sh), on native: a branch's in its pipeline
# (pipeline.yml's check-mbui calls this, its gate waits for it), main's here on its own (on a push to the app). On main
# they hold nothing back (the app's beta is mbui.yml's, done waits for neither) and were the last of its pipeline run
# in half of them: as part of it, the run after waited for them, 16 of 40 runs a median 88 s (2026-10-20).
name: mbui-check
on:
  workflow_call:
  push:
    branches: [main]
    paths: ["apps/mbui/**", ".github/workflows/mbui-check.yml"]
  # (once a day: sfapp's page tests all in one process, below)
  schedule:
    - cron: "53 3 * * *"
# main: one run at a time, the newest waiting (a red one seen, as every commit's was in the pipeline); called, the
# pipeline's own (a branch's newest push stops its run before).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('mbui-check-{0}', github.ref) || format('mbui-check-call-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # The mbui app's check and tests (apps/mbui/scripts/check.sh, test.sh: still.fail's design system and pages over the
  # fixtures, the screens, the media screens, the core client, and the end-to-end flows seen again over their recorded
  # cores, src/sfreplay), on native, as the apps are built (2026-10-22, as asked: "我们只用原生"; js is no longer
  # tested), against mbui's fake host: no window, no station. On GitHub's Linux: a test's program links no host's
  # code (its host the Tester's fake, mbui/hostapi; the platforms' hosts are an app's main's alone), built with clang
  # (gcc took the 16 GB runner's memory on the largest units and the job was killed). The units each test is split
  # into kept in the Actions cache by content (MBC_STORE: main's newest and a branch's own together): 667 tests,
  # ~170 s a part with them, ~390 s without (2026-10-22). A merge's evidence and main's, apart from the app's beta (mbui.yml),
  # which its tests do not hold back (as asked, 2026-10-19). The latest MoonBit (.github/actions/mbui-moonbit); mbui in
  # apps/mbui/mbui. Its tests' two parts (scripts/test.sh's PARTS) on a runner each, the check with the app's: no macOS
  # runner (a test's program is the same C on any system; the Apple toolchain builds the apps, mbui.yml). No ThinLTO
  # parts: the apps are not built with it (scripts/mbc's lto_for, 2026-10-24).
  native:
    name: native (${{ matrix.part }}${{ matrix.group && format(' {0}', matrix.group) || '' }})
    runs-on: ubuntu-24.04
    # (a push's 5 minutes, the pipeline's call of a branch's push too; the day's, its pages in one process, 10)
    timeout-minutes: ${{ github.event_name == 'push' && 5 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        # (the app part on four runners, APP_GROUP: its runs on one runner's four cores were 188 s, each of its sweeps
        # slowed by the eight beside it, and the job 250-330 s with its build; scripts/test.sh app_group_of says which is
        # where. Each builds sfapp's program itself; the first the small packages' too, its units kept apart from the other three's,
        # which take its when they have none of their own yet)
        # (sfapp's program itself built once, app-build below, and its groups' runs on it in the app job since: each
        # of five runners compiled the same program again, 60-150 s each, more than half of a push's runner time, and
        # four branches pushed at once waited up to 4 minutes for runners, 2026-10-31, as asked)
        include:
          - { part: app, group: pkgs, store: app-pkgs }
          - { part: replay, group: "", store: replay }
    env:
      PART: ${{ matrix.part }}
      GROUP: ${{ matrix.group }}
      MBC_STORE: ${{ github.workspace }}/apps/mbui/_build/native/release/mbc-store
      CACHE_PREFIX: mbui-linux-store-${{ matrix.store }}-
      # (main's units under m-, a branch's under b-: a branch takes main's newest and its own, below)
      OWN: ${{ github.ref == 'refs/heads/main' && 'm-' || 'b-' }}
    steps: &native-steps
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      # (from the Actions cache the moonbit workflow fills, never downloaded here)
      - uses: ./.github/actions/mbui-moonbit
      # moon's own build (moonc's C and what it checked) as main's newest run left it: without, moonc made all of it
      # again each run, 46-53 s of the tests' build with every unit and link kept, and the check's type-check from
      # nothing (2026-10-23, 40018743319); over it, moon makes again what changed (on a branch over its own: the app
      # part's build 29 s to 20, the check 24 s to 5 after it, the replay's build 26 s to 13-17). Main's only (75-180 MB
      # a part): a branch takes main's. Without each test program's objects (<test>.mbc: the units' store keeps them):
      # with them, a run took its units from there and left the store's untouched, so it kept none of them, and a
      # branch from before this took main's store of 68 units and compiled the rest (files-browse, 40038188859).
      - uses: actions/cache/restore@v4
        id: moon
        with:
          path: |
            apps/mbui/_build
            !${{ env.MBC_STORE }}
            !apps/mbui/_build/**/*.mbc
          key: mbui-moon-build-${{ env.PART }}-${{ github.sha }}
          restore-keys: mbui-moon-build-${{ env.PART }}-
      # The units main's newest run kept, and on a branch its own last run's beside them (a store by content: the two
      # together, nothing of one replaces the other's). A branch's own alone, after it took main's newer commits in
      # (a rebase), compiled again all main had changed since: 253 s of the app part where its push before was 82 s
      # (mbui-wide-sidebar, 39991582878, 2026-10-23).
      - uses: actions/cache/restore@v4
        id: main
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.CACHE_PREFIX }}m-${{ github.sha }}
          # (m- only: GitHub looks through all the restore-keys on the branch before main's, and a fallback to any of the
          # kind took the branch's own here too, main's never: mbui-wide-workspace, 39995406305, 234 s)
          # (and the three app runners that build sfapp's program alone take the first's, a superset, until they have kept theirs)
          restore-keys: |
            ${{ env.CACHE_PREFIX }}m-
            mbui-linux-store-${{ env.PART }}-m-
      - if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p "$MBC_STORE"
          mv "$MBC_STORE" "$RUNNER_TEMP/store-main"
      - uses: actions/cache/restore@v4
        id: own
        if: github.ref != 'refs/heads/main'
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.CACHE_PREFIX }}b-${{ github.sha }}
          restore-keys: ${{ env.CACHE_PREFIX }}b-
      - if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p "$MBC_STORE"
          cp -a -n "$RUNNER_TEMP/store-main/." "$MBC_STORE/"
          echo "units: $(find "$MBC_STORE" -mindepth 2 -maxdepth 2 -type d | wc -l) (main's $(find "$RUNNER_TEMP/store-main" -mindepth 2 -maxdepth 2 -type d | wc -l))"
      - name: The mbui app's tests and the flows seen again (native, ${{ env.PART }})
        id: tests
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/start"
          # (mbc's account of each program's build, its units compiled and its link, said after: moon shows a
          # compiler's output only when it fails, and where a part's time went was not to be seen)
          export MBC_LOG="$RUNNER_TEMP/mbc.log"
          # (sfapp's page tests, on a push, in four processes side by side, its files dealt round them (SFAPP_SHARDS=4):
          # the runner's four cores, one of them working while the other three waited when all 162 files ran in one,
          # the app's fourth group the longest job of every mbui push, its pages 110-196 s of its 190-300, 2026-10-31,
          # as asked. Once a day in one process (SFAPP_SHARDS=1), their files one after another: what one file leaves
          # behind that a later one trips on shows there, which shards' fewer files each partly hide. The screen
          # sweeps a process each beside them either way, test.sh)
          TIMES=1 MBC_REAL_CC=clang TARGETS=native PARTS=${{ env.PART }} APP_GROUP=${{ env.GROUP == 'build' && '1/4' || env.GROUP }} APP_BUILD_OUT=${{ env.GROUP == 'build' && format('{0}/app-test', runner.temp) || '' }} SFAPP_SHARDS=${{ github.event_name == 'schedule' && 1 || 4 }} LINES_OUT=40 bash apps/mbui/scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/mbui-test.log"
      # (sfapp's test program and its tests' list, for the app job's runs)
      - if: env.GROUP == 'build'
        uses: actions/upload-artifact@v4
        with: { name: "mbui-app-test-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/app-test", retention-days: 1, compression-level: 1 }
      - name: The mbui app's check (detlint, then native type-checked)
        if: env.PART == 'replay'
        # (after the tests: its type-check over the tests' build, not the build after it, 2026-10-23. On the replay
        # part's runner: the app part was 184-187 s with it, the replay part 77-100 s, 2026-10-24)
        run: moon version && bash apps/mbui/scripts/check.sh
      - name: Where the build's time went (mbc)
        if: always()
        run: |
          grep -E ' compiled \(|^mbc: linked' "$RUNNER_TEMP/mbc.log" | cut -c1-220 || true
      # (the units this run used, older ones gone, kept under a key by what they are: main's, and a branch's for its next
      # push, which restores its own with main's: without, each push compiled all the branch had changed again, 125 of
      # 282 units of sfapp's tests for a branch on it, 108 s of the app part's 151, 2026-10-23. Older ones go only after
      # a run that went through: one stopped early used few or none, and kept so its store was empty, main's restored by
      # every branch after it, which then compiled all again, d610a8c0's 5 KB, 2026-10-30)
      - name: The units kept
        if: always()
        run: |
          S=$MBC_STORE
          [ ! -d $S ] || find $S -name '*.lock' -delete
          [ ! -d $S ] || [ "${{ steps.tests.outcome }}" != success ] || find $S -mindepth 2 -maxdepth 2 -type d ! -newer "$RUNNER_TEMP/start" -exec rm -rf {} +
          c=$( (cd $S 2>/dev/null && find . -mindepth 2 -maxdepth 2 -type d | sort) | sha256sum | cut -c1-16)
          echo "BUILD_KEY=$CACHE_PREFIX$OWN$c" >> "$GITHUB_ENV"
      - if: always() && env.BUILD_KEY != steps.main.outputs.cache-matched-key && env.BUILD_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.BUILD_KEY }}
      - if: always() && github.ref == 'refs/heads/main' && steps.moon.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/mbui/_build
            !${{ env.MBC_STORE }}
            !apps/mbui/_build/**/*.mbc
          key: mbui-moon-build-${{ env.PART }}-${{ github.sha }}
      # What failed, and in which commit, where everyone sees it (main is pushed to directly too: red, said whose)
      - name: What failed
        if: failure()
        run: |
          failed=$(grep -a 'test .* failed' "$RUNNER_TEMP/mbui-test.log" | sed 's/^\[stillfail\] test //; s/ failed.*//' | sort -u)
          why=$(grep -a '^flow: \|assert_idle: not' "$RUNNER_TEMP/mbui-test.log" | grep -v 'not checked idle' | sort -u | head -10)
          subject=$(git log -1 --format='%h %an: %s' "$GITHUB_SHA")
          echo "::error title=check-mbui (${{ env.PART }}${{ env.GROUP && format(' {0}', env.GROUP) || '' }}) failed at ${GITHUB_SHA:0:9}::$(printf '%s' "$failed" | tr '\n' ';')"
          {
            echo "### check-mbui (${{ env.PART }}${{ env.GROUP && format(' {0}', env.GROUP) || '' }}) failed at $subject"
            echo
            echo '```'
            printf '%s\n' "${failed:-(no test named: the check or the build failed, see the log)}"
            echo '```'
            [ -z "$why" ] || { echo '```'; printf '%s\n' "$why" | cut -c1-300; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"

  # sfapp's test program built once (scripts/test.sh APP_BUILD_OUT), its units kept as the native job keeps its own
  app-build:
    name: native (app build)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PART: app
      GROUP: build
      MBC_STORE: ${{ github.workspace }}/apps/mbui/_build/native/release/mbc-store
      CACHE_PREFIX: mbui-linux-store-app-sfapp-
      OWN: ${{ github.ref == 'refs/heads/main' && 'm-' || 'b-' }}
    steps: *native-steps

  # sfapp's tests, the app part's groups (scripts/test.sh app_group_of), each run on the program app-build made
  # (APP_EXE: nothing built here, no MoonBit, no units: a checkout, the program, the runs)
  app:
    name: native (app ${{ matrix.group }})
    needs: app-build
    runs-on: ubuntu-24.04
    # (a push's 5 minutes; the day's, its pages in one process, 10)
    timeout-minutes: ${{ github.event_name == 'push' && 5 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4, contrast]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: "mbui-app-test-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/app-test" }
      - name: The mbui app's tests (native, app ${{ matrix.group }}, on app-build's program)
        id: tests
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/app-test/sfapp.whitebox_test.exe"
          APP_EXE="$RUNNER_TEMP/app-test/sfapp.whitebox_test.exe" APP_INFO="$RUNNER_TEMP/app-test/__whitebox_test_info.json" \
            TIMES=1 TARGETS=native PARTS=app APP_GROUP=${{ matrix.group }} SFAPP_SHARDS=${{ github.event_name == 'schedule' && 1 || 4 }} LINES_OUT=40 \
            bash apps/mbui/scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/mbui-test.log"
      - name: What failed
        if: failure()
        run: |
          failed=$(grep -a 'test .* failed' "$RUNNER_TEMP/mbui-test.log" | sed 's/^\[stillfail[^]]*\] test //; s/ failed.*//' | sort -u)
          why=$(grep -a '^flow: \|assert_idle: not' "$RUNNER_TEMP/mbui-test.log" | grep -v 'not checked idle' | sort -u | head -10)
          subject=$(git log -1 --format='%h %an: %s' "$GITHUB_SHA")
          echo "::error title=check-mbui (app ${{ matrix.group }}) failed at ${GITHUB_SHA:0:9}::$(printf '%s' "$failed" | tr '\n' ';')"
          {
            echo "### check-mbui (app ${{ matrix.group }}) failed at $subject"
            echo
            echo '```'
            printf '%s\n' "${failed:-(no test named: see the log)}"
            echo '```'
            [ -z "$why" ] || { echo '```'; printf '%s\n' "$why" | cut -c1-300; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
