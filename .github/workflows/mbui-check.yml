# The mbui app's check and tests (apps/mbui/scripts/check.sh, test.sh), on js and on native: a branch's in its pipeline
# (pipeline.yml's check-mbui calls this, its gate waits for it), main's here on its own (on a push to the app). On main
# they hold nothing back (the app's beta is mbui.yml's, done waits for neither) and were the last of its pipeline run
# in half of them: as part of it, the run after waited for them, 16 of 40 runs a median 88 s (2026-10-20).
name: mbui-check
on:
  workflow_call:
    inputs:
      native: { type: boolean, default: true, description: "the tests on native too (pipeline.yml's plan: mbui_native)" }
  push:
    branches: [main]
    paths: ["apps/mbui/**", ".github/workflows/mbui-check.yml"]
# main: one run at a time, the newest waiting (a red one seen, as every commit's was in the pipeline); called, the
# pipeline's own (a branch's newest push stops its run before).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('mbui-check-{0}', github.ref) || format('mbui-check-call-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # The mbui app's check and tests (apps/mbui/scripts/check.sh, test.sh: still.fail's design system and pages over the
  # fixtures, the screens, the media screens, the core client, and the end-to-end flows seen again over their recorded
  # cores, src/sfreplay), on native, as the apps are built (2026-10-22, as asked: "我们只用原生"; js is no longer
  # tested), against mbui's fake host: no window, no station. On GitHub's Linux: a test's program links no host's
  # code (its host the Tester's fake, mbui/hostapi; the platforms' hosts are an app's main's alone), built with clang
  # (gcc took the 16 GB runner's memory on the largest units and the job was killed). The units each test is split into kept in the Actions cache by
  # content (MBC_STORE: main's written, a branch reads them): 667 tests, ~170 s a part with them, ~390 s without
  # (2026-10-22). A merge's evidence and main's, apart from the app's beta (mbui.yml), which its tests do not hold back
  # (as asked, 2026-10-19). The latest MoonBit (.github/actions/mbui-moonbit); mbui in apps/mbui/mbui. Its tests' two
  # parts (scripts/test.sh's PARTS) on a runner each, the check with the app's.
  js:
    name: native (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [app, replay]
    env:
      MBC_STORE: ${{ github.workspace }}/apps/mbui/_build/native/release/mbc-store
      CACHE_PREFIX: mbui-linux-store-${{ matrix.part }}-
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      # (from the Actions cache the moonbit workflow fills, never downloaded here)
      - uses: ./.github/actions/mbui-moonbit
      - name: The mbui app's check (detlint, then js and native type-checked)
        if: matrix.part == 'app'
        run: moon version && bash apps/mbui/scripts/check.sh
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.CACHE_PREFIX }}${{ github.sha }}
          restore-keys: ${{ env.CACHE_PREFIX }}
      - name: The mbui app's tests and the flows seen again (native, ${{ matrix.part }})
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/start"
          MBC_REAL_CC=clang TARGETS=native PARTS=${{ matrix.part }} LINES_OUT=40 bash apps/mbui/scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/mbui-test.log"
      # (main's: the units this run used, older ones gone, kept under a key by what they are)
      - name: The units kept
        if: always() && github.ref == 'refs/heads/main'
        run: |
          S=$MBC_STORE
          [ ! -d $S ] || { find $S -name '*.lock' -delete; find $S -mindepth 2 -maxdepth 2 -type d ! -newer "$RUNNER_TEMP/start" -exec rm -rf {} +; }
          c=$( (cd $S 2>/dev/null && find . -mindepth 2 -maxdepth 2 -type d | sort) | sha256sum | cut -c1-16)
          echo "BUILD_KEY=$CACHE_PREFIX$c" >> "$GITHUB_ENV"
      - if: always() && github.ref == 'refs/heads/main' && env.BUILD_KEY != steps.store.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.BUILD_KEY }}
      # What failed, and in which commit, where everyone sees it (main is pushed to directly too: red, said whose)
      - name: What failed
        if: failure()
        run: |
          failed=$(grep -a 'test .* failed' "$RUNNER_TEMP/mbui-test.log" | sed 's/^\[stillfail\] test //; s/ failed.*//' | sort -u)
          why=$(grep -a '^flow: \|assert_idle: not' "$RUNNER_TEMP/mbui-test.log" | grep -v 'not checked idle' | sort -u | head -10)
          subject=$(git log -1 --format='%h %an: %s' "$GITHUB_SHA")
          echo "::error title=check-mbui (${{ matrix.part }}) failed at ${GITHUB_SHA:0:9}::$(printf '%s' "$failed" | tr '\n' ';')"
          {
            echo "### check-mbui (${{ matrix.part }}) failed at $subject"
            echo
            echo '```'
            printf '%s\n' "${failed:-(no test named: the check or the build failed, see the log)}"
            echo '```'
            [ -z "$why" ] || { echo '```'; printf '%s\n' "$why" | cut -c1-300; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"


  # The mbui app's tests on native, on macOS, as they run on Linux above (a test's program links no host's code): the
  # Apple toolchain's C and link, ThinLTO as the apps are built. Only where native can differ (plan's mbui_native): the
  # FFI, the link options, the pinned mbui; on main, any change to the app.
  # On GitHub's macos-15 (free for a public repository): it needs nothing of Mini1's, whose mbui runner (mini1-6) is
  # main's beta's. On one runner, not shared out as check-mbui's are: the organization runs 5 macOS jobs at once
  # (GitHub's Team plan), and two of them for each run had a few branches' runs waiting minutes for one.
  # Built --release with mbui's scripts/mbc.py (scripts/test.sh): debug's was 49 s of building and 144 s of running,
  # most of it sfapp's tests one after another; release runs them in 15 s, and its build over the last one's objects
  # compiles only the units whose functions changed: two lines added to sfapp, the job 153 s against debug's 180-245 s
  # (no objects: 250-300 s; the C unchanged: 80 s; 2026-10-20). Without ThinLTO, whose link is 30-40 s a test; on
  # main the same tests with it too, as the apps are built (lto: what only inlining across units shows, undefined
  # behaviour; main's run holds nothing back), on a runner of its own. done waits for neither. 10 minutes at most.
  native:
    if: ${{ github.ref == 'refs/heads/main' || inputs.native }}
    name: native${{ matrix.lto && ' (ThinLTO)' || '' }}
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lto: ${{ github.ref == 'refs/heads/main' && fromJSON('[false, true]') || fromJSON('[false]') }}
    env:
      MBC_LOG: ${{ github.workspace }}/../mbc.log
      MBC_LTO: ${{ matrix.lto && 'thin' || '0' }}
      CACHE_PREFIX: mbui-native-store-${{ matrix.lto && 'lto' || 'test' }}-
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Tools (MoonBit, mbui)
        run: bash apps/mbui/scripts/beta.sh tools
      # The tests' objects as main's last run left them (mbc.py's units, each with what it was made of): moon builds
      # everything else anew (the checkout's mtimes are new), mbc.py keeps every object made of the same inputs by
      # content, so nothing here is taken for this commit's but by content. main's saved when its C is new (a branch
      # reads main's: its own would be its alone, as mbui.yml's Windows build's).
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: apps/mbui/_build/native/release/mbc-store
          key: ${{ env.CACHE_PREFIX }}${{ github.sha }}
          restore-keys: ${{ env.CACHE_PREFIX }}
      - name: The mbui app's tests and the flows seen again (native${{ matrix.lto && ', ThinLTO' || '' }})
        run: |
          set -o pipefail
          [ "$MBC_LTO" = 0 ] || echo "### native with ThinLTO (main's run: the apps' build)" >> "$GITHUB_STEP_SUMMARY"
          touch "$RUNNER_TEMP/mbui-native.start"
          TARGETS=native LINES_OUT=40 bash apps/mbui/scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/mbui-native.log"
      - name: What was compiled
        if: always()
        run: |
          grep -a 'compiled (' "$MBC_LOG" | sed 's/^mbc: //' | sort | tee -a "$GITHUB_STEP_SUMMARY" || true
          du -sh apps/mbui/_build/native/release || true
          # (by the split's manifests and each object's stamp, its command and compiler with what it was made of: a key by
          # the C alone kept the objects of a command no longer used, as #841's run did, 0 of 513 up to date after it)
          # (the store as this run used it: what it did not take or make, older objects, gone)
          S=apps/mbui/_build/native/release/mbc-store
          [ ! -d $S ] || { find $S -name '*.lock' -delete; find $S -mindepth 2 -maxdepth 2 -type d ! -newer "$RUNNER_TEMP/mbui-native.start" -exec rm -rf {} +; du -sh $S; }
          c=$( (cd $S 2>/dev/null && find . -mindepth 2 -maxdepth 2 -type d | sort) | shasum | cut -c1-16)
          echo "BUILD_KEY=$CACHE_PREFIX$c" >> "$GITHUB_ENV"
      - if: github.ref == 'refs/heads/main' && env.BUILD_KEY != steps.build-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: apps/mbui/_build/native/release/mbc-store
          key: ${{ env.BUILD_KEY }}
      - name: What failed
        if: failure()
        run: |
          failed=$(grep -a 'test .* failed' "$RUNNER_TEMP/mbui-native.log" | sed 's/^\[stillfail\] test //; s/ failed.*//' | sort -u)
          lto=; [ "$MBC_LTO" = 0 ] || lto=" with ThinLTO (native without it: the other job)"
          echo "::error title=check-mbui-native failed at ${GITHUB_SHA:0:9}$lto::$(printf '%s' "$failed" | tr '\n' ';')"
