# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# Every platform but Windows (windows.yml) on each push: the tests, the macOS
# apps with Core Text's text and the host's picture against mbui's own, the iOS
# simulator app, and the Android APK; each job's time is what this measures too
# (the summary lists the steps' seconds). Every step holds a merge back: none
# continues on an error (a check that cannot fail is no one's to look at).
name: mbui-ci
on:
  push:
    branches: [main]
    paths: ["apps/mbui/mbui/**", ".github/workflows/mbui-ci.yml", ".github/actions/mbui-moonbit/**"]
  pull_request:
    paths: ["apps/mbui/mbui/**", ".github/workflows/mbui-ci.yml", ".github/actions/mbui-moonbit/**"]
  # (android-streams-real's day, below)
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:



jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (every step's script run with no network: a test that reaches for it fails every time, scripts/offline.sh)
    defaults:
      run:
        working-directory: apps/mbui/mbui
        shell: bash scripts/offline.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: "A network namespace of its own for the steps (Ubuntu 24.04's AppArmor keeps them from a user's: let)"
        shell: bash
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The steps' network is none (a connection out fails at once)
        run: if curl -fsS --max-time 5 -o /dev/null https://github.com; then echo "reached github.com"; exit 1; fi
      - uses: ./.github/actions/mbui-moonbit
      - name: "Determinism: nothing waits on a guessed time or on settling, the app asks no frame (tools/detlint, docs/detlint.md)"
        run: scripts/detlint
      - name: "The outsides' kinds: each its own number in src/ui/hostcall.mbt, every host's named the same (scripts/chk outside-kinds)"
        run: scripts/chk outside-kinds
      - name: "The renderers' corners are src/host/corner.sl's (scripts/chk corner-sl)"
        run: scripts/chk corner-sl --check
      - name: "The kept runs: textrec_runs.mbt is what textrec_runs.txt makes, and lists every run git keeps (scripts/chk textrec --check)"
        run: scripts/chk textrec --check
      - name: "What the scripts wait with, on Linux's events (scripts/logwait_test.sh, chk logwait: inotify, a pidfd)"
        run: bash scripts/logwait_test.sh
      - name: Simulator termination exits on failure and leaves no client after a deadline
        run: bash scripts/ios-terminate-test.sh
      - name: Check
        run: moon version --all && moon check --target native --output-json 2>&1 | scripts/chk errs
      - name: "Check, the web's (the browser host, src/host's js files: what scripts/web.sh builds and scripts/textdiff.sh web needs)"
        run: moon check --target js --output-json 2>&1 | scripts/chk errs
      - name: "Unicode text (UAX #29, #14, #9 against Unicode's own tests)"
        run: |
          set -o pipefail
          moon test --target native -p mbui/text 2>&1 | tail -4
      - name: flexbox (Yoga's tests)
        run: moon test --target native -p mbui/flex 2>&1 | tail -3
      - name: "signals (alien-signals ported: its own tests and the conformance suite it runs, docs/signals.md)"
        run: |
          set -o pipefail
          moon test --target native -p mbui/signals 2>&1 | tail -3
      - name: "sin, exp, pow… worked out in MoonBit (mbui/dmath); gzip unzipped and SHA-256 (mbui/zip); pictures made from others, paths drawn, their PNGs and JPEGs, ThumbHash (mbui/pixels); base64, a link's parts, text's bytes, CSV, subtitles (mbui/codec); what of a frame differs from the last (mbui/damage)"
        run: |
          set -o pipefail
          moon test --target native -p mbui/dmath -p mbui/zip -p mbui/pixels -p mbui/codec -p mbui/damage 2>&1 | tail -3
      - name: "The tools (tools/): detlint's rules on made-up files; the C step (tools/mbc): the splitter on made-up C, then programs built with it, a MoonBit one whole and split (scripts/mbc_test.sh)"
        run: |
          set -o pipefail
          (cd tools && moon test --target native 2>&1 | tail -3)
          bash scripts/mbc_test.sh

  native:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    # the same tests on native, on Linux: a test's program links no host's code (its host the Tester's fake,
    # mbui/hostapi), so it builds anywhere
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: "A network namespace of its own for the steps (Ubuntu 24.04's AppArmor keeps them from a user's: let)"
        shell: bash
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: ./.github/actions/mbui-moonbit
      - name: "ui, motion, the components, Markdown, the hosts' kept runs replayed (src/kitdemo/gallery/textrec_*), effect.mb and its demo over seeds (scripts/test_native.sh; SEED=<n> replays a failure)"
        # (with no network: scripts/offline.sh)
        shell: bash scripts/offline.sh {0}
        run: scripts/test_native.sh
      - name: "The same tests with the display's frames drawn on the way, at 60, 120, 24 and 7 a second (scripts/fps_check.sh): the same results, the same programs as above run again"
        shell: bash scripts/offline.sh {0}
        run: bash scripts/fps_check.sh

  macos:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mbui-moonbit
      - name: macOS apps
        run: |
          for app in demo textdiff kitdemo; do
            /usr/bin/time -p env APP=$app scripts/mac.sh build 2>&1 | tail -4
          done
      # (no screenshot against goldens/mac*.png here: those are Studio's, at its scale, and every run on this runner
      # differed from them in size; the pictures are the render workflows' against their machine's references, and the
      # host's picture is the draw list's below, to the byte)
      - name: "Text against Core Text's own (scripts/textdiff.sh mac: the corpus's 255 strings, not only kitdemo's)"
        run: |
          mkdir -p out/node && (cd out/node && { [ -f package.json ] || npm init -y >/dev/null; } && npm i pngjs >/dev/null)
          scripts/textdiff.sh mac
      - name: "A Tester's draw list drawn offscreen (mbui-render) against the host's own picture of it (scripts/render_check.sh); its md5, to compare machines"
        run: scripts/render_check.sh
      - name: iOS simulator app
        run: scripts/ios.sh build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-shots
          path: |
            apps/mbui/mbui/out/textdiff/
            apps/mbui/mbui/out/render-check/
          if-no-files-found: ignore

  android:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # (the APK without Gradle: mbui/scripts/apk (tools/apk); its dependencies and their dex kept by the lock)
      - uses: ./.github/actions/mbui-apk
      - uses: ./.github/actions/mbui-moonbit
      - name: "The differential text test's APK (APP=textdiff; it runs on an emulator, scripts/textdiff.sh android)"
        run: APP=textdiff scripts/android.sh build
      - name: APK (libmbui.so from the generated C, then Gradle)
        run: scripts/android.sh build
      - name: "The split's self-check: the app's C whole and split define the same symbols (scripts/mbc check)"
        run: |
          TC=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          scripts/mbc check "--cc=$TC/aarch64-linux-android30-clang" --nm="$TC/llvm-nm" --obj=out/mbc-check \
            "--cflags=-I$MOON_HOME/include -Isrc/host -fPIC -fwrapv -fno-strict-aliasing -Wno-unused-value -O2 -DMOONBIT_ALLOCATOR=MOONBIT_ALLOCATOR_SYSTEM -Dmain=mbui_main" \
            out/android/mod/_build/native/release/build/demo/demo.c
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mbui/mbui/android/app/build/outputs/apk/debug/*.apk

  # Android's device checks on an emulator (no machine of ours): the streams' (scripts/android-streams.sh:
  # plain, reopen, away, anew, thrown) over streamdemo, the soft keyboard's (scripts/android-keyboard.sh: up, back,
  # behind, cold) over devicedemo; the emulator the cache's (.github/actions/mbui-android-emulator, AOSP's image)
  android-devices:
    # Once a day (and asked for), never on a push: an emulator's timing is no gate (2026-10-31, as asked: "这种不确定测试只
    # 定期跑，永远不阻塞 ci"; its 430-520 s were what every mbui push's checks waited for)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ABI: x86_64
      EMU_PORT: "5554"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # (the APK without Gradle: mbui/scripts/apk (tools/apk); its dependencies and their dex kept by the lock)
      - uses: ./.github/actions/mbui-apk
      - uses: ./.github/actions/mbui-moonbit
      # (AOSP's image, no Google Play services: on google_apis, just booted, their updates changed the assets' paths
      # (configuration change 0x80000000, CONFIG_ASSETS_PATHS), which relaunches every activity whatever its
      # configChanges, the keyboard's case's mid-way, run 39525921089)
      - uses: ./.github/actions/mbui-android-emulator
        id: emu
        with: { target: default, profile: pixel_6 }
      # (the keyboard's first: its first case is the first launch after the boot, as on an emulator just booted)
      - name: "The soft keyboard (scripts/android-keyboard.sh: up, back, behind, cold)"
        run: APP=devicedemo scripts/android.sh build && APP=devicedemo bash scripts/android-keyboard.sh
      # (after the keyboard's whatever it said, but only on an emulator that is up: with none, adb waited for one until
      # the job's 40 minutes ran out, run 39536847578)
      - name: "The streams (scripts/android-streams.sh: plain, reopen, away, anew, thrown)"
        if: (success() || failure()) && steps.emu.outcome == 'success'
        run: APP=streamdemo scripts/android.sh build && APP=streamdemo bash scripts/android-streams.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-devices
          path: |
            apps/mbui/mbui/out/android/streams/
            apps/mbui/mbui/out/android/keyboard/

  # The oldest Android the apps run on (minSdk 30, Android 11): the demo started there and its first frame shown, or
  # its crash. The other jobs' emulator is API 34's, so a call newer than the oldest system has went unseen until a
  # person's phone aborted at each start (#2665: API 34's Paint.getFontMetricsInt overload, Android 10-13; and with
  # minSdk 29, Android 10 never started at all: MainActivity's insets are API 30's).
  android-oldest:
    # Once a day (and asked for), as android-devices: an emulator's run is no gate (2026-10-31)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ABI: x86_64
      EMU_PORT: "5554"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: ./.github/actions/mbui-apk
      - uses: ./.github/actions/mbui-moonbit
      # (started, the app built meanwhile)
      - uses: ./.github/actions/mbui-android-emulator
        with: { api: "30", target: default, profile: pixel_6, phase: start }
      - name: Build the demo
        run: scripts/android.sh build
      - uses: ./.github/actions/mbui-android-emulator
        with: { api: "30", target: default, profile: pixel_6, phase: wait }
      - name: "Started on Android 11 (scripts/android-launch.sh: its first frame, or its crash)"
        run: bash scripts/android-launch.sh

  # MediaCodec is diagnostic, and must not consume the contract job's time budget. Once a day (and asked for), not each
  # push: it gates nothing, and its emulator and image were 1.1 GB of the Actions cache's downloads each push of mbui,
  # some 9.4 GB a commit of main all told, when GitHub stopped the account's ("Egress is over the account limit",
  # 2026-10-30, 41065605804)
  android-streams-real:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ABI: x86_64
      EMU_PORT: "5554"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: ./.github/actions/mbui-apk
      - uses: ./.github/actions/mbui-moonbit
      - uses: ./.github/actions/mbui-android-emulator
        with: { target: default, profile: pixel_6 }
      - name: Build the stream demo
        run: APP=streamdemo scripts/android.sh build
      - name: "The streams over the system's decoder (REAL=1, not a gate)"
        continue-on-error: true
        run: REAL=1 APP=streamdemo bash scripts/android-streams.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-streams-real
          path: apps/mbui/mbui/out/android/streams-real/
