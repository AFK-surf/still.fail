# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# Every platform but Windows (windows.yml) on each push: the tests, the macOS
# apps with Core Text's text and the host's picture against mbui's own, the iOS
# simulator app, and the Android APK; each job's time is what this measures too
# (the summary lists the steps' seconds). Every step holds a merge back: none
# continues on an error (a check that cannot fail is no one's to look at).
name: mbui-ci
on:
  push:
    branches: [main]
    paths: ["apps/mbui/mbui/**", ".github/workflows/mbui-ci.yml", ".github/actions/mbui-moonbit/**"]
  pull_request:
    paths: ["apps/mbui/mbui/**", ".github/workflows/mbui-ci.yml", ".github/actions/mbui-moonbit/**"]
  # (android-streams-real's day, below)
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
# main: one run at a time, the newest waiting (a run covers every merge since the one before it); a pull request's own
concurrency:
  group: ${{ github.event_name == 'push' && 'mbui-ci-main' || format('mbui-ci-{0}', github.run_id) }}
  cancel-in-progress: false



jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # (every step's script run with no network: a test that reaches for it fails every time, scripts/offline.sh)
    defaults:
      run:
        working-directory: apps/mbui/mbui
        shell: bash scripts/offline.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: "A network namespace of its own for the steps (Ubuntu 24.04's AppArmor keeps them from a user's: let)"
        shell: bash
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The steps' network is none (a connection out fails at once)
        run: if curl -fsS --max-time 5 -o /dev/null https://github.com; then echo "reached github.com"; exit 1; fi
      - uses: ./.github/actions/mbui-moonbit
      - name: "Determinism: nothing waits on a guessed time or on settling, the app asks no frame (tools/detlint)"
        run: scripts/detlint
      - name: "The outsides' kinds: each its own number in src/ui/hostcall.mbt, every host's named the same (scripts/chk outside-kinds)"
        run: scripts/chk outside-kinds
      - name: "The renderers' corners are src/host/corner.sl's (scripts/chk corner-sl)"
        run: scripts/chk corner-sl --check
      - name: "The kept runs: textrec_runs.mbt is what textrec_runs.txt makes, and lists every run git keeps (scripts/chk textrec --check)"
        run: scripts/chk textrec --check
      - name: "What the scripts wait with, on Linux's events (scripts/logwait_test.sh, chk logwait: inotify, a pidfd)"
        run: bash scripts/logwait_test.sh
      - name: Simulator termination exits on failure and leaves no client after a deadline
        run: bash scripts/ios-terminate-test.sh
      - name: "Android's frame pacing (FramePacer, MBView's) on a clock of its own: each refresh a new frame while the app asks, the display's rate, a phone's recorded frames replayed (scripts/framepacer_test.sh; its known list only shortens)"
        run: sh scripts/framepacer_test.sh
      - name: "Android's soft keyboard request in full screen and multi-window"
        run: sh scripts/ime_request_test.sh
      - name: Check
        run: moon version --all && moon check --target native --output-json 2>&1 | scripts/chk errs
      - name: "Check, the web's (the browser host, src/host's js files: what scripts/web.sh builds and scripts/textdiff.sh web needs)"
        run: moon check --target js --output-json 2>&1 | scripts/chk errs
      - name: "The browser host handles scale, pointer layers, stream restoration, browser zoom, voice input, the soft keyboard and what is posted told between frames"
        run: node --test test/host/web-scale.test.mjs test/web/keys.test.mjs test/web/wheel.test.mjs test/web/pointer.test.mjs test/web/context.test.mjs test/web/ime.test.mjs test/web/posted.test.mjs test/web/text_menu.test.mjs
      - name: "Unicode text (UAX #29, #14, #9 against Unicode's own tests)"
        run: |
          set -o pipefail
          moon test --target native -p mbui/text 2>&1 | tail -4
      - name: flexbox (Yoga's tests)
        run: moon test --target native -p mbui/flex 2>&1 | tail -3
      - name: "signals (alien-signals ported: its own tests and the conformance suite it runs)"
        run: |
          set -o pipefail
          moon test --target native -p mbui/signals 2>&1 | tail -3
      - name: "sin, exp, pow… worked out in MoonBit (mbui/dmath); gzip unzipped and SHA-256 (mbui/zip); pictures made from others, paths drawn, their PNGs and JPEGs, ThumbHash (mbui/pixels); base64, a link's parts, text's bytes, CSV, subtitles (mbui/codec); what of a frame differs from the last (mbui/damage)"
        run: |
          set -o pipefail
          moon test --target native -p mbui/dmath -p mbui/zip -p mbui/pixels -p mbui/codec -p mbui/damage 2>&1 | tail -3
      - name: "Vector graphics as tiny-skia draws them, against its own pictures (mbui/skia, mbui/skiatest); SVG, fonts and OpenType shaping (mbui/svg, mbui/font, mbui/shape: resvg's suite runs where it is checked out beside them, src/svgtest)"
        run: |
          set -o pipefail
          moon test --target native -p mbui/skia -p mbui/skiatest -p mbui/svg -p mbui/font -p mbui/shape -p mbui/svgtest 2>&1 | tail -3
      - name: "The tools (tools/): detlint's rules on made-up files; the C step (tools/mbc): the splitter on made-up C, then programs built with it, a MoonBit one whole and split (scripts/mbc_test.sh)"
        run: |
          set -o pipefail
          (cd tools && moon test --target native 2>&1 | tail -3)
          bash scripts/mbc_test.sh

  native:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    # the same tests on native, on Linux: a test's program links no host's code (its host the Tester's fake,
    # mbui/hostapi), so it builds anywhere
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: native${{ matrix.fps && format(' at {0} fps', matrix.fps) || '' }}
    # (and the same tests again with frames drawn on run_for's way while the app asks for them (scripts/fps_check.sh),
    # at 120, at 60, and at 24 then 7, a runner each beside it: what a test asserts at a moment the same however many
    # frames came before it. On main after a merge (the user, 2026-11-11: 「直接合，帧率在 main 上合并后跑」, as
    # mbui-check's), the day's run and one by hand; a pull request's pushes at the default rate alone)
    strategy:
      fail-fast: false
      matrix:
        fps: ${{ fromJSON(github.event_name == 'pull_request' && '[""]' || '["", "120", "60", "24 7"]') }}
    # (what it builds kept between runs, as mbui-check's native job keeps the app's: moon's own build (moonc's C) and the
    # units each test's C is split into, by content (MBC_STORE: main's newest and a branch's own together). Without,
    # every run compiled all of mbui's C again: a change to ui 154 units of ui's blackbox tests and 230 of its whitebox
    # tests, ~180 s of compile of the job's 5 minutes, and the job stopped at them (#3953, #3955, 2026-11-04))
    env:
      MBC_STORE: ${{ github.workspace }}/apps/mbui/mbui/_build/native/release/mbc-store
      CACHE_PREFIX: mbui-ci-native-store-
      # (at 60 and 120 how what moves goes is counted on every frame too, none failing: tester_fps.mbt)
      MBUI_TEST_MOTION: ${{ (matrix.fps == '120' || matrix.fps == '60') && 'count' || '' }}
      # (and at the default rate each file's bars and what was found under them said too, where motion-bars sets them
      # beside the rates': a bar holds what the default run's frames find as well)
      MBUI_TEST_BARS: ${{ matrix.fps == '' && inputs.rates != 'no' && github.event_name != 'pull_request' && '1' || '' }}
      MOTION_OUT: ${{ github.workspace }}/motion.txt
      OWN: ${{ github.ref == 'refs/heads/main' && 'm-' || 'b-' }}
    steps:
      - uses: actions/checkout@v4
      - name: "A network namespace of its own for the steps (Ubuntu 24.04's AppArmor keeps them from a user's: let)"
        shell: bash
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: ./.github/actions/mbui-moonbit
      # moon's own build as main's newest run left it (not the units' store, nor each test program's objects: the store
      # keeps those), over it moon making again only what changed; each file an mtime of its content for that
      - uses: actions/cache/restore@v4
        id: moon
        with:
          path: |
            apps/mbui/mbui/_build
            !${{ env.MBC_STORE }}
            !apps/mbui/mbui/_build/**/*.mbc
          key: mbui-ci-native-moon-${{ github.sha }}
          restore-keys: mbui-ci-native-moon-
      - shell: bash
        working-directory: .
        run: bash apps/mbui/scripts/moon-mtimes.sh
      # The units main's newest run kept, and on a branch its own last run's beside them (mbui-check.yml's, the same way)
      - uses: actions/cache/restore@v4
        id: main
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.CACHE_PREFIX }}m-${{ github.sha }}
          restore-keys: ${{ env.CACHE_PREFIX }}m-
      - if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p "$MBC_STORE"
          mv "$MBC_STORE" "$RUNNER_TEMP/store-main"
      - uses: actions/cache/restore@v4
        id: own
        if: github.ref != 'refs/heads/main'
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.CACHE_PREFIX }}b-${{ github.sha }}
          restore-keys: ${{ env.CACHE_PREFIX }}b-
      - if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p "$MBC_STORE"
          cp -a -n "$RUNNER_TEMP/store-main/." "$MBC_STORE/"
          echo "units: $(find "$MBC_STORE" -mindepth 2 -maxdepth 2 -type d | wc -l) (main's $(find "$RUNNER_TEMP/store-main" -mindepth 2 -maxdepth 2 -type d | wc -l))"
      - name: "ui, motion, the components, Markdown, the hosts' kept runs replayed (src/kitdemo/gallery/textrec_*), effect.mb and its demo over seeds (scripts/test_native.sh; SEED=<n> replays a failure)"
        id: tests
        # (with no network: scripts/offline.sh)
        shell: bash scripts/offline.sh {0}
        run: |
          touch "$RUNNER_TEMP/start"
          if [ -z "${{ matrix.fps }}" ]; then scripts/test_native.sh; else FPS="${{ matrix.fps }}" bash scripts/fps_check.sh; fi
      # (what the run counted of how what moves goes, MBUI_TEST_MOTION=count: in the summary; and that and what it said of
      # the bars, MBUI_TEST_BARS too, whole as an artifact, for motion-bars)
      - name: How what moves goes
        if: always() && (env.MBUI_TEST_MOTION == 'count' || env.MBUI_TEST_BARS == '1')
        shell: bash
        run: |
          [ "$MBUI_TEST_MOTION" != count ] || bash scripts/motion_said.sh "$MOTION_OUT" "how what moves goes at ${{ matrix.fps }} fps" >> "$GITHUB_STEP_SUMMARY"
          touch "$MOTION_OUT"
      - if: always() && (env.MBUI_TEST_MOTION == 'count' || env.MBUI_TEST_BARS == '1')
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: "motion-mbui-${{ matrix.fps || 'default' }}", path: "${{ env.MOTION_OUT }}", retention-days: 7 }
      # (the units this run used, older ones gone (only after a run that went through: one stopped early used few), kept
      # under a key by what they are: main's, and a branch's for its next push)
      - name: The units kept
        if: always()
        shell: bash
        run: |
          S=$MBC_STORE
          [ ! -d $S ] || find $S -name '*.lock' -delete
          # (and only where this run took or made any: a run whose programs moon found built already, over its own
          # build, split no C and used none, and would have kept none)
          used=$( [ ! -d $S ] || find $S -mindepth 2 -maxdepth 2 -type d -newer "$RUNNER_TEMP/start" -print -quit)
          [ -z "$used" ] || [ "${{ steps.tests.outcome }}" != success ] || find $S -mindepth 2 -maxdepth 2 -type d ! -newer "$RUNNER_TEMP/start" -exec rm -rf {} +
          c=$( (cd $S 2>/dev/null && find . -mindepth 2 -maxdepth 2 -type d | sort) | sha256sum | cut -c1-16)
          echo "BUILD_KEY=$CACHE_PREFIX$OWN$c" >> "$GITHUB_ENV"
      - if: always() && env.BUILD_KEY != steps.main.outputs.cache-matched-key && env.BUILD_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MBC_STORE }}
          key: ${{ env.BUILD_KEY }}
      - if: always() && github.ref == 'refs/heads/main' && steps.moon.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/mbui/mbui/_build
            !${{ env.MBC_STORE }}
            !apps/mbui/mbui/_build/**/*.mbc
          key: mbui-ci-native-moon-${{ github.sha }}

  # (each per-file bar of mbui's set beside the most one Tester of its file found under it in the runs at 60, 120 and the
  # default rate, together (scripts/motion_bars.sh): a bar to fall or a file to leave motion_counted fails it, once the
  # tables were clean on main (the coordinator of the migration, 2026-11-12), and what merged since is said by rates-said)
  motion-bars:
    name: native (mbui's bars against what was found)
    needs: native
    if: ${{ always() && inputs.rates != 'no' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: apps/mbui/mbui/scripts }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "motion-mbui-*", path: "${{ runner.temp }}/motion" }
      # (failing where a bar is to fall or a file to leave the list, once every run it was given went through: one cut
      # short found less than there is, and a bar it set beside that would be said to fall for nothing)
      - env:
          STRICT: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '0' || '1' }}
          NAME: "mbui's bars"
        run: |
          find "$RUNNER_TEMP/motion" -type f | xargs -r cat > "$RUNNER_TEMP/motion.txt"
          MOTION_BARS_FAIL=$STRICT bash apps/mbui/mbui/scripts/motion_bars.sh "$RUNNER_TEMP/motion.txt" "mbui's bars against what 60, 120 and the default rate found" >> "$GITHUB_STEP_SUMMARY" ||
            { echo "::error title=$NAME::a bar to fall or a file to leave motion_counted: this job's summary says which, and the one line to change for each"; exit 1; }

  # On main, after a merge: what failed and what merged since the last run that went through, the likeliest first
  # (scripts/rates-said.sh), for whoever brought it to mend forward; it holds no pull request back
  rates-said:
    needs: [test, native, macos, android, motion-bars]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v5
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: bash scripts/rates-said.sh mbui-ci
  macos:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: macos-15
    timeout-minutes: 5
    # (the C units its four builds compile, kept by content (scripts/mbc's MBC_STORE): main's last run's, taken by every
    # run. Without it each run compiled all of them anew, 0 up to date, on a runner whose speed differs run to run: 2:57
    # to 3:28 on #5754 to #5776, then 5:02 on #5779 (each step 1.4 to 1.9 times as long: macOS apps 125 s where it was
    # 85-90, the iOS app's 133 units 52 s for 28-32), cancelled at its five minutes, 2026-11-12)
    env:
      MBC_STORE: ${{ github.workspace }}/apps/mbui/mbui/_build/mbc-store-mac
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mbui-moonbit
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: ${{ env.MBC_STORE }}
          key: mbui-ci-macos-store-${{ github.sha }}
          restore-keys: mbui-ci-macos-store-
      - run: mkdir -p "$MBC_STORE" && touch "$RUNNER_TEMP/start"
      - name: macOS apps
        run: |
          for app in demo textdiff kitdemo; do
            /usr/bin/time -p env APP=$app scripts/mac.sh build 2>&1 | tail -4
          done
      # (no screenshot against goldens/mac*.png here: those are test station's, at its scale, and every run on this runner
      # differed from them in size; the pictures are the render workflows' against their machine's references, and the
      # host's picture is the draw list's below, to the byte)
      - name: "Text against Core Text's own (scripts/textdiff.sh mac: the corpus's 255 strings, not only kitdemo's)"
        run: |
          mkdir -p out/node && (cd out/node && { [ -f package.json ] || npm init -y >/dev/null; } && npm i pngjs >/dev/null)
          scripts/textdiff.sh mac
      - name: "A Tester's draw list drawn offscreen (mbui-render) against the host's own picture of it (scripts/render_check.sh); its md5, to compare machines"
        run: scripts/render_check.sh
      - name: iOS simulator app
        run: scripts/ios.sh build
      # (main's run keeps what it used, the units it took or compiled, and lets the rest go: the store no larger than one
      # run's; a branch's run keeps nothing, so each takes main's newest)
      - name: The units kept
        if: success() && github.event_name == 'push'
        run: |
          find "$MBC_STORE" -name '*.lock' -delete
          find "$MBC_STORE" -mindepth 2 -maxdepth 2 -type d ! -newer "$RUNNER_TEMP/start" -exec rm -rf {} +
      - if: success() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MBC_STORE }}
          key: mbui-ci-macos-store-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: macos-shots
          path: |
            apps/mbui/mbui/out/textdiff/
            apps/mbui/mbui/out/render-check/
          if-no-files-found: ignore

  android:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # (the APK without Gradle: mbui/scripts/apk (tools/apk); its dependencies and their dex kept by the lock)
      - uses: ./.github/actions/mbui-apk
      - uses: ./.github/actions/mbui-moonbit
      - name: "The differential text test's APK (APP=textdiff; it runs on an emulator, scripts/textdiff.sh android)"
        run: APP=textdiff scripts/android.sh build
      - name: APK (libmbui.so from the generated C, then Gradle)
        run: scripts/android.sh build
      - name: "The split's self-check: the app's C whole and split define the same symbols (scripts/mbc check)"
        run: |
          TC=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          scripts/mbc check "--cc=$TC/aarch64-linux-android30-clang" --nm="$TC/llvm-nm" --obj=out/mbc-check \
            "--cflags=-I$MOON_HOME/include -Isrc/host -fPIC -fwrapv -fno-strict-aliasing -Wno-unused-value -O2 -DMOONBIT_ALLOCATOR=MOONBIT_ALLOCATOR_MIMALLOC -Dmain=mbui_main" \
            out/android/mod/_build/native/release/build/demo/demo.c
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mbui/mbui/android/app/build/outputs/apk/debug/*.apk

  # Android's device checks on an emulator (no machine of ours): the streams' (scripts/android-streams.sh:
  # plain, reopen, away, anew, thrown) over streamdemo, the soft keyboard's (scripts/android-keyboard.sh: up, back,
  # behind, cold) over devicedemo; the emulator the cache's (.github/actions/mbui-android-emulator, AOSP's image)
  android-devices:
    # Once a day (and asked for), never on a push: an emulator's timing is no gate (2026-10-31, as asked: "这种不确定测试只
    # 定期跑，永远不阻塞 ci"; its 430-520 s were what every mbui push's checks waited for)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ABI: x86_64
      EMU_PORT: "5554"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # (the APK without Gradle: mbui/scripts/apk (tools/apk); its dependencies and their dex kept by the lock)
      - uses: ./.github/actions/mbui-apk
      - uses: ./.github/actions/mbui-moonbit
      # (AOSP's image, no Google Play services: on google_apis, just booted, their updates changed the assets' paths
      # (configuration change 0x80000000, CONFIG_ASSETS_PATHS), which relaunches every activity whatever its
      # configChanges, the keyboard's case's mid-way, run 39525921089)
      - uses: ./.github/actions/mbui-android-emulator
        id: emu
        with: { target: default, profile: pixel_6 }
      # (the keyboard's first: its first case is the first launch after the boot, as on an emulator just booted)
      - name: "The soft keyboard (scripts/android-keyboard.sh: up, back, behind, cold)"
        run: APP=devicedemo scripts/android.sh build && APP=devicedemo bash scripts/android-keyboard.sh
      # (after the keyboard's whatever it said, but only on an emulator that is up: with none, adb waited for one until
      # the job's 40 minutes ran out, run 39536847578)
      - name: "The streams (scripts/android-streams.sh: plain, reopen, away, anew, thrown)"
        if: (success() || failure()) && steps.emu.outcome == 'success'
        run: APP=streamdemo scripts/android.sh build && APP=streamdemo bash scripts/android-streams.sh
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: android-devices
          path: |
            apps/mbui/mbui/out/android/streams/
            apps/mbui/mbui/out/android/keyboard/

  # The oldest Android the apps run on (minSdk 30, Android 11): the demo started there and its first frame shown, or
  # its crash. The other jobs' emulator is API 34's, so a call newer than the oldest system has went unseen until a
  # person's phone aborted at each start (#2665: API 34's Paint.getFontMetricsInt overload, Android 10-13; and with
  # minSdk 29, Android 10 never started at all: MainActivity's insets are API 30's).
  android-oldest:
    # Once a day (and asked for), as android-devices: an emulator's run is no gate (2026-10-31)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ABI: x86_64
      EMU_PORT: "5554"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: ./.github/actions/mbui-apk
      - uses: ./.github/actions/mbui-moonbit
      # (started, the app built meanwhile)
      - uses: ./.github/actions/mbui-android-emulator
        with: { api: "30", target: default, profile: pixel_6, phase: start }
      - name: Build the demo
        run: scripts/android.sh build
      - uses: ./.github/actions/mbui-android-emulator
        with: { api: "30", target: default, profile: pixel_6, phase: wait }
      - name: "Started on Android 11 (scripts/android-launch.sh: its first frame, or its crash)"
        run: bash scripts/android-launch.sh

      # The phone owns its adb identity. Exercise its key store inside an Android app sandbox, where a hard link
      # fails even though it works on the build host (client/shell/tests/android-adb-key).
      - name: "The phone can create and reuse its adb identity"
        working-directory: client/shell/tests/android-adb-key
        run: |
          rustup target add x86_64-linux-android
          ABI=x86_64 SERIAL=emulator-5554 bash check.sh

  # MediaCodec is diagnostic, and must not consume the contract job's time budget. Once a day (and asked for), not each
  # push: it gates nothing, and its emulator and image were 1.1 GB of the Actions cache's downloads each push of mbui,
  # some 9.4 GB a commit of main all told, when GitHub stopped the account's ("Egress is over the account limit",
  # 2026-10-30, 41065605804)
  android-streams-real:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ABI: x86_64
      EMU_PORT: "5554"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: ./.github/actions/mbui-apk
      - uses: ./.github/actions/mbui-moonbit
      - uses: ./.github/actions/mbui-android-emulator
        with: { target: default, profile: pixel_6 }
      - name: Build the stream demo
        run: APP=streamdemo scripts/android.sh build
      - name: "The streams over the system's decoder (REAL=1, not a gate)"
        continue-on-error: true
        run: REAL=1 APP=streamdemo bash scripts/android-streams.sh
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: android-streams-real
          path: apps/mbui/mbui/out/android/streams-real/
