# still.fail mbui's four packages on GitHub's own (free) runners, the way to three minutes from a push: first what the
# builds take there as they are (no signing, nothing put), each step timed by the run itself.
name: mbui-fast
on:
  push:
    branches: [mbui-ci-3min]
  workflow_dispatch:
concurrency:
  group: mbui-fast-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  # the compiled units by content (scripts/mbc.py's store), kept between runs by actions/cache
  MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
  HBC_CACHE: ${{ github.workspace }}/.ci/hbc
  # the linker's ThinLTO cache: a module whose bitcode did not change, its backend's object kept
  MBC_LTO_CACHE: ${{ github.workspace }}/.ci/lto
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        # (written by this branch's runs too, while it is measured: main's alone, after)
        with: { cache-read-only: false }
      - uses: ./.github/actions/setup
      - name: MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash > /dev/null
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          echo "MOON_HOME=$HOME/.moon" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ci/mbc-store
            ${{ github.workspace }}/.ci/hbc
            ${{ github.workspace }}/.ci/lto
          key: mbui-fast-${{ runner.os }}-${{ github.sha }}
          restore-keys: mbui-fast-${{ runner.os }}-
      - name: mbui at mbui.rev
        run: sh apps/mbui/scripts/mbui.sh
      - name: The Android engine and shell, prebuilt
        run: |
          node scripts/native.ts fetch engine android-arm64
          node scripts/native.ts fetch shell android-arm64
      - name: The core's packages
        run: cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null
      - name: APK (APP=stillfail, release, unsigned key)
        run: |
          L=$RUNNER_TEMP/build.log
          APP=stillfail VARIANT=release EMBER=$PWD bash apps/mbui/scripts/android.sh build > $L 2>&1 || { grep -av '│\|Warning\|╭\|╰\|warning:' $L | tail -60; exit 1; }
          grep -a '^android.sh\|^core.hbc\|compiled (\|units in\|BUILD \|^moon:\|Finished' $L | cut -c1-240 | tail -20
          ls -la apps/mbui/android/app/build/outputs/apk/*/*.apk
      - name: "Gradle's time, task by task (the same build again, libmbui.so touched: as a new build's)"
        run: |
          cd apps/mbui/android
          touch app/src/main/jniLibs/arm64-v8a/libmbui.so
          /usr/bin/time -p ./gradlew -q assembleRelease --profile -PstillfailBuild=2 2>&1 | tail -5
          python3 - build/reports/profile/*.html <<'PY'
          import re, sys, html
          t = open(sys.argv[1]).read()
          rows = re.findall(r'<td>(:[\w:]+)</td>\s*<td[^>]*>([0-9.]+)s</td>\s*<td[^>]*>([^<]*)</td>', t)
          if not rows: print(re.sub(r'\s+', ' ', t[t.find('Task Execution'):][:3000]))
          rows.sort(key=lambda r: -float(r[1]))
          for task, s, res in rows[:15]:
              print(f'{float(s):6.2f} s  {task}  {res}')
          for k in ('Startup', 'Settings and buildSrc', 'Loading Projects', 'Configuring Projects', 'Task Execution', 'Total Build Time'):
              m = re.search(re.escape(k) + r'</td>\s*<td class="numeric">([^<]+)</td>', t)
              if m: print(f'{k}: {m.group(1)}')
          PY

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash > /dev/null
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          echo "MOON_HOME=$HOME/.moon" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ci/mbc-store
            ${{ github.workspace }}/.ci/hbc
            ${{ github.workspace }}/.ci/lto
          key: mbui-fast-${{ runner.os }}-${{ github.sha }}
          restore-keys: mbui-fast-${{ runner.os }}-
      - name: mbui at mbui.rev
        run: sh apps/mbui/scripts/mbui.sh
      - name: The core's packages
        run: cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null
      - name: Rust (the core's shell)
        run: rustup target add aarch64-apple-darwin aarch64-apple-ios
      # the core's parts (its Rust shell, the engine, Hermes): by what they are made of
      - uses: actions/cache@v4
        with:
          # (_build/.macos-min: mac-app.sh's word that what is built is for this macOS, else it starts over)
          path: |
            apps/mbui/out/core
            apps/mbui/_build/.macos-min
            ~/Library/Caches/stillfail-build
          key: mbui-core-mac-${{ hashFiles('client/shell/**', 'client/Cargo.lock', 'client/Cargo.toml', 'apps/mbui/scripts/core.sh', 'apps/mbui/core/**') }}
      - name: The macOS app (built, ad hoc signed)
        run: |
          L=$RUNNER_TEMP/build.log
          EMBER=$PWD bash apps/mbui/scripts/mac-app.sh build > $L 2>&1 || { grep -av '│\|Warning\|╭\|╰\|warning:' $L | tail -60; exit 1; }
          grep -a '^mac-app.sh\|^mac.sh\|^core\|compiled (\|units in\|Finished\|cargo\|Compiling stillfail' $L | cut -c1-240 | tail -20

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash > /dev/null
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          echo "MOON_HOME=$HOME/.moon" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ci/mbc-store
            ${{ github.workspace }}/.ci/hbc
          key: mbui-fast-ios-${{ github.sha }}
          restore-keys: mbui-fast-ios-
      - name: mbui with a device's build (zzj3720/mbui ios-device)
        run: |
          git clone -q --depth 1 -b ios-device https://github.com/zzj3720/mbui.git "$RUNNER_TEMP/mbui"
          echo "MBUI=$RUNNER_TEMP/mbui" >> $GITHUB_ENV
      - name: The core's packages
        run: cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null
      - name: Rust (the core's shell, for a device)
        run: rustup target add aarch64-apple-ios
      - uses: actions/cache@v4
        with:
          path: |
            apps/mbui/out/core
            ~/Library/Caches/stillfail-build
          key: mbui-core-ios-${{ hashFiles('client/shell/**', 'client/Cargo.lock', 'client/Cargo.toml', 'apps/mbui/scripts/core.sh', 'apps/mbui/core/**') }}
      - name: The iOS app for a device (unsigned), as an .ipa
        run: |
          L=$RUNNER_TEMP/build.log
          t0=$SECONDS
          APP=stillfail MBUI_IOS_SDK=iphoneos MBUI_IOS_ID=fail.still.mbui EMBER=$PWD bash apps/mbui/scripts/ios.sh build > $L 2>&1 || { grep -av '│\|Warning\|╭\|╰\|warning:' $L | tail -60; exit 1; }
          grep -a '^built\|compiled (\|units in\|^the core\|^engine\|^hermes' $L | cut -c1-240 | tail -12
          cd apps/mbui/out/ios-device && rm -rf Payload *.ipa && mkdir Payload && cp -R MBUI.app Payload/ && zip -qry stillfail-mbui.ipa Payload
          ls -la stillfail-mbui.ipa; echo "ipa in $((SECONDS - t0)) s"
