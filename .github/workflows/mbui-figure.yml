# Temporary evidence workflow on this session's branch. It checks out an exact source commit;
# it is not part of the Chat change or a release workflow.
name: mbui-media-runtime
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to render
        required: true
        type: string
      source_key:
        description: Expected mbui-film-wasm source key
        required: true
        type: string
permissions:
  contents: read
jobs:
  evidence:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/mbui-moonbit
      - name: Build the exact scene and its drawing host
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_KEY: ${{ inputs.source_key }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [ "$sha" = "$SOURCE_REF" ]
          key=$(node scripts/native.ts key mbui-film-wasm darwin-arm64)
          [ "$key" = "$SOURCE_KEY" ]
          bash apps/mbui/scripts/wasm-film-build.sh "$RUNNER_TEMP/chat-renderer"
          jq -n --arg commit "$sha" --arg key "$key" \
            '{part:"mbui-film-wasm",target:"darwin-arm64",commit:$commit,key:$key,from:"github-hosted-ci"}' \
            > "$RUNNER_TEMP/chat-renderer/manifest.json"
          mkdir -p apps/mbui/out/chat-evidence
          printf '%s\n%s\n' "$sha" "$key" > apps/mbui/out/chat-evidence/source.txt
          printf 'exit\n' > apps/mbui/out/chat-evidence/action.drive
      - name: Capture attachment preview at each screen size
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/apps/mbui/out/chat-evidence"
          runtime="$RUNNER_TEMP/chat-renderer/sffilm"
          for scene in small:390x844:2 medium:700x900:2 large:1280x800:0; do
            name=${scene%%:*}
            rest=${scene#*:}
            size=${rest%%:*}
            platform=${rest#*:}
            MBUI_MEDIA_RUNTIME="$runtime" MBUI_FIXTURE=chat-preview-md MBUI_WIN="$size" \
              MBUI_FILM_PLATFORM="$platform" MBUI_FILM_SCALE=2 MBUI_PICTURE_AT=1000 \
              bash apps/mbui/scripts/media.sh picture "$out/$name-md.png" "$out/action.drive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: chat-preview-evidence
          path: apps/mbui/out/chat-evidence/
          if-no-files-found: error
