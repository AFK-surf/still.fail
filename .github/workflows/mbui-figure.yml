# Temporary evidence workflow on this session's branch. It checks out an exact source commit;
# it is not part of the Chat change or a release workflow.
name: mbui-media-runtime
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to render
        required: true
        type: string
      source_key:
        description: Expected mbui-film-wasm source key
        required: true
        type: string
      source_patch:
        description: Optional gzip and base64 encoded worktree patch
        required: false
        type: string
      patch_sha256:
        description: SHA-256 of the uncompressed worktree patch
        required: false
        type: string
      render:
        description: Build and render the three preview sizes
        type: boolean
        default: true
      test_filters:
        description: Test name filters, one per line
        required: false
        default: "*a chat*reader*"
        type: string
      view_test_filters:
        description: Optional retained-view test name filters, one per line
        required: false
        default: ""
        type: string
      diagnostic_run:
        description: CI run whose native test artifact is examined
        required: false
        default: ""
        type: string
      scene_spec:
        description: Optional JSON fixture, drives, capture time or frame, and window list
        required: false
        default: "{}"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-diagnostic:
    if: ${{ inputs.diagnostic_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - name: Verify the source of the existing native program
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          DIAGNOSTIC_RUN: ${{ inputs.diagnostic_run }}
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_RUN" =~ ^[0-9]+$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_REF" ]
          [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DIAGNOSTIC_RUN" --jq .head_sha)" = "$SOURCE_REF" ]
      - uses: actions/download-artifact@v4
        with:
          name: mbui-app-test-${{ inputs.diagnostic_run }}-1
          path: ${{ runner.temp }}/native-test
          github-token: ${{ github.token }}
          run-id: ${{ inputs.diagnostic_run }}
      - name: Run the isolated case and the whole file
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native-test"
          chmod +x sfapp.whitebox_test.exe testexe
          ./testexe parts __whitebox_test_info.json 4 apps/mbui/src/sfapp/tape_wbtest.mbt > parts
          arg=$(cut -d ' ' -f2- parts)
          printf 'Whole file: %s\n' "$arg"
          if ./sfapp.whitebox_test.exe "$arg" > 0.out 2>&1; then code=0; else code=$?; fi
          printf '%s 0\n' "$code" > 0.code
          ./testexe said __whitebox_test_info.json . stillfail/sfapp || true
          printf '\nIsolated case: tape_wbtest.mbt:27-28\n'
          printf '0 tape_wbtest.mbt:27-28\n' > parts
          if ./sfapp.whitebox_test.exe 'tape_wbtest.mbt:27-28' > 0.out 2>&1; then code=0; else code=$?; fi
          printf '%s 0\n' "$code" > 0.code
          ./testexe said __whitebox_test_info.json . stillfail/sfapp || true
  evidence:
    if: ${{ inputs.render }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Apply the recorded worktree patch
        env:
          SOURCE_PATCH: ${{ inputs.source_patch }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_PATCH" ]; then
            node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.SOURCE_PATCH, "base64"))' "$RUNNER_TEMP/source.patch.gz"
            gzip -dc "$RUNNER_TEMP/source.patch.gz" > "$RUNNER_TEMP/source.patch"
            printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/source.patch" | shasum -a 256 -c
            git apply --check "$RUNNER_TEMP/source.patch"
            git apply "$RUNNER_TEMP/source.patch"
            git add -A
          fi
      - uses: ./.github/actions/mbui-moonbit
      - name: Build the exact scene and its drawing host
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_KEY: ${{ inputs.source_key }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [ "$sha" = "$SOURCE_REF" ]
          key=$(node scripts/native.ts key mbui-film-wasm darwin-arm64)
          [ "$key" = "$SOURCE_KEY" ]
          bash apps/mbui/scripts/wasm-film-build.sh "$RUNNER_TEMP/chat-renderer"
          label="$sha"
          if [ -n "$PATCH_SHA256" ]; then label="$sha+patch:$PATCH_SHA256"; fi
          jq -n --arg commit "$label" --arg key "$key" \
            '{part:"mbui-film-wasm",target:"darwin-arm64",commit:$commit,key:$key,from:"github-hosted-ci"}' \
            > "$RUNNER_TEMP/chat-renderer/manifest.json"
          mkdir -p apps/mbui/out/chat-evidence
          printf '%s\n%s\n%s\n' "$sha" "$key" "$PATCH_SHA256" > apps/mbui/out/chat-evidence/source.txt
          printf 'exit\n' > apps/mbui/out/chat-evidence/action.drive
      - name: Capture the specified scene at each screen size
        env:
          SCENE_SPEC: ${{ inputs.scene_spec }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/apps/mbui/out/chat-evidence"
          runtime="$RUNNER_TEMP/chat-renderer/sffilm"
          spec=${SCENE_SPEC:-'{}'}
          jq -e 'type == "object" and ((.windows // [{"name":"small"}]) | type == "array" and length > 0 and all(.[]; type == "object"))' <<< "$spec" > /dev/null
          while IFS= read -r scene; do
            settings=$(jq -cn --argjson common "$spec" --argjson scene "$scene" '$common + $scene')
            name=$(jq -r '.name' <<< "$settings")
            size=$(jq -r '.size' <<< "$settings")
            platform=$(jq -r '.platform' <<< "$settings")
            [[ "$name" =~ ^[a-zA-Z0-9_-]+$ && "$size" =~ ^[0-9]+x[0-9]+$ && "$platform" =~ ^[0-9]+$ ]]
            fixture=$(jq -r '.fixture // "chat-preview-md"' <<< "$settings")
            jq -r '.drive // "exit"' <<< "$settings" > "$out/$name.action.drive"
            jq -r '.prepare // ""' <<< "$settings" > "$out/$name.prepare.drive"
            frame=$(jq -r '.frame // empty' <<< "$settings")
            at=$(jq -r 'if .frame == null then (.at_ms // 1000) else "" end' <<< "$settings")
            capture() {
              MBUI_MEDIA_RUNTIME="$runtime" MBUI_FIXTURE="$fixture" MBUI_WIN="$size" \
                MBUI_FILM_PLATFORM="$platform" MBUI_FILM_SCALE=2 MBUI_PICTURE_AT="$at" MBUI_PICTURE_FRAME="$frame" \
                bash apps/mbui/scripts/media.sh picture "$out/$name.png" "$out/$name.action.drive" "$@"
            }
            if [ -s "$out/$name.prepare.drive" ] && [ "$(cat "$out/$name.prepare.drive")" != "" ]; then
              capture "$out/$name.prepare.drive"
            else
              capture
            fi
          done < <(jq -c '(.windows // [{"name":"small","size":"390x844","platform":2}, {"name":"medium","size":"700x900","platform":2}, {"name":"large","size":"1280x800","platform":0}])[]' <<< "$spec")
      - uses: actions/upload-artifact@v4
        with:
          name: chat-preview-evidence
          path: apps/mbui/out/chat-evidence/
          if-no-files-found: error
  behavior:
    if: ${{ inputs.source_patch != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Apply the recorded worktree patch
        env:
          SOURCE_PATCH: ${{ inputs.source_patch }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
          SOURCE_KEY: ${{ inputs.source_key }}
        run: |
          set -euo pipefail
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.SOURCE_PATCH, "base64"))' "$RUNNER_TEMP/source.patch.gz"
          gzip -dc "$RUNNER_TEMP/source.patch.gz" > "$RUNNER_TEMP/source.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/source.patch" | shasum -a 256 -c
          git apply --check "$RUNNER_TEMP/source.patch"
          git apply "$RUNNER_TEMP/source.patch"
          git add -A
          [ "$(node scripts/native.ts key mbui-film-wasm darwin-arm64)" = "$SOURCE_KEY" ]
      - uses: ./.github/actions/mbui-moonbit
      - name: Check the application and its tests
        run: |
          set -euo pipefail
          cd apps/mbui
          if ! moon check --target native --no-mbti src/sfapp > "$RUNNER_TEMP/chat-moon-check.log" 2>&1; then
            awk '/^Error:/ { n=9 } n>0 { print; n-- }' "$RUNNER_TEMP/chat-moon-check.log"
            exit 1
          fi
      - name: Exercise the selected Chat cases
        env:
          TEST_FILTERS: ${{ inputs.test_filters }}
        run: |
          set -euo pipefail
          cd apps/mbui
          while IFS= read -r filter || [ -n "$filter" ]; do
            [ -n "$filter" ] && [ "$filter" != "-" ] || continue
            printf 'Testing %s\n' "$filter"
            if ! moon test --target wasm-gc --release -p stillfail/sfapp -f "$filter" > "$RUNNER_TEMP/chat-moon-test.log" 2>&1; then
              awk '/^Error:/ { n=9 } n>0 { print; n-- }' "$RUNNER_TEMP/chat-moon-test.log"
              tail -n 50 "$RUNNER_TEMP/chat-moon-test.log"
              exit 1
            fi
            tail -n 5 "$RUNNER_TEMP/chat-moon-test.log"
          done <<< "$TEST_FILTERS"
      - name: Exercise the selected retained-view cases
        env:
          TEST_FILTERS: ${{ inputs.view_test_filters }}
        run: |
          set -euo pipefail
          cd apps/mbui/mbui
          while IFS= read -r filter || [ -n "$filter" ]; do
            [ -n "$filter" ] || continue
            printf 'Testing %s\n' "$filter"
            if ! moon test --target wasm-gc --release -p mbui/view -f "$filter" > "$RUNNER_TEMP/chat-moon-view-test.log" 2>&1; then
              awk '/^Error:/ { n=9 } n>0 { print; n-- }' "$RUNNER_TEMP/chat-moon-view-test.log"
              tail -n 50 "$RUNNER_TEMP/chat-moon-view-test.log"
              exit 1
            fi
            tail -n 5 "$RUNNER_TEMP/chat-moon-view-test.log"
          done <<< "$TEST_FILTERS"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: chat-test-logs
          path: ${{ runner.temp }}/chat-moon-*.log
          if-no-files-found: ignore
