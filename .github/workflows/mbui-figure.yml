# Ready-to-run mbui renderers: source changes select a new version, scene and drive data do not.
name: mbui-media-runtime
on:
  push:
    branches: ["**"]
    paths:
      - "apps/mbui/src/**"
      - "apps/mbui/mbui/src/**"
      - "apps/mbui/mbui/tools/**"
      - "apps/mbui/mbui/scripts/**"
      - "apps/mbui/tools/wasm-film/**"
      - "apps/mbui/moon.mod"
      - "apps/mbui/moon.work"
      - "apps/mbui/mbui/moon.mod"
      - "apps/mbui/scripts/env.sh"
      - "apps/mbui/scripts/mbui.sh"
      - "apps/mbui/scripts/mac.sh"
      - "apps/mbui/scripts/figure*.sh"
      - "apps/mbui/scripts/media*.sh"
      - "apps/mbui/scripts/wasm-film-build.sh"
      - "scripts/native.ts"
      - ".github/workflows/mbui-figure.yml"
      - ".github/actions/mbui-moonbit/**"
  workflow_dispatch:
concurrency:
  group: mbui-figure-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # A branch's push runs them only when it changed the renderers' own code (their packages, the film tool, their
  # scripts, this workflow): every push touching mbui ran both on the CI Mac, two of its runners' work in all, and the
  # pipeline's check waited 6-20 minutes for one (2026-11-03, as asked: "分支只在改到渲染器时跑"). Main runs them on
  # every change above, and publishes what it built.
  what:
    if: github.repository == 'AFK-surf/still.fail'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.what.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - id: what
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_EVENT_NAME" != push ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(git merge-base origin/main HEAD)
          if git diff --name-only "$base" HEAD | grep -qE '^apps/mbui/mbui/src/(figure|film|media|render)/|^apps/mbui/src/(sffigure|sffilm|sfmedia|sfwasmfilm)[^/]*/|^apps/mbui/tools/wasm-film/|^apps/mbui/scripts/(figure|media)[^/]*\.sh$|^apps/mbui/scripts/wasm-film-build\.sh$|^\.github/workflows/mbui-figure\.yml$|^\.github/actions/mbui-moonbit/'; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "the renderers' own code unchanged on this branch: not built here (main builds them)"
          fi
  renderer:
    needs: what
    if: needs.what.outputs.run == 'yes'
    runs-on: [self-hosted, macos-ci]
    timeout-minutes: 5
    permissions:
      contents: write # On main only, publish the tested part to the existing native-artifacts release.
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/mbui-moonbit
      - name: Build and check the renderer
        run: |
          renderer=$(node scripts/native.ts file mbui-figure darwin-arm64)
          cd apps/mbui
          MBUI_FIGURE_RUNTIME="$renderer" bash scripts/figure-scene-test.sh
          MBUI_FIGURE_RUNTIME="$renderer" bash scripts/figure-prebuilt-test.sh
          bash scripts/media-job-test.sh
      - name: Publish the tested renderer
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native.ts ensure --publish mbui-figure:darwin-arm64
  film:
    needs: what
    if: needs.what.outputs.run == 'yes'
    runs-on: [self-hosted, macos-ci]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/mbui-moonbit
      - name: Build and check the scene renderer
        run: |
          renderer=$(node scripts/native.ts file mbui-film darwin-arm64)
          wasm_renderer=$(node scripts/native.ts file mbui-film-wasm darwin-arm64)
          cd apps/mbui
          MBUI_MEDIA_RUNTIME="$renderer" bash scripts/media-test.sh
          MBUI_MEDIA_RUNTIME="$renderer" bash scripts/media-prebuilt-test.sh
          MBUI_MEDIA_RUNTIME="$wasm_renderer" bash scripts/media-wasm-test.sh
      - name: Capture panel group comparison
        if: github.ref == 'refs/heads/codex/panel-group-evidence'
        run: |
          set -eu
          wasm_renderer=$(node scripts/native.ts file mbui-film-wasm darwin-arm64)
          cd apps/mbui
          mkdir -p out/panel-group-evidence
          printf 'exit\n' > out/panel-group-evidence/drive
          for width in 200 360; do
            for theme in light dark; do
              dark=''
              if [ "$theme" = dark ]; then dark=1; fi
              for side in old new; do
                MBUI_MEDIA_RUNTIME="$wasm_renderer" MBUI_FIXTURE="panel-group-$side" MBUI_WIN="${width}x400" MBUI_DARK="$dark" MBUI_FILM_SCALE=2 \
                  bash scripts/media.sh picture "out/panel-group-evidence/${width}-${theme}-${side}.png" out/panel-group-evidence/drive
              done
            done
          done
      - name: Upload panel group comparison
        if: github.ref == 'refs/heads/codex/panel-group-evidence'
        uses: actions/upload-artifact@v4
        with:
          name: panel-group-evidence
          path: apps/mbui/out/panel-group-evidence/*.png*
          if-no-files-found: error
      - name: Publish the tested renderer
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native.ts ensure --publish mbui-film:darwin-arm64 mbui-film-wasm:darwin-arm64
