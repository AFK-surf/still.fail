# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The host's and the text's contracts on Android (docs/determinism.md, "What is compared, and where"; scripts/
# host_contract.sh): kitdemo's controls page run on an x86_64 emulator with its scripted taps, its tape made a
# Tester's test and run here (every frame the same), then the committed tape's text (android_controls) asked of the
# emulator's text system again (every answer the same). When Android's host changes.
name: mbui-host-android
# Once a day (and asked for), never on a push or a pull request: an emulator's run is no gate (2026-10-31, as asked:
# "这种不确定测试只定期跑，永远不阻塞 ci"; its pixels and answers are SwiftShader's and the pinned image's, not a phone's)
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

jobs:
  contracts:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        # (the merge commit and its base: what changed is told by them, scripts/ci_paths.py)
        with: { fetch-depth: 2 }
      - name: What changed (a pull request runs the contracts its files touch)
        id: f
        if: github.event_name == 'pull_request'
        env:
          FILTERS: |
            host:
              - "src/ui/native.mbt"
              - "src/kitdemo/gallery/viewcheck.mbt"
              - "src/host/android_host.c"
              - "src/host/gles_render.h"
              - "src/host/done_watch.h"
              - "src/ui/drive.mbt"
              - "scripts/done_runner.py"
              - "android/**"
              - "scripts/android.sh"
              - "scripts/host_contract.sh"
              - "tools/chk/textrec.mbt"
              - "test/host/**"
              - "src/kitdemo/gallery/textcheck.mbt"
              - "src/kitdemo/gallery/textrec_android_*"
              - ".github/workflows/mbui-host-android.yml"
              - "src/host/host_native.mbt"
              - "src/kitdemo/main.mbt"
              - "src/host/moon.pkg"
            marks:
              - "src/host/android_host.c"
              - "src/host/done_watch.h"
              - "src/ui/drive.mbt"
              - "scripts/done_runner.py"
              - "android/app/src/main/java/dev/mbui/Marks.java"
              - "android/app/src/main/java/dev/mbui/Host.java"
              - "android/apk.json"
              - "android/apk.lock"
              - "tools/apk/**"
              - "scripts/apk"
              - "src/host/marks.mbt"
              - "src/host/host_native.mbt"
              - "src/kitdemo/gallery/markscheck.mbt"
              - "src/kitdemo/main.mbt"
              - "test/marks/**"
              - "goldens/marks/android*"
              - "scripts/android.sh"
              - "scripts/host_contract.sh"
              - ".github/workflows/mbui-host-android.yml"
              - "src/host/moon.pkg"
        run: python3 scripts/ci_paths.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # (the APK without Gradle: mbui/scripts/apk (tools/apk); its dependencies and their dex kept by the lock)
      - uses: ./.github/actions/mbui-apk
      - uses: ./.github/actions/mbui-moonbit
      - name: kitdemo's APK for an x86_64 emulator
        run: ABI=x86_64 scripts/host_contract.sh android build
      # (the system's animations as a phone has them: off, motion would be reduced, not what a Tester plays)
      - uses: ./.github/actions/mbui-android-emulator
        with: { target: default, profile: pixel_6, animations: "true" }
      - name: "The host's contract (a run's tape = a Tester's frames), the text's (android_controls = the system's), the marks' (= goldens/marks/android.png)"
        env:
          HOST: ${{ steps.f.outputs.host }}
          MARKS: ${{ steps.f.outputs.marks }}
        # (each when a pull request's files touch it: HOST, MARKS as the filter said; everything else, all; not -e: the
        # marks' contract runs whatever the others came to)
        shell: bash {0}
        run: if [ "$HOST" != false ]; then bash scripts/host_contract.sh android record && bash scripts/host_contract.sh android text && bash scripts/host_contract.sh android views && bash scripts/host_contract.sh android site && bash scripts/host_contract.sh android runner; fi; h=$?; m=0; if [ "$MARKS" != false ]; then bash scripts/host_contract.sh android marks || m=1; fi; [ $h = 0 ] && [ $m = 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-android
          path: apps/mbui/mbui/out/host/
          if-no-files-found: ignore
