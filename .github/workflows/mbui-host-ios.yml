# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The host's and the text's contracts on iOS (docs/determinism.md, "What is compared, and where"; scripts/
# host_contract.sh), on Mini1's simulator (mbui's runner there, label mbui-render; scripts/ios.sh's ios-mbui-sf):
# kitdemo's controls page run with its scripted taps, its tape made a Tester's test and run here (every frame the
# same), then the committed tape's text (ios_controls) asked of Core Text there again (every answer the same). When
# the iOS host changes. The simulator is also the iOS host's own runs': booted with an app running, this fails at once.
name: mbui-host-ios
on:
  pull_request:
    paths: &paths
      - "apps/mbui/mbui/src/ui/native.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/viewcheck.mbt"
      - "apps/mbui/mbui/src/host/apple_*"
      - "apps/mbui/mbui/src/host/apple.h"
      - "apps/mbui/mbui/src/host/ios_app.m"
      - "apps/mbui/mbui/ios/**"
      - "apps/mbui/mbui/scripts/ios.sh"
      - "apps/mbui/mbui/scripts/ios-terminate.sh"
      - "apps/mbui/mbui/scripts/mbc"
      - "apps/mbui/mbui/tools/**"
      - "apps/mbui/mbui/scripts/host_contract.sh"
      - "apps/mbui/mbui/tools/chk/textrec.mbt"
      - "apps/mbui/mbui/test/host/**"
      - "apps/mbui/mbui/src/kitdemo/gallery/textcheck.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/textrec_ios_*"
      - ".github/workflows/mbui-host-ios.yml"
      - "apps/mbui/mbui/src/host/marks.mbt"
      - "apps/mbui/mbui/src/host/host_native.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/markscheck.mbt"
      - "apps/mbui/mbui/src/kitdemo/main.mbt"
      - "apps/mbui/mbui/test/marks/**"
      - "apps/mbui/mbui/goldens/marks/ios*"
      - "apps/mbui/mbui/src/host/moon.pkg"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: mbui-host-ios-${{ github.ref }}
  cancel-in-progress: true


jobs:
  contracts:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    # (a machine of ours: never a fork's pull request)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mbui-render]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        # (the merge commit and its base: what changed is told by them, scripts/ci_paths.py)
        with: { fetch-depth: 2 }
      - name: What changed (a pull request runs the contracts its files touch)
        id: f
        if: github.event_name == 'pull_request'
        env:
          FILTERS: |
            host:
              - "src/ui/native.mbt"
              - "src/kitdemo/gallery/viewcheck.mbt"
              - "src/host/apple_*"
              - "src/host/apple.h"
              - "src/host/ios_app.m"
              - "ios/**"
              - "scripts/ios.sh"
              - "scripts/ios-terminate.sh"
              - "scripts/mbc"
              - "tools/**"
              - "scripts/host_contract.sh"
              - "tools/chk/textrec.mbt"
              - "test/host/**"
              - "src/kitdemo/gallery/textcheck.mbt"
              - "src/kitdemo/gallery/textrec_ios_*"
              - ".github/workflows/mbui-host-ios.yml"
              - "src/host/host_native.mbt"
              - "src/kitdemo/main.mbt"
              - "src/host/moon.pkg"
            marks:
              - "src/host/apple_views.m"
              - "src/host/apple.h"
              - "src/host/ios_app.m"
              - "src/host/marks.mbt"
              - "src/host/host_native.mbt"
              - "ios/**"
              - "src/kitdemo/gallery/markscheck.mbt"
              - "src/kitdemo/main.mbt"
              - "test/marks/**"
              - "goldens/marks/ios*"
              - "scripts/ios.sh"
              - "scripts/ios-terminate.sh"
              - "scripts/mbc"
              - "tools/**"
              - "scripts/host_contract.sh"
              - ".github/workflows/mbui-host-ios.yml"
              - "src/host/moon.pkg"
        run: python3 scripts/ci_paths.py
      - name: The simulator free (no other run's app on it)
        run: scripts/host_contract.sh ios free
      - uses: ./.github/actions/mbui-moonbit
      - name: kitdemo for the simulator
        run: scripts/host_contract.sh ios build
      - name: "The host's contract: a run's tape = a Tester's frames"
        if: steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh ios record
      - name: "The text's contract: ios_controls = Core Text's"
        if: steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh ios text
      - name: "The native views' contract: one placed between pixels is put where it was told, on whole device pixels"
        if: (success() || failure()) && steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh ios views
      - name: "The pages' contract: a page says to the app, runs its scripts, keeps cookies, takes an event stream as it is sent"
        if: (success() || failure()) && steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh ios site
      - name: "The marks' contract: test/marks drawn by Core Graphics = goldens/marks/ios.png"
        if: (success() || failure()) && steps.f.outputs.marks != 'false'
        run: scripts/host_contract.sh ios marks
      - name: The simulator shut down again (when these runs booted it)
        if: always()
        run: scripts/host_contract.sh ios done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-ios
          path: apps/mbui/mbui/out/host/
          if-no-files-found: ignore
