# mbui (libs/mbui): the host's and the text's contracts on Linux ("What is compared, and
# where"; scripts/host_contract.sh), as mbui-host-windows.yml has Windows': kitdemo built for the GTK 4 host
# (src/host/linux_*, scripts/linux.sh), its controls page run in a window of Xvfb's (Mesa's llvmpipe draws it: no GPU)
# with its scripted taps, its tape made a Tester's test and run here (every frame the same), then the committed tape's
# text (linux_controls) asked of Pango again (every answer the same), the runner's files told as they come, and the
# app's links (started with one, and handed one by itself started again: once for its person, on a session bus of the
# run's own), a notification (shown, kept, clicked), an update (a newer build put in place and opened), and the web
# views (WebKitGTK 6.0's): one placed where the app told it, on whole device pixels, and a site and a page speaking with
# the app; a stream's JPEG frames and its H.264, each shown to its end (streamdemo); a PDF's pages read and drawn
# (poppler's); a video played (GStreamer's); a folder and a file let go on the window, read. On GitHub's own Ubuntu
# (a public repository's: free); the number on the app's icon as the docks are told it; and, of still.fail's app on
# this host, this machine's station as its own native call says it (apps/mbui/src/host/linux_station.c). When the
# Linux host changes.
name: mbui-host-linux
on:
  pull_request:
    paths: &paths
      - "libs/mbui/src/ui/native.mbt"
      - "libs/mbui/src/kitdemo/gallery/viewcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/sitecheck.mbt"
      - "libs/mbui/src/streamdemo/**"
      - "libs/mbui/src/kitdemo/gallery/pdfcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/imagecheck.mbt"
      - "libs/mbui/src/ui/image.mbt"
      - "libs/mbui/tools/chk/pictures.mbt"
      - "libs/mbui/src/kitdemo/gallery/playcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/badgecheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/a11ycheck.mbt"
      - "libs/mbui/src/ui/a11y.mbt"
      - "libs/mbui/src/host/linux*"
      - "libs/mbui/src/host/mini_json.h"
      - "libs/mbui/src/host/app_calls.h"
      - "apps/mbui/src/host/linux_station.c"
      - "apps/mbui/src/host/station_install.h"
      - "apps/mbui/src/host/station_calls.h"
      - "apps/mbui/scripts/station_install_test.c"
      - "apps/mbui/scripts/linux_station_test.*"
      - "libs/mbui/src/kitdemo/gallery/linkcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/noticecheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/updatecheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/postcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/dropcheck.mbt"
      - "libs/mbui/src/ui/drop.mbt"
      - "libs/mbui/src/ui/messages.mbt"
      - "libs/mbui/src/host/gles_render.h"
      - "libs/mbui/src/host/corner_sl.h"
      - "libs/mbui/src/host/done_watch.h"
      - "libs/mbui/src/host/post.h"
      - "libs/mbui/src/host/listen_api.h"
      - "libs/mbui/src/ui/drive.mbt"
      - "libs/mbui/scripts/done_runner.py"
      - "libs/mbui/scripts/linux.sh"
      - "libs/mbui/scripts/host_contract.sh"
      - "libs/mbui/tools/chk/textrec.mbt"
      - "libs/mbui/test/host/**"
      - "libs/mbui/src/kitdemo/gallery/textcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/textrec_linux_*"
      - ".github/workflows/mbui-host-linux.yml"
      - ".github/actions/apt/**"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

env:
  # Farview's client, which the app draws a chat's Farview tab with (apps/mbui/scripts/farview.sh: a private repository,
  # read by its deploy key)
  FARVIEW_DEPLOY_KEY: ${{ secrets.FARVIEW_DEPLOY_KEY }}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: libs/mbui
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # GTK 4 and what the host draws with (epoxy, Pango, cairo, gdk-pixbuf, libsoup), Mesa's software GL, Xvfb, and the
      # fonts the text is set in (the system's sans-serif, Han in Noto Sans CJK SC, Noto Color Emoji); D-Bus's daemon, for a
      # session bus of the links' run; WebKitGTK 6.0, poppler's GLib face and GStreamer (its base and good plugins, and
      # gst-libav's H.264), which the host loads for its web views, its PDFs and its player
      - uses: ./.github/actions/apt
        with:
          name: mbui-host-linux
          packages: >-
            libgtk-4-dev libepoxy-dev libpango1.0-dev libcairo2-dev libfontconfig-dev libgdk-pixbuf-2.0-dev
            libsoup-3.0-dev zlib1g-dev libgl1-mesa-dri libegl-mesa0 xvfb xauth fonts-noto-cjk fonts-noto-color-emoji
            fonts-dejavu-core dbus-daemon dbus-bin libwebkitgtk-6.0-4 libpoppler-glib8t64
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: "What the app hands this machine's station's installer: the token, the workspace lock's hash, nothing refused dropped (apps/mbui/src/host/station_install.h)"
        working-directory: apps/mbui
        run: |
          mkdir -p out
          cc -Wall -Werror -Isrc/host -I../../libs/mbui/src/host scripts/station_install_test.c -o out/station_install_test
          out/station_install_test
      - uses: ./.github/actions/mbui-moonbit
      - name: kitdemo
        run: scripts/host_contract.sh linux build
      - name: "The host's contract: a run's tape = a Tester's frames"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux record
      - name: "The text's contract: linux_controls = Pango's"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux text
      - name: "The runner's contract: a file written in the run's directory is told as it comes (done X)"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux runner
      - name: "The links' contract: started with a link, and handed one by itself started again"
        if: success() || failure()
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux links
      - name: "The notifications' contract: one shown, kept, and clicked"
        if: success() || failure()
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux notices
      # (the update's contract makes its delta with still.fail's scripts/delta.ts, MBUI_DELTA_TOOL, which needs the
      # repository's Node)
      - uses: actions/setup-node@v5
        if: success() || failure()
        with: { node-version-file: .node-version, package-manager-cache: false }
      - name: "The update's contract: another machine's build refused, this machine's put in place and opened"
        if: success() || failure()
        env: { MBUI_DELTA_TOOL: "${{ github.workspace }}/scripts/delta.ts" }
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux update
      - name: "The native views' contract: one placed between pixels is put where it was told, on whole device pixels"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux views
      - name: "The pages' contract: a page says to the app, runs its scripts, takes an event stream as it is sent"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux site
      - name: "The player: test/host/playcheck.mp4 read through the app, drawn in the canvas, its frames' times read, played to its end, a frame grabbed (GStreamer's)"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux play
      - name: "The PDFs' contract: a PDF's two pages read and drawn, the second turned as its /Rotate says"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux pdf
      - name: "What is posted's contract: a message posted from outside the frames told between frames, not taken as one begins"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux posted
      - name: "What is picked's contract: the system's picker's answer told between frames, not taken as one begins"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux picked
      - name: "What is dropped's contract: a folder and a file let go on the window taken and read whole"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux dropped
      - name: "The pictures' contract over a new context: a picture told ready again and drawn again there"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux images
      - name: "still.fail's station on Linux (the app's own native call): one started by hand said and stopped, the service's said as running it"
        if: success() || failure()
        working-directory: apps/mbui
        run: bash scripts/linux_station_test.sh
      - name: "The dock's number's contract: said to the docks on the session bus, given to one that asks"
        if: success() || failure()
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux badge
      - name: "The accessibility's contract: a button and a checkbox told GTK's accessibility, walked as AT-SPI walks them"
        if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x1024x24" scripts/host_contract.sh linux a11y
      - name: "Streams: streamdemo's JPEG (gdk-pixbuf) said shown to its end (STREAM done)"
        if: success() || failure()
        run: |
          APP=streamdemo bash scripts/linux.sh build > /dev/null
          mkdir -p out/host
          xvfb-run -a -s "-screen 0 1280x1024x24" env MBUI_BENCH=-1 MBUI_WIN=720x480 MBUI_STREAM=jpeg MBUI_STREAM_EXIT=1 \
            ./out/linux/mod/_build/native/release/build/streamdemo/streamdemo.exe > out/host/stream-jpeg.log 2>&1 || true
          grep -a STREAM out/host/stream-jpeg.log | tail -5
          grep -q 'STREAM done' out/host/stream-jpeg.log
      - name: "Streams: streamdemo's H.264 (GStreamer's, gst-libav's decoder) said shown to its end (STREAM done)"
        if: success() || failure()
        run: |
          APP=streamdemo bash scripts/linux.sh build > /dev/null
          mkdir -p out/host
          xvfb-run -a -s "-screen 0 1280x1024x24" env MBUI_BENCH=-1 MBUI_WIN=720x480 MBUI_STREAM_EXIT=1 \
            ./out/linux/mod/_build/native/release/build/streamdemo/streamdemo.exe > out/host/stream-h264.log 2>&1 || true
          grep -a "STREAM\|stream " out/host/stream-h264.log | tail -5
          grep -q 'STREAM start h264' out/host/stream-h264.log && grep -q 'STREAM done' out/host/stream-h264.log
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: host-linux
          path: libs/mbui/out/host/
          if-no-files-found: ignore
