# mbui (libs/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The host's and the text's contracts on macOS ("What is compared, and where"; scripts/
# host_contract.sh), on macos-ci (mbui's runner there, label mbui-render): kitdemo's controls page run in a window with its
# scripted taps, its tape made a Tester's test and run here (every frame the same), then the tape macos-ci kept
# (mac_capture_controls) asked of Core Text again (every answer the same). When the macOS host changes.
name: mbui-host-mac
on:
  pull_request:
    paths: &paths
      - "libs/mbui/src/ui/native.mbt"
      - "libs/mbui/src/kitdemo/gallery/viewcheck.mbt"
      - "libs/mbui/src/host/apple_*"
      - "libs/mbui/src/host/apple.h"
      - "libs/mbui/src/host/mac_app.m"
      - "libs/mbui/src/host/mini_json.h"
      - "apps/mbui/src/host/station_install.h"
      - "apps/mbui/scripts/station_install_test.c"
      - "libs/mbui/src/host/done_watch.h"
      - "libs/mbui/src/ui/drive.mbt"
      - "libs/mbui/scripts/done_runner.py"
      - "libs/mbui/scripts/mac.sh"
      - "libs/mbui/scripts/host_contract.sh"
      - "libs/mbui/tools/chk/textrec.mbt"
      - "libs/mbui/test/host/**"
      - "libs/mbui/src/kitdemo/gallery/textcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/textrec_mac_capture_*"
      - ".github/workflows/mbui-host-mac.yml"
      - "libs/mbui/src/host/marks.mbt"
      - "libs/mbui/src/host/host_native.mbt"
      - "libs/mbui/src/kitdemo/gallery/markscheck.mbt"
      - "libs/mbui/src/kitdemo/main.mbt"
      - "libs/mbui/test/marks/**"
      - "libs/mbui/goldens/marks/mac*"
      - "libs/mbui/src/host/moon.pkg"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: mbui-host-mac-${{ github.ref }}
  cancel-in-progress: true


jobs:
  contracts:
    defaults:
      run:
        working-directory: libs/mbui
    # (a machine of ours: never a fork's pull request)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mbui-render]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        # (the merge commit and its base: what changed is told by them, scripts/ci_paths.py)
        with: { fetch-depth: 2 }
      - name: What changed (a pull request runs the contracts its files touch)
        id: f
        if: github.event_name == 'pull_request'
        env:
          FILTERS: |
            host:
              - "src/ui/native.mbt"
              - "src/kitdemo/gallery/viewcheck.mbt"
              - "src/host/apple_*"
              - "src/host/apple.h"
              - "src/host/mac_app.m"
              - "src/host/mini_json.h"
              - "src/host/done_watch.h"
              - "src/ui/drive.mbt"
              - "scripts/done_runner.py"
              - "scripts/mac.sh"
              - "scripts/host_contract.sh"
              - "tools/chk/textrec.mbt"
              - "test/host/**"
              - "src/kitdemo/gallery/textcheck.mbt"
              - "src/kitdemo/gallery/textrec_mac_capture_*"
              - ".github/workflows/mbui-host-mac.yml"
              - "src/host/host_native.mbt"
              - "src/kitdemo/main.mbt"
              - "src/host/moon.pkg"
              - "src/hostapi/passwords.mbt"
              - "src/ui/hostcall.mbt"
              - "src/kitdemo/gallery/opcheck.mbt"
            marks:
              - "src/host/apple_views.m"
              - "src/host/apple.h"
              - "src/host/mac_app.m"
              - "src/host/marks.mbt"
              - "src/host/host_native.mbt"
              - "src/kitdemo/gallery/markscheck.mbt"
              - "src/kitdemo/main.mbt"
              - "test/marks/**"
              - "goldens/marks/mac*"
              - "scripts/mac.sh"
              - "scripts/host_contract.sh"
              - ".github/workflows/mbui-host-mac.yml"
              - "src/host/moon.pkg"
            a11y:
              - "src/host/mac_app.m"
              - "src/ui/a11y.mbt"
              - "src/ui/semantics.mbt"
              - "src/kitdemo/gallery/a11ycheck.mbt"
              - "src/kitdemo/main.mbt"
              - "scripts/host_contract.sh"
              - ".github/workflows/mbui-host-mac.yml"
        run: python3 scripts/ci_paths.py
      - name: "What the app hands this machine's station's installer: the token, the workspace lock's hash, nothing refused dropped (apps/mbui/src/host/station_install.h)"
        working-directory: apps/mbui
        run: |
          mkdir -p out
          cc -Wall -Werror -Isrc/host -I../../libs/mbui/src/host scripts/station_install_test.c -o out/station_install_test
          out/station_install_test
      - uses: ./.github/actions/mbui-moonbit
      - name: kitdemo
        run: scripts/host_contract.sh mac build
      - name: "The host's contract: a run's tape = a Tester's frames"
        if: steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh mac record
      - name: "The text's contract: mac_capture_controls = Core Text's"
        if: steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh mac text
      - name: "The native views' contract: one placed between pixels is put where it was told, on whole device pixels"
        if: (success() || failure()) && steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh mac views
      - name: "The players' contract: MP4 and WebM play and give a frame through the app"
        if: (success() || failure()) && steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh mac play
      - name: "The pages' contract: a page says to the app, runs its scripts, keeps cookies, takes an event stream as it is sent"
        if: (success() || failure()) && steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh mac site
      - name: "The password manager's contract: a run of op ended, and none to run, each told between frames and read"
        if: (success() || failure()) && steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh mac op
      - name: "The runner's contract: a file written in the run's directory is told as it comes (done X)"
        if: (success() || failure()) && steps.f.outputs.host != 'false'
        run: scripts/host_contract.sh mac runner
      - name: "The widgets told VoiceOver as it walks them, words put in a field and a button pressed through them"
        if: (success() || failure()) && steps.f.outputs.a11y != 'false'
        run: scripts/host_contract.sh mac a11y
      - name: "The marks' contract: test/marks drawn by Core Graphics = goldens/marks/mac.png"
        if: (success() || failure()) && steps.f.outputs.marks != 'false'
        run: scripts/host_contract.sh mac marks
      # (the pictures are for people, not the contract: macos-ci's connection to GitHub's artifact service reset once and
      # failed a contract that had passed, main acb00686, 41356526828, 2026-11-01)
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: host-mac
          path: libs/mbui/out/host/
          if-no-files-found: ignore
