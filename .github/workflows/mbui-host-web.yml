# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The host's and the text's contracts in the browser (docs/determinism.md, "What is compared, and where"; scripts/
# host_contract.sh): kitdemo's controls page run in headless Chromium with its scripted taps, its tape made a Tester's
# test and run here (every frame the same), then the committed tape's text (web_controls) asked of the browser's text
# again (every answer the same); streamdemo's stream decoded to its end (JPEG in Chromium, H.264 in Chrome: Playwright's
# Chromium decodes no H.264). When the web host changes.
name: mbui-host-web
on:
  pull_request:
    paths: &paths
      - "apps/mbui/mbui/src/ui/native.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/viewcheck.mbt"
      - "apps/mbui/mbui/web/**"
      - "apps/mbui/mbui/src/host/host_js.mbt"
      - "apps/mbui/mbui/src/host/textref_js.mbt"
      - "apps/mbui/mbui/scripts/web.sh"
      - "apps/mbui/mbui/scripts/host-web.mjs"
      - "apps/mbui/mbui/scripts/host_contract.sh"
      - "apps/mbui/mbui/tools/chk/textrec.mbt"
      - "apps/mbui/mbui/test/host/**"
      - "apps/mbui/mbui/src/kitdemo/gallery/textcheck.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/textrec_web_*"
      - "apps/mbui/mbui/src/host/stream*"
      - "apps/mbui/mbui/src/ui/stream*"
      - "apps/mbui/mbui/src/streamdemo/**"
      - ".github/workflows/mbui-host-web.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:



jobs:
  contracts:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mbui-moonbit
      - name: kitdemo for the browser, and Chromium
        run: scripts/host_contract.sh web build
      - name: "The host's contract: a run's tape = a Tester's frames"
        run: scripts/host_contract.sh web record
      - name: "The text's contract: web_controls = the browser's text"
        run: scripts/host_contract.sh web text
      - name: "The native views' contract: one placed between pixels is put where it was told, on whole device pixels"
        if: success() || failure()
        run: scripts/host_contract.sh web views
      - name: "The pages' contract: a page says to the app, runs its scripts, keeps cookies, takes an event stream as it is sent"
        if: success() || failure()
        run: scripts/host_contract.sh web site
      - name: "Streams: streamdemo's JPEG (Chromium) and H.264 (Chrome) each said shown to their end (STREAM done)"
        if: success() || failure()
        timeout-minutes: 5
        run: |
          APP=streamdemo bash scripts/web.sh build >/dev/null
          mkdir -p out/host
          node scripts/host-web.mjs "bench=-1&MBUI_STREAM=jpeg&MBUI_STREAM_EXIT=1" out/host/stream-jpeg.log 720 480
          grep -q 'STREAM start jpeg' out/host/stream-jpeg.log
          MBUI_WEB_CHANNEL=chrome node scripts/host-web.mjs "bench=-1&MBUI_STREAM=h264&MBUI_STREAM_EXIT=1" out/host/stream-h264.log 720 480
          grep -q 'STREAM start h264' out/host/stream-h264.log
          grep -c 'STREAM done' out/host/stream-jpeg.log out/host/stream-h264.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-web
          path: apps/mbui/mbui/out/host/
          if-no-files-found: ignore
