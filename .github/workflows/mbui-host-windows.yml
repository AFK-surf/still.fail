# mbui (libs/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The host's and the text's contracts on Windows ("What is compared, and where"; scripts/
# host_contract.sh): kitdemo's controls page run in a window with its scripted taps, its tape made a Tester's test and
# run here (every frame the same), then the committed tape's text (windows_controls) asked of DirectWrite again (every
# answer the same); streamdemo's JPEG stream decoded by WIC to its end. When Windows' host changes.
name: mbui-host-windows
on:
  pull_request:
    paths: &paths
      - "libs/mbui/src/ui/native.mbt"
      - "libs/mbui/src/kitdemo/gallery/viewcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/playcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/secretcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/a11ycheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/fontscalecheck.mbt"
      - "libs/mbui/src/host/win_*"
      - "libs/mbui/src/host/win.h"
      - "libs/mbui/src/host/log_files.h"
      - "libs/mbui/scripts/win_logs_test.c"
      - "libs/mbui/scripts/win_keys_test.c"
      - "libs/mbui/scripts/win_clip_test.c"
      - "libs/mbui/src/host/mini_json.h"
      - "apps/mbui/src/host/station_install.h"
      - "apps/mbui/scripts/station_install_test.c"
      - "libs/mbui/src/host/done_watch.h"
      - "libs/mbui/src/ui/drive.mbt"
      - "libs/mbui/scripts/done_runner.py"
      - "libs/mbui/scripts/win.sh"
      - "libs/mbui/scripts/host_contract.sh"
      - "libs/mbui/tools/chk/textrec.mbt"
      - "libs/mbui/test/host/**"
      - "libs/mbui/src/kitdemo/gallery/textcheck.mbt"
      - "libs/mbui/src/kitdemo/gallery/textrec_windows_*"
      - "libs/mbui/src/host/stream*"
      - "libs/mbui/src/ui/stream*"
      - "libs/mbui/src/streamdemo/**"
      - ".github/workflows/mbui-host-windows.yml"
      - ".github/actions/msvc/**"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:


env:
  # Farview's client, which the app draws a chat's Farview tab with (apps/mbui/scripts/farview.sh: a private repository,
  # read by its deploy key)
  FARVIEW_DEPLOY_KEY: ${{ secrets.FARVIEW_DEPLOY_KEY }}
jobs:
  # (a job of its own: a failure here is not the host's contracts' failure, and takes none of their time)
  log-files:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: libs/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      - name: "A screen's Windows shortcuts stay on its canvas; the shell gets its keys back as it leaves"
        run: |
          mkdir -p out/keys
          cl.exe -nologo -W4 -Isrc/host scripts/win_keys_test.c -Foout/keys/ -Feout/keys/win_keys_test.exe
          out/keys/win_keys_test.exe
      - name: "Pasted screenshots over 8 MiB are attachments, as copied image files are"
        run: |
          mkdir -p out/clip
          cl.exe -nologo -W4 -Isrc/host scripts/win_clip_test.c -Foout/clip/ -Feout/clip/win_clip_test.exe -link user32.lib shell32.lib ole32.lib
          out/clip/win_clip_test.exe
      - name: "What the app hands this machine's station's installer: the token, the workspace lock's hash, nothing refused dropped (apps/mbui/src/host/station_install.h)"
        working-directory: apps/mbui
        run: |
          mkdir -p out/install
          cl.exe -nologo -W3 -WX -D_CRT_SECURE_NO_WARNINGS -Isrc/host -I../../libs/mbui/src/host scripts/station_install_test.c -Foout/install/ -Feout/install/station_install_test.exe
          out/install/station_install_test.exe
      - name: "The log files: stderr kept in rotating files, nothing of a secret, nobody waiting for a stalled disk (src/host/win_logs.h)"
        run: |
          mkdir -p out/logs
          cl.exe -nologo -W3 -D_CRT_SECURE_NO_WARNINGS -Isrc/host scripts/win_logs_test.c -Foout/logs/ -Feout/logs/win_logs_test.exe
          timeout 150 out/logs/win_logs_test.exe 2> out/logs/stderr.txt
          # (given on as it was said, to whoever had stderr before)
          grep -q 'crt line password=hunter2' out/logs/stderr.txt
          grep -q 'handle line https://a.example/p?token=hunter3' out/logs/stderr.txt
          grep -q 'after the stall' out/logs/stderr.txt

  kitdemo:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: libs/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - name: kitdemo
        run: scripts/host_contract.sh windows build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-kitdemo
          path: libs/mbui/out/win/mod/_build/native/release/build/kitdemo/kitdemo.exe

  # The host's app built above; this job's time belongs to running its contracts and replaying its tape.
  contracts:
    needs: kitdemo
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: libs/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - uses: actions/download-artifact@v4
        with:
          name: windows-kitdemo
          path: libs/mbui/out/win/mod/_build/native/release/build/kitdemo/
      - name: "The host's contract: a run's tape = a Tester's frames"
        run: scripts/host_contract.sh windows record
      - name: "The text's contract: windows_controls = DirectWrite's"
        run: scripts/host_contract.sh windows text
      - name: "The native views' contract: one placed between pixels is put where it was told, on whole device pixels"
        if: success() || failure()
        run: scripts/host_contract.sh windows views
      - name: "The pages' contract: a page says to the app, runs its scripts, keeps cookies, takes an event stream as it is sent"
        if: success() || failure()
        run: scripts/host_contract.sh windows site
      - name: "The runner's contract: a file written in the run's directory is told as it comes (done X)"
        if: success() || failure()
        run: scripts/host_contract.sh windows runner
      - name: "The system's Text size given the app (150%: its words 1.5 times as big)"
        if: success() || failure()
        run: scripts/host_contract.sh windows fontscale
      - name: "The widgets read out by UI Automation's client (as a reader: Narrator, NVDA), a button pressed through it"
        if: success() || failure()
        run: scripts/host_contract.sh windows a11y
      - name: "Secrets copied: kept out of the clipboard's history, taken off as the app ends, left when something else was copied since"
        if: success() || failure()
        run: scripts/host_contract.sh windows secret
      - name: "PDFs: test/host/pdfcheck.pdf's two pages read and drawn by Windows' own (Windows.Data.Pdf)"
        if: success() || failure()
        run: scripts/host_contract.sh windows pdf
      - name: "The player: test/host/playcheck.mp4 read through the app, played to its end, a frame grabbed (WebView2's <video>)"
        if: success() || failure()
        run: scripts/host_contract.sh windows play
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: host-windows
          path: libs/mbui/out/host/
          if-no-files-found: ignore

  # A second app's build is independent of kitdemo's contracts; each gets its own five-minute job.
  streams:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: libs/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - name: "Streams: streamdemo's H.264 (Media Foundation's decoder) and its JPEG (WIC) each said shown to its end (STREAM done)"
        timeout-minutes: 5
        run: |
          APP=streamdemo bash scripts/win.sh build >/dev/null
          mkdir -p out/host
          ok=1
          for codec in h264 jpeg; do
            # (a run that hangs, every frame let go, given 3 minutes before it fails)
            timeout 180 env MBUI_BENCH=-1 MBUI_WIN=720x480 MBUI_STREAM=$codec MBUI_STREAM_EXIT=1 \
              ./out/win/mod/_build/native/release/build/streamdemo/streamdemo.exe > out/host/stream-$codec.log 2>&1
            echo "== $codec"; grep -a 'STREAM\|^win: stream' out/host/stream-$codec.log
            grep -q 'STREAM done' out/host/stream-$codec.log || ok=0
          done
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: host-windows-streams
          path: libs/mbui/out/host/
          if-no-files-found: ignore
