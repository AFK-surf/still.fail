# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The host's and the text's contracts on Windows (docs/determinism.md, "What is compared, and where"; scripts/
# host_contract.sh): kitdemo's controls page run in a window with its scripted taps, its tape made a Tester's test and
# run here (every frame the same), then the committed tape's text (windows_controls) asked of DirectWrite again (every
# answer the same); streamdemo's JPEG stream decoded by WIC to its end. When Windows' host changes.
name: mbui-host-windows
on:
  pull_request:
    paths: &paths
      - "apps/mbui/mbui/src/ui/native.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/viewcheck.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/playcheck.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/secretcheck.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/a11ycheck.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/fontscalecheck.mbt"
      - "apps/mbui/mbui/src/host/win_*"
      - "apps/mbui/mbui/src/host/win.h"
      - "apps/mbui/mbui/src/host/log_files.h"
      - "apps/mbui/mbui/scripts/win_logs_test.c"
      - "apps/mbui/mbui/scripts/win_drop_test.c"
      - "apps/mbui/mbui/src/host/mini_json.h"
      - "apps/mbui/mbui/src/host/done_watch.h"
      - "apps/mbui/mbui/src/ui/drive.mbt"
      - "apps/mbui/mbui/scripts/done_runner.py"
      - "apps/mbui/mbui/scripts/win.sh"
      - "apps/mbui/mbui/scripts/host_contract.sh"
      - "apps/mbui/mbui/tools/chk/textrec.mbt"
      - "apps/mbui/mbui/test/host/**"
      - "apps/mbui/mbui/src/kitdemo/gallery/textcheck.mbt"
      - "apps/mbui/mbui/src/kitdemo/gallery/textrec_windows_*"
      - "apps/mbui/mbui/src/host/stream*"
      - "apps/mbui/mbui/src/ui/stream*"
      - "apps/mbui/mbui/src/streamdemo/**"
      - ".github/workflows/mbui-host-windows.yml"
      - ".github/actions/msvc/**"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:


jobs:
  # (a job of its own: a failure here is not the host's contracts' failure, and takes none of their time)
  log-files:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mbui/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      - name: "The log files: stderr kept in rotating files, nothing of a secret, nobody waiting for a stalled disk (src/host/win_logs.h)"
        run: |
          mkdir -p out/logs
          cl.exe -nologo -W3 -D_CRT_SECURE_NO_WARNINGS -Isrc/host scripts/win_logs_test.c -Foout/logs/ -Feout/logs/win_logs_test.exe
          timeout 150 out/logs/win_logs_test.exe 2> out/logs/stderr.txt
          # (given on as it was said, to whoever had stderr before)
          grep -q 'crt line password=hunter2' out/logs/stderr.txt
          grep -q 'handle line https://a.example/p?token=hunter3' out/logs/stderr.txt
          grep -q 'after the stall' out/logs/stderr.txt

  explorer-probe:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mbui/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - name: Real HGLOBAL contracts
        run: |
          mkdir -p out/host/explorer
          cl.exe -nologo -W3 -D_CRT_SECURE_NO_WARNINGS -I"$MOON_HOME/include" -Isrc/host scripts/win_drop_test.c -Foout/host/explorer/ -Feout/host/explorer/win_drop_test.exe user32.lib shell32.lib ole32.lib uuid.lib
          out/host/explorer/win_drop_test.exe
      - name: Build retained node probe
        run: APP=drop_probe bash scripts/win.sh build
      - name: Drag from Explorer into the app
        run: |
          printf 'hello from Explorer\n' > out/host/explorer/mbui-drag-source
          env MBUI_BENCH=-1 MBUI_WIN=560x400 ./out/win/mod/_build/native/release/build/drop_probe/drop_probe.exe > out/host/explorer/probe.log 2>&1 &
          proc=$!
          pid=$(cat /proc/$proc/winpid)
          code=0
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "$PWD/test/host/explorer-drop-probe.ps1")" -AppId "$pid" -FilePath "$(cygpath -w "$PWD/out/host/explorer/mbui-drag-source")" -LogPath "$(cygpath -w "$PWD/out/host/explorer/probe.log")" -ShotPath "$(cygpath -w "$PWD/out/host/explorer/hover.png")" || { code=$?; kill "$proc" 2>/dev/null || :; }
          wait "$proc" || :
          cat out/host/explorer/probe.log
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-drop-probe
          path: apps/mbui/mbui/out/host/explorer/
          if-no-files-found: ignore

  contracts:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mbui/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - name: "File drop and clipboard: movable CF_HDROP with Unicode paths"
        run: |
          mkdir -p out/host
          cl.exe -nologo -W3 -D_CRT_SECURE_NO_WARNINGS -I"$MOON_HOME/include" -Isrc/host scripts/win_drop_test.c -Foout/host/ -Feout/host/win_drop_test.exe user32.lib shell32.lib ole32.lib uuid.lib
          out/host/win_drop_test.exe
      - name: "A key that focuses a field and the next typed key belong to the right recipients"
        run: |
          mkdir -p out/host
          cl.exe -nologo -W3 -Isrc/host scripts/win_input_test.c -Foout/host/ -Feout/host/win_input_test.exe user32.lib
          out/host/win_input_test.exe
      - name: kitdemo
        run: scripts/host_contract.sh windows build
      - name: "The host's contract: a run's tape = a Tester's frames"
        run: scripts/host_contract.sh windows record
      - name: "The text's contract: windows_controls = DirectWrite's"
        run: scripts/host_contract.sh windows text
      - name: "The native views' contract: one placed between pixels is put where it was told, on whole device pixels"
        if: success() || failure()
        run: scripts/host_contract.sh windows views
      - name: "The pages' contract: a page says to the app, runs its scripts, keeps cookies, takes an event stream as it is sent"
        if: success() || failure()
        run: scripts/host_contract.sh windows site
      - name: "The runner's contract: a file written in the run's directory is told as it comes (done X)"
        if: success() || failure()
        run: scripts/host_contract.sh windows runner
      - name: "The system's Text size given the app (150%: its words 1.5 times as big)"
        if: success() || failure()
        run: scripts/host_contract.sh windows fontscale
      - name: "The widgets read out by UI Automation's client (as a reader: Narrator, NVDA), a button pressed through it"
        if: success() || failure()
        run: scripts/host_contract.sh windows a11y
      - name: "Secrets copied: kept out of the clipboard's history, taken off as the app ends, left when something else was copied since"
        if: success() || failure()
        run: scripts/host_contract.sh windows secret
      - name: "PDFs: test/host/pdfcheck.pdf's two pages read and drawn by Windows' own (Windows.Data.Pdf)"
        if: success() || failure()
        run: scripts/host_contract.sh windows pdf
      - name: "The player: test/host/playcheck.mp4 read through the app, played to its end, a frame grabbed (WebView2's <video>)"
        if: success() || failure()
        run: scripts/host_contract.sh windows play
      - name: "Streams: streamdemo's H.264 (Media Foundation's decoder) and its JPEG (WIC) each said shown to its end (STREAM done)"
        if: success() || failure()
        timeout-minutes: 5
        run: |
          APP=streamdemo bash scripts/win.sh build >/dev/null
          mkdir -p out/host
          ok=1
          for codec in h264 jpeg; do
            # (a run that hangs, every frame let go, given 3 minutes before it fails)
            timeout 180 env MBUI_BENCH=-1 MBUI_WIN=720x480 MBUI_STREAM=$codec MBUI_STREAM_EXIT=1 \
              ./out/win/mod/_build/native/release/build/streamdemo/streamdemo.exe > out/host/stream-$codec.log 2>&1
            echo "== $codec"; grep -a 'STREAM\|^win: stream' out/host/stream-$codec.log
            grep -q 'STREAM done' out/host/stream-$codec.log || ok=0
          done
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-windows
          path: apps/mbui/mbui/out/host/
          if-no-files-found: ignore
