# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# MoonBit's latest release put in the Actions cache, once each (by the ETags of this platform's binaries and core): what
# every job's MoonBit is (.github/actions/mbui-moonbit), restored there, never downloaded in a job. Asked each hour; a release
# already in, nothing done. A download that breaks off fails this run alone, the jobs going on with the release before.
name: mbui-moonbit
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/mbui-moonbit.yml"
      - ".github/actions/mbui-moonbit/**"
  # (a change to it tried on its pull request: what it puts in is that pull request's own)
  pull_request:
    paths: *paths


jobs:
  put:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bin: moonbit-linux-x86_64.tar.gz, core: core-latest.tar.gz }
          # (the Linux app's arm64 build: mbui.yml's linux job on GitHub's arm64 Ubuntu)
          - { os: ubuntu-24.04-arm, bin: moonbit-linux-aarch64.tar.gz, core: core-latest.tar.gz }
          - { os: macos-15, bin: moonbit-darwin-aarch64.tar.gz, core: core-latest.tar.gz }
          - { os: windows-latest, bin: moonbit-windows-x86_64.zip, core: core-latest.zip }
          # (Mini1's own entry: a self-hosted runner's cache is not the same entry as macos-15's, its tar and
          # compression another, so its jobs find none of macos-15's)
          - { os: [self-hosted, mbui-render], bin: moonbit-darwin-aarch64.tar.gz, core: core-latest.tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: The latest release's ETags
        id: tag
        shell: bash
        run: |
          base=https://cli.moonbitlang.com
          # (--retry-all-errors: --retry alone does not ask again after a connection broken off, Mini1's
          # SSL_ERROR_SYSCALL failing the hour's run at once, 40997517041)
          tag=$( { curl -fsSI --retry 3 --retry-all-errors --max-time 20 $base/binaries/latest/${{ matrix.bin }}
                   curl -fsSI --retry 3 --retry-all-errors --max-time 20 $base/cores/${{ matrix.core }}; } \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "etag" { print $2 }' | tr -d '\n')
          [ "$(printf '%s' "$tag" | tr -cd '"' | wc -c | tr -d ' ')" = 4 ] || { echo "::error::no ETags from $base: $tag"; exit 1; }
          echo "key=moonbit-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-$(printf '%s' "$tag trimmed" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: had
        with:
          path: ${{ runner.tool_cache }}/moon-ci
          key: ${{ steps.tag.outputs.key }}
          lookup-only: true
      - name: "Installed (MOON_HOME: moon-ci in the runner's tool cache)"
        if: steps.had.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export MOON_HOME="$RUNNER_TOOL_CACHE/moon-ci"; [ "${{ runner.os }}" != Windows ] || MOON_HOME=$(cygpath -u "$MOON_HOME")
          # (the release the tool cache held is written over: .github/actions/mbui-moonbit restores what is put in)
          rm -f "$MOON_HOME.key"
          if [ "${{ runner.os }}" = Windows ]; then
            MOON_HOME=$(cygpath -w "$MOON_HOME") powershell -NoProfile -Command "irm https://cli.moonbitlang.com/install/powershell.ps1 | iex"
          else
            curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          # (without what no job here runs: the docs', the editors' and the coverage's programs, ~40 MB of every job's
          # download of it, ~20 jobs a commit, when GitHub stopped the account's cache downloads: "Egress is over the
          # account limit", 2026-10-30. "trimmed" in the key: a release put in before is put in again so)
          rm -f "$MOON_HOME"/bin/moondoc* "$MOON_HOME"/bin/moon-ide* "$MOON_HOME"/bin/moon-lsp* "$MOON_HOME"/bin/moonbit-lsp* \
            "$MOON_HOME"/bin/moon_cove* "$MOON_HOME"/bin/moonc-prove*
          ls "$MOON_HOME/bin"
          PATH="$MOON_HOME/bin:$PATH" moon version --all
      - if: steps.had.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.tool_cache }}/moon-ci
          key: ${{ steps.tag.outputs.key }}
      # (put in, or this fails: a save that could not be made is only a warning of actions/cache/save's, run 39533061843's
      # every put green with nothing saved)
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.tool_cache }}/moon-ci
          key: ${{ steps.tag.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true
      # (what a job gets: the action over what was put in)
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/actions }
      - uses: ./.github/actions/mbui-moonbit
