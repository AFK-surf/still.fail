# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The renderer's pixels in the browser (docs/determinism.md, "Pixel references belong to one kind of machine"): a
# Tester's draw list drawn by web/host.js's WebGL2 renderer in headless Chromium on SwiftShader (Playwright pinned,
# scripts/render_web.sh) on GitHub's ubuntu-24.04 runner, twice in each of two jobs at once, against its reference
# (goldens/render/web-controls.png) to the byte, on the runner image and browser the reference was made on
# (goldens/render/web.txt). The picture drawn is the artifact: what a PR that changes it commits, saying why.
name: mbui-render-web
on:
  pull_request:
    paths: &paths
      - "apps/mbui/mbui/web/host.js"
      - "apps/mbui/mbui/web/render.html"
      - "apps/mbui/mbui/src/render/**"
      - "apps/mbui/mbui/src/ui/drawlist.mbt"
      - "apps/mbui/mbui/src/ui/scene.mbt"
      - "apps/mbui/mbui/src/ui/line.mbt"
      - "apps/mbui/mbui/scripts/lines_check.py"
      - "apps/mbui/mbui/src/kitdemo/dl_print_wbtest.mbt"
      - "apps/mbui/mbui/src/ui/smooth.mbt"
      - "apps/mbui/mbui/src/host/corner*"
      - "apps/mbui/mbui/goldens/render/web*"
      - "apps/mbui/mbui/scripts/render_dl.sh"
      - "apps/mbui/mbui/scripts/render_web.sh"
      - "apps/mbui/mbui/scripts/render_web.mjs"
      - ".github/workflows/mbui-render-web.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:



jobs:
  offscreen:
    defaults:
      run:
        working-directory: apps/mbui/mbui
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mbui-moonbit
      - name: Drawn offscreen, twice (scripts/render_web.sh)
        run: scripts/render_web.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-web-${{ matrix.run }}
          # (a rerun's own: the attempt before's put by, so `same` compares this attempt's pictures)
          overwrite: true
          path: apps/mbui/mbui/out/render/
      - name: Against the reference, on the machine it was made on
        run: scripts/render_web.sh against

  # the two jobs' pictures (two machines of the kind, at once): the same to the byte
  same:
    needs: offscreen
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: render-web-*, path: runs }
      - run: |
          md5sum runs/*/controls.png
          grep -h '^cpu ' runs/*/machine.txt
          cmp runs/render-web-a/controls.png runs/render-web-b/controls.png && echo "the two jobs' pictures: the same to the byte"

        working-directory: ${{ github.workspace }}