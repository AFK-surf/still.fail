# mbui (libs/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The renderer's pixels on Windows ("Pixel references belong to one kind of machine"): a Tester's
# draw list drawn offscreen by the Direct3D 11 renderer on WARP on GitHub's windows-2025 runner, twice in each of two
# jobs at once, against its reference (goldens/render/windows-controls.png) to the byte, on the runner image the
# reference was made on (goldens/render/windows.txt). The picture drawn is the artifact: what a PR that changes it
# commits, saying why.
name: mbui-render-windows
on:
  pull_request:
    paths: &paths
      - "libs/mbui/src/host/win_render.cpp"
      - "libs/mbui/src/host/win_text.cpp"
      - "libs/mbui/src/host/win_image.cpp"
      - "libs/mbui/scripts/win.sh"
      - "libs/mbui/src/render/**"
      - "libs/mbui/src/damage/**"
      - "libs/mbui/src/ui/drawlist.mbt"
      - "libs/mbui/src/ui/scene.mbt"
      - "libs/mbui/src/ui/line.mbt"
      - "libs/mbui/tools/chk/pictures.mbt"
      - "libs/mbui/src/kitdemo/gallery/dl_print_wbtest.mbt"
      - "libs/mbui/src/ui/smooth.mbt"
      - "libs/mbui/src/host/corner*"
      - "libs/mbui/src/host/contained.h"
      - "libs/mbui/goldens/render/windows*"
      - "libs/mbui/goldens/render/controls.dl"
      - "libs/mbui/scripts/render_dl.sh"
      - "libs/mbui/scripts/render_windows.sh"
      - ".github/workflows/mbui-render-windows.yml"
      - ".github/actions/mbui-warp/**"
      - ".github/actions/msvc/**"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:


jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        working-directory: libs/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - name: The renderer and its draw lists
        run: scripts/render_windows.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-render-build
          path: |
            libs/mbui/out/render/
            libs/mbui/out/win/mod/_build/native/release/build/render/render.exe

  offscreen:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        working-directory: libs/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - uses: ./.github/actions/mbui-warp
      - uses: actions/download-artifact@v4
        with:
          name: windows-render-build
          path: libs/mbui/out/
      - name: Drawn offscreen, twice (scripts/render_windows.sh)
        run: scripts/render_windows.sh draw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-windows-${{ matrix.run }}
          # (a rerun's own: the attempt before's put by, so `same` compares this attempt's pictures)
          overwrite: true
          path: libs/mbui/out/render/
      - name: Against the reference, on the machine it was made on
        run: scripts/render_windows.sh against

  # the two jobs' pictures (two machines of the kind, at once): the same to the byte
  same:
    needs: offscreen
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: render-windows-*, path: runs }
      - run: |
          md5sum runs/*/controls.png
          grep -h '^cpu ' runs/*/machine.txt
          cmp runs/render-windows-a/controls.png runs/render-windows-b/controls.png && echo "the two jobs' pictures: the same to the byte"

        working-directory: ${{ github.workspace }}
