# mbui (libs/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The renderer's pixels ("Pixel references belong to one machine"): a Tester's draw list drawn
# offscreen on macos-ci (mbui's runner there, label mbui-render), against its reference (goldens/render/macos-ci-*.png) to
# the byte, on the macOS and GPU the references were made on (goldens/render/macos-ci.txt). The pictures drawn are the
# artifact: what a PR that changes them commits, saying which and why.
name: mbui-render
on:
  pull_request:
    paths:
      - "libs/mbui/src/host/apple_render.m"
      - "libs/mbui/src/host/apple_text.m"
      - "libs/mbui/src/render/**"
      - "libs/mbui/src/damage/**"
      - "libs/mbui/src/ui/drawlist.mbt"
      - "libs/mbui/src/ui/scene.mbt"
      - "libs/mbui/src/ui/line.mbt"
      - "libs/mbui/tools/chk/pictures.mbt"
      - "libs/mbui/src/kitdemo/gallery/dl_print_wbtest.mbt"
      - "libs/mbui/src/ui/smooth.mbt"
      - "libs/mbui/src/host/corner*"
      - "libs/mbui/src/host/contained.h"
      - "libs/mbui/goldens/render/**"
      - "libs/mbui/scripts/render_offscreen.sh"
      - ".github/workflows/mbui-render.yml"
  push:
    branches: [main]
    paths:
      - "libs/mbui/src/host/apple_render.m"
      - "libs/mbui/src/host/apple_text.m"
      - "libs/mbui/src/render/**"
      - "libs/mbui/src/damage/**"
      - "libs/mbui/src/ui/drawlist.mbt"
      - "libs/mbui/src/ui/scene.mbt"
      - "libs/mbui/src/ui/line.mbt"
      - "libs/mbui/tools/chk/pictures.mbt"
      - "libs/mbui/src/kitdemo/gallery/dl_print_wbtest.mbt"
      - "libs/mbui/src/ui/smooth.mbt"
      - "libs/mbui/src/host/corner*"
      - "libs/mbui/src/host/contained.h"
      - "libs/mbui/goldens/render/**"
  workflow_dispatch:

concurrency:
  group: mbui-render-${{ github.ref }}
  cancel-in-progress: true


env:
  # Farview's client, which the app draws a chat's Farview tab with (apps/mbui/scripts/farview.sh: a private repository,
  # read by its deploy key)
  FARVIEW_DEPLOY_KEY: ${{ secrets.FARVIEW_DEPLOY_KEY }}
jobs:
  offscreen:
    defaults:
      run:
        working-directory: libs/mbui
    # (a machine of ours: never a fork's pull request)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mbui-render]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mbui-moonbit
      - name: A Tester's draw list drawn offscreen (scripts/render_offscreen.sh)
        run: scripts/render_offscreen.sh
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: render
          path: libs/mbui/out/render/
      - name: The macOS and the GPU the references were made on
        run: |
          for k in system gpu; do
            want=$(sed -n "s/^$k //p" goldens/render/macos-ci.txt)
            have=$(sed -n "s/^$k //p" out/render/machine.txt)
            if [ "$want" != "$have" ]; then
              echo "$k is $have here, the references were made on $want: make them all again in one PR (this run's artifact), saying so"
              exit 1
            fi
          done
      - name: Against the references, to the byte
        run: |
          if cmp -s out/render/controls.png goldens/render/macos-ci-controls.png; then
            echo "the same to the byte"
          else
            echo "goldens/render/macos-ci-controls.png: not what macos-ci draws now (this run's artifact has it)"
            exit 1
          fi
