# The screens' pixels: each screen's draw list (apps/mbui/src/sfscreens/__snapshot__/*.dl, what its Tester drew)
# drawn offscreen by mbui-render on GitHub's macos-15 runner, against its reference (apps/mbui/goldens/render/macos15:
# that runner's, mbui's docs/determinism.md), to the byte (scripts/screens.sh render); the pictures drawn are the
# artifact a PR that changes them commits, saying which and why.
# And mbui's drawing on screen against offscreen (mbui's scripts/render_check.sh: a Tester's draw list drawn offscreen by
# mbui-render, the same page as the host draws it in its window, the two pictures the same to the byte;
# mbui's docs/determinism.md), on Mini1 (mini1-6, label mbui: GitHub's runners cannot open a window that large), when
# a bump of mbui (apps/mbui/mbui.rev) changes its macOS drawing: rarely.
name: mbui-render
on:
  pull_request:
    paths:
      - "apps/mbui/**"
      - ".github/workflows/mbui-render.yml"
  push:
    branches: [main]
    paths:
      - "apps/mbui/**"
permissions:
  contents: read
jobs:
  screens:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MOON_HOME: ${{ github.workspace }}/../.moon
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME=$MOON_HOME bash
          echo "$MOON_HOME/bin" >> $GITHUB_PATH
      - name: The screens' draw lists drawn offscreen, against their references (scripts/screens.sh render)
        run: bash apps/mbui/scripts/screens.sh render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-render
          path: apps/mbui/out/screens-render/

  on-screen:
    if: github.event_name == 'pull_request'
    runs-on: mbui
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Tools (MoonBit, mbui)
        run: bash apps/mbui/scripts/beta.sh tools
      - name: On screen = offscreen, when the bump changes mbui's macOS drawing
        run: |
          M=$(sh apps/mbui/scripts/mbui.sh)
          new=$(tr -d ' \n' < apps/mbui/mbui.rev)
          old=$(git show "origin/${GITHUB_BASE_REF}:apps/mbui/mbui.rev" 2>/dev/null | tr -d ' \n' || true)
          C=$(dirname "$M")/repo.git
          if [ -n "$old" ] && [ "$old" != "$new" ]; then
            git -C "$C" fetch -q --filter=blob:none origin "$old" "$new" || true
            changed=$(git -C "$C" diff --name-only "$old" "$new" -- src/host/apple_render.m src/host/apple_text.m src/render src/ui/drawlist.mbt src/ui/scene.mbt)
            if [ -z "$changed" ]; then
              echo "mbui $old..$new does not change its macOS drawing: nothing to check"
              exit 0
            fi
            echo "the drawing changed: $changed"
          fi
          cd "$M" && bash scripts/render_check.sh
