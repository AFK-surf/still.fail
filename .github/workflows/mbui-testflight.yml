name: mbui TestFlight (manual)
# Its environment `ios-testflight` is held to main by a deployment rule (no tags; a second person's approval where set).
# Variables: IOS_TEAM_ID, IOS_APP_GROUP, IOS_RELEASE_REVIEWED (true only once the release is reviewed). monoid uses
# MONOID_IOS_APP_GROUP, MONOID_IOS_RELEASE_REVIEWED and MONOID_IOS_{APP,SHARE}_PROFILE_B64.
# Secrets:
# IOS_DISTRIBUTION_P12_B64 and _PASSWORD, IOS_SIGNING_SHA1, IOS_APP_PROFILE_B64, IOS_SHARE_PROFILE_B64, ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_PRIVATE_KEY_B64: credentials made for CI alone.
# The build number in the run's name: the next dispatch takes one above every number any run was given, failed ones too.
run-name: ${{ inputs.product || 'both' }} TestFlight ${{ inputs.version }} (${{ inputs.build }})
on:
  workflow_dispatch:
    inputs:
      product:
        description: Apps to release (both uses the same SHA, version and build number)
        default: both
        required: true
        type: choice
        options: [both, stillfail, monoid]
      sha:
        description: Full main SHA captured by this manual dispatch (tested and released unchanged)
        required: true
        type: string
      version:
        description: Explicit marketing version (not git commit count)
        default: "0.1.0"
        required: true
        type: string
      build:
        description: Fresh positive build number (existing 0.1.0 build 4 is already used)
        required: true
        type: string
      external:
        description: Also add this build to the external group and submit it to Beta App Review
        default: true
        type: boolean
      skip_tests:
        description: Upload whatever this run's tests say (they still run, and fail the run)
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  guard:
    if: github.repository_owner == 'AFK-surf' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      products: ${{ steps.products.outputs.products }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - run: bash scripts/testflight-products-test.sh
      - id: products
        name: Select app identities
        env:
          RELEASE_PRODUCT: ${{ inputs.product || 'both' }}
        run: |
          products=$(bash scripts/testflight-products.sh "$RELEASE_PRODUCT")
          echo "products=$products" >> "$GITHUB_OUTPUT"
      - run: bash apps/mbui/scripts/testflight-guard-test.sh
      - run: bash apps/mbui/scripts/testflight-product-test.sh
      - run: bash apps/mbui/scripts/testflight-sign-test.sh
      - run: bash scripts/testflight-distribute-test.sh
      - run: bash apps/mbui/scripts/testflight-guard.sh checkout
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
  tests:
    needs: guard
    permissions: { contents: read, actions: read }
    uses: ./.github/workflows/mbui-check.yml
  # Queued tests can outlast the release's ten minutes. Start its build and signing only after the tests finish.
  # The explicit skip_tests choice still permits uploading after failed tests.
  release:
    needs: [guard, tests]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (inputs.skip_tests || needs.tests.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.guard.outputs.products) }}
    # Each app keeps its own upload lock, including when a single-app run overlaps a both-app run.
    concurrency:
      group: mbui-testflight-${{ matrix.product == 'monoid' && 'monoid' || '6818750243' }}
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 10
    # Configure required reviewers, prevent self-review, and main-only deployment rules.
    # No production/Cloudflare credentials are used by this job.
    environment: ios-testflight
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      # mbc's units and the core's bytecode as main's newest iOS build (preview.yml) kept them: without, all ~510 units were
      # compiled again each release, 70 s on its 3 cores
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
      RELEASE_SHA: ${{ inputs.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
      RELEASE_PRODUCT: ${{ matrix.product }}
      RELEASE_SKIP_TESTS: ${{ inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - run: bash apps/mbui/scripts/testflight-guard.sh checkout
      # (restored only: preview.yml's ios job, on main, saves them)
      - uses: actions/cache/restore@v4
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-ios-${{ github.sha }}
          restore-keys: mbui-ios-
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/mbui/out/ios-device/_build
            !apps/mbui/out/ios-device/_build/**/*.mbc
          key: mbui-ios-moon-${{ github.sha }}
          restore-keys: mbui-ios-moon-
      - name: iOS's SDK 27.1 or later
        shell: bash
        run: |
          v=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $v ($(xcodebuild -version | head -1))"
          case "$v" in 2[0-6].*|27.0*) echo "::error::iOS SDK $v: an iPhone Duo letterboxes an app built before 27.1"; exit 1 ;; esac
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/mbui-moonbit
      - run: bash apps/mbui/scripts/ios-product-test.sh
      - run: bash apps/mbui/scripts/moon-mtimes.sh
      - name: Device build dependencies
        run: |
          rustup target add aarch64-apple-ios
          (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline --ignore-scripts)
      - name: Validate identity and profiles, build, sign, validate and upload
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_APP_GROUP: ${{ vars[matrix.product == 'monoid' && 'MONOID_IOS_APP_GROUP' || 'IOS_APP_GROUP'] }}
          IOS_RELEASE_REVIEWED: ${{ vars[matrix.product == 'monoid' && 'MONOID_IOS_RELEASE_REVIEWED' || 'IOS_RELEASE_REVIEWED'] }}
          IOS_DISTRIBUTION_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_B64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_B64: ${{ secrets[matrix.product == 'monoid' && 'MONOID_IOS_APP_PROFILE_B64' || 'IOS_APP_PROFILE_B64'] }}
          IOS_SHARE_PROFILE_B64: ${{ secrets[matrix.product == 'monoid' && 'MONOID_IOS_SHARE_PROFILE_B64' || 'IOS_SHARE_PROFILE_B64'] }}
          IOS_SIGNING_SHA1: ${{ secrets.IOS_SIGNING_SHA1 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          # (PostHog's key its crash reports go with: none, and the build sends nothing; testflight.sh warns)
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash apps/mbui/scripts/testflight.sh
          [ "$(cat "$RUNNER_TEMP/mbui-testflight-uploaded")" = "$RELEASE_SHA" ] || { echo 'Missing upload completion receipt' >&2; exit 1; }
      # Each successful upload starts its distribution, even if the other app fails or is still building.
      # Apple's processing runs apart from this job, leaving the upload standing if distribution fails.
      - name: Distribute the uploaded app
        run: gh workflow run mbui-testflight-distribute.yml --repo "$GITHUB_REPOSITORY" --ref main -f product="$RELEASE_PRODUCT" -f version="$RELEASE_VERSION" -f build="$RELEASE_BUILD" -f external="$RELEASE_EXTERNAL" -f round=1
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXTERNAL: ${{ inputs.external }}
      - name: Clean temporary signing material (also on failure/cancellation)
        if: always()
        shell: bash
        run: |
          for dir in "$RUNNER_TEMP"/mbui-testflight.*; do
            [ -d "$dir" ] || continue
            security delete-keychain "$dir/signing.keychain-db" >/dev/null 2>&1 || true
            rm -rf "$dir"
          done
