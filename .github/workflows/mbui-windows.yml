# mbui (apps/mbui/mbui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The demo on Windows: build with MoonBit and MSVC, its input method's script run in a window (Direct3D falls back to
# WARP on the GPU-less runner); then the text against DirectWrite's own. No picture of the app's window is compared
# with a kept one (goldens/windows.png is scripts/shots.sh's, by hand): what Direct3D draws is held to its references
# by mbui-render-windows (a Tester's draw list drawn offscreen), as the macOS job does (mbui-ci.yml).
name: mbui-windows
on:
  # (on main as on a branch, only when what it builds changed: on every push to main it ran 77 times in three days,
  # a commit to the station's code as well)
  push:
    branches: [main]
    paths: ["apps/mbui/mbui/**", ".github/workflows/mbui-windows.yml", ".github/actions/mbui-moonbit/**", ".github/actions/msvc/**"]
  pull_request:
    paths: ["apps/mbui/mbui/**", ".github/workflows/mbui-windows.yml", ".github/actions/mbui-moonbit/**", ".github/actions/msvc/**"]
  workflow_dispatch:
    inputs:
      stillfail_ref:
        description: "also build still.fail's apps/mbui sffix (AFK-surf/still.fail at this ref) and shoot its wide frame"
        required: false
        default: ""


jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 5
    # (the units mbc compiles kept by content, MBC_STORE: restored on every run, saved by main's alone; without them
    # each run compiled the demo, textdiff and webdemo whole, 193 s on average and 466 s at most, 2026-10-22)
    env:
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
    defaults:
      run:
        working-directory: apps/mbui/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      # MoonBit's latest release, kept in the Actions cache by the ETags of its two downloads (the binaries and the
      # core, a HEAD each): installed (~16 s, most of it bundling the core) only when either changed. No answer: no
      # key, installed as before.
      - uses: ./.github/actions/mbui-moonbit
      - uses: actions/cache/restore@v4
        with:
          path: .ci/mbc-store
          key: mbui-windows-demo-${{ github.sha }}
          restore-keys: mbui-windows-demo-
      - name: Build
        run: |
          moon version --all
          scripts/win.sh build
          echo "binary: $(stat -c %s out/win/mod/_build/native/release/build/demo/demo.exe) bytes"
      - name: IME script
        run: scripts/win.sh script ime
      - name: Text against DirectWrite's own (scripts/textdiff.sh windows; the report is in the artifact)
        run: |
          mkdir -p out/node && (cd out/node && { [ -f package.json ] || npm init -y >/dev/null; } && npm i pngjs >/dev/null)
          scripts/textdiff.sh windows
      - name: Web views (WebView2) - a page, a site the app answers, and with no runtime to be had
        run: |
          APP=webdemo scripts/win.sh build
          mkdir -p out/webviews
          D=$(cygpath -w "$PWD/out/webviews")
          EXE=out/win/mod/_build/native/release/build/webdemo/webdemo.exe
          # the runtime's first start on this machine, not looked at: on the 20261030 image (runtime 156) the first web
          # views a fresh runner makes take ~35 s (5 s its environment, 30 s its views), every start after it ~0.5 s, with
          # a user data folder of its own too (2026-10-30, the webview2-slow-diag runs); the image before it, ~2 s
          MBUI_BENCH=-1 MBUI_SCRIPT=shot MBUI_SHOT_NAME=webviews-first MBUI_SHOT_DIR="$D" ./$EXE > out/webviews/webviews-first.log 2>&1 || true
          MBUI_SHOT_SCREEN=1 MBUI_BENCH=-1 MBUI_SCRIPT=shot MBUI_SHOT_NAME=webviews MBUI_SHOT_DIR="$D" ./$EXE 2>&1 | tee out/webviews/webviews.log
          # the runtime looked for where there is none (as on a machine without it): every view says it cannot be shown
          MBUI_WEBVIEW2_DIR='C:\no-webview2-here' MBUI_BENCH=-1 MBUI_SCRIPT=shot MBUI_SHOT_NAME=webviews-none \
            MBUI_SHOT_DIR="$D" ./$EXE 2>&1 | tee out/webviews/webviews-none.log
          for want in "view 1: page loaded" "view 2: site page loaded" "view 1: told 1" "view 2: told 0" "view 2: told 1" \
                      "site asked GET /style.css" "site asked POST /api/echo (page false, body 7 bytes)" "SHOT .* ok"; do
            grep -q "$want" out/webviews/webviews.log || { echo "webviews.log: no \"$want\""; exit 1; }
          done
          grep -q "no WebView2 runtime" out/webviews/webviews-none.log || { echo "webviews-none.log: the runtime was found"; exit 1; }
          grep -q "SHOT .* ok" out/webviews/webviews-none.log
      - if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ci/mbc-store
          key: mbui-windows-demo-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: |
            apps/mbui/mbui/out/webviews/
            apps/mbui/mbui/out/shot-kit/
            apps/mbui/mbui/out/ime/
            apps/mbui/mbui/out/photos/
            apps/mbui/mbui/out/textdiff/
          if-no-files-found: warn

  # still.fail's app over made-up data (its apps/mbui sffix, against this mbui), asked for by a run's stillfail_ref:
  # its wide frame (a desktop's window) and a phone's page, light and dark, for comparing with macOS's.
  stillfail:
    if: github.event_name == 'workflow_dispatch' && inputs.stillfail_ref != ''
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mbui/mbui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AFK-surf/still.fail
          ref: ${{ inputs.stillfail_ref }}
          path: apps/mbui/mbui/sf
          sparse-checkout: apps/mbui
      - uses: ./.github/actions/msvc
      # MoonBit's latest release, kept in the Actions cache by the ETags of its two downloads (the binaries and the
      # core, a HEAD each): installed (~16 s, most of it bundling the core) only when either changed. No answer: no
      # key, installed as before.
      - uses: ./.github/actions/mbui-moonbit
      - name: Build sffix
        run: MBUI_APP_MOD=sf/apps/mbui APP=sffix scripts/win.sh build
      - name: Screenshots
        run: |
          mkdir -p out/shot-sf
          D=$(cygpath -w "$PWD/out/shot-sf")
          EXE=$(ls out/win/app/_build/native/release/build/*/sffix/sffix.exe)
          for m in home chat settings-appearance files; do
            for d in 0 1; do
              n=win-wide-$m$([ $d = 1 ] && echo -dark || true)
              MBUI_BENCH=-1 MBUI_WIN=1280x800 MBUI_DARK=$d MBUI_FIXTURE=$m MBUI_SCRIPT=shot MBUI_SHOT_NAME=$n MBUI_SHOT_DIR="$D" ./$EXE
            done
          done
          MBUI_BENCH=-1 MBUI_WIN=1440x900 MBUI_FIXTURE=chat MBUI_SCRIPT=shot MBUI_SHOT_NAME=win-wide-chat-1440 MBUI_SHOT_DIR="$D" ./$EXE
          MBUI_BENCH=-1 MBUI_WIN=390x844 MBUI_SCRIPT=shot MBUI_SHOT_NAME=win-phone-home MBUI_SHOT_DIR="$D" ./$EXE
          # its web views (WebView2): a service's page the app answers, an HTML file previewed
          for m in service chat-preview-html; do
            MBUI_SHOT_SCREEN=1 MBUI_BENCH=-1 MBUI_WIN=1280x800 MBUI_FIXTURE=$m MBUI_SCRIPT=shot MBUI_SHOT_NAME=win-wide-$m \
              MBUI_SHOT_DIR="$D" ./$EXE 2>&1 | tee out/shot-sf/win-wide-$m.log
          done
          ls -la out/shot-sf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stillfail-windows-shots
          path: apps/mbui/mbui/out/shot-sf/
          if-no-files-found: warn
