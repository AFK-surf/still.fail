# still.fail mbui (apps/mbui: still.fail's Android app written in mbui, fail.still.mbui, a test app of its own beside
# still.fail's): on main, each push that changes what it is built from is out in a few minutes, signed with every
# still.fail Android release's key, at https://app.still.fail/releases/latest/android-mbui (its feed
# android/mbui/latest.json, still.fail's AppRelease); its macOS app after it, signed with still.fail's macOS identity,
# at /releases/latest/mac-mbui (mac/mbui/latest.json). A branch's push builds it (no key, nothing put): the evidence.
# A workflow of its own, not a job of pipeline.yml: it does not wait for the pipeline's run before it (main's runs queue
# one after the other, and the checks take longer than this app's whole release), and nothing of the pipeline waits
# for it or fails with it (deployed/beta, put, done). As asked (2026-10-19), its tests do not hold it back: it is a
# test app. The feed moves only once its APK is fetched back from where it is served, the same bytes.
# main's on mini1-6 (label mbui), a branch's on mini1's four. Warm on mini1 (apps/mbui/scripts/beta.sh): the latest MoonBit (installed again only when there is a newer one), the
# pinned mbui, core.hbc by its inputs, moonc's and the compiler's outputs and Gradle's in ~/stillfail-ci/mbui (out of
# the checkout, which other jobs clean), Gradle's daemon for its idle timeout.
name: mbui
on:
  push:
    branches: ["**"]
    paths:
      - "apps/mbui/**"
      - "client/**"
      - "media/**"
      - "vendor/**"
      - "scripts/native.ts"
      - "scripts/release-put.sh"
      - "cloud/test/dev.ts"
      - ".github/workflows/mbui.yml"
  workflow_dispatch:
# main: one at a time, a push meanwhile waits as one run of the newest; a branch: only its newest push matters.
concurrency:
  group: mbui-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  beta:
    # Trusted repository pushes only (as pipeline.yml): never pull_request here, the job has production's secrets.
    if: github.repository == 'AFK-surf/still.fail' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # mini1-6, a runner of its own on mini1 (label mbui, nothing else): it never waits behind the pipeline's jobs on
    # mini1's four, nor holds up their natives on mini1-5 (quick)
    runs-on: mbui
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # versionCode is the commits in the history
      - uses: ./.github/actions/setup-mac
      - name: Tools (MoonBit, mbui, the core's packages)
        run: bash apps/mbui/scripts/beta.sh tools
      - name: Build and sign
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          MBUI_KEEP_DAEMON: 1
        run: bash apps/mbui/scripts/beta.sh build
      - name: Put it, check it, then its feed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash apps/mbui/scripts/beta.sh publish android

  # The macOS app, after the APK (out by then, whatever happens here), on the same runner: signed with still.fail's
  # identity as its desktop app is (.github/release-desktop.py: an Apple Development certificate, no hardened runtime,
  # not notarized).
  mac:
    needs: beta
    if: ${{ !cancelled() && github.repository == 'AFK-surf/still.fail' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: mbui
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Tools (MoonBit, mbui, the core's packages)
        run: bash apps/mbui/scripts/beta.sh tools
      - name: The macOS app, built and signed
        env:
          MACOS_SIGNING_CERTIFICATE_B64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_B64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
        run: bash apps/mbui/scripts/beta.sh mac
      - name: Put it, check it, then its feed (mac)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash apps/mbui/scripts/beta.sh publish mac

  build:
    if: github.repository == 'AFK-surf/still.fail' && github.ref != 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, mini1]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Tools (MoonBit, mbui, the core's packages)
        run: bash apps/mbui/scripts/beta.sh tools
      # its own copy and caches (WORK, MBUI_CACHE): main's stay main's
      - name: Build (unsigned)
        env:
          MBUI_CACHE: ${{ runner.temp }}/mbui
        run: bash apps/mbui/scripts/beta.sh build

  # The app on Windows (APP=stillfail), on GitHub's Windows (no runner of ours is Windows), main's and a branch's: built
  # with MSVC (apps/mbui/scripts/win.sh) on the Windows engine and shell (scripts/native.ts, win32-x64: the release's, or
  # built here, kept in the job's cache by their sources), the core in Hermes; then signed in through its loopback
  # redirect against a local still.fail cloud started in the job, and Home (apps/mbui/e2e/win.sh). Its shots and logs
  # are the run's artifact (mbui-windows-<sha>). Nothing is put anywhere: packaging and signing a Windows app come later.
  windows:
    if: github.repository == 'AFK-surf/still.fail' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2025
    # a first build of the natives (the shell ~6 minutes, Hermes ~4) where the release has none yet
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      # apps/mbui/mbui, the pinned mbui's link, a real one
      MSYS: winsymlinks:nativestrict
    steps:
      # the natives' keys are git's blobs: the checkout as git has it
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Tools (MoonBit; MSVC's link.exe for cargo, which Git Bash's /usr/bin/link shadows)
        run: |
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -m "$(dirname "$(which cl)")/link.exe")" >> "$GITHUB_ENV"
          powershell -NoProfile -Command 'irm https://cli.moonbitlang.com/install/powershell.ps1 | iex'
          echo "$USERPROFILE\.moon\bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/stillfail-native
          key: mbui-windows-natives-${{ hashFiles('client/shell/**', 'client/Cargo.toml', 'client/Cargo.lock', 'apps/mbui/engine/**', 'scripts/native.ts') }}
      - name: The Windows engine and shell (the release's, else built here)
        run: |
          node scripts/native.ts path shell win32-x64
          node scripts/native.ts path engine win32-x64
      - name: Packages (the core's, the cloud's)
        run: |
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts > /dev/null
          (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
      - name: Build (APP=stillfail)
        run: |
          moon version --all
          bash apps/mbui/scripts/win.sh build
      - name: Signed in against a local still.fail, then Home (e2e/win.sh)
        run: bash apps/mbui/e2e/win.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbui-windows-${{ github.sha }}
          # (not the core's files: a sign-in, though the local cloud's)
          path: |
            apps/mbui/out/e2e/windows/
            !apps/mbui/out/e2e/windows/core/
          if-no-files-found: warn
