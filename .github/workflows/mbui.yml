# still.fail mbui (apps/mbui: still.fail's app written in mbui, fail.still.mbui, a test app of its own beside
# still.fail's): on main, each push that changes what it is built from is out in about two minutes from the push, on
# GitHub's own runners (no machine of ours: 2026-10-21, a push to four packages in three minutes): its Android app
# signed with every still.fail Android release's key (/releases/latest/android-mbui, its feed android/mbui/latest.json,
# still.fail's AppRelease), its macOS app signed with still.fail's Developer ID (/releases/latest/mac-mbui), its
# Windows app's installer, signed (/releases/latest/win-mbui), its Linux app tarred with its installer for x64 and
# arm64 (/releases/latest/linux-mbui, linux-arm64-mbui),
# side by side; its iOS app built unsigned for a device and kept as an Actions artifact. TestFlight is the separate manual mbui-testflight.yml workflow.
# A workflow of its own, not a job of pipeline.yml: nothing of the pipeline waits for it or fails with it. As asked
# (2026-10-19), its tests do not hold it back: it is a test app (Windows' e2e runs after its installer is out). A feed moves
# only once its file is fetched back from where it is served, the same bytes.
# What stays between runs, by content, in the Actions cache: MoonBit (by its release's ETags), mbc's compiled units
# (MBC_STORE), core.hbc by its inputs (HBC_CACHE), React Native's Hermes for Apple and its hermesc (by the versions
# core.sh pins), the APK's dependencies, its dex (R8's: by its classes, dependencies and rules) and its stripped native
# libraries (APK_CACHE: mbui's scripts/apk, the APK built without Gradle). The core's shell is still.fail's natives
# (scripts/native.ts shell, shell-apple; Android's and Windows' engine too), fetched by its key, never built here;
# Apple's engine, one file compiled in 1-2 s, is made in each run.
name: mbui
on:
  push:
    branches: ["**"]
    paths:
      - "apps/mbui/**"
      - "client/**"
      - "media/**"
      - "vendor/**"
      - "scripts/native.ts"
      - "scripts/release-put.sh"
      - "scripts/release-sign.ts"
      - "scripts/win-feeds.sh"
      - "scripts/release.sh"
      - "station/src/updates/**"
      - "cloud/src/install.ts"
      - "cloud/test/dev.ts"
      - ".github/workflows/mbui.yml"
      - ".github/actions/setup/**"
      - ".github/actions/msvc/**"
      - ".github/actions/apt/**"
  # (the Windows app run end to end, once a day: below, the windows job's E2E)
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
# main: one at a time, a push meanwhile waits as one run of the newest; a branch: only its newest push matters.
concurrency:
  group: mbui-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # Which packages main's push makes: those whose app changed since the build their feed names (beta.sh changed: its
  # code, not its tests, docs, scripts or CI; a push of those alone is no new package, 2026-10-21). iOS has no
  # feed: every matching main push builds a downloadable unsigned artifact. A run by hand builds them all;
  # a branch's push only Android and Windows: its macOS and iOS
  # builds put nothing and took two of the organization's 5 macOS jobs at once for each push, check-mbui's native
  # waiting 1.5 to 15 minutes for one (2026-10-21).
  what:
    if: github.repository == 'AFK-surf/still.fail' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.what.outputs.android }}
      mac: ${{ steps.what.outputs.mac }}
      win: ${{ steps.what.outputs.win }}
      linux: ${{ steps.what.outputs.linux }}
      ios: ${{ steps.what.outputs.ios }}
      handoff: ${{ steps.what.outputs.handoff }}
      win_build: ${{ steps.what.outputs.win_build }}
    steps:
      # (the history's commits and trees, the files' contents only for beta.sh: what changed is told by the trees)
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none", sparse-checkout: apps/mbui/scripts }
      - id: what
        run: |
          branch=; [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_EVENT_NAME" != push ] || branch=1
          for p in android mac win linux ios; do
            # (the day's run: the Windows app alone, built and run end to end, nothing put)
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then v=no; [ $p = win ] && v=yes; echo "$p=$v" >> "$GITHUB_OUTPUT"; echo "$p: $v"; continue; fi
            # iOS has no feed: build every matching main push, independently of Android.
            if [ "$p" != ios ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then v=$(bash apps/mbui/scripts/beta.sh changed "$p"); else v=yes; fi
            # (Linux's two machines each have a feed: a package for both when either's is behind, as arm64's before its first)
            if [ "$p" = linux ] && [ "$v" = no ]; then v=$(bash apps/mbui/scripts/beta.sh changed linux-arm64); fi
            case "$branch$p" in 1mac|1ios) v=no ;; esac
            echo "$p=$v" >> "$GITHUB_OUTPUT"
            echo "$p: $v"
          done
          # The desktop app (Electron's) moved over to the Windows app by its own updater (the windows job's last step,
          # e2e/win/handoff.sh): asked for by hand, or for a change to what that goes by (the installer, the app's
          # identity and its data's place, how it is built as the desktop app, the release's feeds), since main (a
          # branch) or the push before (main).
          v=no
          if [ "$GITHUB_EVENT_NAME" != push ]; then v=yes
          else
            base=${{ github.event.before }}
            [ -n "$branch" ] && base=$(git merge-base origin/main HEAD)
            if git cat-file -e "$base^{commit}" 2>/dev/null && git diff --name-only "$base" HEAD |
              grep -qE '^(apps/mbui/windows/|apps/mbui/e2e/win/handoff\.sh$|apps/mbui/scripts/win\.sh$|apps/mbui/src/host/win_core\.c$|apps/mbui/src/host/win_electron_sealed\.h$|apps/mbui/mbui/src/host/win_(life|update)\.h$|scripts/(win-feeds|release)\.sh$|scripts/release-sign\.ts$|station/src/updates/)'; then v=yes; fi
          fi
          echo "handoff=$v" >> "$GITHUB_OUTPUT"
          echo "handoff: $v"
          # How the Windows app is built (its compiler, mbc, the release variants' build), since main (a branch): what
          # the windows job's check that the beta app reuses the app's objects goes by. On every push it was 14-25 s of
          # a job at 180-200 s, for a change it could not catch (no-dup-tooltips 41277416265, 2026-11-01).
          v=no
          if [ "$GITHUB_EVENT_NAME" != push ] || [ -z "$branch" ]; then v=yes
          else
            base=$(git merge-base origin/main HEAD)
            if git cat-file -e "$base^{commit}" 2>/dev/null && git diff --name-only "$base" HEAD |
              grep -qE '^(apps/mbui/scripts/(win|win-compiler|beta|env)\.sh$|apps/mbui/mbui/scripts/(win\.sh|mbc|env\.sh)$|apps/mbui/mbui/tools/mbc/|\.github/workflows/(mbui|pipeline|stable)\.yml$|\.github/actions/(msvc|mbui-moonbit)/|scripts/release\.sh$)'; then v=yes; fi
          fi
          echo "win_build=$v" >> "$GITHUB_OUTPUT"
          echo "win_build: $v"

  android:
    needs: what
    if: github.repository == 'AFK-surf/still.fail' && needs.what.outputs.android == 'yes'
    runs-on: ubuntu-24.04
    # production's secrets (the key, the bucket's token) on main only: a branch's run builds, unsigned, and puts nothing
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    timeout-minutes: 5
    env:
      MBUI_FRESH: 1
      MBUI_CACHE: ${{ github.workspace }}/.ci/release
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
      APK_CACHE: ${{ github.workspace }}/.ci/apk
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # versionCode is the commits in the history (their files only as checked out)
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/mbui-moonbit
      # (mbc's units and the core's bytecode: main's newest, and on a branch its own last push's over them, m- and b-, as
      # the linux job keeps them: with main's alone each push of a branch compiled all it had changed again)
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-android-m-${{ github.sha }}
          restore-keys: |
            mbui-android-m-
            mbui-android-
      - if: github.ref != 'refs/heads/main'
        run: mkdir -p .ci && mv .ci "$RUNNER_TEMP/ci-main"
      - uses: actions/cache/restore@v4
        id: own
        if: github.ref != 'refs/heads/main'
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-android-b-${{ github.sha }}
          restore-keys: mbui-android-b-
      - if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p .ci && cp -a -n "$RUNNER_TEMP/ci-main/." .ci/ && rm -rf "$RUNNER_TEMP/ci-main"
          echo "units: $(find .ci/mbc-store -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)"
      # (the APK's own, apart: a cache's paths are part of what it is, and the one above stays the one main has)
      - uses: actions/cache/restore@v4
        id: apk-store
        with:
          path: .ci/apk
          key: mbui-apk-${{ github.sha }}
          restore-keys: mbui-apk-
      # (the Android engine and shell in the native cache, as a run before fetched them, as the windows job keeps its own:
      # one download from the store took 84 s for 2.9 MB, main 9440b484, 40668393099)
      - name: The Android natives' keys
        id: native-keys
        run: echo "key=natives-android-arm64-$(node scripts/native.ts key shell android-arm64)-$(node scripts/native.ts key engine android-arm64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      - name: Tools (the Android engine and shell prebuilt, the core's packages)
        run: |
          sh apps/mbui/scripts/mbui.sh > /dev/null
          node scripts/native.ts fetch engine android-arm64
          node scripts/native.ts fetch shell android-arm64
          (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          touch "$RUNNER_TEMP/start"
      - name: Build (and sign, on main)
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          # PostHog's key, the app's crash reports' (apps/mbui/android/apk.json's strings)
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: bash apps/mbui/scripts/beta.sh build
      - name: Put it, check it, then its feed
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash apps/mbui/scripts/beta.sh publish android
      # (main's, saved under a key by what they hold: as restored, not saved again; under the commit's key each job of
      # each run saved the same, ~25 s a job, 2026-10-22)
      - name: The caches' keys, by what they hold
        run: |
          sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
          echo "STORE_KEY=mbui-android-${{ github.ref == 'refs/heads/main' && 'm' || 'b' }}-$(sh apps/mbui/scripts/held.sh .ci/mbc-store .ci/hbc)" >> "$GITHUB_ENV"
          echo "APK_KEY=mbui-apk-$(sh apps/mbui/scripts/held.sh .ci/apk)" >> "$GITHUB_ENV"
      # (the units on every ref, a branch's under b-; the APK's, 400 MB, main's alone)
      - if: env.STORE_KEY != steps.store.outputs.cache-matched-key && env.STORE_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: ${{ env.STORE_KEY }}
      - if: github.ref == 'refs/heads/main' && env.APK_KEY != steps.apk-store.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .ci/apk
          key: ${{ env.APK_KEY }}

  # The Linux app (apps/mbui/scripts/linux.sh: GTK 4, the engine and shell prebuilt for the machine, core.hbc), for x64
  # and arm64, each on GitHub's Ubuntu of that machine (a public repository's: free): built on every push that changes
  # it; on main tarred with its installer and put, each on its machine's feed (beta.sh linux: the part linux, linux-arm64).
  linux:
    needs: what
    if: github.repository == 'AFK-surf/still.fail' && needs.what.outputs.linux == 'yes'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-24.04, part: linux }
          - { arch: arm64, os: ubuntu-24.04-arm, part: linux-arm64 }
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    timeout-minutes: 5
    env:
      MBUI_FRESH: 1
      MBUI_CACHE: ${{ github.workspace }}/.ci/release
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # the build's number is the commits in the history (their files only as checked out)
      # (GTK 4 and what the host and the core link beside it: libsoup, libsecret)
      - uses: ./.github/actions/apt
        with:
          name: mbui-linux-${{ matrix.arch }}
          packages: libgtk-4-dev libepoxy-dev libsoup-3.0-dev libsecret-1-dev clang
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/mbui-moonbit
      # mbc's units and the core's bytecode: main's newest, and on a branch its own last push's over them (m- and b-, as
      # check-mbui keeps its own). With main's alone, every push of a branch compiled all it had changed since main
      # again: presets' two pushes 273 and 276 of 480 units, 78 s of each Linux x64 build (41288956328, 41289661355,
      # 2026-11-01; a branch restores its own after main's, then main's newest units over it).
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-linux-${{ matrix.arch }}-m-${{ github.sha }}
          # (m- only, then the names before m- and b-: GitHub looks through the branch's own caches first)
          restore-keys: |
            mbui-linux-${{ matrix.arch }}-m-
            mbui-linux-${{ matrix.arch }}-
      - if: github.ref != 'refs/heads/main'
        run: mkdir -p .ci && mv .ci "$RUNNER_TEMP/ci-main"
      - uses: actions/cache/restore@v4
        id: own
        if: github.ref != 'refs/heads/main'
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-linux-${{ matrix.arch }}-b-${{ github.sha }}
          restore-keys: mbui-linux-${{ matrix.arch }}-b-
      - if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p .ci && cp -a -n "$RUNNER_TEMP/ci-main/." .ci/ && rm -rf "$RUNNER_TEMP/ci-main"
          echo "units: $(find .ci/mbc-store -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)"
      # (the Linux engine and shell in the native cache, as a run before fetched them, as the windows job keeps its own:
      # one download from the store took 84 s for 2.9 MB, main 9440b484, 40668393099)
      - name: The Linux natives' keys
        id: native-keys
        run: echo "key=natives-linux-${{ matrix.arch }}-$(node scripts/native.ts key shell linux-${{ matrix.arch }})-$(node scripts/native.ts key engine linux-${{ matrix.arch }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      - name: Tools (the Linux engine and shell prebuilt, the core's packages)
        run: |
          sh apps/mbui/scripts/mbui.sh > /dev/null
          node scripts/native.ts fetch engine linux-${{ matrix.arch }}
          node scripts/native.ts fetch shell linux-${{ matrix.arch }}
          (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          touch "$RUNNER_TEMP/start"
      - name: Build (APP=stillfail)
        run: bash apps/mbui/scripts/linux.sh build
      - name: Tarred with its installer
        run: bash apps/mbui/scripts/beta.sh linux
      - name: Put it, check it, then its feed
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash apps/mbui/scripts/beta.sh publish ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with: { name: "mbui-linux-${{ matrix.arch }}-${{ github.sha }}", path: ".ci/release/release/${{ matrix.part }}", retention-days: 7 }
      - name: The caches' keys, by what they hold
        run: |
          sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
          echo "STORE_KEY=mbui-linux-${{ matrix.arch }}-${{ github.ref == 'refs/heads/main' && 'm' || 'b' }}-$(sh apps/mbui/scripts/held.sh .ci/mbc-store .ci/hbc)" >> "$GITHUB_ENV"
      - if: env.STORE_KEY != steps.store.outputs.cache-matched-key && env.STORE_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: ${{ env.STORE_KEY }}

  # On macOS 26: its app icon is an Icon Composer document, which actool compiles only there (Xcode 26's actool on
  # macos-15 crashed in its asset agent, IBPlatformToolFailureException, 2026-10-29, 40819418131)
  mac:
    needs: what
    if: github.repository == 'AFK-surf/still.fail' && needs.what.outputs.mac == 'yes'
    runs-on: macos-26
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    timeout-minutes: 5
    env:
      MBUI_FRESH: 1
      MBUI_CACHE: ${{ github.workspace }}/.ci/release
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      # (restored on every run; saved by main's alone: a branch's would be its own, and the cache has 10 GB. Before the
      # setup: whether core.hbc is in it says whether the job needs pnpm, below)
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-mac-${{ github.sha }}
          restore-keys: mbui-mac-
      # React Native's Hermes for Apple (its framework and headers) and its hermesc, downloads of what core.sh pins: kept
      # by those lines alone. (Not the core's parts, out/core, by a hash of the shell's sources, core.sh and the engine's,
      # with nothing to fall back on, as before: any change to core.sh missed it, and mac-app.sh then built the shell with
      # cargo, 253 s of the job's 427, 2026-10-24, 40069429045. The shell is shell-apple, fetched by its key; the engine
      # is compiled in seconds, and a restored one was compiled again anyway, older than the checkout's sources.)
      - id: hermes
        run: echo "key=$(grep -E '^HERMES_(RN|APPLE_URL|APPLE_SHA256)=' apps/mbui/scripts/core.sh | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/stillfail-build
            apps/mbui/out/core/hermesc
          key: mbui-hermes-apple-${{ steps.hermes.outputs.key }}
      # The core's packages (pnpm, its store, core-ts's node_modules) only when core.hbc is not in HBC_CACHE for this
      # commit's inputs (core.sh hermes-kept: the key core.sh itself keeps it by), and then installed by core.sh as it
      # makes the core: they are only esbuild's and Babel's, and the core is unchanged in most runs. They were 12-37 s
      # of each run (pnpm, its ~58 MB store restored, the install; 2026-10-24, 40076678382: the job's 216 s).
      - id: core
        run: if bash apps/mbui/scripts/core.sh hermes-kept apple; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/setup
        with: { pnpm: "${{ steps.core.outputs.kept != 'true' }}" }
      # (its icon, drawn by scripts/mac-icon.swift run with swift and compiled by actool, made once for that script, as
      # the build does, not again on each fresh runner)
      - uses: actions/cache@v4
        with:
          path: apps/mbui/out/mac/AppIcon-*
          key: mbui-mac-icon-${{ hashFiles('apps/mbui/scripts/mac-icon.swift') }}
      # (shell-apple darwin-arm64 in the native cache by its key, as the other jobs keep their engine and shell: a shell not
      # prebuilt yet is built here with cargo, ~4.5 min, and was built again by each run of main until the pipeline's
      # natives job published it, main 9d59e567 and 1c0b2ca0, 2026-10-29)
      - name: The macOS shell's key
        id: native-keys
        run: echo "key=natives-shell-apple-darwin-arm64-$(node scripts/native.ts key shell-apple darwin-arm64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: shell
        with:
          path: ~/Library/Caches/stillfail-native/shell-apple
          key: ${{ steps.native-keys.outputs.key }}
      - uses: ./.github/actions/mbui-moonbit
      # moon's own build of the app (apps/mbui/_build, without the programs' objects the store keeps) as main's newest run
      # left it, as the iOS job's and check-mbui's: without, moonc made all of it again each run (the build and signing
      # 169 s of the job's 211, main ba28c96f, 40628153347, 2026-10-28)
      - uses: actions/cache/restore@v4
        id: moon
        with:
          path: |
            apps/mbui/_build
            !apps/mbui/_build/**/*.mbc
          key: mbui-mac-moon-${{ github.sha }}
          restore-keys: mbui-mac-moon-
      # (no Rust target: nothing is built with cargo here; native.ts adds one itself if a part must be built)
      - name: Tools
        run: |
          sh apps/mbui/scripts/mbui.sh > /dev/null
          touch "$RUNNER_TEMP/start"
      # (the shell's cargo build, its dependencies kept, as main's newest that built it left it: a shell changed is built
      # here when not prebuilt yet, and from nothing that was 180-320 s of the job, a crate of its own again and again
      # (2026-10-29, five times on main); its dependencies change with Cargo.lock alone)
      - if: steps.shell.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/mbui/out/core-target*/native/shell-apple
          key: shell-apple-target-darwin-arm64-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
          # (or from a Cargo.lock before it: cargo builds again only the crates it changed, the rest as they were.
          # Keyed by the lock alone, a lock's change built all from nothing, 331 s of the macOS app's, bef99112's iroh)
          restore-keys: |
            shell-apple-target-darwin-arm64-${{ hashFiles('client/Cargo.lock') }}-
            shell-apple-target-darwin-arm64-
      - name: The macOS app, built (and signed with still.fail's identity, on main)
        if: github.ref == 'refs/heads/main'
        env:
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
        run: bash apps/mbui/scripts/beta.sh mac
      - name: The macOS app, built (ad hoc signed)
        if: github.ref != 'refs/heads/main'
        run: EMBER=$PWD bash apps/mbui/scripts/mac-app.sh build
      - name: Put it, check it, then its feed (mac)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash apps/mbui/scripts/beta.sh publish mac
      # (by what it holds, as the android job's)
      # (main's, when it built the shell here)
      - if: github.ref == 'refs/heads/main' && steps.shell.outputs.cache-hit != 'true' && hashFiles('apps/mbui/out/core-target*/native/shell-apple/**/libstillfail_shell.a') != ''
        uses: actions/cache/save@v4
        with:
          path: apps/mbui/out/core-target*/native/shell-apple
          key: shell-apple-target-darwin-arm64-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
      - name: The cache's key, by what it holds
        if: github.ref == 'refs/heads/main'
        run: |
          sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
          echo "STORE_KEY=mbui-mac-$(sh apps/mbui/scripts/held.sh .ci/mbc-store .ci/hbc)" >> "$GITHUB_ENV"
      - if: github.ref == 'refs/heads/main' && env.STORE_KEY != steps.store.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: ${{ env.STORE_KEY }}
      - if: github.ref == 'refs/heads/main' && steps.moon.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/mbui/_build
            !apps/mbui/_build/**/*.mbc
          key: mbui-mac-moon-${{ github.sha }}

  # Built with iOS 27.1's SDK: an app built with an older one runs on an iPhone Duo's inner screen letterboxed, black
  # bars either side, and is told nothing of its hinge (UIHingeInteraction, its fold's reserved regions: ios_app.m).
  # GitHub's xcode-27 image has Xcode 27.1 beside its default 27.0 (2026-10-23); the SDK is checked, not trusted.
  ios:
    needs: what
    if: github.repository == 'AFK-surf/still.fail' && needs.what.outputs.ios == 'yes'
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      # (the shell's cargo build in the checkout, as the macOS job's is (mac-app.sh's), for the cache below)
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/mbui/out/core-target
    steps:
      - name: iOS's SDK 27.1 or later
        run: |
          v=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $v ($(xcodebuild -version | head -1))"
          case "$v" in 2[0-6].*|27.0*) echo "::error::iOS SDK $v: an iPhone Duo letterboxes an app built before 27.1"; exit 1 ;; esac
      - uses: actions/checkout@v5
      # (restored on every run; saved by main's alone: a branch's would be its own, and the cache has 10 GB; before the
      # setup, as the mac job's)
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-ios-${{ github.sha }}
          restore-keys: mbui-ios-
      # (Hermes for Apple and its hermesc by the versions core.sh pins, as the mac job's)
      - id: hermes
        run: echo "key=$(grep -E '^HERMES_(RN|APPLE_URL|APPLE_SHA256)=' apps/mbui/scripts/core.sh | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/stillfail-build
            apps/mbui/out/core/hermesc
          key: mbui-hermes-apple-${{ steps.hermes.outputs.key }}
      # (the core's packages only for a core.hbc not kept, as the mac job's)
      - id: core
        run: if bash apps/mbui/scripts/core.sh hermes-kept apple; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/setup
        with: { pnpm: "${{ steps.core.outputs.kept != 'true' }}" }
      # (its icon, drawn by scripts/mac-icon.swift run with swift and compiled by actool, made once for that script, as
      # the build does, not again on each fresh runner)
      - uses: actions/cache@v4
        with:
          path: apps/mbui/out/ios-assets-*
          key: mbui-ios-icon-${{ hashFiles('apps/mbui/scripts/mac-icon.swift', 'apps/mbui/scripts/ios.sh') }}
      # (shell-apple ios-arm64 in the native cache by its key, as the other jobs keep their engine and shell: a shell not
      # prebuilt yet is built here with cargo, ~4.5 min, and was built again by each run of main until the pipeline's
      # natives job published it, main 9d59e567 and 1c0b2ca0, 2026-10-29)
      - name: The iOS shell's key
        id: native-keys
        run: echo "key=natives-shell-apple-ios-arm64-$(node scripts/native.ts key shell-apple ios-arm64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: shell
        with:
          path: ~/Library/Caches/stillfail-native/shell-apple
          key: ${{ steps.native-keys.outputs.key }}
      - uses: ./.github/actions/mbui-moonbit
      # moon's own build of the app (moonc's C, what it checked) as main's newest run left it, as check-mbui keeps its
      # own: without, moonc made all of it again each run, ~2 of the .ipa step's 2-3 minutes, the release's longest job
      # (main ca1e5c05, 40613958685, 2026-10-28). Main's only, as the units' store. (Without each program's objects: the
      # store keeps those.)
      - uses: actions/cache/restore@v4
        id: moon
        with:
          path: |
            apps/mbui/out/ios-device/_build
            !apps/mbui/out/ios-device/_build/**/*.mbc
          key: mbui-ios-moon-${{ github.sha }}
          restore-keys: mbui-ios-moon-
      - run: touch "$RUNNER_TEMP/start"
      # Always unsigned. TestFlight signing/upload is a separate manual workflow.
      # (the shell's cargo build, its dependencies kept, as main's newest that built it left it: a shell changed is built
      # here when not prebuilt yet, and from nothing that was 180-320 s of the job, a crate of its own again and again
      # (2026-10-29, five times on main); its dependencies change with Cargo.lock alone)
      - if: steps.shell.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/mbui/out/core-target*/native/shell-apple
          key: shell-apple-target-ios-arm64-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
          # (or from a Cargo.lock before it: cargo builds again only the crates it changed, the rest as they were.
          # Keyed by the lock alone, a lock's change built all from nothing, 331 s of the macOS app's, bef99112's iroh)
          restore-keys: |
            shell-apple-target-ios-arm64-${{ hashFiles('client/Cargo.lock') }}-
            shell-apple-target-ios-arm64-
      - name: The iOS app for a device, as an .ipa
        run: |
          APP=stillfail MBUI_IOS_SDK=iphoneos MBUI_IOS_ID=fail.still.mbui EMBER=$PWD bash apps/mbui/scripts/ios.sh build
          cd apps/mbui/out/ios-device && rm -rf Payload *.ipa && mkdir Payload && cp -R MBUI.app Payload/
          zip -qry stillfail-mbui.ipa Payload && ls -la stillfail-mbui.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: mbui-ios-unsigned-${{ github.sha }}
          path: apps/mbui/out/ios-device/stillfail-mbui.ipa
          if-no-files-found: error
          retention-days: 14
      # (by what it holds, as the android job's)
      # (main's, when it built the shell here)
      - if: github.ref == 'refs/heads/main' && steps.shell.outputs.cache-hit != 'true' && hashFiles('apps/mbui/out/core-target*/native/shell-apple/**/libstillfail_shell.a') != ''
        uses: actions/cache/save@v4
        with:
          path: apps/mbui/out/core-target*/native/shell-apple
          key: shell-apple-target-ios-arm64-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
      - name: The cache's key, by what it holds
        if: github.ref == 'refs/heads/main'
        run: |
          sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
          echo "STORE_KEY=mbui-ios-$(sh apps/mbui/scripts/held.sh .ci/mbc-store .ci/hbc)" >> "$GITHUB_ENV"
      - if: github.ref == 'refs/heads/main' && env.STORE_KEY != steps.store.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: ${{ env.STORE_KEY }}
      - if: github.ref == 'refs/heads/main' && steps.moon.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/mbui/out/ios-device/_build
            !apps/mbui/out/ios-device/_build/**/*.mbc
          key: mbui-ios-moon-${{ github.sha }}

  windows:
    needs: what
    if: github.repository == 'AFK-surf/still.fail' && needs.what.outputs.win == 'yes'
    runs-on: windows-2025
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'production' || '' }}
    # (a push's 5 minutes; the day's run, end to end and moved over from the desktop app, 10)
    timeout-minutes: ${{ github.event_name == 'push' && 5 || 10 }}
    # (actions: the pipeline's run of this commit and its natives artifact, for the test station's natives; write: this
    # run cancelled when main's pipeline run of this commit was, below)
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    env:
      MSYS: winsymlinks:nativestrict
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
      # a branch's units kept for its next push (MBC_STORE, below the app's build cache, which is main's alone)
      MBC_STORE: ${{ github.ref != 'refs/heads/main' && format('{0}/.ci/mbc-store', github.workspace) || '' }}
      # The app run end to end (e2e/win.sh: signed in against a local still.fail, its files, a notice, its update; the
      # desktop app moved over to it, handoff.sh) once a day and when asked, never on a push: a window on a machine,
      # its browser, its notices and its installer, is no gate (2026-10-31, as asked: "这种不确定测试只定期跑，永远不阻塞
      # ci"; on a push its flow was the last ~40 s of the job, the handoff 1-2 minutes more)
      E2E: ${{ github.event_name != 'push' && '1' || '' }}
    steps:
      # Defender's real-time scan kept off what the job writes and runs: each new file and each program's first start was
      # scanned, MoonBit's 114 MB (206 MB of programs) put in in 12-25 s against 2 s for as much of the build's, 2026-10-30
      - shell: pwsh
        run: |
          $t = Get-Date
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, $env:LOCALAPPDATA, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
          "Defender kept off them in $([int]((Get-Date) - $t).TotalMilliseconds) ms"
      # the natives' keys are git's blobs: the checkout as git has it
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # (the build's number: the commits in the history)
      # Node alone first (the natives' fetch, the build's scripts): the rest of the setup (pnpm, its store) is done while
      # cl compiles the app. The image's Node, from its tool cache, put on the PATH as it is: setup-node's would print
      # npm's and yarn's versions, their first start on the runner (29-81 s of some runs, 2026-10-25, 40225325122; the
      # setup's own setup-node after it, ~0.5 s), and that start is the setup's, beside cl. setup-node when the image
      # has not that Node.
      - id: node
        run: |
          d="$(cygpath -u "$RUNNER_TOOL_CACHE")/node/$(tr -d 'v[:space:]' < .node-version)/x64"
          [ -x "$d/node.exe" ] || exit 0
          cygpath -w "$d" >> "$GITHUB_PATH"
          echo "kept=true" >> "$GITHUB_OUTPUT"
          # (the natives' keys made from here on, beside MSVC's and MoonBit's setup: Node's first start on the runner
          # is ~5 s and the keys' first look at the tree ~2, before the build could start, 2026-10-30, 40979192948)
          K=$RUNNER_TEMP/native-keys; mkdir -p "$K"
          nohup bash -c 'PATH="$1:$PATH"; k="natives-win32-x64-$(node scripts/native.ts key shell win32-x64)-$(node scripts/native.ts key engine win32-x64)" && printf %s "$k" > "$0/key"; echo $? > "$0/status"' "$K" "$d" > /dev/null 2>&1 &
      - if: steps.node.outputs.kept != 'true'
        uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - name: Tools (MSVC's link.exe for cargo, which Git Bash's /usr/bin/link shadows)
        run: |
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -m "$(dirname "$(which cl)")/link.exe")" >> "$GITHUB_ENV"
      # (the Windows engine and shell in the native cache, as a run before fetched them: a download is not every run's
      # to break off, 39431384793)
      - name: The Windows natives' keys
        id: native-keys
        run: |
          K=$RUNNER_TEMP/native-keys
          if [ -d "$K" ]; then while [ ! -f "$K/status" ]; do sleep 0.2; done; fi
          if [ "$(cat "$K/status" 2>/dev/null)" = 0 ]; then echo "key=$(cat "$K/key")" >> "$GITHUB_OUTPUT"
          else echo "key=natives-win32-x64-$(node scripts/native.ts key shell win32-x64)-$(node scripts/native.ts key engine win32-x64)" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      - name: The Windows engine and shell, prebuilt (the prebuild workflow's, when asked)
        run: |
          node scripts/native.ts fetch shell win32-x64
          node scripts/native.ts fetch engine win32-x64
      # The app's build as the last run on main left it (mbui's in apps/mbui/mbui: moon's _build, the split C and its objects, the .exe): of main's pushes that run this job, three in four leave the app's C
      # as it was (tests, docs, client/, media/; 96 of 129, 2026-10-18 to 20), and then moonc writes the same C again,
      # scripts/mbc finds every unit's object made of the same inputs (by content) and the same link made already:
      # nothing is compiled (with an mbui whose win.sh mirrors its copies and makes cl, link and lib reproducible, mbui#49:
      # the build's step ~19 s and the job ~2 min, against ~3.2, 2026-10-20). A C that changed compiles as before; nothing
      # here is taken for this commit's but by content.
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            apps/mbui/mbui/_build
            apps/mbui/mbui/out
          key: mbui-win-build-mono-${{ github.sha }}
          restore-keys: mbui-win-build-mono-
      # A branch's own units over main's build (MBC_STORE: those of its last push, by content, which main's build has
      # not): without, each push of a branch compiled all it changed against main again, presets' 277 of 480 units on
      # every push, ~55 s (2026-11-01, 41291664812). Its objects alone (some tens of MB), not the build's 160; main's
      # build is restored above for the rest. Pruned to what the run used and saved below, as the Linux jobs' are.
      - uses: actions/cache/restore@v4
        id: own
        if: github.ref != 'refs/heads/main'
        with:
          path: .ci/mbc-store
          key: mbui-win-store-b-${{ github.sha }}
          restore-keys: mbui-win-store-b-
      - run: touch "$RUNNER_TEMP/start"
      # The app (APP=stillfail) built in the background from here on: cl /O2 of its C (some 46 MB) is ~55 s on the
      # runner's four cores, and needs nothing of what the steps after it do (pnpm, the packages, the core's bytecode),
      # which were ~60 s before it, one after another (2026-10-20). "Build (APP=stillfail)" waits for it.
      - name: Build (APP=stillfail), started
        run: |
          moon version --all
          B=$RUNNER_TEMP/build; mkdir -p "$B"
          # (the app's C by LLVM's clang-cl, Visual Studio's own, not cl: cl compiled the 159 units of a change in 68 s,
          # clang on Linux's runner of the same four cores the same 159 in 22, chat-opener-groups 41250236826,
          # 2026-11-01; MSVC's link and lib all the same, scripts/mbc shim)
          # The app's win.sh selects it for both this build and its release variants, which share these objects.
          nohup bash -c 'MBUI_WIN_CORE=0 bash apps/mbui/scripts/win.sh build > "$0/log" 2>&1; echo $? > "$0/status"' "$B" > /dev/null 2>&1 &
      - uses: ./.github/actions/setup
      # core.hbc by its inputs (HBC_CACHE, scripts/core.sh hermes), as the other jobs keep it: the core's step was 12-17 s
      # of every run (~14 s of a CPU, beside cl), the core unchanged in most of them (restored on every run, saved by
      # main's when it made one: the names in it are their contents' keys)
      - uses: actions/cache/restore@v4
        id: hbc
        with:
          path: .ci/hbc
          key: mbui-win-hbc-${{ github.sha }}
          restore-keys: mbui-win-hbc-
      - name: Packages (the core's, the cloud's; the test station built)
        run: |
          # (the packages' scripts in bash, not cmd: the station's build is sh)
          export npm_config_script_shell="$(cygpath -w "$(command -v bash)")"
          # (each quiet unless it fails, then all it said: pnpm says its errors on stdout, and a run that ended 127
          # with nothing said could not be told why, fix-update-jitter 40539668024)
          quiet() { "$@" > "$RUNNER_TEMP/packages.log" 2>&1 || { c=$?; cat "$RUNNER_TEMP/packages.log"; echo "packages: $* in $PWD: exit $c"; return $c; }; }
          quiet pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          (cd client/core-ts && quiet pnpm install --frozen-lockfile --prefer-offline)
          # (the cloud and the test station: the e2e flow's alone)
          [ -n "$E2E" ] || exit 0
          (cd cloud && quiet pnpm install --frozen-lockfile --prefer-offline)
          (cd station && quiet pnpm install --frozen-lockfile --prefer-offline && quiet pnpm run build)
      # The test station's natives (e2e/win.sh: mesh and runner, win32-x64), by their keys. A change to one of them is in
      # no release yet and is built only by the pipeline's natives job (a Mac's cross-build: this machine has no zig):
      # then its end is waited for (an outside wait, its job's own state), and a branch takes what it built (its run's
      # artifact, as the pipeline's own jobs do, .github/actions/natives); main's it published to the release. None
      # missing, nothing waited for (the run of #1493 found mesh missing and failed building it here).
      - name: The test station's natives (the pipeline's natives job's, for a change to them)
        if: env.E2E == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=$(node scripts/native.ts missing mesh:win32-x64 runner:win32-x64)
          [ -n "$missing" ] || exit 0
          echo "not in the release yet: $(echo $missing); the pipeline's natives job is waited for"
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          t0=$SECONDS run=""
          # (main's: in the release, whichever run's natives job put them there. A run of main's still waiting to start
          # is cancelled by the next push's, which builds and publishes the same natives: 91434fca's was, and this step
          # waited for it until its 6 minutes ran out, the next one's in the release 2 minutes before, 40642483751.)
          main() { [ "$GITHUB_REF" = refs/heads/main ]; }
          while :; do
            ! main || [ -n "$(node scripts/native.ts missing mesh:win32-x64 runner:win32-x64)" ] || { echo "(in the release after $((SECONDS - t0)) s)"; break; }
            [ -n "$run" ] || run=$(api "actions/workflows/pipeline.yml/runs?head_sha=$GITHUB_SHA&per_page=1" '.workflow_runs[0].id // empty' || true)
            state=$([ -z "$run" ] || api "actions/runs/$run/jobs?per_page=100" '.jobs[] | select(.name == "natives") | "\(.status) \(.conclusion // "")"' || true)
            case "$state" in
              "completed success") break ;;
              completed*) main || { echo "::error::the pipeline's natives job ended $state (run $run)"; exit 1; } ;;
            esac
            # (main's run of this commit cancelled before its natives were published, a newer push's in its place, the
            # natives not in the release: this commit's release is the newer one's to make, as the pipeline's was. This
            # run is cancelled as that one was, not failed: 3a22a53f's waited its 6 minutes and failed, the next run's
            # natives job begun 1 minute after, 40837737154, 2026-10-29)
            if main && [ -n "$run" ] && [ "$(api "actions/runs/$run" '.status + " " + (.conclusion // "")' || true)" = "completed cancelled" ]; then
              echo "main's pipeline run of this commit was cancelled (run $run), a newer push's in its place: this run is cancelled too"
              gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
              sleep 120; exit 1
            fi
            # (3 minutes: inside the job's 5, said before the job is stopped)
            [ $((SECONDS - t0)) -lt 180 ] || { echo "::error::the pipeline's natives job not done after 3 minutes (run ${run:-not found})"; exit 1; }
            sleep 5
          done
          echo "(its natives job done after $((SECONDS - t0)) s: run $run)"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$GITHUB_SHA" -D "$RUNNER_TEMP/natives"
            echo "STILLFAIL_NATIVE_INBOX=$RUNNER_TEMP/natives" >> "$GITHUB_ENV"
          fi
      # The still.fail the e2e flow signs in against (its cloud, relay, station and chat: ~13 s of the flow's ~18, none
      # of it the app's) made while cl compiles the app and the core's bytecode is made: started as soon as the packages
      # are (the cloud's, the station's dist) and the station's natives, not after the checks below (it was ~30 s of the
      # job's ~185-215 behind them, 2026-10-28, 40638451981); the flow waits for the app (E2E_APP: "Build
      # (APP=stillfail)" says it is whole), then runs it. Waited for at the end, with the installer's put (main's), the
      # cache's save and the order of names' and the sealed values' checks beside it.
      - name: The e2e flow started (e2e/win.sh, the app waited for)
        if: env.E2E == '1'
        run: |
          E=$RUNNER_TEMP/e2e; mkdir -p "$E"
          nohup bash -c 'E2E_APP="$0/app" bash apps/mbui/e2e/win.sh > "$0/log" 2>&1; echo $? > "$0/status"' "$E" > /dev/null 2>&1 &
      - name: The core's bytecode (Hermes)
        run: |
          bash apps/mbui/scripts/win.sh core
          [ ! -d .ci/hbc ] || echo "HBC_CACHE: $(ls .ci/hbc | wc -l) files, $(du -sm .ci/hbc | cut -f1) MB"
          [ ! -d .ci/hbc ] || echo "HBC_KEY=mbui-win-hbc-$(ls .ci/hbc | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
      - name: Build (APP=stillfail)
        run: |
          B=$RUNNER_TEMP/build E=$RUNNER_TEMP/e2e; mkdir -p "$E"
          # (the e2e flow told the app is not coming, else it would wait its 10 minutes)
          trap '[ -s "$E/app" ] || echo failed > "$E/app"' EXIT
          # the installer's own program made while the app compiles (win.sh setup takes it), not beside the e2e flow
          bash apps/mbui/scripts/win.sh setup-bare
          t0=$SECONDS
          while [ ! -s "$B/status" ]; do
            [ $((SECONDS - t0)) -lt 420 ] || { echo "the build took over 7 minutes"; cat "$B/log"; exit 1; }
            sleep 1
          done
          echo "(waited $((SECONDS - t0)) s for it)"
          cat "$B/log"
          [ "$(cat "$B/status")" = 0 ] || exit 1
          bash apps/mbui/scripts/win.sh put
          echo ok > "$E/app"
          # the cache's key: the app's C by its content (a C as the restored one was is not saved again)
          d=$(sh apps/mbui/scripts/mbui.sh)
          c=$(sha256sum "$d/out/win/app/_build/native/release/build/stillfail/stillfail/stillfail.c" | cut -c1-16)
          echo "BUILD_KEY=mbui-win-build-mono-$c" >> "$GITHUB_ENV"
      # the installer (apps/mbui/windows/setup.c) made of the app as built, put into a folder of this run's, put again
      # over it, taken away (e2e/win/setup.sh: ~5 s)
      - name: The installer, installed and taken away (win.sh setup, e2e/win/setup.sh)
        run: |
          bash apps/mbui/scripts/win.sh setup
          bash apps/mbui/e2e/win/setup.sh "$(ls apps/mbui/out/setup/stillfail-setup-*.exe)"
      # (these two checks need nothing of the app's or the e2e flow's: done while the e2e flow runs, not before it)
      # the order of names the host gives the core (text.collate: src/host/win_collate.h), checked (a C program, ~2 s)
      - name: The order of names (win.sh collate)
        run: bash apps/mbui/scripts/win.sh collate
      # what still.fail's desktop app kept sealed, opened by the app built in its place (src/host/win_electron_sealed.h)
      - name: The desktop app's sealed values (win.sh sealed)
        run: bash apps/mbui/scripts/win.sh sealed
      # out before the e2e flow ends (its tests hold nothing back): signed, put, checked, then its feed, beside the
      # cache's save and the e2e flow (one after another they were ~6 + 13 + 17 s after the build, 2026-10-24,
      # 40064767331; the put mostly waiting on the network)
      - name: The Windows app's installer signed, put, checked, then its feed, started
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # its .sig, which the feed carries (the app takes a build only as it says it: docs/release-signing.md)
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          MBUI_CACHE: ${{ runner.temp }}/mbui-release
        run: |
          # (beta.sh's python3: Windows' is `python`, UTF-8 for the feed's news; its shasum -a 256: Git Bash's sha256sum,
          # without the backslash it puts before a line whose name has one, as MBUI_CACHE's D:\a\_temp: the sum taken
          # by its first field was then never the one fetched back)
          mkdir -p "$RUNNER_TEMP/bin" && printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3" && chmod +x "$RUNNER_TEMP/bin/python3"
          cat > "$RUNNER_TEMP/bin/shasum" <<'EOF'
          #!/bin/sh
          [ "$1" = -a ] && shift 2
          sha256sum "$@" | sed 's/^\\//'
          EOF
          chmod +x "$RUNNER_TEMP/bin/shasum"
          export PATH="$RUNNER_TEMP/bin:$PATH" PYTHONUTF8=1
          # (its summary lines kept beside it: this step's own summary file is done with before they come)
          Z=$RUNNER_TEMP/zip; mkdir -p "$Z"
          export GITHUB_STEP_SUMMARY="$Z/summary"
          nohup bash -c 'bash apps/mbui/scripts/beta.sh win > "$0/log" 2>&1 && bash apps/mbui/scripts/beta.sh publish win >> "$0/log" 2>&1; echo $? > "$0/status"' "$Z" > /dev/null 2>&1 &
      # main's core.hbc kept (HBC_CACHE: the newest 8, some 370 MB, its save ~45 s) while the e2e flow runs, not
      # before the app's put, which the flow waits for (it held the put back 44 s, 2026-10-28, 40642305618)
      - if: github.ref == 'refs/heads/main' && env.HBC_KEY != '' && env.HBC_KEY != steps.hbc.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .ci/hbc
          key: ${{ env.HBC_KEY }}
      # main's, saved when its C is new (a branch reads main's: its own would be its alone)
      - if: github.ref == 'refs/heads/main' && env.BUILD_KEY != steps.build-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            apps/mbui/mbui/_build
            apps/mbui/mbui/out
          key: ${{ env.BUILD_KEY }}
      - name: The branch's units, by what they hold
        if: github.ref != 'refs/heads/main'
        run: |
          sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
          echo "STORE_KEY=mbui-win-store-b-$(sh apps/mbui/scripts/held.sh .ci/mbc-store)" >> "$GITHUB_ENV"
      - if: github.ref != 'refs/heads/main' && env.STORE_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .ci/mbc-store
          key: ${{ env.STORE_KEY }}
      - name: The Windows app's installer signed, put, checked, then its feed
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          Z=$RUNNER_TEMP/zip
          node apps/mbui/scripts/waitfor.mjs --deadline 150 --what "the installer's put" --exists "$(cygpath -w "$Z/status")" > /dev/null || { cat "$Z/log"; exit 1; }
          cat "$Z/log"
          cat "$Z/summary" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "$(cat "$Z/status")" = 0 ]
      - name: Signed in against a local still.fail, then Home (e2e/win.sh)
        if: env.E2E == '1'
        run: |
          E=$RUNNER_TEMP/e2e
          node apps/mbui/scripts/waitfor.mjs --deadline 150 --what "the e2e flow" --exists "$(cygpath -w "$E/status")" > /dev/null || { cat "$E/log"; exit 1; }
          cat "$E/log"
          [ "$(cat "$E/status")" = 0 ]
      # Each desktop app still Electron's as released (the beta, the stable one), installed, moved over to this app built
      # as it by its own updater (e2e/win/handoff.sh: ~1-2 min each), for a change to what that goes by (the what job).
      # Last: it builds the app again as the desktop app, in the place the e2e flow and the installer's put take it from.
      - name: The desktop app moved over to this app by its own updater (e2e/win/handoff.sh)
        if: env.E2E == '1' && needs.what.outputs.handoff == 'yes'
        run: bash apps/mbui/e2e/win/handoff.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbui-windows-${{ github.sha }}
          # (not the core's files: a sign-in, though the local cloud's)
          path: |
            apps/mbui/out/e2e/windows/
            !apps/mbui/out/e2e/windows/core/
            apps/mbui/out/setup/*.log
            apps/mbui/out/setup/result.txt
            apps/mbui/out/handoff/*/*.log
            apps/mbui/out/handoff/*/*.txt
          if-no-files-found: warn
      # The release variants change only resources. Rebuilding one from this app's cache must reuse its C objects;
      # otherwise a release recompiles the whole app before it can publish any platform's update.
      - name: The beta Windows app reuses the app's compiled objects
        if: github.ref != 'refs/heads/main' && github.event_name == 'push' && needs.what.outputs.win_build == 'yes'
        run: |
          MBUI_VARIANT=beta MBUI_WIN_CORE=0 bash apps/mbui/scripts/win.sh build > "$RUNNER_TEMP/beta-cache.log" 2>&1 || { cat "$RUNNER_TEMP/beta-cache.log"; exit 1; }
          grep 'stillfail.c: .* of .* compiled' "$RUNNER_TEMP/beta-cache.log"
          grep -Eq 'stillfail.c: 0 of [0-9]+ compiled' "$RUNNER_TEMP/beta-cache.log" || { echo "beta build recompiled the app"; exit 1; }
