# monoid's cloud (cloud/deploy.py CLOUDS: monoid.build, its test channel monoid.zone, in the company's Cloudflare
# account), by hand: what the pipeline does not deploy there, the relay (deploying it drops every connection), its first
# deploy, or any part again. The pipeline deploys its API and static parts after still.fail's on every main run.
name: monoid
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "deploy.py's parts (relay api web web-beta admin preview share)"
        required: true
        default: "relay api web web-beta admin preview share"
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository_owner == 'AFK-surf' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the web app's build number is the commits in the history
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      # (the app's page, each of the web app's pages; contains: web and web-beta)
      - if: contains(inputs.parts, 'web')
        uses: ./.github/actions/mbui-moonbit
      - if: contains(inputs.parts, 'web')
        run: bash apps/mbui/scripts/web-app.sh
      - name: Deploy ${{ inputs.parts }} to monoid
        env:
          STILLFAIL_CLOUD: monoid
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
          STILLFAIL_ADMIN_EMAIL: ${{ secrets.STILLFAIL_ADMIN_EMAIL }}
          DEPLOY_KEYS_JSON: ${{ vars.CLOUD_MOVED == 'on' && secrets.DEPLOY_KEYS_JSON || secrets.MONOID_DEPLOY_KEYS_JSON }}
          FORWARD_SECRET: ${{ vars.CLOUD_MOVED == 'on' && secrets.CLOUD_FORWARD_SECRET || '' }}
          GUEST_GOOGLE_OAUTH_JSON: ${{ vars.CLOUD_MOVED == 'on' && secrets.GOOGLE_OAUTH_JSON || '' }}
          GOOGLE_OAUTH_JSON: ${{ secrets.MONOID_GOOGLE_OAUTH_JSON || secrets.GOOGLE_OAUTH_JSON }}
          AXIOM_JSON: ${{ secrets.AXIOM_JSON }}
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.MONOID_FCM_SERVICE_ACCOUNT_JSON }}
          APNS_JSON: ${{ secrets.MONOID_APNS_JSON }}
          FCM_SERVICE_ACCOUNT_MORE_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_MORE_JSON: ${{ secrets.APNS_JSON }}
          APPLE_JSON: ${{ secrets.APPLE_JSON }}
          REVIEW_ACCOUNTS_JSON: ${{ secrets.REVIEW_ACCOUNTS_JSON }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
        run: sh .github/deploy.sh ${{ inputs.parts }}
