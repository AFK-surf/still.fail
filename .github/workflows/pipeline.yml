# still.fail's pipeline (docs/operations.md, "CI"), on mini1's self-hosted runners (label mini1):
#   a branch: the full check (scripts/check.sh) of what it changes from main, and every part it touches built and
#             bundled (deploy.py --dry-run): evidence for its merge; nothing deployed, no secrets.
#   main:     the full check of what changed since the last deploy (the tag deployed/beta), then what changed of it goes
#             out, the API first: api, then the test channel's web app (app.youdid.wtf), admin, preview and youdid.wtf,
#             its station release (then studio's station updates to it), its Android app and its desktop app (built
#             and signed on studio, whose keychain holds the certificate).
#             Nothing goes out after a step that fails; the tag moves to the commit once all of it is out.
# Not here: the relay (deploying it drops every connection), the stable channel and its apps: ~/bin/ember-deploy and
# ~/bin/ember-promote on studio, scripts/release.sh.
name: pipeline
on:
  push:
    branches: ["**"]
  workflow_dispatch:
# Only the newest commit of a branch matters: a push stops the run before it (main's tag keeps what that one missed).
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plan:
    # Trusted repository pushes only. Never add pull_request or pull_request_target here:
    # these persistent runners have access to maintainer infrastructure.
    if: github.repository == 'AFK-surf/still.fail' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, mini1]
    outputs:
      range: ${{ steps.plan.outputs.range }}
      parts: ${{ steps.plan.outputs.parts }}
      api: ${{ steps.plan.outputs.api }}
      static: ${{ steps.plan.outputs.static }}
      relay: ${{ steps.plan.outputs.relay }}
      station: ${{ steps.plan.outputs.station }}
      android: ${{ steps.plan.outputs.android }}
      desktop: ${{ steps.plan.outputs.desktop }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, fetch-tags: true }
      - id: plan
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then base=$(git rev-parse -q --verify "refs/tags/deployed/beta^{commit}" || true)
          else base=$(git merge-base origin/main HEAD); fi
          if [ -n "$base" ]; then range="$base..$GITHUB_SHA"; changed=$(git diff --name-only "$base" "$GITHUB_SHA"); else range=all; changed=$(git ls-files); fi
          has() { printf '%s\n' "$changed" | grep -qE "$1"; }
          # Part by part, as ~/bin/ember-deploy decided them.
          static=()
          if has '^(web/|client/|package\.json$|pnpm-lock\.yaml$|cloud/(deploy\.py|build-static\.ts|wrangler\.web-beta\.jsonc)$)'; then static+=(web-beta); fi
          if has '^(web/|client/|package\.json$|pnpm-lock\.yaml$|cloud/(deploy\.py|build-static\.ts|wrangler\.admin\.jsonc)$)'; then static+=(admin); fi
          if has '^cloud/(src/preview\.ts|build-static\.ts|wrangler\.preview\.jsonc)$'; then static+=(preview); fi
          if has '^(web/src/site/|cloud/wrangler\.site-beta\.jsonc$)'; then static+=(site-beta); fi
          api=false
          if printf '%s\n' "$changed" | grep -E '^cloud/(src/|wrangler\.jsonc$|package\.json$|deploy\.py$)' | grep -qvE '^cloud/src/(relay|relay-worker|limits|preview)\.ts$'; then api=true; fi
          relay=false
          if has '^cloud/(src/(relay|relay-worker|limits|auth)\.ts|Dockerfile|relay-entrypoint\.sh|wrangler\.relay\.jsonc)$'; then relay=true; fi
          station=false
          if has '^(src/|mesh/|vendor/|client/|bin/|scripts/(release|station-bundle|linux-station)\.sh$|scripts/posthog-key\.ts$)'; then station=true; fi
          android=false
          if has '^(apps/android/|client/|web/src/viz/|scripts/release\.sh$)'; then android=true; fi
          # The desktop app carries the core, the web app and a station: any of them changed is a new app.
          desktop=false
          if has '^(apps/desktop/|client/|web/|src/|mesh/|vendor/|bin/|scripts/(release|station-bundle)\.sh$|scripts/posthog-key\.ts$)'; then desktop=true; fi
          {
            echo "range=$range"
            echo "parts=${static[*]}"
            echo "static=$([ ${#static[@]} -gt 0 ] && echo true || echo false)"
            echo "api=$api"
            echo "relay=$relay"
            echo "station=$station"
            echo "android=$android"
            echo "desktop=$desktop"
          } >> "$GITHUB_OUTPUT"
          echo "range $range ($(printf '%s\n' "$changed" | grep -c .) files): api=$api static=${static[*]:-none} station=$station android=$android desktop=$desktop relay=$relay"

  check:
    needs: plan
    runs-on: [self-hosted, mini1]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: Full check
        run: |
          range='${{ needs.plan.outputs.range }}'
          if [ "$range" = all ]; then sh scripts/check.sh all; else sh scripts/check.sh full "$range"; fi
      # A branch takes back nothing merged into main meanwhile (a squash onto a main that moved: scripts/undone.sh).
      - name: Undoes nothing on main
        if: github.ref != 'refs/heads/main'
        run: sh scripts/undone.sh "$(git merge-base HEAD origin/main)" HEAD

  # A branch: what main would deploy, built and bundled; nothing sent, no secrets.
  bundle:
    needs: [plan, check]
    if: github.ref != 'refs/heads/main' && (needs.plan.outputs.api == 'true' || needs.plan.outputs.static == 'true')
    runs-on: [self-hosted, mini1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: deploy.py --dry-run
        run: sh .github/deploy.sh --dry-run $([ '${{ needs.plan.outputs.api }}' = true ] && echo api) ${{ needs.plan.outputs.parts }}

  api:
    needs: [plan, check]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.api == 'true'
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Deploy api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_KEYS_JSON: ${{ secrets.DEPLOY_KEYS_JSON }}
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          AXIOM_JSON: ${{ secrets.AXIOM_JSON }}
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/deploy.sh api

  static:
    needs: [plan, check, api]
    # After the API (a page may need what it adds), or without it when it did not change.
    if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.static == 'true' && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the web app's build number (__BUILD__, build.json) is the commits in the history
      - uses: ./.github/actions/setup
      - name: Deploy ${{ needs.plan.outputs.parts }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/deploy.sh ${{ needs.plan.outputs.parts }}
      - name: Keep the test channel's build
        if: contains(needs.plan.outputs.parts, 'web-beta')
        # What ~/bin/ember-promote web takes to app.still.fail: the very files deployed to app.youdid.wtf.
        run: echo "$GITHUB_SHA" > "$HOME/stillfail-deploy/beta-web-commit"
      - if: contains(needs.plan.outputs.parts, 'web-beta')
        uses: actions/upload-artifact@v4
        with: { name: "cloud-web-${{ github.sha }}", path: dist/cloud-web, retention-days: 90 }

  # The test channel's station release: what a station on it updates to (studio's at once, the others when they update).
  station:
    needs: [plan, check, api]
    if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.station == 'true' && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the release's number is the commits in the history
      - uses: ./.github/actions/setup
      - name: Release the station (darwin-arm64, linux-x64, linux-arm64)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/release.sh station
      - name: studio's station takes it
        # As any station on the test channel would; handed over in place (studio's /tmp/ember-station-update.log).
        run: ssh -o BatchMode=yes studio 'env -u EMBER_DATA -u STILLFAIL_DATA STILLFAIL_CHANNEL=beta ~/.local/bin/stillfail update > /tmp/ember-station-update.log 2>&1; tail -2 /tmp/ember-station-update.log'

  # The test channel's Android app (fail.still.android.beta), on android/beta/latest.json.
  android:
    needs: [plan, check, api]
    if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.android == 'true' && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # versionCode is the commits in the history
      - uses: ./.github/actions/setup
      - name: Release the beta Android app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: sh .github/release.sh android

  # The test channel's desktop app (fail.still.desktop.beta), on desktop/stillfail-beta-mac.yml: built and signed on studio.
  desktop:
    needs: [plan, check, api]
    if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.desktop == 'true' && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Release the beta desktop app (on studio)
        run: ssh -o BatchMode=yes studio "sh -s $GITHUB_SHA" < .github/desktop-on-studio.sh

  # The changelog people read in the apps (docs/changelog.md), from main's history, once what it says is out: the
  # releases bucket's changelog.json, which still.fail cloud serves and marks bug reports fixed by.
  changelog:
    needs: [plan, check, api, static, station, android, desktop]
    # A fix in still.fail cloud counts as out as soon as it is listed: not before the API carrying it is deployed.
    if: always() && github.ref == 'refs/heads/main' && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # each entry's version is the commits up to it
      - uses: ./.github/actions/setup
      - name: Put changelog.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/changelog.ts > "$RUNNER_TEMP/changelog.json"
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null && pnpm exec wrangler r2 object put ember-releases/changelog.json --file "$RUNNER_TEMP/changelog.json" --content-type application/json --remote > /dev/null)
          echo "changelog: $(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).length)' "$RUNNER_TEMP/changelog.json") entries"

  # main, once all of it is out: the tag the next run's range starts from, and what is left to do by hand.
  done:
    needs: [plan, check, api, static, station, android, desktop]
    if: always() && github.ref == 'refs/heads/main' && needs.check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result) && contains(fromJSON('["success","skipped"]'), needs.station.result) && contains(fromJSON('["success","skipped"]'), needs.android.result) && contains(fromJSON('["success","skipped"]'), needs.desktop.result)
    runs-on: [self-hosted, mini1]
    permissions:
      contents: write # only this job updates the tag deployed/beta
    steps:
      - uses: actions/checkout@v5
      - run: |
          git tag -f deployed/beta "$GITHUB_SHA"
          # Not the repository's pre-push check (the runner's checkout has the hooks on): this run checked it all.
          git push --no-verify -f origin refs/tags/deployed/beta
      - if: needs.plan.outputs.relay == 'true'
        run: echo "::warning::the relay changed and is not deployed here, as that drops every connection. Run ~/bin/ember-deploy on studio."
