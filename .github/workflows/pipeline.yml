# still.fail's pipeline (docs/operations.md, "CI"), on AFK-surf's Linux runners and self-hosted Macs:
#   a branch: the full check (scripts/check.sh) of what it changes from main, and every part it touches built and
#             bundled (deploy.py --dry-run): evidence for its merge; nothing deployed, no secrets.
#   main:     the full check of what changed since the last deploy (the tag deployed/beta), then what changed of it goes
#             out, the API first: api, then the test channel's web app (app.youdid.wtf), admin, preview, share and youdid.wtf,
#             its station release (then studio's station updates to it), its Android app and its desktop app (built
#             and signed on the organization Mac runner with the existing certificate).
#             Nothing goes out after a step that fails; the tag moves to the commit once all of it is out.
# The native parts (scripts/native.ts: the station's mesh addon, launcher and runner, the web's iroh, Android's shell
# and engine, the desktop's dock) are prebuilt: the natives job builds those whose key the release
# native-artifacts lacks, on mini1, and on main publishes them there; every other job gets them from the release (a
# branch's: from its natives job's run artifact), so a change that is not to a native part compiles no Rust.
# Stable: the manual Publish stable workflow. Relay remains manual (deploying it drops every connection).
name: pipeline
on:
  push:
    branches: ["**"]
  workflow_dispatch:
# A branch: only its newest commit matters, a push stops the run before it. main: a run going on finishes (stopped
# halfway, with a merge every few minutes, nothing went out for an hour on 2026-10-02); pushes meanwhile wait as one
# run of the newest, which the tag deployed/beta makes carry what the ones skipped brought.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  # The native parts a branch's checks and builds use (the Linux station parts are built and published from main; the
  # Linux check's mesh addon is built on a branch that changed it).
  BRANCH_NATIVES: mesh:darwin-arm64 dock:darwin-arm64 launcher:darwin-arm64 runner:darwin-arm64 archive-rs:darwin-arm64 iroh-wasm shell engine mesh:linux-x64 mesh:win32-x64 launcher:win32-x64 runner:win32-x64 window-controls:win32-x64 notify-permission:darwin-arm64 notify-permission:win32-x64 helper:darwin-arm64
jobs:
  # What can runs on mini1; what needs Linux (the Linux check) and the small jobs (plan, the API's deploy, put, the
  # changelog, timing) on GitHub's own runners, free for a public repository, not on Blacksmith's (2026-10-15, as asked).
  # GitHub's runners were short once (Actions degraded, 2026-10-05): a job waiting for one held each run 15 minutes and
  # was cancelled, nothing released.
  plan:
    # Trusted repository pushes only. Never add pull_request or pull_request_target here:
    # deployment jobs use production secrets; local signing stays isolated.
    if: github.repository == 'AFK-surf/still.fail' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      range: ${{ steps.plan.outputs.range }}
      parts: ${{ steps.plan.outputs.parts }}
      api: ${{ steps.plan.outputs.api }}
      static: ${{ steps.plan.outputs.static }}
      relay: ${{ steps.plan.outputs.relay }}
      station: ${{ steps.plan.outputs.station }}
      android: ${{ steps.plan.outputs.android }}
      desktop: ${{ steps.plan.outputs.desktop }}
      desktop_web: ${{ steps.plan.outputs.desktop_web }}
      windows: ${{ steps.plan.outputs.windows }}
      natives: ${{ steps.natives.outputs.natives }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      # Whether the natives job has anything to do: a part this run uses that the release native-artifacts lacks (the
      # keys are the sources' hashes: scripts/native.ts). None, and it is skipped (~25 s on mini1 that everything
      # building waited for).
      - id: natives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then missing=$(node scripts/native.ts missing)
          else missing=$(node scripts/native.ts missing $BRANCH_NATIVES); fi
          echo "missing: ${missing:-none}"
          echo "natives=$([ -n "$missing" ] && echo needed || echo ready)" >> "$GITHUB_OUTPUT"
      - id: plan
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then base=$(git rev-parse -q --verify "refs/tags/deployed/beta^{commit}" || true)
          else base=$(git merge-base origin/main HEAD); fi
          if [ -n "$base" ]; then range="$base..$GITHUB_SHA"; changed=$(git diff --name-only "$base" "$GITHUB_SHA"); else range=all; changed=$(git ls-files); fi
          has() { printf '%s\n' "$changed" | grep -qE "$1"; }
          # Part by part, as ~/bin/ember-deploy decided them.
          static=()
          # A reviewed stable release gets a fresh, pinned web artifact even when only its notes changed.
          if has '^docs/releases/'; then static+=(web-beta); fi
          if has '^(web/|client/|package\.json$|pnpm-lock\.yaml$|cloud/(deploy\.py|build-static\.ts|wrangler\.web-beta\.jsonc)$)' && [ ${#static[@]} = 0 ]; then static+=(web-beta); fi
          if has '^(web/|client/|package\.json$|pnpm-lock\.yaml$|cloud/(deploy\.py|build-static\.ts|wrangler\.admin\.jsonc)$)'; then static+=(admin); fi
          if has '^cloud/(src/preview\.ts|build-static\.ts|wrangler\.preview\.jsonc)$'; then static+=(preview); fi
          # The share host's page is the web's Markdown and visualizations, its words, the iroh it binds (client/), and its headers.
          if has '^(web/|client/|package\.json$|pnpm-lock\.yaml$|cloud/(src/share\.ts|share-hosts\.ts|build-static\.ts|wrangler\.share\.jsonc|wrangler\.jsonc|deploy\.py)$)'; then static+=(share); fi
          if has '^(web/src/site/|cloud/wrangler\.site-beta\.jsonc$)'; then static+=(site-beta); fi
          api=false
          if printf '%s\n' "$changed" | grep -E '^cloud/(src/|wrangler\.jsonc$|package\.json$|deploy\.py$)' | grep -qvE '^cloud/src/(relay|relay-worker|limits|preview|share)\.ts$'; then api=true; fi
          relay=false
          if has '^cloud/(src/(relay|relay-worker|limits|auth)\.ts|Dockerfile|relay-entrypoint\.sh|wrangler\.relay\.jsonc)$'; then relay=true; fi
          station=false
          # The station in TypeScript, its native parts (vendor/: the mesh addon's iroh), the words it says, the installer
          # it carries (cloud/src/install*.ts: scripts/installers.ts).
          if has '^(station/(src|native)/|station/(package\.json|pnpm-lock\.yaml)$|vendor/|client/i18n/|bin/|scripts/(release|station-bundle)\.sh$|scripts/(posthog-key|native|installers|release-sign)\.ts$|cloud/src/(install|install-windows|i18n)\.ts$)'; then station=true; fi
          android=false
          if printf '%s\n' "$changed" | sh apps/android/carries.sh; then android=true; fi
          # The desktop app carries the core, a station and the web app. A change to the first two (its shell) is a new
          # app; to the web app alone, a web release the beta app takes without one (scripts/desktop-web.ts,
          # docs/desktop-web-updates.md): desktop=… and desktop_web=….
          eval "$(printf '%s\n' "$changed" | node scripts/desktop-web.ts plan)"
          # A branch's Windows app and its smoke run (windows-build, windows-smoke): only for what is Windows' own in it,
          # the app's code and its iroh addon (a change to the web app it carries is the Mac app's check too).
          windows=false
          if has '^(apps/desktop/|station/native/mesh/|vendor/|scripts/native\.ts$|\.github/windows-smoke\.ps1$)'; then windows=true; fi
          {
            echo "range=$range"
            echo "parts=${static[*]}"
            echo "static=$([ ${#static[@]} -gt 0 ] && echo true || echo false)"
            echo "api=$api"
            echo "relay=$relay"
            echo "station=$station"
            echo "android=$android"
            echo "desktop=$desktop"
            echo "desktop_web=$desktop_web"
            echo "windows=$windows"
          } >> "$GITHUB_OUTPUT"
          echo "range $range ($(printf '%s\n' "$changed" | grep -c .) files): api=$api static=${static[*]:-none} station=$station android=$android desktop=$desktop desktop_web=$desktop_web relay=$relay"

  # The native parts for this commit (scripts/native.ts): each one whose key the release native-artifacts lacks is
  # built here (once per key and machine: mini1's cache is shared by its runners and the checks beside this job wait
  # for a build under way rather than doing it again). main publishes them, and keeps the newest 20 of each; a branch
  # publishes nothing, and passes what it built to its other jobs as a run artifact. Seconds when none changed.
  natives:
    needs: plan
    if: needs.plan.outputs.natives == 'needed'
    runs-on: [self-hosted, quick]
    timeout-minutes: 10
    permissions:
      contents: write # the release native-artifacts' assets, on main only
    steps:
      - name: Check organization Mac capabilities
        run: |
          uname -sm
          sw_vers
          for tool in brew rustup cargo node python3; do command -v "$tool" || true; done
          if security find-identity -v -p codesigning | grep -Fq 'Apple Development: zuozijian1994@gmail.com (9C49UVFRK3)'; then
            echo 'Existing still.fail signing identity is available'
          else
            echo 'Existing still.fail signing identity needs provisioning'
          fi
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mac
      - name: Get or build the native parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            node scripts/native.ts ensure --publish
            node scripts/native.ts prune 20
          else
            # What a branch's checks and builds use (BRANCH_NATIVES).
            node scripts/native.ts ensure --outbox "$RUNNER_TEMP/natives" $BRANCH_NATIVES
          fi
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: "natives-${{ github.sha }}", path: "${{ runner.temp }}/natives", if-no-files-found: ignore, retention-days: 7 }

  # mini1-5 (label quick, on mini1 too) takes only the short jobs everything else waits on: natives (what a run's
  # builds and checks need), and main's done and station-update. Behind the builds in mini1's four, natives waited
  # 4-5 minutes, and with it every job of the run, GitHub's too (2026-10-16).
  # No job may take over 10 minutes (2026-10-16, as asked: none should; the longest, a stable Android release, ~7):
  # one that does is stuck, and on mini1 it holds one of four runners every run waits on.
  # The full check (scripts/check.sh) in two jobs: the parts that need a Mac (the station with its native parts' own
  # tests, client/'s Rust) here on mini1, the rest beside it on Linux (check-linux). In each, the steps run side by
  # side, so a part the range leaves alone costs nothing. Rust builds in targets under the job's own (setup-mac,
  # check.sh), through sccache. The native parts come from mini1's cache, the release or the natives job running beside
  # it (scripts/native.ts).
  check:
    needs: plan
    runs-on: [self-hosted, mini1]
    # Usually under 2 minutes, all of it with Rust built anew a few: a test that hangs (one waiting on what never comes,
    # up to its 10 minutes each) held one of mini1's four runners for most of an hour, and every run behind it waited
    # (2026-10-16, station/test/mesh-handover.test.ts on branches whose mesh needed a service it did not give).
    timeout-minutes: 10
    env:
      STILLFAIL_CHECK_PART: station core
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Full check (station, core)
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep -q '^.github/'; then range=all; fi
          # Its guards beside it: the stable release's selection, and (a branch) nothing merged into main taken back by
          # a squash onto a main that moved (scripts/undone.sh), and no `Changelog: none` (scripts/changelog.ts).
          python3 -m unittest discover -s .github -p 'test_stable_plan.py' > "$RUNNER_TEMP/stable.log" 2>&1 &
          stable=$!
          undone=""
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            sh scripts/undone.sh "$(git merge-base HEAD origin/main)" HEAD > "$RUNNER_TEMP/undone.log" 2>&1 &
            undone=$!
          fi
          status=0
          if [ "$range" = all ]; then sh scripts/check.sh all || status=1; else sh scripts/check.sh full "$range" || status=1; fi
          if wait $stable; then echo "· stable release selection guards … ok"; else echo "· stable release selection guards … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/stable.log"; status=1; fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            if node scripts/changelog.ts --refuse "$(git merge-base HEAD origin/main)..HEAD"; then echo "· no Changelog: none … ok"; else echo "· no Changelog: none … FAILED"; status=1; fi
          fi
          if [ -n "$undone" ]; then
            if wait $undone; then echo "· undoes nothing on main … ok"; else echo "· undoes nothing on main … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/undone.log"; status=1; fi
          fi
          exit $status

  # The part of the full check that needs no Mac (ts) on a Linux runner of its own (android is mini1's, check-android),
  # so it never waits for one of mini1's (2026-10-04: a run's jobs there queued up to 4 minutes behind one
  # another) nor for each other (in one job, Gradle waited for the real-time tests before it). The native parts they
  # use come from the release or this run's natives job (mesh and iroh's relay for linux-x64, Android's shell and
  # engine); what passed before at the same inputs is kept in the Actions cache (scripts/check.sh, `remembered`).
  check-linux:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STILLFAIL_CHECK_PART: ts
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stillfail-check
          key: check-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: check-${{ runner.os }}-
      - name: Full check (ts)
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep -q '^.github/'; then range=all; fi
          if [ "$range" = all ]; then sh scripts/check.sh all; else sh scripts/check.sh full "$range"; fi

  # The web in Chrome (scripts/check.sh's browser part: its stories measured, the message list's motion watched), shared
  # out between four of GitHub's runners side by side: on one beside the Linux check it took ~3 minutes (2026-10-15);
  # the motion in two since its cases grew to over two minutes (2026-10-17).
  check-browser:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        share: ["stories 1/2", "stories 2/2", "motion 1/2", "motion 2/2"]
    env:
      STILLFAIL_CHECK_PART: browser
      STILLFAIL_BROWSER: ${{ matrix.share }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - name: Full check (browser, ${{ matrix.share }})
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep -q '^.github/'; then range=all; fi
          if [ "$range" = all ]; then sh scripts/check.sh all; else sh scripts/check.sh full "$range"; fi

  # The Android app's check on GitHub's runners (2026-10-17, as asked): on mini1, two or three of them side by side with
  # the builds took 200-230 s each (100-150 alone), 23% of its runs over budget. Here Gradle's caches are restored each
  # run (on Blacksmith's 8 cores 80-130 s, 2026-10-08).
  check-android:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Two jobs side by side: its Kotlin, unit tests and debug app; and its lint, the longest part (2026-10-17).
    strategy:
      fail-fast: false
      matrix:
        part: [build, lint]
    env:
      STILLFAIL_CHECK_PART: android
      STILLFAIL_ANDROID: ${{ matrix.part }}
      # A branch: the debug app made in the check's Gradle run (main releases its own: android).
      STILLFAIL_CHECK_APK: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with:
          android: 'true'
      - uses: ./.github/actions/natives
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stillfail-check
          key: check-android-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: check-android-${{ runner.os }}-
      # The app's build directories and Gradle's state of the project, as the last run of this branch (else main's) left
      # them: what did not change is up to date, and Kotlin compiles and lint looks at what did (a fresh checkout built
      # it all: Gradle 3-6 minutes on these four cores; kept, a change to code 2 minutes, most of it lint, 2026-10-17).
      - uses: actions/cache@v4
        with:
          path: |
            apps/android/.gradle
            apps/android/build
            apps/android/app/build
            apps/android/core/build
          key: android-${{ matrix.part }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            android-${{ matrix.part }}-${{ github.ref_name }}-
            android-${{ matrix.part }}-main-
      - name: Full check (android, ${{ matrix.part }})
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep -q '^.github/'; then range=all; fi
          if [ "$range" = all ]; then sh scripts/check.sh all; else sh scripts/check.sh full "$range"; fi

  # A branch: what main would deploy, built and bundled beside the check (not after it: the build is most of the run);
  # nothing sent, no secrets.
  bundle:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref != 'refs/heads/main' && (needs.plan.outputs.api == 'true' || needs.plan.outputs.static == 'true') }}
    # On GitHub's runners, not mini1: a dry run of half a minute that queued there behind the builds (2026-10-16).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - name: deploy.py --dry-run
        run: sh .github/deploy.sh --dry-run $([ '${{ needs.plan.outputs.api }}' = true ] && echo api) ${{ needs.plan.outputs.parts }}

  # A branch: the apps main would release, built with the prebuilt native parts (unsigned, nothing sent): the desktop
  # app and the TypeScript station's bundle (a branch's Android app is check-android's).
  mac-build:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref != 'refs/heads/main' && (needs.plan.outputs.desktop == 'true' || needs.plan.outputs.station == 'true') }}
    runs-on: [self-hosted, mini1]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: The TypeScript station's bundle (darwin-arm64)
        run: |
          pnpm install --frozen-lockfile --prefer-offline > /dev/null
          (cd station && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/station-bundle.sh "$RUNNER_TEMP/station" darwin-arm64
          du -sh "$RUNNER_TEMP/station/stillfail"
      - name: The desktop app (beta, unsigned)
        if: needs.plan.outputs.desktop == 'true'
        run: |
          (cd apps/desktop && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          UNSIGNED=1 sh apps/desktop/build.sh --beta
          ls -la apps/desktop/out/*.zip

  # The Windows app (beta, unsigned), built on mini1 beside mac-build, for windows-smoke: a branch's, when it changes
  # what is Windows' own in it (plan: windows).
  windows-build:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref != 'refs/heads/main' && needs.plan.outputs.windows == 'true' }}
    runs-on: [self-hosted, mini1]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: The desktop app for Windows (beta, unsigned)
        run: |
          pnpm install --frozen-lockfile --prefer-offline > /dev/null
          (cd apps/desktop && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh apps/desktop/build.sh --beta --win
          mkdir -p "$RUNNER_TEMP/win" && cp apps/desktop/out/*-win.exe "$RUNNER_TEMP/win/"
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-win-${{ github.sha }}", path: "${{ runner.temp }}/win", retention-days: 3 }

  # The Windows app on a Windows machine (GitHub's: neither Blacksmith nor mini1 has one), a branch's only: installed,
  # its iroh addon loaded by its Electron, started and its window photographed (.github/windows-smoke.ps1).
  windows-smoke:
    needs: [plan, windows-build]
    if: ${{ !cancelled() && needs.windows-build.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: .github }
      - uses: actions/download-artifact@v4
        with: { name: "desktop-win-${{ github.sha }}", path: "${{ runner.temp }}/win" }
      - name: Install, load, start
        shell: pwsh
        run: ./.github/windows-smoke.ps1 -Dir "$env:RUNNER_TEMP/win"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "windows-smoke-${{ github.sha }}", path: "${{ runner.temp }}/smoke", if-no-files-found: ignore, retention-days: 7 }

  api:
    needs: [plan, check, check-linux, check-browser, check-android]
    # Not on the implicit success(): a skipped job before it (natives, when nothing native changed; check-android) would
    # skip it too (2026-10-04 to 05: the API was not deployed for a day). The checks it needs passed or were not needed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.outputs.api == 'true' && needs.check.result == 'success' && needs.check-linux.result == 'success' && needs.check-browser.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.check-android.result) }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Deploy api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_KEYS_JSON: ${{ secrets.DEPLOY_KEYS_JSON }}
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          AXIOM_JSON: ${{ secrets.AXIOM_JSON }}
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APPLE_JSON: ${{ secrets.APPLE_JSON }}
          REVIEW_ACCOUNTS_JSON: ${{ secrets.REVIEW_ACCOUNTS_JSON }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/deploy.sh api

  static:
    needs: [plan, natives, check, check-linux, check-browser, check-android, api]
    # After the API (a page may need what it adds), or without it when it did not change.
    if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.static == 'true' && contains(fromJSON('["success","skipped"]'), needs.natives.result) && needs.check.result == 'success' && needs.check-linux.result == 'success' && needs.check-browser.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.check-android.result) && contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the web app's build number (__BUILD__, build.json) is the commits in the history
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Deploy ${{ needs.plan.outputs.parts }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/deploy.sh ${{ needs.plan.outputs.parts }}
      - if: contains(needs.plan.outputs.parts, 'web-beta')
        uses: actions/upload-artifact@v4
        with: { name: "cloud-web-${{ github.sha }}", path: dist/cloud-web, include-hidden-files: true, retention-days: 90 }

  # The test channel's releases are built beside the check (the builds are most of a release: before 2026-10-04 they
  # waited for the check and the API). The apps' files, named by their version, go in the bucket at once (nothing points
  # at them yet); the station's (named the same each time: what installs get) and every feed are kept as this run's
  # artifact and put by `put` once the check passed and the API is out (scripts/release-put.sh).

  # The station's (darwin-arm64, linux-x64, linux-arm64, win32-x64): what a station on the test channel updates to.
  station:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.station == 'true' }}
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the release's number is the commits in the history
      - uses: ./.github/actions/setup-mac
      - name: Build the station's release (darwin-arm64, linux-x64, linux-arm64, win32-x64)
        env:
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          MACOS_SIGNING_CERTIFICATE_B64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_B64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          # The key the release is signed with (docs/release-signing.md): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh .github/release.sh station
      - uses: actions/upload-artifact@v4
        with: { name: "release-station-${{ github.sha }}", path: "${{ runner.temp }}/release", retention-days: 7 }

  # The Android app (fail.still.android.beta), on android/beta/latest.json.
  android:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.android == 'true' }}
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # versionCode is the commits in the history
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Build and sign the beta Android app
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh .github/release.sh android
      - name: Put its files (named by its version, nothing points at them until put writes the feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with: { name: "release-android-${{ github.sha }}", path: "${{ runner.temp }}/release", retention-days: 7 }

  # The desktop app (fail.still.desktop.beta), on desktop/stillfail-beta-mac.yml: built and signed on the organization Mac.
  # Its Windows app is desktop-win's, beside it: one after the other they took ~140 s, then their 268 MB went up.
  desktop:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.desktop == 'true' }}
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Build and sign the beta desktop app on the organization Mac
        env:
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
          MACOS_SIGNING_CERTIFICATE_B64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_B64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: python3 .github/release-desktop.py --only mac --out "$RUNNER_TEMP/release"
      - name: Put its files (named by its version, nothing points at them until put writes the feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with: { name: "release-desktop-mac-${{ github.sha }}", path: "${{ runner.temp }}/release", retention-days: 7 }

  # The Windows desktop app (beta), on desktop/stillfail-beta.yml: built on the organization Mac too (build.sh --win),
  # in a runner of its own beside desktop's Mac app. Not code-signed; its installer's .sig is (docs/release-signing.md).
  desktop-win:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.desktop == 'true' }}
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Build the beta Windows desktop app and sign its installer's .sig
        env:
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          # The installer's signature (its .sig): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python3 .github/release-desktop.py --only win --out "$RUNNER_TEMP/release"
      - name: Put its files (named by its version, nothing points at them until put writes the feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with: { name: "release-desktop-win-${{ github.sha }}", path: "${{ runner.temp }}/release", retention-days: 7 }

  # The web app the beta desktop app takes without a new app (docs/desktop-web-updates.md): when the web app changed and
  # its shell did not (a change to the shell is a new app, desktop above, carrying it). The same build as the app
  # carries (build:cloud's dist/cloud-web, PostHog's key in it), packed and its feed signed (scripts/desktop-web.ts); the
  # archive, named by its version, is put at once, the feed by `put` once the check passed. On GitHub's runner: a few
  # MB, nothing to sign with Apple's keys.
  desktop-web:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.desktop_web == 'true' && needs.plan.outputs.desktop != 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # its build number, and the oldest app it works in (the last commit changing the shell)
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - name: Build, pack and sign the beta desktop app's web app
        env:
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline > /dev/null
          if [ -n "$POSTHOG_JSON" ]; then printf '%s' "$POSTHOG_JSON" > "$RUNNER_TEMP/posthog.json"; export STILLFAIL_POSTHOG="$RUNNER_TEMP/posthog.json"; fi
          node scripts/native.ts iroh-pkg > /dev/null
          (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          pnpm exec vp build --config web/vite.config.ts --mode cloud
          node scripts/desktop-web.ts pack "$RUNNER_TEMP/release" --build "$(git rev-list --count HEAD)"
      - name: Put its archive (named by its version, nothing points at it until put writes the feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with: { name: "release-desktop-web-${{ github.sha }}", path: "${{ runner.temp }}/release", retention-days: 7 }

  # What was built put in the bucket, once the check passed and the API and the web are out; nothing when a build
  # failed. Then the changelog that says so (scripts/changelog-put.sh): in this job, not one more after it.
  put:
    needs: [plan, check, check-linux, check-browser, check-android, api, static, station, android, desktop, desktop-win, desktop-web]
    if: always() && github.ref == 'refs/heads/main' && needs.check.result == 'success' && needs.check-linux.result == 'success' && needs.check-browser.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.check-android.result) && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result) && contains(fromJSON('["success","skipped"]'), needs.station.result) && contains(fromJSON('["success","skipped"]'), needs.android.result) && contains(fromJSON('["success","skipped"]'), needs.desktop.result) && contains(fromJSON('["success","skipped"]'), needs.desktop-win.result) && contains(fromJSON('["success","skipped"]'), needs.desktop-web.result) && (needs.station.result == 'success' || needs.android.result == 'success' || needs.desktop.result == 'success' || needs.desktop-web.result == 'success')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the changelog's entries are numbered by the commits up to them
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { pattern: "release-*-${{ github.sha }}", path: "${{ runner.temp }}/release", merge-multiple: true }
      - name: Put the releases (their files, then their feeds)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh "$RUNNER_TEMP/release"
      - name: Put changelog.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/changelog-put.sh
      - name: Delete old installers and beta blockmaps (scripts/release-prune.ts says which stay)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-prune.ts

  station-update:
    needs: [station, put]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.station.result == 'success' && needs.put.result == 'success'
    runs-on: [self-hosted, quick]
    timeout-minutes: 10
    steps:
      - name: studio's station takes the published release
        run: ssh -o BatchMode=yes studio 'env -u EMBER_DATA -u STILLFAIL_DATA STILLFAIL_CHANNEL=beta ~/.local/bin/stillfail update --beta > /tmp/ember-station-update.log 2>&1 && tail -2 /tmp/ember-station-update.log'

  # The changelog, when nothing was released (put, which puts it after the releases, did not run): a fix in still.fail
  # cloud counts as out as soon as it is listed, not before the API carrying it is deployed.
  changelog:
    needs: [plan, check, check-linux, check-browser, check-android, api, static, put]
    if: always() && github.ref == 'refs/heads/main' && needs.put.result == 'skipped' && needs.check.result == 'success' && needs.check-linux.result == 'success' && needs.check-browser.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.check-android.result) && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # each entry's version is the commits up to it
      - uses: ./.github/actions/setup
      - name: Put changelog.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/changelog-put.sh

  # main, once all of it is out: the tag the next run's range starts from, and what is left to do by hand.
  done:
    needs: [plan, natives, check, check-linux, check-browser, check-android, api, static, station, android, desktop, desktop-win, desktop-web, put]
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["success","skipped"]'), needs.natives.result) && needs.check.result == 'success' && needs.check-linux.result == 'success' && needs.check-browser.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.check-android.result) && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result) && contains(fromJSON('["success","skipped"]'), needs.station.result) && contains(fromJSON('["success","skipped"]'), needs.android.result) && contains(fromJSON('["success","skipped"]'), needs.put.result) && contains(fromJSON('["success","skipped"]'), needs.desktop.result) && contains(fromJSON('["success","skipped"]'), needs.desktop-win.result) && contains(fromJSON('["success","skipped"]'), needs.desktop-web.result)
    runs-on: [self-hosted, quick]
    timeout-minutes: 10
    permissions:
      contents: write # only this job updates the tag deployed/beta
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - run: |
          git tag -f deployed/beta "$GITHUB_SHA"
          # Not the repository's pre-push check (the runner's checkout has the hooks on): this run checked it all.
          # As mini1's own GitHub login, not the run's token: GitHub refuses that token a ref to a commit that changes a
          # workflow (no `workflows` permission), and a tag stuck behind such a commit stays stuck (2026-10-02, e3ae7c10).
          git push --no-verify -f "https://github.com/$GITHUB_REPOSITORY" refs/tags/deployed/beta
      - if: needs.plan.outputs.relay == 'true'
        run: echo "::warning::the relay changed and is not deployed here, as that drops every connection. Run ~/bin/ember-deploy on studio."

  # How long this run took against its budget (scripts/ci-time.ts): in the run's summary, and a warning when over. A
  # station's watch reads the same of every run and has an agent find why one went over.
  timing:
    needs: [plan, natives, check, check-linux, check-browser, check-android, bundle, mac-build, api, static, station, station-update, android, desktop, desktop-win, desktop-web, put, changelog, done]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: "scripts/ci-time.ts\n.node-version", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          node scripts/ci-time.ts "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/timing.txt" || rc=$?
          cat "$RUNNER_TEMP/timing.txt"
          { echo '```'; cat "$RUNNER_TEMP/timing.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc = 3 ]; then echo "::warning::$(head -1 "$RUNNER_TEMP/timing.txt")"; elif [ $rc != 0 ]; then exit $rc; fi
      # main: every part the plan said changed went out, or this run fails (a job skipped where it should have run went
      # unnoticed for a day: the API, 2026-10-04 to 05). Skipped is right only for a part the plan left alone, or when a
      # check before it failed (the run has failed then anyway).
      - if: github.ref == 'refs/heads/main' && needs.check.result == 'success' && needs.check-linux.result == 'success' && needs.check-browser.result == 'success'
        run: |
          missed=""
          planned() { [ "$1" = true ] && [ "$2" = skipped ] && missed="$missed $3"; return 0; }
          planned '${{ needs.plan.outputs.api }}' '${{ needs.api.result }}' api
          planned '${{ needs.plan.outputs.static }}' '${{ needs.static.result }}' static
          planned '${{ needs.plan.outputs.station }}' '${{ needs.station.result }}' station
          planned '${{ needs.plan.outputs.android }}' '${{ needs.android.result }}' android
          planned '${{ needs.plan.outputs.desktop }}' '${{ needs.desktop.result }}' desktop
          planned '${{ needs.plan.outputs.desktop }}' '${{ needs.desktop-win.result }}' desktop-win
          [ '${{ needs.plan.outputs.desktop }}' = true ] || planned '${{ needs.plan.outputs.desktop_web }}' '${{ needs.desktop-web.result }}' desktop-web
          if [ -n "$missed" ]; then echo "::error::changed, planned, and not released:$missed"; exit 1; fi
          echo "every planned part went out"
