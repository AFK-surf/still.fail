# still.fail's pipeline (docs/operations.md, "CI"), on AFK-surf's Linux runners and self-hosted Macs:
#   a branch: the full check (scripts/check.sh) of what it changes from main, and every part it touches built and
#             bundled (deploy.py --dry-run): evidence for its merge; nothing deployed, no secrets.
#   main:     the full check of what changed since the last deploy (the tag deployed/beta), then what changed of it goes
#             out, the API first: api, then the test channel's web app (app.youdid.wtf), admin, preview, share and youdid.wtf,
#             its station release (then studio's station updates to it), its Android app and its desktop app (built
#             and signed on the organization Mac runner with the existing certificate).
#             Nothing goes out after a step that fails; the tag moves to the commit once all of it is out.
# The native parts (scripts/native.ts: the station's mesh addon, launcher and runner, the web's iroh, Android's shell
# and engine, the media service's ffmpeg) are prebuilt: the natives job builds those whose key the release
# native-artifacts lacks, on mini1, and on main publishes them there; every other job gets them from the release (a
# branch's: from its natives job's run artifact), so a change that is not to a native part compiles no Rust. The mbui
# app's Windows shell and engine are prebuilt on a development Mac instead (node scripts/native.ts prebuild: cross-built,
# put in the releases bucket by their keys) and never built here: windows-natives fetches them and runs the shell's tests.
# Stable: the manual Publish stable workflow. Relay remains manual (deploying it drops every connection).
name: pipeline
on:
  push:
    branches: ["**"]
  workflow_dispatch:
# A branch: only its newest commit matters, a push stops the run before it. main: a run going on finishes (stopped
# halfway, with a merge every few minutes, nothing went out for an hour on 2026-10-02); pushes meanwhile wait as one
# run of the newest, which the tag deployed/beta makes carry what the ones skipped brought.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  # The native parts a branch's checks and builds use (the Linux station parts are built and published from main; the
  # Linux check's mesh addon is built on a branch that changed it). ffmpeg, all three, on a branch that changed
  # scripts/ffmpeg.ts: nothing on a branch runs it, but its build there is the evidence for the merge; so the Apple shell
  # (shell-apple), the macOS one, on a branch that changed it (#1365 went to main untried and failed there).
  BRANCH_NATIVES: mesh:darwin-arm64 launcher:darwin-arm64 runner:darwin-arm64 archive-rs:darwin-arm64 iroh-wasm shell shell-apple:darwin-arm64 engine mesh:linux-x64 mesh:win32-x64 launcher:win32-x64 runner:win32-x64 screen:win32-x64 helper:darwin-arm64 ffmpeg:darwin-arm64 ffmpeg:linux-x64 ffmpeg:linux-arm64
jobs:
  # What can runs on mini1; what needs Linux (the Linux check) and the small jobs (plan, the API's deploy, put, the
  # changelog, timing) on GitHub's own runners, free for a public repository, not on Blacksmith's (2026-10-15, as asked).
  # GitHub's runners were short once (Actions degraded, 2026-10-05): a job waiting for one held each run 15 minutes and
  # was cancelled, nothing released.
  plan:
    # Trusted repository pushes only. Never add pull_request or pull_request_target here:
    # deployment jobs use production secrets; local signing stays isolated.
    if: github.repository == 'AFK-surf/still.fail' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      range: ${{ steps.plan.outputs.range }}
      parts: ${{ steps.plan.outputs.parts }}
      api: ${{ steps.plan.outputs.api }}
      static: ${{ steps.plan.outputs.static }}
      relay: ${{ steps.plan.outputs.relay }}
      station: ${{ steps.plan.outputs.station }}
      modules: ${{ steps.plan.outputs.modules }}
      android_beta: ${{ steps.plan.outputs.android_beta }}
      mac_beta: ${{ steps.plan.outputs.mac_beta }}
      win_beta: ${{ steps.plan.outputs.win_beta }}
      natives: ${{ steps.natives.outputs.natives }}
      windows_natives: ${{ steps.plan.outputs.windows_natives }}
      mbui: ${{ steps.plan.outputs.mbui }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, fetch-tags: true, filter: "blob:none" } # (the history's commits and trees: the range, the paths it changed; a blob read is fetched then)
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      # Whether the natives job has anything to do: a part this run uses that the release native-artifacts lacks (the
      # keys are the sources' hashes: scripts/native.ts). None, and it is skipped (~25 s on mini1 that everything
      # building waited for).
      - id: natives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then missing=$(node scripts/native.ts missing)
          else missing=$(node scripts/native.ts missing $BRANCH_NATIVES); fi
          echo "missing: ${missing:-none}"
          echo "natives=$([ -n "$missing" ] && echo needed || echo ready)" >> "$GITHUB_OUTPUT"
      - id: plan
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then base=$(git rev-parse -q --verify "refs/tags/deployed/beta^{commit}" || true)
          else base=$(git merge-base origin/main HEAD); fi
          if [ -n "$base" ]; then range="$base..$GITHUB_SHA"; changed=$(git diff --name-only "$base" "$GITHUB_SHA"); else range=all; changed=$(git ls-files); fi
          has() { printf '%s\n' "$changed" | grep -qE "$1"; }
          # Part by part, as ~/bin/ember-deploy decided them.
          static=()
          # A reviewed stable release gets a fresh, pinned web artifact even when only its notes changed.
          if has '^docs/releases/'; then static+=(web-beta); fi
          if has '^(web/|client/|package\.json$|pnpm-lock\.yaml$|cloud/(deploy\.py|build-static\.ts|wrangler\.web-beta\.jsonc)$)' && [ ${#static[@]} = 0 ]; then static+=(web-beta); fi
          if has '^(web/|client/|package\.json$|pnpm-lock\.yaml$|cloud/(deploy\.py|build-static\.ts|wrangler\.admin\.jsonc)$)'; then static+=(admin); fi
          if has '^cloud/(src/preview\.ts|build-static\.ts|wrangler\.preview\.jsonc)$'; then static+=(preview); fi
          # The share host's page is the web's Markdown and visualizations, its words, the iroh it binds (client/), and its headers.
          if has '^(web/|client/|package\.json$|pnpm-lock\.yaml$|cloud/(src/share\.ts|share-hosts\.ts|build-static\.ts|wrangler\.share\.jsonc|wrangler\.jsonc|deploy\.py)$)'; then static+=(share); fi
          if has '^(web/src/site/|cloud/wrangler\.site-beta\.jsonc$)'; then static+=(site-beta); fi
          api=false
          if printf '%s\n' "$changed" | grep -E '^cloud/(src/|wrangler\.jsonc$|package\.json$|deploy\.py$)' | grep -qvE '^cloud/src/(relay|relay-worker|limits|preview|share)\.ts$'; then api=true; fi
          relay=false
          if has '^cloud/(src/(relay|relay-worker|limits|auth)\.ts|Dockerfile|relay-entrypoint\.sh|wrangler\.relay\.jsonc)$'; then relay=true; fi
          station=false
          # The station in TypeScript, its native parts (vendor/: the mesh addon's iroh), the words it says, the installer
          # it carries (cloud/src/install*.ts: scripts/installers.ts).
          if has '^(station/(src|native)/|station/(package\.json|pnpm-lock\.yaml)$|vendor/|client/i18n/|bin/|scripts/(release|station-bundle)\.sh$|scripts/(posthog-key|native|installers|release-sign)\.ts$|cloud/src/(install|install-windows|i18n)\.ts$)'; then station=true; fi
          # The modules' packages (scripts/module-bundle.ts): what one packs (its module.json says), or how they are packed
          # and signed: modules=….
          eval "$(printf '%s\n' "$changed" | node scripts/module-bundle.ts plan)"
          # The beta Android app: mbui's in the Kotlin one's place (scripts/release.sh --beta android), released for a
          # change to what apps/mbui's beta is made of (scripts/beta.sh APP_SRC: its code, mbui's with its Android host's
          # Java, the client's, media's, vendor's), or to how it is released.
          android_beta=false
          if has '^(apps/mbui/(src|core|android|ios|engine)/|apps/mbui/mbui/(src|android)/|apps/mbui/(mbui/)?moon\.(mod|work)$|client/|media/|vendor/|scripts/(release\.sh|native\.ts)$|\.github/release\.sh$|apps/mbui/scripts/(beta|android|android-core|core)\.sh$)'; then android_beta=true; fi
          # The beta Mac app: mbui's in the Electron one's place (scripts/release.sh --beta desktop), released, as the
          # Android one, for a change to what apps/mbui's Mac app is made of (its code, mbui's with its Mac host, the
          # client's, media's, vendor's) or to how it is built and released.
          mac_beta=false
          if has '^(apps/mbui/(src|core|engine)/|apps/mbui/mbui/src/|apps/mbui/(mbui/)?moon\.(mod|work)$|client/|media/|vendor/|scripts/(release|mac-feeds)\.sh$|scripts/native\.ts$|\.github/(release-desktop|mac_signing)\.py$|apps/mbui/scripts/(beta|mac-app|mac|core)\.sh$|apps/mbui/scripts/mac-icon\.swift$)'; then mac_beta=true; fi
          # The beta Windows app: mbui's in the Electron one's place (scripts/release.sh --beta desktop-win), released, as
          # the Mac one, for a change to what apps/mbui's Windows app is made of (its code, mbui's with its Windows host,
          # its installer, the client's, media's, vendor's) or to how it is built and released.
          win_beta=false
          if has '^(apps/mbui/(src|core|engine|windows)/|apps/mbui/mbui/src/|apps/mbui/(mbui/)?moon\.(mod|work)$|client/|media/|vendor/|scripts/(release|win-feeds)\.sh$|scripts/native\.ts$|apps/mbui/scripts/(win|core)\.sh$|apps/mbui/mbui/scripts/win\.sh$|apps/mbui/scripts/mac-icon\.swift$)'; then win_beta=true; fi
          # The mbui app's Windows shell and engine, prebuilt: fetched and the shell's tests run (windows-natives), for a
          # change to what they are made of.
          windows_natives=false
          if has '^(client/shell/|client/Cargo\.(toml|lock)$|vendor/|apps/mbui/engine/|scripts/native\.ts$)'; then windows_natives=true; fi
          # The mbui app's own tests (check-mbui, mbui-check.yml; main's run there on their own): for a change to it, or
          # to mbui (apps/mbui/mbui).
          mbui=false
          if has '^apps/mbui/' || has '^\.github/workflows/mbui-check\.yml$'; then mbui=true; fi
          # The web in Chrome (check-browser): for a change to the web or its browser tests (scripts/check.sh's browser
          # part says which exactly), or to the workflows (the job checks everything then). None, and its eight runners
          # are not started: each fetched pnpm's 280 MB store and did nothing, 2.2 GB of a push's 4 GB of the Actions
          # cache's downloads, whose account limit GitHub slows them by (mbui-only branches, login-flow-look 41162994216,
          # 2026-10-31).
          browser=false
          if [ "$range" = all ] || has '^(web/|test/browser/)' || printf '%s\n' "$changed" | grep '^\.github/' | grep -qv '^\.github/workflows/mbui[.-]'; then browser=true; fi
          {
            echo "range=$range"
            echo "parts=${static[*]}"
            echo "static=$([ ${#static[@]} -gt 0 ] && echo true || echo false)"
            echo "api=$api"
            echo "relay=$relay"
            echo "station=$station"
            echo "modules=$modules"
            echo "android_beta=$android_beta"
            echo "mac_beta=$mac_beta"
            echo "win_beta=$win_beta"
            echo "windows_natives=$windows_natives"
            echo "mbui=$mbui"
            echo "browser=$browser"
          } >> "$GITHUB_OUTPUT"
          echo "range $range ($(printf '%s\n' "$changed" | grep -c .) files): api=$api static=${static[*]:-none} station=$station modules=$modules android_beta=$android_beta mac_beta=$mac_beta win_beta=$win_beta relay=$relay mbui=$mbui browser=$browser"

  # The native parts for this commit (scripts/native.ts): each one whose key the release native-artifacts lacks is
  # built here (once per key and machine: mini1's cache is shared by its runners and the checks beside this job wait
  # for a build under way rather than doing it again). main publishes them, and keeps the newest 20 of each; a branch
  # publishes nothing, and passes what it built to its other jobs as a run artifact. Seconds when none changed.
  natives:
    needs: plan
    if: needs.plan.outputs.natives == 'needed'
    runs-on: [self-hosted, quick]
    timeout-minutes: 10
    permissions:
      contents: write # the release native-artifacts' assets, on main only
    steps:
      - name: Check organization Mac capabilities
        run: |
          uname -sm
          sw_vers
          for tool in brew rustup cargo node python3; do command -v "$tool" || true; done
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mac
      - name: Get or build the native parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            node scripts/native.ts ensure --publish
            node scripts/native.ts prune 20
          else
            # What a branch's checks and builds use (BRANCH_NATIVES).
            node scripts/native.ts ensure --outbox "$RUNNER_TEMP/natives" $BRANCH_NATIVES
          fi
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with: { name: "natives-${{ github.sha }}", path: "${{ runner.temp }}/natives", if-no-files-found: ignore, retention-days: 7 }

  # The mbui app's Windows shell and engine (scripts/native.ts `msvc`) are prebuilt, by the prebuild workflow when asked
  # (.github/workflows/prebuild.yml) or on a Mac, and fetched by their keys; nothing else builds them. Here, on GitHub's
  # Windows (no runner of ours is), for a change to what they are made of: both fetched (a key not there fails, saying
  # to run the prebuild workflow), and the shell's tests, built with it, run where it runs.
  windows-natives:
    needs: plan
    if: needs.plan.outputs.windows_natives == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # the keys are git's blobs: the checkout as git has it
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      # (the Windows engine and shell in the native cache, as a run before fetched them: a download is not every run's
      # to break off, 39431384793)
      - name: The Windows natives' keys
        id: native-keys
        run: echo "key=natives-win32-x64-$(node scripts/native.ts key shell win32-x64)-$(node scripts/native.ts key engine win32-x64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      - name: The Windows engine and shell, prebuilt; the shell's tests
        run: |
          node scripts/native.ts fetch engine win32-x64
          shell=$(node scripts/native.ts fetch shell win32-x64)
          for t in "$shell"/tests/*.exe; do echo "== $(basename "$t")"; "$t" --test-threads=2 || exit 1; done

  # The desktop's accessibility trees on Windows (station/test/ui-live.test.ts): the agent-desktop.exe a Windows station
  # carries (the native part agent-desktop) driving Notepad through the agents' computer tool, on GitHub's Windows,
  # whose runner has a signed-in person's session as a station's machine does. For a change to the station.
  ui-windows:
    needs: plan
    if: needs.plan.outputs.station == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # (the natives' keys are git's blobs: the checkout as git has it)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Notepad driven by its tree
        run: |
          (cd station && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          export STILLFAIL_AGENT_DESKTOP="$(node scripts/native.ts file agent-desktop win32-x64)"
          cd station && STILLFAIL_UI_LIVE=1 node --test --test-timeout=120000 test/ui-live.test.ts

  # main: the prebuilt Windows natives in the releases bucket's natives/ (what `prebuild --release` put in the release
  # native-artifacts, the prebuild workflow's or a Mac's, copied over: nothing is built here), once the API (which serves
  # natives/) is out. Seconds when the store has them.
  natives-store:
    needs: [plan, api]
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Copy what the store lacks from the release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/native.ts store-sync

  # mini1-5 (label quick, on mini1 too) takes only the short jobs everything else waits on: natives (what a run's
  # builds and checks need), and main's done and station-update. Behind the builds in mini1's four, natives waited
  # 4-5 minutes, and with it every job of the run, GitHub's too (2026-10-16).
  # No job may take over 10 minutes (2026-10-16, as asked: none should; the longest, a stable Android release, ~7):
  # one that does is stuck, and on mini1 it holds one of four runners every run waits on.
  # The full check (scripts/check.sh) in two jobs: the parts that need a Mac (the station with its native parts' own
  # tests, client/'s Rust) here on mini1, the rest beside it on Linux (check-linux). In each, the steps run side by
  # side, so a part the range leaves alone costs nothing. Rust builds in targets under the job's own (setup-mac,
  # check.sh), through sccache. The native parts come from mini1's cache, the release or the natives job running beside
  # it (scripts/native.ts).
  check:
    needs: plan
    runs-on: [self-hosted, mini1]
    # Usually under 2 minutes, all of it with Rust built anew a few: a test that hangs (one waiting on what never comes,
    # up to its 10 minutes each) held one of mini1's four runners for most of an hour, and every run behind it waited
    # (2026-10-16, station/test/mesh-handover.test.ts on branches whose mesh needed a service it did not give).
    timeout-minutes: 10
    env:
      STILLFAIL_CHECK_PART: station core
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Full check (station, core)
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep '^\.github/' | grep -qv '^\.github/workflows/mbui[.-]'; then range=all; fi
          # Its guards beside it: the stable release's selection, and (a branch) nothing merged into main taken back by
          # a squash onto a main that moved (scripts/undone.sh), and the changelog's trailers (scripts/changelog.ts: no
          # `Changelog: none`, the parts said).
          python3 -m unittest discover -s .github -p 'test_stable_plan.py' > "$RUNNER_TEMP/stable.log" 2>&1 &
          stable=$!
          undone=""
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            sh scripts/undone.sh "$(git merge-base HEAD origin/main)" HEAD > "$RUNNER_TEMP/undone.log" 2>&1 &
            undone=$!
          fi
          status=0
          if [ "$range" = all ]; then sh scripts/check.sh all || status=1; else sh scripts/check.sh full "$range" || status=1; fi
          if wait $stable; then echo "· stable release selection guards … ok"; else echo "· stable release selection guards … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/stable.log"; status=1; fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            if node scripts/changelog.ts --refuse "$(git merge-base HEAD origin/main)..HEAD"; then echo "· changelog trailers … ok"; else echo "· changelog trailers … FAILED"; status=1; fi
          fi
          if [ -n "$undone" ]; then
            if wait $undone; then echo "· undoes nothing on main … ok"; else echo "· undoes nothing on main … FAILED"; sed 's/^/    /' "$RUNNER_TEMP/undone.log"; status=1; fi
          fi
          exit $status

  # The part of the full check that needs no Mac (ts) on a Linux runner of its own,
  # so it never waits for one of mini1's (2026-10-04: a run's jobs there queued up to 4 minutes behind one
  # another) nor for each other (in one job, Gradle waited for the real-time tests before it). The native parts they
  # use come from the release or this run's natives job (mesh and iroh's relay for linux-x64, Android's shell and
  # engine); what passed before at the same inputs is kept in the Actions cache (scripts/check.sh, `remembered`).
  check-linux:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STILLFAIL_CHECK_PART: ts
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/setup
      # (MoonBit for the icons' tool, apps/mbui/tools/icons, when design/icons or what it writes changed)
      - uses: ./.github/actions/mbui-moonbit
      - uses: ./.github/actions/natives
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stillfail-check
          key: check-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: check-${{ runner.os }}-
      - name: Full check (ts)
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep '^\.github/' | grep -qv '^\.github/workflows/mbui[.-]'; then range=all; fi
          if [ "$range" = all ]; then sh scripts/check.sh all; else sh scripts/check.sh full "$range"; fi

  # The mbui app's check and tests, on native, on Linux: mbui-check.yml, main's there on its own.
  check-mbui:
    needs: plan
    if: ${{ !cancelled() && !failure() && github.ref != 'refs/heads/main' && needs.plan.outputs.mbui == 'true' }}
    uses: ./.github/workflows/mbui-check.yml

  # The web in Chrome (scripts/check.sh's browser part: its stories measured, the message list's motion watched), shared
  # out between eight of GitHub's runners side by side: on one beside the Linux check it took ~3 minutes (2026-10-15);
  # the motion in two since its cases grew to over two minutes (2026-10-17); the stories in five since a share of three
  # was 131-151 s, the pipeline's longest once mbui's app part was on four runners (models-density, 40431110522, 2026-10-27). The motion in
  # three since its last share (the list's half and the viewer's and the drive's cases after it) was 134 s, the longest
  # then (sync-tick-draw, 40559708530).
  check-browser:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        share: ["stories 1/5", "stories 2/5", "stories 3/5", "stories 4/5", "stories 5/5", "motion 1/3", "motion 2/3", "motion 3/3"]
    env:
      STILLFAIL_CHECK_PART: browser
      STILLFAIL_BROWSER: ${{ matrix.share }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - name: Full check (browser, ${{ matrix.share }})
        run: |
          range='${{ needs.plan.outputs.range }}'
          if git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | grep '^\.github/' | grep -qv '^\.github/workflows/mbui[.-]'; then range=all; fi
          if [ "$range" = all ]; then sh scripts/check.sh all; else sh scripts/check.sh full "$range"; fi

  # A branch: what main would deploy, built and bundled beside the check (not after it: the build is most of the run);
  # nothing sent, no secrets.
  bundle:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref != 'refs/heads/main' && (needs.plan.outputs.api == 'true' || needs.plan.outputs.static == 'true') }}
    # On GitHub's runners, not mini1: a dry run of half a minute that queued there behind the builds (2026-10-16).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - name: deploy.py --dry-run
        run: sh .github/deploy.sh --dry-run $([ '${{ needs.plan.outputs.api }}' = true ] && echo api) ${{ needs.plan.outputs.parts }}

  # A branch: the TypeScript station's bundle main would release, built with the prebuilt native parts (unsigned,
  # nothing sent). On GitHub's macos-15 (free for a public repository): unsigned, it needs nothing of Mini1's (main's
  # signed builds stay there, with its keychain). (The apps are mbui's: their builds are mbui.yml's and mbui-host-mac's.)
  mac-build:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref != 'refs/heads/main' && needs.plan.outputs.station == 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      - name: The TypeScript station's bundle (darwin-arm64)
        run: |
          pnpm install --frozen-lockfile --prefer-offline > /dev/null
          (cd station && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/station-bundle.sh "$RUNNER_TEMP/station" darwin-arm64
          du -sh "$RUNNER_TEMP/station/stillfail"

  # A branch: the one check main's protection requires (2026-10-20, asked: "main 开保护"; an admin may merge past it,
  # 2026-10-22): every job a branch runs, one skipped as passing, one failed or cancelled failing it. Its list
  # is the branch's jobs: a job added to them goes here too, or the protection does not wait for it.
  gate:
    needs: [plan, natives, windows-natives, ui-windows, check, check-linux, check-mbui, check-browser, bundle, mac-build]
    if: always() && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::a branch job failed or was cancelled: main's protection keeps this branch out"
            exit 1
          fi

  # The API and the web wait for the checks of what they are made of, not the Android app's (2026-10-17, as asked: its
  # lint on GitHub's runners held a release's web back for minutes); the apps' releases (put) wait for all.
  api:
    needs: [plan, check, check-linux, check-browser]
    # Not on the implicit success(): a skipped job before it (natives, when nothing native changed) would
    # skip it too (2026-10-04 to 05: the API was not deployed for a day). The checks it needs passed or were not needed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.outputs.api == 'true' && needs.check.result == 'success' && needs.check-linux.result == 'success' && (needs.check-browser.result == 'success' || (needs.check-browser.result == 'skipped' && needs.plan.outputs.browser != 'true')) }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Deploy api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_KEYS_JSON: ${{ secrets.DEPLOY_KEYS_JSON }}
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          AXIOM_JSON: ${{ secrets.AXIOM_JSON }}
          VAPID_JSON: ${{ secrets.VAPID_JSON }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_JSON: ${{ secrets.APNS_JSON }}
          APPLE_JSON: ${{ secrets.APPLE_JSON }}
          REVIEW_ACCOUNTS_JSON: ${{ secrets.REVIEW_ACCOUNTS_JSON }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/deploy.sh api

  static:
    needs: [plan, natives, check, check-linux, check-browser, api]
    # After the API (a page may need what it adds), or without it when it did not change.
    if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.static == 'true' && contains(fromJSON('["success","skipped"]'), needs.natives.result) && needs.check.result == 'success' && needs.check-linux.result == 'success' && (needs.check-browser.result == 'success' || (needs.check-browser.result == 'skipped' && needs.plan.outputs.browser != 'true')) && contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: [self-hosted, mini1]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the web app's build number (__BUILD__, build.json) is the commits in the history
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Deploy ${{ needs.plan.outputs.parts }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/deploy.sh ${{ needs.plan.outputs.parts }}
      - if: contains(needs.plan.outputs.parts, 'web-beta')
        uses: actions/upload-artifact@v4
        with: { name: "cloud-web-${{ github.sha }}", path: dist/cloud-web, include-hidden-files: true, retention-days: 90 }

  # The test channel's releases are built beside the check (the builds are most of a release: before 2026-10-04 they
  # waited for the check and the API). The apps' files, named by their version, go in the bucket at once (nothing points
  # at them yet); the station's (named the same each time: what installs get) go in at once under staged/, and with
  # every feed they are put by `put` once the check passed and the API is out (scripts/release-put.sh).

  # The station's (darwin-arm64, linux-x64, linux-arm64, win32-x64): what a station on the test channel updates to.
  station:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.station == 'true' }}
    runs-on: [self-hosted, mini1]
    outputs:
      hand: ${{ steps.hand.outputs.key }}
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # the release's number is the commits in the history
      - uses: ./.github/actions/setup-mac
      - name: Build the station's release (darwin-arm64, linux-x64, linux-arm64, win32-x64)
        env:
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          # AFK's Developer ID and notary profile (.github/mac_signing.py).
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
          # The key the release is signed with (docs/release-signing.md): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh .github/release.sh station
      # Its files into the bucket from here, staged (scripts/release-put.sh --stage): put takes them back. In the run
      # artifact they went up through the proxy mini1's DNS sends GitHub to, 40 MB a release (2026-10-23).
      - name: Stage its files in the bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/release-put.sh --stage "$RUNNER_TEMP/release"
      # (handed to put through the bucket, not a run artifact: scripts/release-put.sh --hand)
      - id: hand
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          sh scripts/release-put.sh --hand "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/hand.out"
          echo "key=$(tail -1 "$RUNNER_TEMP/hand.out")" >> "$GITHUB_OUTPUT"

  # The Android app (fail.still.android.beta: mbui's, apps/mbui, in the place of the Kotlin one), on android/beta/latest.json.
  android:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.android_beta == 'true' }}
    runs-on: [self-hosted, mini1]
    outputs:
      hand: ${{ steps.hand.outputs.key }}
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # versionCode is the commits in the history
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Build and sign the beta Android app
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh .github/release.sh android
      - name: Put its files (named by its version, nothing points at them until put writes the feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      # (handed to put through the bucket, not a run artifact: scripts/release-put.sh --hand)
      - id: hand
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          sh scripts/release-put.sh --hand "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/hand.out"
          echo "key=$(tail -1 "$RUNNER_TEMP/hand.out")" >> "$GITHUB_OUTPUT"

  # The Mac app (fail.still.desktop.beta: mbui's, apps/mbui, in the Electron app's place), on mac/beta/latest.json and
  # desktop/stillfail-beta-mac.yml (which moves an installed Electron beta over): built, signed and notarized on the
  # organization Mac, warm in a cache of its own there (scripts/release.sh desktop). The beta Windows app, mbui's too, is
  # desktop-win's.
  desktop:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.mac_beta == 'true' }}
    runs-on: [self-hosted, mini1]
    outputs:
      hand: ${{ steps.hand.outputs.key }}
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # its build is the commits in the history
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Build, sign and notarize the beta Mac app on the organization Mac
        env:
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          # AFK's Developer ID and notary profile (.github/mac_signing.py).
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
        run: python3 .github/release-desktop.py --out "$RUNNER_TEMP/release"
      - name: Put its files (named by its version, nothing points at them until put writes the feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      # (handed to put through the bucket, not a run artifact: scripts/release-put.sh --hand)
      - id: hand
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          sh scripts/release-put.sh --hand "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/hand.out"
          echo "key=$(tail -1 "$RUNNER_TEMP/hand.out")" >> "$GITHUB_OUTPUT"

  # The beta Windows app (fail.still.desktop.beta: mbui's, apps/mbui, in the Electron app's place, as the Mac one), on
  # win/beta/latest.json and desktop/stillfail-beta.yml (which moves an installed Electron beta over): built on GitHub's
  # Windows runner as mbui.yml's windows job builds still.fail mbui, from main's build as that job left it in the Actions
  # cache (what is the same is not compiled again: mbui's scripts/mbc), packed in its installer (windows/setup.c) and
  # signed: its .sig (docs/release-signing.md), which the Electron app and mbui's core check; not code-signed. The stable
  # one is built the same way (stable.yml).
  desktop-win:
    needs: [plan]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.win_beta == 'true' }}
    runs-on: windows-2025
    environment: production
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      MSYS: winsymlinks:nativestrict
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
    steps:
      # (the natives' keys are git's blobs: the checkout as git has it)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # its build is the commits in the history
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - name: The Windows natives' keys
        id: native-keys
        run: echo "key=natives-win32-x64-$(node scripts/native.ts key shell win32-x64)-$(node scripts/native.ts key engine win32-x64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      - name: The Windows engine and shell, prebuilt
        run: |
          node scripts/native.ts fetch shell win32-x64
          node scripts/native.ts fetch engine win32-x64
      # (mbui.yml's windows job saves them, main's; read here, never saved)
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/mbui/mbui/_build
            apps/mbui/mbui/out
          key: mbui-win-build-mono-${{ github.sha }}
          restore-keys: mbui-win-build-mono-
      - uses: actions/cache/restore@v4
        with:
          path: .ci/hbc
          key: mbui-win-hbc-${{ github.sha }}
          restore-keys: mbui-win-hbc-
      - name: Build, pack and sign the beta Windows app
        env:
          # The installer's signature (its .sig): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release.sh --beta desktop-win
      - name: Put its files (named by its version, nothing points at them until put writes the feeds)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with: { name: "release-desktop-win-${{ github.sha }}", path: "${{ runner.temp }}/release", retention-days: 7 }

  # The modules' packages stations install themselves (scripts/module-bundle.ts, docs/station-modules.md): when what one
  # packs changed. Each one's archive, named by its version, is put at once (one already out is checked to be the same
  # bytes: scripts/release.sh), its beta feed signed and put by `put` once the check passed. On GitHub's runner: plain
  # files, nothing of a machine's in them. After natives: a module carrying a native part (the media service's ffmpeg,
  # one archive a platform) takes the build the release native-artifacts has, which natives publishes first.
  modules:
    needs: [plan, natives]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.plan.outputs.modules == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # its version is the build of the last commit that changed what it packs
      - uses: ./.github/actions/setup
      - name: Pack and sign the modules' packages
        env:
          # The key the feeds are signed with (docs/release-signing.md): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh .github/release.sh modules
      - name: Put their archives (named by their version, nothing points at them until put writes the feeds)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with: { name: "release-modules-${{ github.sha }}", path: "${{ runner.temp }}/release", retention-days: 7 }

  # What was built put in the bucket, once the check passed and the API and the web are out; nothing when a build
  # failed. Then the changelog that says so (scripts/changelog-put.sh): in this job, not one more after it.
  put:
    needs: [plan, check, check-linux, check-browser, api, static, station, modules, android, desktop, desktop-win]
    if: always() && github.ref == 'refs/heads/main' && needs.check.result == 'success' && needs.check-linux.result == 'success' && (needs.check-browser.result == 'success' || (needs.check-browser.result == 'skipped' && needs.plan.outputs.browser != 'true')) && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result) && contains(fromJSON('["success","skipped"]'), needs.station.result) && contains(fromJSON('["success","skipped"]'), needs.modules.result) && contains(fromJSON('["success","skipped"]'), needs.android.result) && contains(fromJSON('["success","skipped"]'), needs.desktop.result) && contains(fromJSON('["success","skipped"]'), needs.desktop-win.result) && (needs.station.result == 'success' || needs.modules.result == 'success' || needs.android.result == 'success' || needs.desktop.result == 'success' || needs.desktop-win.result == 'success')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # the changelog's entries are numbered by the commits up to them
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { pattern: "release-*-${{ github.sha }}", path: "${{ runner.temp }}/release", merge-multiple: true }
      # what mini1's jobs handed through the bucket (scripts/release-put.sh --hand)
      - name: What mini1's jobs handed over
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HANDED: ${{ needs.station.outputs.hand }} ${{ needs.android.outputs.hand }} ${{ needs.desktop.outputs.hand }}
        run: |
          [ -n "$(echo $HANDED)" ] || exit 0
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          # shellcheck disable=SC2086 # names, one word each
          sh scripts/release-put.sh --unhand "$RUNNER_TEMP/release" $HANDED
      - name: Put the releases (their files, then their feeds)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release-put.sh "$RUNNER_TEMP/release"
      - name: Put changelog.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/changelog-put.sh
      - name: Delete old installers and beta blockmaps (scripts/release-prune.ts says which stay)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-prune.ts

  station-update:
    needs: [station, put]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.station.result == 'success' && needs.put.result == 'success'
    runs-on: [self-hosted, quick]
    timeout-minutes: 10
    steps:
      - name: studio's station takes the published release
        run: ssh -o BatchMode=yes studio 'env -u EMBER_DATA -u STILLFAIL_DATA STILLFAIL_CHANNEL=beta ~/.local/bin/stillfail update --beta > /tmp/ember-station-update.log 2>&1 && tail -2 /tmp/ember-station-update.log'

  # The changelog, when nothing was released (put, which puts it after the releases, did not run): a fix in still.fail
  # cloud counts as out as soon as it is listed, not before the API carrying it is deployed.
  changelog:
    needs: [plan, check, check-linux, check-browser, api, static, put]
    if: always() && github.ref == 'refs/heads/main' && needs.put.result == 'skipped' && needs.check.result == 'success' && needs.check-linux.result == 'success' && (needs.check-browser.result == 'success' || (needs.check-browser.result == 'skipped' && needs.plan.outputs.browser != 'true')) && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" } # each entry's version is the commits up to it
      - uses: ./.github/actions/setup
      - name: Put changelog.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/changelog-put.sh

  # main, once all of it is out: the tag the next run's range starts from, and what is left to do by hand.
  done:
    needs: [plan, natives, check, check-linux, check-browser, api, static, station, modules, android, desktop, desktop-win, put]
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["success","skipped"]'), needs.natives.result) && needs.check.result == 'success' && needs.check-linux.result == 'success' && (needs.check-browser.result == 'success' || (needs.check-browser.result == 'skipped' && needs.plan.outputs.browser != 'true')) && contains(fromJSON('["success","skipped"]'), needs.api.result) && contains(fromJSON('["success","skipped"]'), needs.static.result) && contains(fromJSON('["success","skipped"]'), needs.station.result) && contains(fromJSON('["success","skipped"]'), needs.modules.result) && contains(fromJSON('["success","skipped"]'), needs.android.result) && contains(fromJSON('["success","skipped"]'), needs.put.result) && contains(fromJSON('["success","skipped"]'), needs.desktop.result) && contains(fromJSON('["success","skipped"]'), needs.desktop-win.result)
    runs-on: [self-hosted, quick]
    timeout-minutes: 10
    permissions:
      contents: write # only this job updates the tag deployed/beta
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - run: |
          git tag -f deployed/beta "$GITHUB_SHA"
          # Not the repository's pre-push check (the runner's checkout has the hooks on): this run checked it all.
          # As mini1's own GitHub login, not the run's token: GitHub refuses that token a ref to a commit that changes a
          # workflow (no `workflows` permission), and a tag stuck behind such a commit stays stuck (2026-10-02, e3ae7c10).
          git push --no-verify -f "https://github.com/$GITHUB_REPOSITORY" refs/tags/deployed/beta
      - if: needs.plan.outputs.relay == 'true'
        run: echo "::warning::the relay changed and is not deployed here, as that drops every connection. Run ~/bin/ember-deploy on studio."

  # How long this run took against its budget (scripts/ci-time.ts): in the run's summary, and a warning when over. A
  # station's watch reads the same of every run and has an agent find why one went over.
  timing:
    needs: [plan, natives, check, check-linux, check-browser, bundle, mac-build, api, static, station, station-update, modules, android, desktop, desktop-win, put, changelog, done]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: "scripts/ci-time.ts\n.node-version", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          node scripts/ci-time.ts "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/timing.txt" || rc=$?
          cat "$RUNNER_TEMP/timing.txt"
          { echo '```'; cat "$RUNNER_TEMP/timing.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc = 3 ]; then echo "::warning::$(head -1 "$RUNNER_TEMP/timing.txt")"; elif [ $rc != 0 ]; then exit $rc; fi
      # main: every part the plan said changed went out, or this run fails (a job skipped where it should have run went
      # unnoticed for a day: the API, 2026-10-04 to 05). Skipped is right only for a part the plan left alone, or when a
      # check before it failed (the run has failed then anyway).
      - if: github.ref == 'refs/heads/main' && needs.check.result == 'success' && needs.check-linux.result == 'success' && (needs.check-browser.result == 'success' || (needs.check-browser.result == 'skipped' && needs.plan.outputs.browser != 'true'))
        run: |
          missed=""
          planned() { [ "$1" = true ] && [ "$2" = skipped ] && missed="$missed $3"; return 0; }
          planned '${{ needs.plan.outputs.api }}' '${{ needs.api.result }}' api
          planned '${{ needs.plan.outputs.static }}' '${{ needs.static.result }}' static
