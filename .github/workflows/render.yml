# The renderer's pixels (docs/determinism.md, "Pixel references belong to one kind of machine"): a Tester's draw list
# drawn offscreen on GitHub's macOS runner, against its reference (goldens/render/macos15-*.png) to the byte, on the
# runner image the references were made on (goldens/render/macos15.txt). The pictures drawn are the artifact: what a
# PR that changes them commits, saying which and why.
name: render
on:
  pull_request:
    paths:
      - "src/host/apple_render.m"
      - "src/host/apple_text.m"
      - "src/render/**"
      - "src/ui/drawlist.mbt"
      - "src/ui/scene.mbt"
      - "goldens/render/**"
      - "scripts/render_offscreen.sh"
      - ".github/workflows/render.yml"
  push:
    branches: [main]
    paths:
      - "src/host/apple_render.m"
      - "src/host/apple_text.m"
      - "src/render/**"
      - "src/ui/drawlist.mbt"
      - "src/ui/scene.mbt"
      - "goldens/render/**"
  workflow_dispatch:

env:
  MOON_HOME: ${{ github.workspace }}/../.moon

jobs:
  offscreen:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME=$MOON_HOME bash
          echo "$MOON_HOME/bin" >> $GITHUB_PATH
      - name: A Tester's draw list drawn offscreen (scripts/render_offscreen.sh)
        run: scripts/render_offscreen.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render
          path: out/render/
      - name: The runner's image the references were made on
        run: |
          want=$(sed -n 's/^image //p' goldens/render/macos15.txt)
          have="$ImageOS $ImageVersion"
          if [ "$want" != "$have" ]; then
            echo "the runner's image is $have, the references were made on $want: make them all again in one PR (this run's artifact), saying so"
            exit 1
          fi
      - name: Against the references, to the byte
        run: |
          if cmp -s out/render/controls.png goldens/render/macos15-controls.png; then
            echo "the same to the byte"
          else
            echo "goldens/render/macos15-controls.png: not what this runner draws now (this run's artifact has it)"
            exit 1
          fi
