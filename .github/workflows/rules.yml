# The workspace lock's rules in MoonBit (rules/): the JS committed in rules/js is what its source
# builds to (station, cloud and the core take that JS as it is), and what is proved there still proves (`moon prove`).
name: rules
on:
  push:
    branches: ["**"]
    paths:
      - "rules/**"
      - ".github/workflows/rules.yml"
      - ".github/actions/mbui-moonbit/**"
  workflow_dispatch:
concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  built:
    if: github.repository_owner == 'AFK-surf'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mbui-moonbit
      - name: rules/js is what rules/src builds to
        run: |
          sh rules/build.sh
          git diff --exit-code -- rules/js || { echo "rules/js is not what rules/src builds to: run rules/build.sh and commit it"; exit 1; }
  # What proving takes that every job's MoonBit leaves out: moonc-prove (32 MB, trimmed from the cache all jobs restore,
  # .github/workflows/mbui-moonbit.yml) and z3, pinned. Put in the Actions cache once for each MoonBit release, as
  # mbui-moonbit puts that in. (z3 by apt in each job: ~2.5 minutes of a job on a slow day, 42156739330. moon prove has
  # needed no Why3 since MoonBit 0.10.9; building it here with opam took 166 s for each release, and this step sat silent
  # until the job's limit on one, 42150487931, so the download has a limit of its own.)
  tools:
    if: github.repository_owner == 'AFK-surf'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: .github/actions }
      - uses: ./.github/actions/mbui-moonbit
      - id: key
        run: echo "key=rules-prove-z3-5.3.3-$(cat "$RUNNER_TOOL_CACHE/moon-ci.key")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: had
        with:
          path: ~/prove-tools
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.had.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/prove-tools/bin ~/release
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 https://cli.moonbitlang.com/binaries/latest/moonbit-linux-x86_64.tar.gz | tar -xz -C ~/release
          cp "$(find ~/release -name moonc-prove -type f | head -1)" ~/prove-tools/bin/
          python3 -m venv ~/prove-tools/z3
          ~/prove-tools/z3/bin/pip -q install z3-solver==5.3.3.0
      - if: steps.had.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/prove-tools
          key: ${{ steps.key.outputs.key }}
  proved:
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mbui-moonbit
      - uses: actions/cache/restore@v4
        with:
          path: ~/prove-tools
          key: ${{ needs.tools.outputs.key }}
          fail-on-cache-miss: true
      - name: what is proved still proves
        run: |
          export PATH="$HOME/prove-tools/z3/bin:$PATH"
          install -m 755 ~/prove-tools/bin/moonc-prove "$MOON_HOME/bin/moonc-prove"
          ls "$MOON_HOME/lib/prelude_proof" >/dev/null
          z3 --version
          cd rules && moon prove
  # Each mistake planted in the proved rules makes the proof fail (rules/planted.sh), beside `proved`.
  planted:
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mbui-moonbit
      - uses: actions/cache/restore@v4
        with:
          path: ~/prove-tools
          key: ${{ needs.tools.outputs.key }}
          fail-on-cache-miss: true
      - name: each planted mistake fails the proof
        run: |
          export PATH="$HOME/prove-tools/z3/bin:$PATH"
          install -m 755 ~/prove-tools/bin/moonc-prove "$MOON_HOME/bin/moonc-prove"
          sh rules/planted.sh
  # The lock, face-to-face approval and the vault's key as messages over a network the adversary holds (rules/protocol,
  # Tamarin): each lemma verified, each mistake planted in a copy caught. Tamarin and Maude as released, cached.
  protocol:
    if: github.repository_owner == 'AFK-surf'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - id: had
        uses: actions/cache@v4
        with:
          path: ~/tamarin
          key: tamarin-1.12.0-maude-3.5.1
      - if: steps.had.outputs.cache-hit != 'true'
        name: Tamarin 1.12.0 and Maude 3.5.1
        run: |
          mkdir -p ~/tamarin/bin && cd ~/tamarin
          curl -sSfL -o t.tgz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          tar xzf t.tgz && rm t.tgz
          curl -sSfL -o m.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          unzip -q m.zip -d maude && rm m.zip
          ln -sf "$(find ~/tamarin -name tamarin-prover -type f | head -1)" bin/tamarin-prover
          m=$(find ~/tamarin/maude -name 'maude*' -type f -perm -u+x | head -1)
          ln -sf "$m" bin/maude
          echo "$(dirname "$m")" > maude-lib
      - name: each lemma verified, each planted mistake caught
        run: |
          export PATH="$HOME/tamarin/bin:$PATH" MAUDE_LIB="$(cat ~/tamarin/maude-lib)"
          tamarin-prover --version | head -1
          sh rules/protocol/check.sh
