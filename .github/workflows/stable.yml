# Stable is never triggered by a push. Run workflow after reviewing the release notes.
name: Publish stable
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Optional full SHA (a main commit, or a release branch''s newest its notes name); empty selects the latest reviewed release notes'
        required: false
        type: string
concurrency:
  group: publish-stable
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    if: github.repository_owner == 'AFK-surf' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      web: ${{ steps.plan.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, fetch-tags: true, filter: "blob:none" }
      - uses: ./.github/actions/setup
      - id: plan
        name: Pin a reviewed release with a successful pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: python3 .github/stable-plan.py

  # The Android app is mbui's (apps/mbui, its `stable` variant: fail.still.android, signed as the Kotlin app was, so an
  # installed one updates in place) since 2026-10-24, as asked; the Kotlin app stopped at 0.1.4520. 10 minutes (it runs
  # by hand): on 2026-11-11 still.fail's took 2m09s and monoid's was cut at the job's 5, which skipped the release after.
  android:
    needs: plan
    runs-on: [self-hosted, macos-ci]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Publish stable Android (mbui's) with its original signing key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: sh .github/release.sh --stable android
      # monoid's (build.monoid.android, the same key): from the same build, in the same warm cache (only the package is
      # made again: its id, name and links are in its manifest and resources); put by monoid-android. Not a reason to hold
      # still.fail's release back: monoid-android, apart from done, fails where this did.
      - name: Build and sign monoid's stable Android app from the same build
        continue-on-error: true
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          RELEASE_DIR: ${{ runner.temp }}/monoid
        run: sh .github/release.sh --product monoid --stable android
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: "monoid-android-stable", path: "${{ runner.temp }}/monoid", if-no-files-found: error, retention-days: 1, compression-level: 0 }

  # The Mac app is mbui's (apps/mbui, its `stable` variant: fail.still.desktop, signed by the same team, so an installed
  # Electron app's updater moves it over, its data and sign-in kept), as the beta's became on 2026-10-26. 10 minutes (it
  # runs by hand): the day before's main has no warm build, and its build and Apple's notary took 4m59s on 2026-11-12
  # and were cut at 5 on 2026-11-13.
  desktop:
    needs: plan
    runs-on: [self-hosted, macos-ci]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Publish the stable Mac app (mbui's) with its original signing identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          # AFK's Developer ID and notary profile (.github/mac_signing.py).
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
        run: sh .github/release-desktop.sh --stable
      # Only frees the runner's disk of the zip already put: it fetches the zip back from R2 to compare, which from mini1
      # took past the job's 10 minutes after the release was out (0.1.8947, two attempts, 2026-11-15), so it never fails
      # or holds back the release.
      - name: Remove the uploaded Mac zip's local copy
        continue-on-error: true
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          build=$(git rev-list --count HEAD)
          cache=${MBUI_MAC_CACHE:-"$HOME/stillfail-ci/mbui-mac-stable"}
          # (where scripts/beta.sh of the release's checkout builds: beside libs/mbui once mbui is there)
          work=$cache/tree/apps/mbui; [ -d "$GITHUB_WORKSPACE/libs/mbui" ] || work=$cache/work
          work=${WORK:-$work}
          if [ "${MBUI_FRESH:-}" = 1 ]; then work="$GITHUB_WORKSPACE/apps/mbui"; fi
          # The checkout is the reviewed release, which can be older than this workflow. Use this workflow's helper.
          git show "$GITHUB_SHA:scripts/release-put.sh" > "$RUNNER_TEMP/release-put-cleanup.sh"
          STILLFAIL_RELEASE_TOOLS_ROOT="$GITHUB_WORKSPACE" sh "$RUNNER_TEMP/release-put-cleanup.sh" --clean-uploaded "desktop/stillfail-0.1.$build-arm64-mac.zip" "$work/out/mac/stillfail-$build-arm64-mac.zip"

  # The Windows app is mbui's (apps/mbui, its `stable` variant: fail.still.desktop, its installer run by an installed
  # Electron app's updater, its data and sign-in kept), as the beta's became on 2026-10-26: built as the pipeline's
  # desktop-win job builds the beta's, from main's build as preview.yml's windows job left it in the Actions cache, its
  # installer's .sig signed (scripts/release-sign.ts), not code-signed. The release is the day before's main (#4929), whose
  # build the cache has often lost by then: the build restored is a later commit's, and rebuilding from it took 3m44s
  # on 2026-11-11 (48s from the commit's own), so the job has 10 minutes (it runs by hand).
  desktop-win:
    needs: plan
    runs-on: windows-2025
    environment: production
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      MSYS: winsymlinks:nativestrict
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
    steps:
      # (the natives' keys are git's blobs: the checkout as git has it)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0, filter: "blob:none" } # its build is the commits in the history
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/msvc
      - uses: ./.github/actions/mbui-moonbit
      - name: The Windows natives' keys
        id: native-keys
        run: echo "key=natives-win32-x64-$(node scripts/native.ts key shell win32-x64)-$(node scripts/native.ts key engine win32-x64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      - name: The Windows engine and shell, prebuilt
        run: |
          node scripts/native.ts fetch shell win32-x64
          node scripts/native.ts fetch engine win32-x64
      # (preview.yml's windows job saves them, main's; read here, never saved)
      - uses: actions/cache/restore@v4
        with:
          path: |
            libs/mbui/_build
            libs/mbui/out
          key: mbui-win-build-mono-${{ needs.plan.outputs.sha }}
          restore-keys: mbui-win-build-mono-
      - uses: actions/cache/restore@v4
        with:
          path: .ci/hbc
          key: mbui-win-hbc-${{ needs.plan.outputs.sha }}
          restore-keys: mbui-win-hbc-
      - name: Build, pack and sign the stable Windows app
        env:
          # The installer's signature (its .sig): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: |
          # the PostHog project its core sends what people use to (apps/mbui/scripts/core.sh posthog_define)
          if [ -n "${POSTHOG_JSON:-}" ]; then
            (umask 077 && printf '%s' "$POSTHOG_JSON" > "$RUNNER_TEMP/posthog.json")
            export STILLFAIL_POSTHOG="$RUNNER_TEMP/posthog.json"
          fi
          unset POSTHOG_JSON
          # This checkout is the reviewed release and can be older than the workflow.
          git show "$GITHUB_SHA:apps/mbui/scripts/win-compiler.sh" > "$RUNNER_TEMP/win-compiler.sh"
          . "$RUNNER_TEMP/win-compiler.sh"
          (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          sh scripts/release.sh desktop-win
      # its files (named by its version: nothing points at them yet) put here; its feeds by desktop-win-feeds, after the
      # deltas to it, which are not this job's to make (it takes most of its 5 minutes already)
      - name: Put its files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with: { name: "release-desktop-win-stable", path: "${{ runner.temp }}/release", retention-days: 1 }
      # monoid's (build.monoid.desktop): the same program, linked again with its own resources (its id, name and
      # environment: apps/mbui/scripts/win.sh), nothing compiled again; put by monoid-desktop-win.
      - name: Pack and sign monoid's stable Windows app from the same build
        continue-on-error: true
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/monoid
        run: |
          . "$RUNNER_TEMP/win-compiler.sh"
          sh scripts/release.sh --product monoid desktop-win
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: "monoid-desktop-win-stable", path: "${{ runner.temp }}/monoid", if-no-files-found: error, retention-days: 1 }

  # The stable Windows app's feeds (desktop-win put its files), after the deltas to it from the stable builds before
  # (scripts/release-deltas.ts, which fetches the installer's raw form back: a few minutes of a Linux runner's, never a
  # reason to hold the release back).
  desktop-win-feeds:
    needs: [plan, desktop-win]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "release-desktop-win-stable", path: "${{ runner.temp }}/release" }
      - name: Its deltas, then its feeds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/release-deltas.ts "$RUNNER_TEMP/release" --deadline 200
          sh scripts/release-put.sh "$RUNNER_TEMP/release"

  # monoid's stable apps (apps/mbui's monoid variants on monoid's cloud: build.monoid.android, build.monoid.desktop), of
  # the same reviewed release as still.fail's, made from theirs (nothing compiled again) and put in monoid's bucket in the
  # company's Cloudflare account. Apart from done: still.fail's stable is recorded whatever they do.
  monoid-android:
    needs: [plan, android]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "monoid-android-stable", path: "${{ runner.temp }}/monoid" }
      - name: Put it in monoid's bucket (its files and deltas, then its feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/release-deltas.ts "$RUNNER_TEMP/monoid" --releases https://app.monoid.build/releases --deadline 150
          sh scripts/release-put.sh "$RUNNER_TEMP/monoid"

  # monoid's Mac app: still.fail's stable one (as the desktop job put it) renamed, not built again: the same program,
  # Hermes, bytecode and icon, its own Info.plist, program name and updater id (apps/mbui/scripts/mac-app.sh
  # MBUI_MAC_FROM), signed and notarized as monoid, put in monoid's bucket.
  monoid-desktop:
    needs: [plan, desktop]
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    runs-on: macos-26
    environment: production
    timeout-minutes: 5
    env:
      MBUI_FRESH: 1
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0, filter: "blob:none" } # its build is the commits in the history
      - uses: ./.github/actions/setup
      - name: Rename, sign and notarize still.fail's stable Mac app as monoid's, and put it in monoid's bucket
        env:
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: |
          zip="stillfail-0.1.$(git rev-list --count HEAD)-arm64-mac.zip"
          curl -fsS -o "$RUNNER_TEMP/$zip" "https://app.still.fail/releases/desktop/$zip"
          export MBUI_MAC_FROM="$RUNNER_TEMP/$zip"
          sh .github/release-desktop.sh --product monoid --stable

  monoid-desktop-win:
    needs: [plan, desktop-win]
    if: ${{ !cancelled() && needs.desktop-win.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "monoid-desktop-win-stable", path: "${{ runner.temp }}/monoid" }
      - name: Put it in monoid's bucket (its files and deltas, then its feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/release-deltas.ts "$RUNNER_TEMP/monoid" --releases https://app.monoid.build/releases --deadline 150
          sh scripts/release-put.sh "$RUNNER_TEMP/monoid"

  # The app's page for a web built here (plan's web=build: a release branch's commit, never on beta, or a main commit
  # whose run changed no web and so kept no artifact), as the pipeline's mbui-web job builds it.
  mbui-web:
    needs: plan
    if: needs.plan.outputs.web == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}' }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/mbui-moonbit
      - run: bash apps/mbui/scripts/web-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: "mbui-web-stable-${{ needs.plan.outputs.sha }}", path: web/public/mbui, retention-days: 1 }

  web:
    needs: [plan, android, desktop, desktop-win, mbui-web]
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.desktop.result == 'success' && needs.desktop-win.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.mbui-web.result) }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/setup
      - run: cd cloud && pnpm install --frozen-lockfile --prefer-offline
      # web=build: built from the release's revision as the pipeline's static job builds main's (deploy.py, with the
      # same PostHog key), then deployed to app.still.fail as an artifact would be.
      - if: needs.plan.outputs.web == 'build'
        uses: actions/download-artifact@v4
        with: { name: "mbui-web-stable-${{ needs.plan.outputs.sha }}", path: web/public/mbui }
      - name: Build the release's web app and deploy it
        if: needs.plan.outputs.web == 'build'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: |
          sh .github/deploy.sh --dry-run web-beta
          test "$(node -p 'require("./dist/cloud-web/build.json").revision')" = "${{ needs.plan.outputs.sha }}"
          cd cloud && python3 deploy.py promote-web ../dist/cloud-web
      - name: Promote the same revision's original beta web artifact
        if: needs.plan.outputs.web == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_REVISION: ${{ needs.plan.outputs.sha }}
        run: python3 scripts/promote-web.py --revision "$RELEASE_REVISION"
      # monoid's web app (deploy.py CLOUDS), its own build of the same revision (pipeline.yml monoid-static). A revision
      # from before monoid has none: not a reason to hold still.fail's release back.
      - name: Promote the same revision's monoid web artifact
        if: needs.plan.outputs.web == 'artifact'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STILLFAIL_CLOUD: monoid
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
          RELEASE_REVISION: ${{ needs.plan.outputs.sha }}
        run: python3 scripts/promote-web.py --revision "$RELEASE_REVISION"

  # Offer compatible apps before making the station update available.
  station:
    needs: [plan, web]
    # web needs mbui-web, skipped when web=artifact; without this, the default success() over a skipped ancestor skips
    # this job and everything after it (0.1.8278, 2026-11-12).
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: [self-hosted, macos-ci]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Publish all three stable station platforms from the pinned source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          # AFK's Developer ID (.github/mac_signing.py): the native parts are signed with it, as the beta's are; without
          # it the stable station went out ad hoc (2026-11-02's).
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
          # The key the release is signed with (scripts/release-sign.ts): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: sh .github/release.sh --stable station

  # The official site, still.fail, from the same revision: the pipeline deploys only youdid.wtf's (site-beta), and a
  # stable release that left it out kept still.fail at 2026-10-01's for two weeks (no Windows download on it).
  site:
    needs: [plan, web]
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: [self-hosted, macos-ci]
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Deploy still.fail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh .github/deploy.sh site
      # monoid's, monoid.build (website/build.mjs SITES: the template's own, its links its cloud's): not a reason to hold
      # still.fail's release back
      - name: Deploy monoid.build
        continue-on-error: true
        env:
          STILLFAIL_CLOUD: monoid
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: sh .github/deploy.sh site

  done:
    needs: [plan, android, desktop, desktop-win, desktop-win-feeds, web, station, site]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.station.result == 'success' && needs.site.result == 'success' && needs.desktop-win-feeds.result == 'success' }}
    runs-on: [self-hosted, macos-ci]
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write # the clouds believe it as it tells them a release is out (scripts/release-told.sh)
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false, ref: '${{ needs.plan.outputs.sha }}' }
      - name: Record the fully published stable revision
        env:
          RELEASE_REVISION: ${{ needs.plan.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git tag -f deployed/stable "$RELEASE_REVISION"
          # As macos-ci's own GitHub login, not the run's token: GitHub refuses that token a ref to a commit that changes a
          # workflow (no `workflows` permission), and a tag stuck behind such a commit stays stuck (2026-10-02, e3ae7c10).
          # (again on a dropped connection: one from macos-ci to github.com failed the tag's push alone, the beta out, main
          # 30f68adc 41249459343, 2026-11-01)
          for i in 1 2 3; do
            git push --no-verify -f "https://github.com/$GITHUB_REPOSITORY" refs/tags/deployed/stable && break
            [ $i = 3 ] && exit 1; sleep 10
          done
          echo "Published stable 0.1.$RELEASE_VERSION from $RELEASE_REVISION" >> "$GITHUB_STEP_SUMMARY"
      # (inline: this checkout is the release's revision, which can be older than scripts/release-told.sh)
      - name: Tell the clouds the release is out (their stations and apps read their feeds then)
        run: |
          for origin in https://app.still.fail https://app.youdid.wtf; do
            token=$(curl -fsS -H "authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$origin" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || token=""
            if [ -n "$token" ] && curl -fsS --retry 3 -X POST -H "authorization: Bearer $token" "$origin/v1/releases/out" > /dev/null; then echo "$origin told"; else echo "$origin not told" >&2; fi
          done
