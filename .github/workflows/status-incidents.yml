# still.fail/status's incidents (cloud/src/status.ts): issues labelled `incident`, sent to the cloud when one changes.
# Sent from here, not read by the cloud: GitHub limits what it answers without a token by address, and a Worker's is
# shared. The cloud believes this workflow by its OIDC token, so no secret is kept on either side.
name: status-incidents
on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  id-token: write
concurrency:
  group: status-incidents
  cancel-in-progress: false
jobs:
  send:
    # Only the repository's own can label an issue: anyone else's opens no run here.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'incident') || github.event.label.name == 'incident'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send the incidents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues?labels=incident&state=all&per_page=20" > issues.json
          token=$(curl -fsS -H "authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://app.still.fail" | jq -r .value)
          curl -fsS --retry 3 -X POST -H "authorization: Bearer $token" -H "content-type: application/json" --data-binary @issues.json https://app.still.fail/v1/status/incidents
