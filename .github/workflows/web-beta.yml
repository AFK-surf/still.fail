# The test channel's web app (app.youdid.wtf), deployed on its own on every push to main that changes it, on mini1's
# self-hosted runner (docs/operations.md, "CI"): no GitHub minutes, and Cloudflare's login stays on that machine.
# The rest (api, relay, admin, preview, the station release) stays with ~/bin/ember-deploy on studio; app.still.fail
# gets the very build deployed here with ~/bin/ember-promote web.
name: web-beta
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "client/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "cloud/build-static.ts"
      - "cloud/deploy.py"
      - "cloud/wrangler.web-beta.jsonc"
      - ".github/workflows/web-beta.yml"
  workflow_dispatch:
# Only the newest main matters: a push while one deploys stops it and deploys itself.
concurrency:
  group: web-beta
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: [self-hosted, mini1]
    timeout-minutes: 30
    env:
      # Kept between runs (outside the checkout, which is cleaned): the wasm core builds again in seconds, not minutes.
      CARGO_TARGET_DIR: /Users/zuozijian/stillfail-ci/target
      # Cloudflare's login is mini1's own `wrangler login`; the deploy directory holds only posthog.json and the builds.
      STILLFAIL_DEPLOY_DIR: /Users/zuozijian/stillfail-deploy
    steps:
      - uses: actions/checkout@v5
      - name: Toolchains
        run: |
          # rustup's (with wasm32 and wasm-bindgen) ahead of Homebrew's rust; node 24 and pnpm from ~/.local/bin.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline)
      - name: Web core (wasm)
        run: sh client/wasm/build.sh > /dev/null
      - name: Check
        run: |
          pnpm exec tsgo -p web/tsconfig.json
          pnpm exec tsgo -p tsconfig.json
          pnpm test
      - name: Deploy to app.youdid.wtf
        run: |
          # The LAN's way out drops a connection now and then ("fetch failed"): tried again, up to three times.
          for try in 1 2 3; do
            (cd cloud && python3 deploy.py web-beta) > /tmp/web-beta-deploy.txt 2>&1 && break
            if [ $try = 3 ] || ! grep -q "fetch failed" /tmp/web-beta-deploy.txt; then tail -60 /tmp/web-beta-deploy.txt; exit 1; fi
            echo "network dropped (try $try), trying again"; sleep 10
          done
          grep -E "^(deploying|deployed|kept|check|note)" /tmp/web-beta-deploy.txt
          # What ~/bin/ember-promote web takes to app.still.fail.
          echo "$GITHUB_SHA" > "$STILLFAIL_DEPLOY_DIR/beta-web-commit"
