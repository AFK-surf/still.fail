# The demo on Windows: build with MoonBit and MSVC, take the scripted
# screenshot (Direct3D falls back to WARP on the GPU-less runner), and compare
# it with goldens/windows.png when there is one; then the photos app over
# test/images and a big JPEG made here, with its decode times.
name: windows
on:
  push:
    branches: [main, windows, images-android-win]
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install MoonBit
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build
        run: |
          moon version --all
          scripts/win.sh build
          echo "binary: $(stat -c %s out/win/mod/_build/native/release/build/demo/demo.exe) bytes"
      - name: Screenshot
        run: |
          scripts/win.sh shot
          ls -la out/shot-win
      - name: IME script
        run: scripts/win.sh script ime
      - name: Compare with the golden
        run: |
          mkdir -p out/shots
          cp out/shot-win/main.png out/shots/windows.png
          if [ -f goldens/windows.png ]; then
            mkdir -p out/node && cd out/node && npm init -y >/dev/null && npm i pngjs pixelmatch >/dev/null && cd ../..
            node scripts/imgdiff.mjs goldens/windows.png out/shots/windows.png out/shots/windows-review.png
          else
            echo "no goldens/windows.png yet"
          fi
      - name: A big JPEG for the photos app
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $b = New-Object System.Drawing.Bitmap 6000, 4000
          $g = [System.Drawing.Graphics]::FromImage($b)
          $r = New-Object System.Drawing.Rectangle 0, 0, 6000, 4000
          $g.FillRectangle((New-Object System.Drawing.Drawing2D.LinearGradientBrush $r, ([System.Drawing.Color]::SteelBlue), ([System.Drawing.Color]::DarkOrange), 45.0), $r)
          for ($i = 0; $i -lt 40; $i++) {
            $c = [System.Drawing.Color]::FromArgb(140, ($i * 37) % 256, ($i * 71) % 256, ($i * 13) % 256)
            $g.FillEllipse((New-Object System.Drawing.SolidBrush $c), ($i * 137) % 5600, ($i * 251) % 3600, 400 + $i * 10, 400 + $i * 10)
          }
          $g.Dispose()
          $b.Save("$PWD\test\images\big.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          "big.jpg: $((Get-Item test\images\big.jpg).Length) bytes"
      - name: Photos
        run: |
          APP=photos scripts/win.sh build
          MBUI_BENCH=-1 APP=photos scripts/win.sh script photos
          ls -la out/photos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: |
            out/shots/
            out/shot-win/
            out/ime/
            out/photos/
          if-no-files-found: warn
