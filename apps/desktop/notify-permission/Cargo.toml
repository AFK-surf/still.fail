[package]
name = "stillfail-notify-permission"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["dyn-symbols"] }
napi-derive = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["UI_Notifications"] }

[build-dependencies]
napi-build = "2"

[workspace]
