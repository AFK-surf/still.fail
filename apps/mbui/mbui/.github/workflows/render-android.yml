# The renderer's pixels on Android (docs/determinism.md, "Pixel references belong to one kind of machine"): a Tester's
# draw list drawn offscreen by the app's GL renderer in an x86_64 emulator (SwiftShader) on GitHub's ubuntu-24.04
# runner, twice in each of two jobs at once, against its reference (goldens/render/android-controls.png) to the byte,
# on the runner image, emulator and system image the reference was made on (goldens/render/android.txt). The picture
# drawn is the artifact: what a PR that changes it commits, saying why.
name: render-android
on:
  pull_request:
    paths: &paths
      - "src/host/android_host.c"
      - "android/app/src/main/java/dev/mbui/MBText.java"
      - "android/app/src/main/java/dev/mbui/Images.java"
      - "android/app/build.gradle.kts"
      - "scripts/android.sh"
      - "src/render/**"
      - "src/ui/drawlist.mbt"
      - "src/ui/scene.mbt"
      - "src/ui/line.mbt"
      - "scripts/lines_check.py"
      - "src/kitdemo/dl_print_wbtest.mbt"
      - "src/ui/smooth.mbt"
      - "src/host/corner*"
      - "goldens/render/android*"
      - "scripts/render_dl.sh"
      - "scripts/render_android.sh"
      - "scripts/render_android_hook.sh"
      - ".github/workflows/render-android.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:


jobs:
  offscreen:
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/moonbit
      - name: The draw list and the APK (scripts/render_android.sh build)
        run: scripts/render_android.sh build
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drawn offscreen in the emulator, twice (scripts/render_android.sh run)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          # the emulator's build the reference was made with (goldens/render/android.txt), not the newest
          emulator-build: 16428233
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/render_android.sh run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-android-${{ matrix.run }}
          # (a rerun's own: the attempt before's put by, so `same` compares this attempt's pictures)
          overwrite: true
          path: out/render/
      - name: Against the reference, on the machine it was made on
        run: scripts/render_android.sh against

  # the two jobs' pictures (two machines of the kind, at once): the same to the byte
  same:
    needs: offscreen
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: render-android-*, path: runs }
      - run: |
          md5sum runs/*/controls.png
          grep -h '^cpu ' runs/*/machine.txt
          cmp runs/render-android-a/controls.png runs/render-android-b/controls.png && echo "the two jobs' pictures: the same to the byte"
