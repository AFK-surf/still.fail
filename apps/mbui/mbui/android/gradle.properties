org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# scripts/android.sh builds with the daemon (a build after the first skips the JVM's start and Gradle's warm-up),
# the build cache (a clean checkout takes what an earlier build of the same inputs made, from ~/.gradle) and the
# configuration cache; an idle daemon goes after 30 minutes, not Gradle's 3 hours (shared machines).
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon.idletimeout=1800000
