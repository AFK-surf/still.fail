<!doctype html><html><head><meta charset="utf-8"><style>
/* A story's film laid in a Pixel 10 Pro Fold (Android Studio's device art), with its keyboard, taps, camera and
   spotlight drawn over it: render(t) draws the moment t (s) of the film. compose.mjs films it frame by frame. */
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#e9e6e1}
body>.scr{position:absolute}
body{font-family:"Google Sans","Roboto","PingFang SC",-apple-system,sans-serif}
#bg{position:absolute;inset:0;background:radial-gradient(1500px 1000px at 50% 42%,#f6f4f0,#e7e3dd 62%,#dcd7cf)}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.dev{position:absolute;transform-origin:50% 50%;backface-visibility:hidden}
.dev>img.back{position:absolute;left:0;top:0;display:block}
.dev>.shadow{position:absolute;inset:3% 4%;border-radius:8%;box-shadow:0 60px 120px rgba(40,30,20,.30),0 18px 40px rgba(40,30,20,.20)}
.scr{position:absolute;overflow:hidden;background:#f4f1ee}
.scr>img.app{position:absolute;left:0;top:0;transform-origin:0 0}
.bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;color:#1f1b17;font-weight:500;z-index:4}
.bar .r{display:flex;align-items:center;gap:.35em}
.kb{position:absolute;left:0;right:0;bottom:0;background:#e9ebf1;z-index:5}
.kb .cands{display:flex;align-items:center;color:#2a2a30}
.kb .cands .py{color:#5f6270}
.kb .row{display:flex;justify-content:center}
.kb .k{background:#fff;color:#1d1d22;display:flex;align-items:center;justify-content:center;transition:none}
.kb .k.f{background:#d7dbe6}
.kb .k.on{background:#c9cfe0}
.kb .gest{position:absolute;left:50%;transform:translateX(-50%);background:#1d1d22;opacity:.75}
.spot{position:absolute;z-index:6;pointer-events:none;border-radius:0}
.tap{position:absolute;z-index:7;border-radius:50%;background:rgba(30,25,20,.20);border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 18px rgba(0,0,0,.18)}
.cam{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 38%,#2a2d3a,#050507 60%);z-index:8}
#end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;flex-direction:column;gap:26px}
#end img{width:120px;height:120px}
#end b{font-size:64px;font-weight:600;color:#1f1b17;letter-spacing:.5px}
</style></head><body><div id="bg"></div><div id="world"></div><div id="end"><img src="mark.svg"><b>still.fail</b></div>

    open: { back: 'device/default-back.png', w: 2201, h: 2268, sx: 62, sy: 58, sw: 2076, sh: 2152, r: 150, win: [791, 820], top: 32, cam: [1942, 81, 32], pad: [26, 74] },
  },

// the light on each face as it turns: darker the more it faces away

  kb.querySelectorAll('.k').forEach((k) => { k.style.borderRadius = kp(5); k.style.boxShadow = '0 1px 0 rgba(0,0,0,.3)'; if (k.dataset.k === '↵') { k.textContent = '换行'; k.style.fontSize = kp(15); k.style.width = kp(70); } if (k.dataset.k === '␣') k.textContent = '空格'; });

const keys = {}; kb.querySelectorAll('.k').forEach((k) => { keys[k.dataset.k] = k; });

const CAM = window.SHOTS.cam, SPOT = window.SHOTS.spot;
