[workspace]
resolver = "3"
members = ["core", "shapes", "wasm", "ffi", "node"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# The browser build (client/wasm/build.sh): small over fast. A profile of its
# own so native release builds keep the defaults.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# mDNS that works on a machine with several networks, and through a router reflecting it between subnets (vendor/README.md).
[patch.crates-io]
swarm-discovery = { path = "../vendor/swarm-discovery" }
iroh-mdns-address-lookup = { path = "../vendor/iroh-mdns-address-lookup" }
