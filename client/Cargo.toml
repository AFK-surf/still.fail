[workspace]
resolver = "3"
members = ["iroh-wasm", "shell"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Dev and test builds (cargo test in scripts/check.sh, in a worktree each): line numbers for our own code and
# no debug info for dependencies keep target/ several times smaller and linking quicker; backtraces still
# name file and line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The browser's iroh (client/iroh-wasm/build.sh): small over fast. A profile of its
# own so native release builds keep the defaults.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# The LAN on a machine with several networks or addresses, and through a router reflecting mDNS (vendor/README.md).
[patch.crates-io]
# Android cannot publish the phone's adb key with a hard link (vendor/README.md).
libadb = { path = "../vendor/libadb" }
noq-proto = { git = "https://github.com/zzj3720/noq", rev = "76344e6eab7ae651ce524e4f329a2f283f69d7ab" }
swarm-discovery = { path = "../vendor/swarm-discovery" }
iroh-mdns-address-lookup = { path = "../vendor/iroh-mdns-address-lookup" }
noq-udp = { path = "../vendor/noq-udp" }
n0-mainline = { path = "../vendor/n0-mainline" }
iroh = { git = "https://github.com/zzj3720/iroh", rev = "cbb88bc4d070a4de6999799aada2b5f3dc5680f4" }
iroh-relay = { git = "https://github.com/zzj3720/iroh", rev = "cbb88bc4d070a4de6999799aada2b5f3dc5680f4" }
