[workspace]
resolver = "3"
members = ["core", "shapes", "wasm", "ffi", "node"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# The browser build (client/wasm/build.sh): small over fast (then wasm-opt -Oz
# there). A profile of its own so native release builds keep the defaults.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

# The LAN on a machine with several networks or addresses, and through a router reflecting mDNS (vendor/README.md).
[patch.crates-io]
swarm-discovery = { path = "../vendor/swarm-discovery" }
iroh-mdns-address-lookup = { path = "../vendor/iroh-mdns-address-lookup" }
noq-udp = { path = "../vendor/noq-udp" }
iroh = { path = "../vendor/iroh" }
