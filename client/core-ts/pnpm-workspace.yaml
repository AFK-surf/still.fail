# Only these may run install scripts: esbuild fetches its own binary (pnpm 10 reads the list, pnpm 11 the map).
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
# MathJax's default font (New Computer Modern), which its SVG output imports whether or not it is used: none
# (no-default-font). The core lays formulas out with the TeX font it gives (src/math.ts).
overrides:
  "@mathjax/mathjax-newcm-font": "link:./no-default-font"
# linkedom's CSS parser (its style elements' `sheet`, which the core's mermaid document never reads): none (no-cssom).
  "@acemir/cssom": "link:./no-cssom"
