[package]
name = "stillfail-core"
description = "The logic every still.fail client shares: accounts, still.fail cloud, mesh links to stations, the cache of topics."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
stillfail-shapes = { path = "../shapes" }
stillfail-i18n = { path = "../i18n" }
# iroh's QUIC: its congestion settings (see mesh.rs, transport).
noq-proto = { version = "1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh = { version = "=1.0.3" }
# Finding stations without still.fail cloud: on the LAN (mDNS), and which relay they are on (the Mainline DHT).
iroh-mdns-address-lookup = "=0.4.0"
iroh-mainline-address-lookup = "=0.5.0"

tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"], optional = true }

[features]
# The fake host for tests (this crate's and its bindings').
testing = ["dep:tokio"]
# Tunnels to this device's adbd (adb.rs): native cores, on tokio's sockets.
tunnels = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Relays on localhost (mesh.rs tests), one reached through a proxy that slows it.
iroh = { version = "=1.0.3", features = ["test-utils"] }
iroh-relay = { version = "1", features = ["test-utils"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
