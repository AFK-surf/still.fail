[package]
name = "ember-core"
description = "The logic every ember client shares: accounts, ember cloud, mesh links to stations, the cache of topics."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ember-shapes = { path = "../shapes" }
# iroh's QUIC: its congestion settings (see mesh.rs, transport).
noq-proto = { version = "1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh = { version = "=1.0.3" }

tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"], optional = true }

[features]
# The fake host for tests (this crate's and its bindings').
testing = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
