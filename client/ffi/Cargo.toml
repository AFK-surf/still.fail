[package]
name = "stillfail-core-ffi"
description = "stillfail-core natively (Android, later iOS): a Host over reqwest and files on a core thread, exported with uniffi."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "stillfail_core_ffi"

[[bin]]
# Generates the Kotlin bindings from the built library (apps/android/build.py).
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
# Stations answering at the cloud's origin (STILLFAIL_HOST_WIRE): the side-by-side run, client/core-ts/harness.
testing = ["stillfail-core/testing"]

[dependencies]
# Its tunnels to the phone's adbd (adb.rs) too.
stillfail-core = { path = "../core", features = ["tunnels"] }
uniffi = "=0.31.0"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures = "0.3"
serde_json = "1"
thiserror = "2"
# The crypto provider is iroh's (ring); roots are Mozilla's, as iroh's own TLS
# uses, so nothing needs the platform verifier's JNI setup.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# still.fail cloud's /v1/events socket; the TLS config is the one reqwest gets.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
getrandom = "0.3"
# The core's database (docs/core-db.md), built in: the same SQLite on every platform.
rusqlite = { version = "0.37", features = ["bundled"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "macros"] }
