[package]
name = "stillfail-shapes"
description = "Words the Rust station shares with the clients (runtimes, accounts, connect modes, software versions) and how it reads models, providers and reasoning levels. The clients' types are declared in client/core-ts/src/shapes/schema.ts."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
