[package]
name = "stillfail-shell"
description = "The native shell of the core in TypeScript in the apps (client/core-ts hosts/bridge.ts, apps/mbui/engine): HTTP, still.fail cloud's WebSocket, files and the core's database, TCP to adbd, and iroh, behind a C ABI the Hermes engine (C++) calls."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "stillfail_shell"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# As the Rust core's native host had them: the crypto provider is iroh's (ring); roots are Mozilla's.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# The core's database, built in: the same SQLite and file as the Rust core's native host's.
rusqlite = { version = "0.37", features = ["bundled"] }
libc = "0.2"
iroh = { version = "=1.0.3" }
iroh-mdns-address-lookup = "=0.4.0"
iroh-mainline-address-lookup = "=0.5.0"
# Its DHT, for what its socket and lookups went through (`dht.said`: vendor/n0-mainline's `stillfail`).
n0-mainline = "=0.6.0"
# The type of what an address lookup resolves (`Unmade`), as iroh names it.
n0-future = "0.3"
# A datagram that asks whether a connection's other end is still there (`conn.answers`).
bytes = "1"
noq-proto = { version = "1", default-features = false }
# The lock's and the vault's signatures checked here (`crypto.verify`) by formally verified implementations (Cryspen's
# libcrux: HACL*'s Ed25519 and P-256, proved in F*), not the core's JS (@noble's), and off Hermes' slow arithmetic.
libcrux-ed25519 = { version = "=0.0.10", default-features = false }
libcrux-ecdsa = { version = "=0.0.9", default-features = false }
# A station's replies are decompressed here, off the core's JS thread (zstd.*).
zstd = { version = "0.13", default-features = false }
# What the station's programs write and hash (fs.write, fs.hash) and draw at random (crypto.random).
sha2 = "0.10"
getrandom = "0.3"
# A screen view's sound asked as Opus (ScreenTap), decoded here into the PCM every host plays, one decoder for every
# platform (the hosts' own differ, and Windows may have none). Pure Rust, a port of libopus 1.6: on the Mac's helper's
# packets 20 µs a packet on an M5 Max and within 84 dB of AudioToolbox's own decode (opus-decoder 0.1.1, the same to
# 92 dB, took 1.8 ms a packet; 2026-11-12).
opus-rs = "=0.1.42"
# The phone's own adb session (src/adb.rs): pairing with its adbd and the TLS it speaks, on rustls with ring as here.
libadb = { version = "=0.7.0", default-features = false, features = ["tokio", "pairing", "host-keys"] }
embedded-io-async = "0.6"

