[package]
name = "ember-station"
version.workspace = true
edition.workspace = true
description = "ember station: runs the station (its Node part as a child), serves its admin page here, and connects it to ember cloud over iroh"

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
iroh = { version = "=1.0.3" }
noq-proto = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
getrandom = "0.3"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
