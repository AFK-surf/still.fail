[package]
name = "ember-mesh-web"
version = "0.1.0"
edition = "2024"
description = "ember's iroh client for the browser: relay-only connections to stations"

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
