[package]
name = "proto-shell"
edition = "2024"
version = "0.1.0"
publish = false
description = "Prototype: a Rust shell that holds iroh connections and SQLite, while the logic runs in TypeScript"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
iroh = { version = "=1.0.3" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# A workspace of its own: not part of mesh/ or client/.
[workspace]

[patch.crates-io]
swarm-discovery = { path = "../../../vendor/swarm-discovery" }
noq-udp = { path = "../../../vendor/noq-udp" }
iroh = { path = "../../../vendor/iroh" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
