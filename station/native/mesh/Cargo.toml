[package]
name = "stillfail-mesh"
edition = "2024"
version = "0.1.0"
publish = false
description = "The station's iroh and its image codecs (thumbnails, ThumbHashes), for the station in TypeScript (station/src): built once per release of it, shipped prebuilt as mesh.node"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The archive lock (archive.rs `file_lock`) and local links (local_links.rs), as mesh/app has them.
libc = "=0.2.189"
percent-encoding = "=2.3.2"
pulldown-cmark = { version = "=0.13.4", default-features = false }
url = "=2.5.8"
anyhow = "1"
base64 = "0.22"
# A datagram that asks whether a connection's other end is still there (`Connection::answers`).
bytes = "1"
hex = "0.4"
iroh = { version = "=1.0.3" }
iroh-mdns-address-lookup = "=0.4.0"
iroh-mainline-address-lookup = "=0.5.0"
napi = { version = "3", features = ["async", "tokio_rt"] }
napi-derive = "3"
noq-proto = { version = "1", default-features = false }
sha2 = "0.10"
# Thumbnails (src/thumbs.rs): exactly as mesh/app builds them (mesh/Cargo.lock), so both stations make the same bytes;
# the codecs under `image` pinned too (Cargo.lock is not kept here).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
thumbhash = "=0.1.0"
png = "=0.18.1"
fdeflate = "=0.3.7"
flate2 = "=1.1.10"
miniz_oxide = "=0.8.9"
zune-jpeg = "=0.5.15"
zune-core = "=0.5.3"
image-webp = "=0.2.4"
moxcms = "=0.8.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[build-dependencies]
napi-build = "2"

# A workspace of its own: not part of mesh/ or client/.
[workspace]

# As mesh/ has them (vendor/README.md).
[patch.crates-io]
noq-proto = { git = "https://github.com/zzj3720/noq", rev = "d578f818ad7580c49691f26d5ccf8cc3afcc026a" }
swarm-discovery = { path = "../../../vendor/swarm-discovery" }
iroh-mdns-address-lookup = { path = "../../../vendor/iroh-mdns-address-lookup" }
noq-udp = { path = "../../../vendor/noq-udp" }
iroh = { git = "https://github.com/zzj3720/iroh", rev = "4607ae173cc50fcbc59ea3f72b96c0a0c9120df5" }
iroh-relay = { git = "https://github.com/zzj3720/iroh", rev = "4607ae173cc50fcbc59ea3f72b96c0a0c9120df5" }

[profile.release]
strip = true
