[package]
name = "station-load"
edition = "2024"
version = "0.1.0"
publish = false
description = "For testing a station: a test workspace's keys for a station, and a member's client that asks it things over iroh, timed"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
iroh = { version = "=1.0.3" }
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[workspace]

[patch.crates-io]
swarm-discovery = { path = "../../../vendor/swarm-discovery" }
iroh-mdns-address-lookup = { path = "../../../vendor/iroh-mdns-address-lookup" }
noq-udp = { path = "../../../vendor/noq-udp" }
iroh = { git = "https://github.com/zzj3720/iroh", rev = "5c48fdf8a84062bd1ba322d4e363e64e7aae0613" }
iroh-relay = { git = "https://github.com/zzj3720/iroh", rev = "5c48fdf8a84062bd1ba322d4e363e64e7aae0613" }
