<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- The film put together: the panes (frames/<pane>/NNNNN.jpg, filmed by record.mjs) in their devices, moved by the
     scenes below, with the words. render(seconds) draws one moment; record.mjs screenshots it frame by frame. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: #f2f1ee; color: #17181b; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 40%, #fbfaf8 0%, #f2f1ee 60%, #e9e7e2 100%); }
  .dev { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .phone { width: 418px; height: 872px; border-radius: 62px; background: #121214; padding: 14px; box-shadow: 0 40px 80px -30px rgba(20,20,30,.45), 0 0 0 1.5px #2b2b30 inset; }
  .phone .screen { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #fff; }
  .phone img { width: 390px; height: 844px; display: block; }
  .island { position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; padding: 6px 34px 0 40px; font-weight: 600; font-size: 16px; }
  .status .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .bat { width: 25px; height: 12px; border: 1.5px solid #17181b; border-radius: 4px; position: relative; opacity: .9; }
  .bat::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: #17181b; border-radius: 1.5px; }
  .tap { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(40,40,50,.22); border: 2px solid rgba(255,255,255,.7); pointer-events: none; }
  .win { border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 30px 70px -28px rgba(20,20,30,.4), 0 0 0 1px rgba(0,0,0,.08); }
  .bar { height: 34px; display: flex; align-items: center; padding: 0 14px; background: #ececec; border-bottom: 1px solid #dedede; font-size: 13px; color: #555; gap: 8px; }
  .bar .t { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; }
  .bar.mac i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .bar.windows { background: #f3f3f3; justify-content: flex-start; }
  .bar.windows .ctl { margin-left: auto; display: flex; gap: 26px; font-size: 13px; color: #333; }
  .bar.linux { background: #2b2d31; color: #c9cbd0; border-bottom-color: #222; }
  .win img { display: block; }
  .label { position: absolute; left: 2px; top: -40px; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .label b { font-size: 22px; font-weight: 600; }
  .label span { font-size: 16px; color: #6b6d73; }
  .label .dot { width: 10px; height: 10px; border-radius: 50%; background: #2fb36b; display: inline-block; transform: translateY(-2px); }
  .ring { position: absolute; inset: -6px; border-radius: 19px; border: 3px solid #2fb36b; opacity: 0; }
  svg#wires { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  .caption { position: absolute; left: 72px; bottom: 56px; padding: 18px 26px 20px; border-radius: 22px; background: rgba(248,247,244,.9); box-shadow: 0 10px 40px -12px rgba(20,20,30,.18); }
  .caption h2 { font-size: 46px; font-weight: 650; letter-spacing: .5px; }
  .caption p { font-size: 24px; color: #5d5f66; margin-top: 12px; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
  #end h1 { font-family: "Inter", -apple-system, "Helvetica Neue", sans-serif; font-size: 112px; font-weight: 700; letter-spacing: -3px; }
  #end p { margin-top: 26px; font-size: 34px; color: #5d5f66; font-weight: 500; letter-spacing: .5px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world" style="position:absolute;inset:0;transform-origin:0 0">
    <svg id="wires"></svg>
    <div id="devices"></div>
  </div>
  <div class="caption" id="cap"><h2></h2><p></p></div>
  <div id="end"><h1>One devices.</h1><p>still.fail</p></div>
</div>
<script type="module">
const FPS = 60;
/** The panes' clock (ms) at a moment of the film (s): the film starts this much before the phone does anything. */
const LEAD = 0.6;
const paneMs = (s) => Math.max(0, (s - LEAD) * 1000);
const PANE_FRAMES = await fetch('frames/count.json').then((r) => r.json());

const ease = (t) => (t < 0 ? 0 : t > 1 ? 1 : t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/**
 * Where a device is, by keys: [seconds, { x, y (its centre), w (its width), o (opacity) }]; between two keys it moves
 * on an ease from one to the next.
 */
function at(keys, s) {
  if (s <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [s1, b] = keys[i];
    const [s0, a] = keys[i - 1];
    if (s <= s1) { const t = ease((s - s0) / (s1 - s0)); return Object.fromEntries(Object.keys(a).map((k) => [k, lerp(a[k], b[k], t)])); }
  }
  return keys.at(-1)[1];
}

// ---- The devices ----
const PHONE_W = 418, PHONE_H = 872;
const MACHINES = {
  home: { name: '家里的 Mac', os: 'macOS', bar: 'mac', w: 1280, h: 800 },
  studio: { name: 'Studio', os: 'macOS · 编安卓', bar: 'mac', w: 1280, h: 800 },
  win: { name: 'Win 台式机', os: 'Windows 11', bar: 'windows', w: 1280, h: 800 },
  cloud: { name: '云主机', os: 'Ubuntu 24.04', bar: 'linux', w: 1280, h: 800 },
};
const devices = document.getElementById('devices');
const made = {};
function makePhone() {
  const el = document.createElement('div');
  el.className = 'dev phone';
  el.innerHTML = '<div class="screen"><img><div class="status"><span class="clock">8:40</span><span class="r">5G <span style="letter-spacing:-1px">▮▮▮▮</span> <span class="bat"></span></span></div><div class="island"></div><div class="tap" style="opacity:0"></div></div>';
  devices.append(el);
  return { el, img: el.querySelector('img'), clock: el.querySelector('.clock'), tap: el.querySelector('.tap'), w: PHONE_W, h: PHONE_H };
}
function makeWindow(key) {
  const m = MACHINES[key];
  const el = document.createElement('div');
  el.className = 'dev';
  const bar = m.bar === 'mac' ? '<i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="t">still.fail</span>'
    : m.bar === 'windows' ? '<span>still.fail</span><span class="ctl"><span>—</span><span>☐</span><span>✕</span></span>'
    : '<span class="t">still.fail — 浏览器</span>';
  el.innerHTML = `<div class="label"><span class="dot"></span><b>${m.name}</b><span>${m.os}</span></div><div class="win"><div class="bar ${m.bar}" style="position:relative">${bar}</div><img style="width:${m.w}px;height:${m.h}px"></div><div class="ring"></div>`;
  devices.append(el);
  return { el, img: el.querySelector('img'), ring: el.querySelector('.ring'), label: el.querySelector('.label'), w: m.w, h: m.h + 34 };
}
made.studio = makeWindow('studio');
made.win = makeWindow('win');
made.cloud = makeWindow('cloud');
made.home = makeWindow('home');
made.phone = makePhone();

// The grid the machines work in, the phone beside it.
const CELL = 580;
const GRID = { home: [400, 255], studio: [1040, 255], win: [400, 705], cloud: [1040, 705] };
const PHONE_SIDE = { x: 1610, y: 480 };

/** When each machine's chat is opened (pane ms, story.ts) and when its answer comes back. */
const OPENS = { studio: 9200, win: 10100, cloud: 11000 };
const BACK = { studio: 19400, win: 21400, cloud: 19800 };
const sOf = (ms) => ms / 1000 + LEAD;

const PH = (x, y, w, o = 1) => ({ x, y, w, o });
const phoneKeys = [
  [0, PH(960, 540, 440)], [6.0, PH(960, 540, 440)], [7.4, PH(1640, 560, 330)], [9.4, PH(1640, 560, 330)], [11.0, PH(PHONE_SIDE.x, PHONE_SIDE.y, 340)],
  [22.6, PH(PHONE_SIDE.x, PHONE_SIDE.y, 340)], [24.0, PH(960, 540, 440)], [31.2, PH(960, 540, 440)], [32.8, PH(1160, 560, 300)], [34.0, PH(1010, 530, 250, 0)],
];
const homeKeys = [
  [0, PH(560, 620, 900, 0)], [6.0, PH(560, 620, 900, 0)], [7.4, PH(760, 545, 1180)], [9.4, PH(760, 545, 1180)], [11.0, PH(GRID.home[0], GRID.home[1], CELL)],
  [22.6, PH(GRID.home[0], GRID.home[1], CELL)], [24.0, PH(420, 300, 520, 0.5)], [31.2, PH(420, 300, 520, 0.5)], [32.8, PH(840, 470, 560)], [34.0, PH(960, 520, 470, 0)],
];
function machineKeys(key) {
  const open = sOf(OPENS[key]);
  const [gx, gy] = GRID[key];
  const near = { studio: [1500, 300], win: [420, 820], cloud: [1500, 820] }[key];
  const end = { studio: [1080, 430], win: [900, 600], cloud: [1050, 640] }[key];
  return [
    [0, PH(GRID.home[0], GRID.home[1], 200, 0)], [open - 0.05, PH(GRID.home[0] + 120, GRID.home[1] + 40, 220, 0)], [open + 0.9, PH(gx, gy, CELL)],
    [22.6, PH(gx, gy, CELL)], [24.0, PH(near[0], near[1], 460, 0.5)], [31.2, PH(near[0], near[1], 460, 0.5)], [32.8, PH(end[0], end[1], 520)], [34.0, PH(960, 520, 470, 0)],
  ];
}
const KEYS = { phone: phoneKeys, home: homeKeys, studio: machineKeys('studio'), win: machineKeys('win'), cloud: machineKeys('cloud') };

// ---- The wires: from the Mac at home to each machine it opened a chat on, a dot going out and one coming back ----
const wires = document.getElementById('wires');
const NS = 'http://www.w3.org/2000/svg';
const wire = {};
for (const key of ['studio', 'win', 'cloud']) {
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#2fb36b'); path.setAttribute('stroke-width', '3'); path.setAttribute('stroke-linecap', 'round');
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('r', '9'); dot.setAttribute('fill', '#2fb36b');
  wires.append(path, dot);
  wire[key] = { path, dot };
}

// ---- Words ----
const CAPTIONS = [
  [0.4, 5.6, '早上 8:40，地铁上', '在手机上说一句'],
  [6.6, 9.6, '家里的 Mac 接手', '改好代码，但它编不了安卓，也没有 Windows'],
  [11.4, 13.2, '每台机器做它擅长的事', '家里的 Mac 在另外三台上各开一个对话'],
  [13.6, 15.6, 'Studio 编安卓', '编译、装到模拟器、浅色深色各截一张'],
  [16.0, 18.0, 'Win 台式机装新版', '打包、安装、截图'],
  [18.4, 20.0, '云主机跑测试', '312 个单元测试，24 个 e2e'],
  [20.4, 22.4, '结果都回到同一个对话', ''],
  [24.4, 30.8, '三端都好了，合吗？', '在手机上点一下'],
];
const cap = document.getElementById('cap');
const [capH, capP] = [cap.querySelector('h2'), cap.querySelector('p')];
const end = document.getElementById('end');

const TAPS = await fetch('frames/phone/taps.json').then((r) => r.json()).catch(() => []);

/** The camera: where it looks (cx, cy) and how near (z), by keys as the devices'. */
const CAM = (cx, cy, z) => ({ cx, cy, z });
const near = (key) => CAM(GRID[key][0], GRID[key][1] + 10, 1.62);
const cameraKeys = [
  [0, CAM(960, 540, 1)], [13.0, CAM(960, 540, 1)], [13.8, near('studio')], [15.4, near('studio')], [16.2, near('win')], [17.8, near('win')],
  [18.6, near('cloud')], [19.6, near('cloud')], [20.4, CAM(960, 540, 1)],
];
const world = document.getElementById('world');

window.LENGTH = 38;
const shown = {};
async function frame(name, s) {
  const n = PANE_FRAMES[name] ?? 1;
  const f = Math.min(n - 1, Math.floor((paneMs(s) / 1000) * FPS));
  const src = `frames/${name}/${String(f).padStart(5, '0')}.jpg`;
  const d = made[name];
  if (shown[name] !== src) { shown[name] = src; d.img.src = src; await d.img.decode().catch(() => {}); }
}

window.render = async (s) => {
  const pending = [];
  const cam = at(cameraKeys, s);
  world.style.transform = `translate(${960 - cam.cx * cam.z}px, ${540 - cam.cy * cam.z}px) scale(${cam.z})`;
  for (const [name, d] of Object.entries(made)) {
    const p = at(KEYS[name], s);
    const k = p.w / d.w;
    const h = d.h * k;
    d.el.style.transform = `translate(${p.x - p.w / 2}px, ${p.y - h / 2}px) scale(${k})`;
    d.el.style.opacity = String(p.o);
    d.box = { x: p.x - p.w / 2, y: p.y - h / 2, w: p.w, h, o: p.o };
    if (p.o > 0.01) pending.push(frame(name, s));
  }
  // The phone's clock, and a finger where it taps.
  const ms = paneMs(s);
  made.phone.clock.textContent = ms > 20000 ? '8:41' : '8:40';
  const tap = TAPS.findLast?.((t) => ms >= t.t && ms < t.t + 450);
  made.phone.tap.style.opacity = tap ? String(1 - (ms - tap.t) / 450) : '0';
  if (tap) { made.phone.tap.style.left = `${tap.x}px`; made.phone.tap.style.top = `${tap.y}px`; made.phone.tap.style.transform = `scale(${0.8 + 0.4 * (ms - tap.t) / 450})`; }
  // A machine glows as its answer comes back.
  for (const key of ['studio', 'win', 'cloud']) {
    const back = sOf(BACK[key]);
    made[key].ring.style.opacity = String(s > back && s < back + 2.2 ? Math.sin(Math.PI * (s - back) / 2.2) : 0);
  }
  // The wires, between the Mac's window and each machine's, while they all stand in the grid.
  const home = made.home.box;
  for (const key of ['studio', 'win', 'cloud']) {
    const b = made[key].box;
    const open = sOf(OPENS[key]);
    const back = sOf(BACK[key]);
    const from = { x: home.x + home.w * 0.5, y: home.y + home.h * 0.5 };
    const to = { x: b.x + b.w * 0.5, y: b.y + b.h * 0.5 };
    const mx = (from.x + to.x) / 2;
    const d = `M ${from.x} ${from.y} C ${mx} ${from.y}, ${mx} ${to.y}, ${to.x} ${to.y}`;
    const { path, dot } = wire[key];
    path.setAttribute('d', d);
    const len = path.getTotalLength();
    const grow = clamp((s - open) / 0.9);
    const fade = 1 - clamp((s - 22.4) / 0.6);
    path.style.strokeDasharray = `${len}`;
    path.style.strokeDashoffset = `${len * (1 - grow)}`;
    path.style.opacity = String(0.55 * fade * (s > open ? 1 : 0));
    const out = clamp((s - open) / 0.9);
    const ret = clamp((s - back) / 1.0);
    const going = s > open && s < open + 0.9;
    const coming = s > back && s < back + 1.0;
    if (going || coming) {
      const pt = path.getPointAtLength(len * (going ? ease(out) : 1 - ease(ret)));
      dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); dot.style.opacity = String(fade);
    } else dot.style.opacity = '0';
  }
  // The words.
  const c = CAPTIONS.find(([a, b]) => s >= a && s < b);
  if (c) {
    const [a, b, h2, p] = c;
    capH.textContent = h2; capP.textContent = p; capP.style.display = p ? '' : 'none';
    const o = Math.min(clamp((s - a) / 0.5), clamp((b - s) / 0.5));
    cap.style.opacity = String(o);
    cap.style.transform = `translateY(${(1 - o) * 14}px)`;
  } else cap.style.opacity = '0';
  // The end: the devices gone into one, the line.
  const e = clamp((s - 33.6) / 0.9);
  end.style.opacity = String(ease(e) * (1 - clamp((s - 37.2) / 0.8)));
  end.style.transform = `scale(${0.96 + 0.04 * ease(e)})`;
  await Promise.all(pending);
};
await window.render(0);
</script>
</body>
</html>
