<!doctype html>

     record.mjs); the machines are drawn as the things they are, each screen showing the work it does as the story
     goes (an editor, an Android emulator, a Windows install, a terminal of tests), with a line of still.fail under it
     saying which chat sent it there. render(seconds) draws one moment; record.mjs screenshots it frame by frame. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; color: #17181b; -webkit-font-smoothing: antialiased; }

  #desk { position: absolute; left: -900px; right: -900px; top: 830px; height: 700px; background: linear-gradient(#e2ddd5, #ece8e2 40%, #f1efeb); opacity: 0; }

  .phone { width: 418px; height: 872px; border-radius: 62px; background: #121214; padding: 14px; box-shadow: 0 40px 80px -30px rgba(20,20,30,.45), 0 0 0 1.5px #2b2b30 inset; }

  .bat { width: 25px; height: 12px; border: 1.5px solid #17181b; border-radius: 4px; position: relative; opacity: .9; }
  .bat::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: #17181b; border-radius: 1.5px; }
  .tap { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(40,40,50,.22); border: 2px solid rgba(255,255,255,.7); }

  .glass { position: absolute; overflow: hidden; background: #000; }
  .content { position: absolute; left: 0; top: 0; width: 920px; height: 575px; transform-origin: 0 0; overflow: hidden; }
  .sf { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; background: rgba(250,249,247,.96); color: #3b3d42; border-top: 1px solid rgba(0,0,0,.08); }

  .sf .ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #e06d2c; border-right-color: transparent; }
  .sf .ok { width: 14px; height: 14px; border-radius: 50%; background: #2fb36b; position: relative; }
  .sf .ok::after { content: ""; position: absolute; left: 4.5px; top: 2.5px; width: 3px; height: 6px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .sf .idle { width: 10px; height: 10px; border-radius: 50%; background: #b9bbc0; }
  .flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }

  .label { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 18px; white-space: nowrap; text-align: center; }
  .label b { font-size: 26px; font-weight: 650; display: block; }
  .label span { font-size: 17px; color: #6b6d73; display: block; margin-top: 4px; }

  .letter { position: absolute; left: 0; top: 0; width: 52px; height: 36px; margin: -18px 0 0 -26px; border-radius: 7px; background: #fff; box-shadow: 0 10px 24px -6px rgba(20,20,30,.35); border: 2px solid #2fb36b; overflow: hidden; }
  .letter::before { content: ""; position: absolute; left: -2px; right: -2px; top: -2px; height: 22px; background: #e7f6ee; border-bottom: 2px solid #2fb36b; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  svg#wires { position: absolute; left: -600px; top: -600px; width: 3120px; height: 2280px; overflow: visible; }

  .caption { position: absolute; left: 72px; top: 60px; padding: 18px 26px 20px; border-radius: 22px; background: rgba(248,247,244,.92); box-shadow: 0 10px 40px -12px rgba(20,20,30,.18); }
  .caption h2 { font-size: 44px; font-weight: 650; letter-spacing: .5px; }

  #end p { margin-top: 26px; font-size: 34px; color: #5d5f66; font-weight: 500; letter-spacing: .5px; }

  .login { display: flex; flex-direction: column; padding: 22px 18px; border-radius: 16px; }

<script type="module">
const FPS = 60;
/** The phone's clock (ms) at a moment of the film (s): the film starts this much before the phone does anything. */
const LEAD = 0.6;
const paneMs = (s) => Math.max(0, (s - LEAD) * 1000);
const COUNT = await fetch('frames/count.json').then((r) => r.json()).catch(() => ({}));
const TAPS = await fetch('frames/phone/taps.json').then((r) => r.json()).catch(() => []);

const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
/** By keys [seconds, {…numbers}]: the values at `s`, eased between keys. */
function at(keys, s) {
  if (s <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [s1, b] = keys[i];
    const [s0, a] = keys[i - 1];
    if (s <= s1) { const t = ease((s - s0) / (s1 - s0)); return Object.fromEntries(Object.keys(a).map((k) => [k, lerp(a[k], b[k], t)])); }
  }
  return keys.at(-1)[1];
}
/** The last of `[seconds, value]` reached by `s`. */
const latest = (list, s, none = null) => { let v = none; for (const [t, x] of list) if (s >= t) v = x; return v; };
const span = (s, a, b) => clamp((s - a) / (b - a));

// ---- When things happen (film seconds: the phone's story, story.ts, plus LEAD) ----
const T = {
  sent: 4.8,
  opens: { studio: 9.1, win: 10.0, cloud: 10.9 },
  back: { studio: 20.0, cloud: 20.4, win: 22.0 },
  merged: 30.65,
};

// ---- The machines' screens (each drawn at 920 × 575) ----
function strip(chat, s, doing, done, from) {
  if (s < from) return `<div class="sf"><span class="idle"></span><span>still.fail · 空闲</span></div>`;
  const icon = done ? '<span class="ok"></span>' : `<span class="ring" style="transform:rotate(${(s * 360) % 360}deg)"></span>`;
  return `<div class="sf">${icon}<b>${chat}</b><span>· ${esc(doing)}</span><span style="margin-left:auto;color:#8b8d93">still.fail</span></div>`;
}
const lines = (list, s) => list.filter(([t]) => s >= t).map(([, l]) => l).join('\n');
function loginCard(dark, fixed, w = 250) {
  const bg = dark ? '#1c1d21' : '#fff', fg = dark ? '#eceef2' : '#16181d', line = dark ? '#34353b' : '#dcdfe4';
  const btn = fixed ? 'background:#5b5bd6;color:#fff' : (dark ? 'background:#202124;color:#1a1a1a' : 'background:#e9e9ec;color:#e1e1e4');
  return `<div class="login" style="width:${w}px;background:${bg};color:${fg};box-shadow:0 1px 3px rgba(0,0,0,.1)"><div class="lg"></div><h4>登录 Acme</h4><small>欢迎回来</small>
    <div class="f" style="border:1px solid ${line}">you@acme.dev</div><div class="f" style="border:1px solid ${line}">••••••••••</div><div class="btn" style="${btn}">登录</div></div>`;
}

// The Mac at home: its editor, the button's colours changed, its preview beside.
const MAC_DOING = [[4.8, '收到你的消息'], [5.4, '思考中'], [6.7, '搜索 LoginButton'], [7.5, '读取 src/auth/login.css'], [8.2, '编辑 src/auth/login.css'],
  [9.1, '在 Studio 上开对话'], [10.0, '在 Win 台式机上开对话'], [10.9, '在云主机上开对话'], [11.9, '等 3 台机器回来'], [20.0, 'Studio 回来了'], [20.4, '云主机 回来了'],
  [22.0, 'Win 台式机 回来了'], [23.0, '写回复'], [24.2, '等你决定：合进 main 吗？'], [28.0, '运行 gh pr merge'], [30.65, '已合进 main（4f2a9c1）']];
function macScreen(s) {
  const edited = s >= 8.2;
  const found = s >= 6.7 && s < 8.2;
  const code = [
    ['<span class="tok-p">.login</span> { <span class="tok-k">display</span>: grid; <span class="tok-k">gap</span>: <span class="tok-v">12px</span>; }'],
    ['<span class="tok-p">.field</span> { <span class="tok-k">height</span>: <span class="tok-v">44px</span>; }'],
    [''],
    ['<span class="tok-c">/* 登录按钮 */</span>'],
    [`<span class="tok-p" style="${found ? 'background:rgba(255,210,80,.35);border-radius:3px' : ''}">.submit</span> {`],
    ['  <span class="tok-k">height</span>: <span class="tok-v">46px</span>;'],
    ['  <span class="tok-k">color</span>: <span class="tok-v">#1a1a1a</span>;', edited ? 'del' : ''],
    ['  <span class="tok-k">background</span>: <span class="tok-v">#202124</span>;', edited ? 'del' : ''],
    ...(edited ? [['  <span class="tok-k">color</span>: <span class="tok-s">var(--on-primary)</span>;', 'add'], ['  <span class="tok-k">background</span>: <span class="tok-s">var(--primary)</span>;', 'add']] : []),
    ['  <span class="tok-k">font-weight</span>: <span class="tok-v">600</span>;'],
    ['}'],
  ];
  const rows = code.map(([html, cls], i) => `<div class="${cls ?? ''}" style="display:flex;white-space:pre"><span style="width:44px;color:#4b4f63;text-align:right;padding-right:14px">${i + 18}</span><span>${html}</span></div>`).join('');
  const tree = ['src', '  auth', '    LoginForm.tsx', '    login.css', '  pages', '  theme.css'].map((n) => `<div style="padding:3px 14px;white-space:pre;${n.trim() === 'login.css' ? 'background:#2c3040;color:#fff' : ''}">${n}</div>`).join('');
  return `<div style="position:absolute;inset:0;background:#1b1c22;color:#c8cad3">
    <div style="height:36px;background:#24252d;display:flex;align-items:center;padding:0 14px;gap:8px;font-size:14px;color:#9a9db0"><i style="width:12px;height:12px;border-radius:50%;background:#ff5f57;display:block"></i><i style="width:12px;height:12px;border-radius:50%;background:#febc2e;display:block"></i><i style="width:12px;height:12px;border-radius:50%;background:#28c840;display:block"></i><span style="margin-left:14px">login.css — acme</span>${found ? '<span style="margin-left:auto;background:#2c3040;padding:3px 10px;border-radius:6px;color:#fff" class="mono">LoginButton · 1 处</span>' : ''}</div>
    <div style="position:absolute;top:36px;left:0;bottom:34px;width:170px;background:#202129;font-size:14px;padding-top:10px;color:#9a9db0">${tree}</div>
    <div class="code" style="position:absolute;top:50px;left:180px;width:450px">${rows}</div>
    <div style="position:absolute;top:36px;right:0;bottom:34px;width:290px;background:#121316;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
      <span style="font-size:13px;color:#7f8592">预览 · 深色模式</span>${loginCard(true, edited, 230)}</div>
    ${strip('Acme App', s, latest(MAC_DOING, s, ''), s >= T.merged, T.sent)}</div>`;
}

// Studio: building the Android app, putting it on the emulator, its screenshots.
const STUDIO_TERM = [
  [10.2, '<span class="c">~/acme</span> $ git switch fix/login-button'], [10.8, "Switched to branch 'fix/login-button'"],
  [12.6, '<span class="c">~/acme</span> $ ./gradlew assembleDebug'], [12.9, '<span class="d">&gt; Task :app:preBuild</span>'], [13.1, '<span class="d">&gt; Task :app:mergeDebugResources</span>'],
  [13.3, '<span class="d">&gt; Task :app:compileDebugKotlin</span>'], [13.55, '<span class="d">&gt; Task :app:dexBuilderDebug</span>'], [13.75, '<span class="d">&gt; Task :app:packageDebug</span>'],
  [14.0, '<span class="g b">BUILD SUCCESSFUL</span> in 41s'], [14.1, '<span class="c">~/acme</span> $ adb install -r app-debug.apk'], [14.5, '<span class="g">Success</span>'],
  [14.9, '<span class="c">~/acme</span> $ adb exec-out screencap -p &gt; login-dark.png'], [15.2, 'saved <span class="y">login-dark.png</span>'],
];
const STUDIO_DOING = [[9.6, '思考中'], [10.2, '运行 git switch'], [12.6, '运行 gradlew assembleDebug'], [14.1, '运行 adb install'], [14.9, '截图 登录页'], [15.4, '写回复'], [T.back.studio - 0.2, '已回复 Acme App']];
function studioScreen(s) {
  const fixed = s >= 14.6;
  const building = s >= 12.6 && s < 14.0 ? span(s, 12.6, 14.0) : null;
  const flash = s >= 15.0 && s < 15.35 ? 1 - span(s, 15.0, 15.35) : 0;
  const bar = building !== null ? `\n<span class="y">&lt;${'='.repeat(Math.round(building * 26)).padEnd(26, '-')}&gt; ${Math.round(building * 100)}% EXECUTING</span>` : '';
  return `<div style="position:absolute;inset:0;background:linear-gradient(135deg,#c9d6ff,#e2e2e2 60%,#f3d9c4)">
    <div style="position:absolute;left:30px;top:22px;font-size:13px;color:#333">Android 模拟器 · Pixel 9</div>

}

// The Windows desktop: building the installer, installing it, the new version opened.
const WIN_TERM = [
  [11.2, 'PS C:\\acme&gt; git pull'], [11.7, 'Already up to date.'], [12.4, 'PS C:\\acme&gt; pnpm build:win'], [12.9, '<span class="d">vite v7.2  building for production…</span>'],
  [13.6, '<span class="d">✓ 1,284 modules transformed.</span>'], [14.4, '<span class="d">electron-builder  target=nsis arch=x64</span>'], [15.3, '<span class="d">signing  Acme-Setup-2.4.0.exe</span>'],
  [16.0, '<span class="g">built</span> dist\\Acme-Setup-2.4.0.exe'], [16.2, 'PS C:\\acme&gt; .\\dist\\Acme-Setup-2.4.0.exe /S'],
];
const WIN_DOING = [[10.5, '思考中'], [11.2, '运行 git pull'], [12.4, '运行 pnpm build:win'], [16.2, '安装 Acme 2.4.0'], [17.4, '截图 登录页'], [17.9, '写回复'], [T.back.win - 0.2, '已回复 Acme App']];
function winScreen(s) {

      <div style="height:30px;background:#202020;display:flex;align-items:center;padding:0 12px;font-size:13px;color:#ccc">Windows PowerShell<span style="margin-left:auto;letter-spacing:18px">—☐✕</span></div>

    ${app ? `<div style="position:absolute;left:390px;top:50px;width:470px;height:440px;background:#f4f5f7;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden;transform:scale(${0.92 + 0.08 * pop});opacity:${pop}">

      <div style="position:absolute;top:30px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center">${loginCard(false, true, 250)}</div><div class="flash" style="opacity:${flash}"></div></div>` : ''}
    <div style="position:absolute;left:0;right:0;bottom:34px;height:40px;background:rgba(32,32,40,.82);display:flex;align-items:center;justify-content:center;gap:16px">
      ${['#4cc2ff', '#ffb900', '#7fba00', '#f25022'].map((c) => `<i style="width:20px;height:20px;border-radius:4px;background:${c};display:block;opacity:.9"></i>`).join('')}</div>
    ${strip('Windows 上验证登录按钮', s, latest(WIN_DOING, s, ''), s >= T.back.win - 0.2, T.opens.win + 0.5)}</div>`;
}

// The cloud machine: the tests, one by one green.
const TESTS = ['auth/login.test.ts (18)', 'auth/session.test.ts (24)', 'theme/colors.test.ts (12)', 'orders/export.test.ts (31)', 'orders/list.test.ts (27)',
  'api/client.test.ts (40)', 'pages/home.test.ts (22)', 'pages/settings.test.ts (19)', 'ui/button.test.ts (16)', 'ui/form.test.ts (21)', 'billing/plan.test.ts (33)', 'search/query.test.ts (49)'];
const CLOUD_DOING = [[11.4, '思考中'], [12.1, '运行 pnpm install'], [13.2, '运行 pnpm test'], [19.1, '运行 pnpm e2e login'], [19.6, '写回复'], [T.back.cloud - 0.2, '已回复 Acme App']];
const PROMPT = '<span class="g">ci@cloud</span>:<span class="c">~/acme</span>$';
function cloudScreen(s) {
  const out = [[12.1, `${PROMPT} pnpm install --frozen-lockfile`], [12.9, '<span class="d">Lockfile is up to date</span>'], [13.0, 'Done in 6.2s'], [13.2, `${PROMPT} pnpm test`], [13.4, '']];
  const per = (18.6 - 13.6) / TESTS.length;
  TESTS.forEach((t, i) => out.push([13.6 + i * per, ` <span class="g">✓</span> ${t}`]));
  const done = TESTS.filter((_, i) => s >= 13.6 + i * per).length;
  const count = Math.min(312, Math.round((done / TESTS.length) * 312));
  out.push([18.7, ''], [18.7, ' <span class="d">Test Files</span>  <span class="g b">41 passed</span> (41)'], [18.75, '      <span class="d">Tests</span>  <span class="g b">312 passed</span> (312)'],
    [19.1, `${PROMPT} pnpm e2e login`], [19.5, '  <span class="g b">24 passed</span> (2 browsers)']);
  const text = lines(out, s).split('\n').slice(-17).join('\n');
  return `<div style="position:absolute;inset:0;background:#0f1115">
    <div style="height:32px;background:#1a1d23;display:flex;align-items:center;padding:0 14px;font-size:13px;color:#8c93a0">ssh ci@cloud — acme<span style="margin-left:auto" class="mono">${s >= 13.4 && s < 18.7 ? `<span style="color:#5fd38d">${count}</span> / 312` : ''}</span></div>
    <div class="term" style="padding:12px 18px">${text}</div>
    ${strip('跑全部测试', s, latest(CLOUD_DOING, s, ''), s >= T.back.cloud - 0.2, T.opens.cloud + 0.5)}</div>`;
}

// ---- The devices ----
const devices = document.getElementById('devices');
function put(html) { const el = document.createElement('div'); el.className = 'dev'; el.innerHTML = html; devices.append(el); return el; }
/** A screen in a device: its glass (w × h), its content (920 × 575) fitted to it. */
const glass = (w, h, r = 6) => `<div class="glass" style="left:0;top:0;width:${w}px;height:${h}px;border-radius:${r}px"><div class="content" style="transform:scale(${w / 920},${h / 575})"></div></div>`;
const LABELS = { home: ['家里的 Mac', 'MacBook Pro'], studio: ['Studio', 'Mac Studio · 编安卓'], win: ['Win 台式机', 'Windows 11 · 装新版'], cloud: ['云主机', 'Ubuntu 24.04 · 跑测试'] };
const label = (k) => `<div class="label"><b>${LABELS[k][0]}</b><span>${LABELS[k][1]}</span></div>`;

// Each device: its element, the box it is laid out in (w × h, its foot at the bottom), what its screen shows, and
// where its screen's middle is in that box (sx, sy).
const D = {};
// A laptop: its lid, the screen in it, its base.
D.home = { w: 560, h: 356, sx: 280, sy: 163, screen: macScreen, el: put(`<div style="position:absolute;left:28px;top:0;width:504px;height:336px;border-radius:18px 18px 4px 4px;background:#16171a;padding:14px 14px 24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)">
  <div style="position:relative;width:476px;height:298px">${glass(476, 298, 4)}</div></div>
  <div style="position:absolute;left:0;top:336px;width:560px;height:20px;border-radius:2px 2px 14px 14px;background:linear-gradient(#d8d9dd,#a9abb1)"></div>
  <div style="position:absolute;left:230px;top:336px;width:100px;height:7px;border-radius:0 0 8px 8px;background:#9a9ca2"></div>
  <div style="position:absolute;left:0;top:0;width:560px;height:356px">${label('home')}</div>`) };
// Studio: a display on its stand, the Mac Studio beside its foot.
D.studio = { w: 560, h: 420, sx: 280, sy: 161, screen: studioScreen, el: put(`<div style="position:absolute;left:30px;top:0;width:500px;height:322px;border-radius:12px;background:#d9dadf;padding:11px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)">
  <div style="position:relative;width:478px;height:300px">${glass(478, 300, 4)}</div></div>
  <div style="position:absolute;left:245px;top:322px;width:70px;height:86px;background:linear-gradient(90deg,#c9cad0,#e6e7ea,#c9cad0)"></div>
  <div style="position:absolute;left:190px;top:404px;width:180px;height:16px;border-radius:6px;background:linear-gradient(#e3e4e8,#c3c5cb)"></div>
  <div style="position:absolute;left:400px;top:356px;width:140px;height:64px;border-radius:14px;background:linear-gradient(#ebecef,#c8cad0);box-shadow:0 10px 20px -10px rgba(0,0,0,.4)"><i style="position:absolute;left:18px;bottom:12px;width:6px;height:6px;border-radius:50%;background:#7fdc9a;display:block"></i></div>
  <div style="position:absolute;left:0;top:0;width:560px;height:420px">${label('studio')}</div>`) };
// The Windows desktop: a black display, the tower beside it.
D.win = { w: 610, h: 420, sx: 250, sy: 161, screen: winScreen, el: put(`<div style="position:absolute;left:0;top:0;width:500px;height:322px;border-radius:10px;background:#111214;padding:11px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)">
  <div style="position:relative;width:478px;height:300px">${glass(478, 300, 3)}</div></div>
  <div style="position:absolute;left:220px;top:322px;width:60px;height:84px;background:#26272b"></div>
  <div style="position:absolute;left:160px;top:404px;width:180px;height:16px;border-radius:5px;background:#1d1e21"></div>
  <div style="position:absolute;left:516px;top:170px;width:92px;height:250px;border-radius:8px;background:linear-gradient(90deg,#1c1d21,#2c2e33);box-shadow:0 20px 30px -16px rgba(0,0,0,.5)">
    <i style="position:absolute;left:12px;top:20px;width:4px;height:120px;border-radius:2px;background:#4cc2ff;display:block"></i></div>
  <div style="position:absolute;left:0;top:0;width:500px;height:420px">${label('win')}</div>`) };
// The cloud machine: a rack, its console open above it.
D.cloud = { w: 460, h: 420, sx: 230, sy: 145, screen: cloudScreen, el: put(`<div style="position:absolute;left:0;top:0;width:460px;height:290px;border-radius:12px;background:#2a2d33;padding:10px;box-shadow:0 30px 60px -30px rgba(0,0,0,.55)">
  <div style="position:relative;width:440px;height:270px">${glass(440, 270, 6)}</div></div>
  <div style="position:absolute;left:150px;top:290px;width:160px;height:130px;border-radius:6px 6px 2px 2px;background:#1e2025;padding:10px 12px;display:flex;flex-direction:column;gap:9px">
    ${[0, 1, 2, 3].map((i) => `<div style="height:22px;border-radius:3px;background:#2b2e35;display:flex;align-items:center;gap:6px;padding:0 8px"><i class="led" data-i="${i}" style="width:6px;height:6px;border-radius:50%;display:block;background:#2fb36b"></i><i style="width:6px;height:6px;border-radius:50%;display:block;background:#4c5160"></i><span style="margin-left:auto;width:50px;height:3px;background:#3a3e47;display:block"></span></div>`).join('')}</div>
  <div style="position:absolute;left:0;top:0;width:460px;height:420px">${label('cloud')}</div>`) };
for (const d of Object.values(D)) { d.content = d.el.querySelector('.content'); d.label = d.el.querySelector('.label'); d.el.style.width = `${d.w}px`; d.el.style.height = `${d.h}px`; }

// The phone.
const phoneEl = put(`<div class="phone"><div class="screen"><img><div class="status"><span class="clock">8:40</span><span class="r">5G <span style="letter-spacing:-1px">▮▮▮▮</span> <span class="bat"></span></span></div><div class="island"></div><div class="tap" style="opacity:0"></div></div></div>`);
phoneEl.style.transformOrigin = '50% 50%';
const phone = { el: phoneEl, img: phoneEl.querySelector('img'), clock: phoneEl.querySelector('.clock'), tap: phoneEl.querySelector('.tap'), w: 418, h: 872 };

// ---- Where they stand ----
// The desk: the four machines side by side, their feet on one line (world px).
const FOOT = 830;
const ROW = { home: 290, studio: 860, win: 1440, cloud: 1990 };
/** A device's key: its foot's middle (x, y), its scale (k), its opacity (o). */
const K = (x, y, k, o = 1) => ({ x, y, k, o });
const rowAt = (key) => K(ROW[key], FOOT, 1);
// Behind the phone while it is in front: the row, smaller, faded.
const behind = (key) => K(960 + (ROW[key] - 1140) * 0.6, 820, 0.6, 0.3);
const together = (key, i) => K(900 + i * 26, 700 + i * 16, 0.5);
const gone = (key, i) => K(940 + i * 10, 640 + i * 6, 0.36, 0);
const KEYS = {
  phone: [[0, K(960, 540, 1.04)], [6.0, K(960, 540, 1.04)], [7.4, K(1600, 560, 0.78)], [9.0, K(1600, 560, 0.78)], [10.4, K(2300, 560, 0.7, 0)],
    [22.6, K(2300, 560, 0.7, 0)], [24.0, K(960, 540, 1.04)], [31.2, K(960, 540, 1.04)], [32.8, K(1060, 560, 0.5)], [33.8, K(1000, 560, 0.36, 0)]],
  home: [[0, K(700, 1000, 1.6, 0)], [6.0, K(700, 1000, 1.6, 0)], [7.4, K(720, 880, 2.0)], [9.0, K(720, 880, 2.0)], [10.4, rowAt('home')], [22.6, rowAt('home')],
    [24.0, behind('home')], [31.2, behind('home')], [32.8, together('home', 0)], [33.8, gone('home', 0)]],
};
for (const [i, key] of ['studio', 'win', 'cloud'].entries()) {
  const open = T.opens[key] + 0.5;
  KEYS[key] = [[0, K(ROW[key], FOOT + 40, 0.9, 0)], [open, K(ROW[key], FOOT + 40, 0.9, 0)], [open + 0.6, rowAt(key)], [22.6, rowAt(key)],
    [24.0, behind(key)], [31.2, behind(key)], [32.8, together(key, i + 1)], [33.8, gone(key, i + 1)]];
}
/** The camera: where it looks (cx, cy) and how near (z). Wide: the desk; near: one machine's screen. */
const CAM = (cx, cy, z) => ({ cx, cy, z });
const WIDE = CAM(1140, 640, 0.8);
const near = (key, z = 1.85) => CAM(ROW[key] - D[key].w / 2 + D[key].sx, FOOT - D[key].h + D[key].sy + 30, z);
const CAMERA = [[0, CAM(960, 540, 1)], [9.0, CAM(960, 540, 1)], [10.6, WIDE], [12.3, WIDE], [12.9, near('studio')], [15.3, near('studio')], [15.8, near('win')], [17.9, near('win')],
  [18.4, near('cloud')], [19.6, near('cloud')], [20.2, WIDE], [22.6, WIDE], [24.0, CAM(960, 540, 1)]];
const world = document.getElementById('world');
const desk = document.getElementById('desk');

// ---- The letters ----
const wires = document.getElementById('wires');
const NS = 'http://www.w3.org/2000/svg';
const wire = {}, letter = {};
for (const key of ['studio', 'win', 'cloud']) {
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#2fb36b'); path.setAttribute('stroke-width', '3'); path.setAttribute('stroke-dasharray', '2 10'); path.setAttribute('stroke-linecap', 'round');
  wires.append(path);
  wire[key] = path;
  const l = document.createElement('div'); l.className = 'letter'; devices.append(l); letter[key] = l;
}
/** Where a device's screen's middle is now, in world px. */
function screenMid(key) { const d = D[key], b = d.box; return { x: b.x + (d.sx - d.w / 2) * b.k, y: b.y - (d.h - d.sy) * b.k }; }

// ---- Words ----
const CAPTIONS = [
  [0.4, 5.6, '早上 8:40，地铁上', '在手机上说一句'],
  [6.4, 9.0, '家里的 Mac 接手', '找到原因，改好代码'],
  [9.3, 12.3, '可它编不了安卓，也没有 Windows', '于是给另外三台机器各写了一封信'],
  [12.9, 15.2, 'Studio 编安卓', '装进模拟器，按钮看得清了'],
  [15.8, 17.9, 'Win 台式机装新版', '打包、安装、截图'],
  [18.4, 19.7, '云主机跑测试', '312 个单元测试，24 个 e2e'],
  [20.2, 22.5, '结果都寄回来', '回到你在手机上说话的那个对话'],
  [24.4, 30.9, '三端都好了，合吗？', '在手机上点一下'],
];
const cap = document.getElementById('cap');
const [capH, capP] = [cap.querySelector('h2'), cap.querySelector('p')];
const end = document.getElementById('end');

window.LENGTH = 38;
let shownSrc = null;
window.render = async (s) => {
  const cam = at(CAMERA, s);
  world.style.transform = `translate(${960 - cam.cx * cam.z}px, ${540 - cam.cy * cam.z}px) scale(${cam.z})`;
  desk.style.opacity = String(clamp((s - 9.0) / 1.4) * (1 - clamp((s - 22.6) / 1.2)) * 0.9);
  // The machines, and what their screens show now.
  for (const [key, d] of Object.entries(D)) {
    const p = at(KEYS[key], s);
    d.box = p;
    d.el.style.transform = `translate(${p.x - d.w / 2}px, ${p.y - d.h}px) scale(${p.k})`;
    d.el.style.opacity = String(p.o);
    d.label.style.opacity = String(p.k <= 1.05 && s < 23.2 ? clamp((1.5 - cam.z) / 0.4) : 0);
    if (p.o > 0.01) d.content.innerHTML = d.screen(s);
  }
  for (const l of document.querySelectorAll('.led')) l.style.background = Math.floor(s * 7 + Number(l.dataset.i) * 3) % 4 !== 0 ? '#2fb36b' : '#20402d';
  // The phone.
  const p = at(KEYS.phone, s);
  phone.el.style.transform = `translate(${p.x - phone.w / 2}px, ${p.y - phone.h / 2}px) scale(${p.k})`;
  phone.el.style.opacity = String(p.o);
  const ms = paneMs(s);
  phone.clock.textContent = ms > 20000 ? '8:41' : '8:40';
  const tap = TAPS.findLast((t) => ms >= t.t && ms < t.t + 450);
  phone.tap.style.opacity = tap ? String(1 - (ms - tap.t) / 450) : '0';
  if (tap) { phone.tap.style.left = `${tap.x}px`; phone.tap.style.top = `${tap.y}px`; phone.tap.style.transform = `scale(${0.8 + 0.4 * (ms - tap.t) / 450})`; }
  let pending = null;
  if (p.o > 0.01) {
    const n = COUNT.phone ?? 1;
    const src = `frames/phone/${String(Math.min(n - 1, Math.floor((ms / 1000) * FPS))).padStart(5, '0')}.jpg`;
    if (src !== shownSrc) { shownSrc = src; phone.img.src = src; pending = phone.img.decode().catch(() => {}); }
  }
  // The letters: out from the Mac at home as it opens each chat, back as each answers.
  const home = screenMid('home');
  for (const key of ['studio', 'win', 'cloud']) {
    const to = screenMid(key);
    const mx = (home.x + to.x) / 2, top = Math.min(home.y, to.y) - 200;
    const path = wire[key];
    path.setAttribute('d', `M ${home.x + 600} ${home.y + 600} Q ${mx + 600} ${top + 600}, ${to.x + 600} ${to.y + 600}`);
    const open = T.opens[key], back = T.back[key];
    path.style.opacity = String(0.7 * clamp((s - open) / 0.3) * (1 - clamp((s - 22.6) / 0.6)));
    const len = path.getTotalLength();
    const l = letter[key];
    const going = s >= open && s < open + 0.9, coming = s >= back && s < back + 1.0;
    if (going || coming) {
      const t = going ? ease(span(s, open, open + 0.9)) : 1 - ease(span(s, back, back + 1.0));
      const pt = path.getPointAtLength(len * t);
      l.style.transform = `translate(${pt.x - 600}px, ${pt.y - 600}px) rotate(${(t - 0.5) * 16}deg) scale(${1.25 / cam.z})`;
      l.style.opacity = '1';
    } else l.style.opacity = '0';
  }
  // The words.
  const c = CAPTIONS.find(([a, b]) => s >= a && s < b);
  if (c) {
    const [a, b, h2, sub] = c;
    capH.textContent = h2; capP.textContent = sub; capP.style.display = sub ? '' : 'none';
    const o = Math.min(clamp((s - a) / 0.4), clamp((b - s) / 0.4));
    cap.style.opacity = String(o);
    cap.style.transform = `translateY(${(1 - o) * -12}px)`;
  } else cap.style.opacity = '0';
  const e = clamp((s - 33.4) / 0.9);
  end.style.opacity = String(ease(e) * (1 - clamp((s - 37.2) / 0.8)));
  end.style.transform = `scale(${0.96 + 0.04 * ease(e)})`;
  await pending;
};
await window.render(0);
</script>
</body>
</html>
