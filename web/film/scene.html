     render(seconds) draws one moment; record.mjs screenshots it frame by frame. -->

<script type="module">
import * as THREE from 'three';

function painted(w, h, draw, repeat) {

// ---- The room ----
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), physical({ color: 0xcfc8be, roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const desk = new THREE.Mesh(new RoundedBoxGeometry(3.0, 0.036, 1.05, 4, 0.008), physical({ map: WOOD, roughness: 0.48, clearcoat: 0.25, clearcoatRoughness: 0.4 }));
desk.position.set(0, DESK_Y - 0.018, -0.2); desk.castShadow = desk.receiveShadow = true; scene.add(desk);

}

const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.055, 0.14, 40), physical({ color: 0xe9e4dc, roughness: 0.6 }));

for (let i = 0; i < 14; i++) {

  const a = i * 2.4, r = 0.03 + (i % 4) * 0.018;

// ---- Light: a window's, from the left, and the room's ----
const sun = new THREE.DirectionalLight(0xfff3e2, 2.6);
sun.position.set(-3, 5, 3.5); sun.castShadow = true;

scene.add(new THREE.HemisphereLight(0xf4f1ec, 0xb9ad9c, 0.55));

// ---- Screens: their pictures, one frame of screens.html (or the phone's) at a time ----
/** A screen's glass: a plane w × h with rounded corners (r), its picture on it, lit by itself, the room reflected. */
function glassOf(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r); s.lineTo(w / 2, h / 2 - r);
  s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); s.lineTo(-w / 2, -h / 2 + r);
  s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  const g = new THREE.ShapeGeometry(s, 12);
  const pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / w + 0.5, pos.getY(i) / h + 0.5);
  const tex = new THREE.Texture(); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16; tex.generateMipmaps = true; tex.minFilter = THREE.LinearMipmapLinearFilter;
  const m = new THREE.MeshPhysicalMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 1.12, roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05 });
  const mesh = new THREE.Mesh(g, m);
  return { mesh, tex };
}
const shown = {};
/** The phone's picture: the app's frame, and over it what the system draws (its clock, its signal, the island). */
const phoneCanvas = document.createElement('canvas'); phoneCanvas.width = 780; phoneCanvas.height = 1688;
/** Puts frame `src` on a screen's texture (loaded and decoded first); the phone's with `clock` in its status bar. */
async function show(screen, src, clock) {
  const key = `${src}|${clock ?? ''}`;
  if (shown[screen.key] === key) return;
  shown[screen.key] = key;
  const img = new Image(); img.src = src;
  await img.decode().catch(() => {});
  if (screen.key !== 'phone') { screen.tex.image = img; screen.tex.needsUpdate = true; return; }
  const g = phoneCanvas.getContext('2d');
  g.drawImage(img, 0, 0, 780, 1688);
  g.fillStyle = '#17181b'; g.font = '600 34px -apple-system, "Helvetica Neue"'; g.textBaseline = 'middle';
  g.fillText(clock, 78, 66);
  g.font = '600 26px -apple-system, "Helvetica Neue"'; g.fillText('5G', 556, 66);
  for (let i = 0; i < 4; i++) g.fillRect(604 + i * 11, 74 - 8 - i * 5, 7, 8 + i * 5);
  g.strokeStyle = '#17181b'; g.lineWidth = 3; g.beginPath(); g.roundRect(660, 52, 50, 26, 8); g.stroke();
  g.fillRect(665, 57, 34, 16); g.fillRect(712, 60, 4, 10);
  g.fillStyle = '#000'; g.beginPath(); g.roundRect(390 - 122, 22, 244, 72, 36); g.fill();
  screen.tex.image = phoneCanvas; screen.tex.needsUpdate = true;
}

const R = (geo, mat, cast = true) => { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; };
const box = (w, h, d, r = 0.004) => new RoundedBoxGeometry(w, h, d, 4, r);

// The Mac at home: a laptop, open, turned towards the middle of the desk.
const laptop = new THREE.Group();
{
  const base = R(box(0.312, 0.0155, 0.221, 0.006), ALU); base.position.y = 0.0078; laptop.add(base);
  const keys = R(new THREE.PlaneGeometry(0.27, 0.1), physical({ color: 0x1b1c1e, roughness: 0.6 }), false); keys.rotation.x = -Math.PI / 2; keys.position.set(0, 0.0157, -0.035); laptop.add(keys);
  const pad = R(new THREE.PlaneGeometry(0.13, 0.08), physical({ color: 0xb9bbc0, metalness: 0.6, roughness: 0.25 }), false); pad.rotation.x = -Math.PI / 2; pad.position.set(0, 0.0157, 0.06); laptop.add(pad);

  const g = glassOf(0.29, 0.18125, 0.006); g.mesh.position.set(0, 0.11, 0.0027); lid.add(g.mesh);
  laptop.userData.screen = { key: 'home', ...g, mesh: g.mesh };
}
laptop.position.set(-0.98, DESK_Y, 0.24); laptop.rotation.y = 0.42; scene.add(laptop);

// Studio: a display on its stand, the Mac Studio beside it.
const studio = new THREE.Group();
{
  const foot = R(box(0.17, 0.008, 0.2, 0.003), ALU); foot.position.set(0, 0.004, 0); studio.add(foot);
  const arm = R(box(0.15, 0.3, 0.012, 0.004), ALU); arm.position.set(0, 0.16, -0.035); arm.rotation.x = -0.12; studio.add(arm);
  const body = R(box(0.623, 0.36, 0.028, 0.012), ALU); body.position.set(0, 0.39, 0.0); studio.add(body);
  const bezel = R(box(0.613, 0.35, 0.002, 0.01), GLASS, false); bezel.position.set(0, 0.39, 0.0145); studio.add(bezel);

  studio.userData.screen = { key: 'studio', ...g };

  const led = new THREE.Mesh(new THREE.CircleGeometry(0.0025, 16), new THREE.MeshBasicMaterial({ color: 0xffffff })); led.position.set(0.27, 0.02, 0.269); studio.add(led);
}
studio.position.set(-0.5, DESK_Y, -0.38); studio.rotation.y = 0.14; scene.add(studio);

// The Windows desktop: a black display, the tower behind it, its light.
const win = new THREE.Group();
{

  const arm = R(box(0.06, 0.3, 0.03, 0.005), BLACK); arm.position.set(0, 0.16, -0.04); win.add(arm);

  // The tower stands under the desk, its light on the floor.
  const tower = R(box(0.21, 0.46, 0.44, 0.01), BLACK); tower.position.set(0.3, -DESK_Y + 0.23, 0.05); win.add(tower);
  const strip = new THREE.Mesh(new THREE.PlaneGeometry(0.006, 0.34), new THREE.MeshBasicMaterial({ color: 0x4cc2ff })); strip.position.set(0.3 - 0.07, -DESK_Y + 0.25, 0.271); win.add(strip);
}
win.position.set(0.15, DESK_Y, -0.4); win.rotation.y = -0.06; scene.add(win);

// The cloud machine: a rack in a machine room far away; what it does seen over ssh, a window on the desk's right.
const cloud = new THREE.Group();
{
  const rack = R(box(0.6, 1.95, 0.8, 0.01), physical({ color: 0x1c1e22, metalness: 0.55, roughness: 0.45 })); rack.position.set(0, 0.975, 0); cloud.add(rack);

cloud.position.set(1.62, 0, -0.95); cloud.rotation.y = -0.3; // (the rack: far away in its machine room, not in this room)

{
  const frame = R(box(0.6, 0.39, 0.012, 0.012), physical({ color: 0x24262b, metalness: 0.3, roughness: 0.3, transparent: true, opacity: 0.92 }), false); ssh.add(frame);

}
ssh.position.set(0.78, DESK_Y + 0.4, -0.3); ssh.rotation.y = -0.32; scene.add(ssh);

// The phone, on a train: the person's, the real app on it, the city going by behind it.
const PHONE_AT = new THREE.Vector3(30, 1.3, 0);
const phone = new THREE.Group();
{

  const front = R(box(0.0706, 0.1467, 0.001, 0.0105), GLASS, false); front.position.z = 0.0041; phone.add(front);

}

// The train's window behind it: dusk, the city's lights going by, out of focus.
const CITY = painted(2048, 1024, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#2b3557'); sky.addColorStop(0.55, '#6a5a78'); sky.addColorStop(1, '#d99a73');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);

  for (let i = 0; i < 160; i++) {

// ---- The work sent out and its answers: light along a line from the laptop to each ----
const DOT = painted(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(120,255,170,1)'); r.addColorStop(0.35, 'rgba(60,220,130,.6)'); r.addColorStop(1, 'rgba(47,179,107,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); });
const midOf = (g) => { const v = new THREE.Vector3(); g.userData.screen.mesh.getWorldPosition(v); return v; };
const SENT = 9.4;
const BACK = { studio: 20.0, cloud: 20.4, win: 22.0 };
const routes = {};
for (const [key, g] of Object.entries({ studio, win, cloud: ssh })) {
  const a = midOf(laptop).add(new THREE.Vector3(0, 0.1, 0)), b = midOf(g).add(new THREE.Vector3(0, 0.19, 0));

const LAPTOP_SHOT = shot(lapMid.clone().add(V(0.2, 0.06, 0.4)), lapMid.clone(), 30, 0.004);
const LAPTOP_NEAR = shot(lapMid.clone().add(V(0.15, 0.04, 0.3)), lapMid.clone().add(V(0.01, 0, 0)), 30, 0.004);
const WIDE = shot(V(-0.12, 1.3, 2.05), V(-0.1, 0.97, -0.3), 38, 0);
const WIDE_IN = shot(V(-0.11, 1.27, 1.9), V(-0.1, 0.98, -0.3), 38, 0);
const ROOM = shot(V(-0.05, 1.5, 2.3), V(-0.08, 0.9, -0.25), 38, 0);
/** Scenes: [from, to, shot at from, shot at to]; a cut between scenes. */
const SCENES = [
  [0, 6.0, PHONE_SHOT, PHONE_SHOT],
  [6.0, 9.0, LAPTOP_SHOT, LAPTOP_NEAR],
  [9.0, 22.6, LAPTOP_NEAR, WIDE_IN, (s) => (s < 10.6 ? ease(span(s, 9.0, 10.6)) * 0.55 : 0.55 + 0.45 * span(s, 10.6, 22.6))],
  [22.6, 31.4, PHONE_SHOT, PHONE_SHOT],
  [31.4, 38, WIDE, ROOM],
];
function cameraAt(s) {
  const sc = SCENES.find(([a, b]) => s >= a && s < b) ?? SCENES.at(-1);
  const [a, b, from, to, curve] = sc;
  let t = curve ? curve(s) : ease(span(s, a, b));
  if (sc === SCENES[2]) {
    // Pulled back to the desk, then on towards it, slowly, while the three work.
    const k = ease(span(s, 9.0, 10.6));
    const p = from.pos.clone().lerp(WIDE.pos, k).lerp(WIDE_IN.pos, span(s, 10.6, 22.6) * k);
    const at = from.at.clone().lerp(WIDE.at, k).lerp(WIDE_IN.at, span(s, 10.6, 22.6) * k);
    return { pos: p, at, fov: from.fov + (WIDE.fov - from.fov) * k, blur: from.blur * (1 - k) };
  }
  return { pos: from.pos.clone().lerp(to.pos, t), at: from.at.clone().lerp(to.at, t), fov: from.fov + (to.fov - from.fov) * t, blur: from.blur + (to.blur - from.blur) * t };
}

// ---- Post: focus, then the picture as the screen shows it ----
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 0.4, aperture: 0.0, maxblur: 0.01 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());

// ---- Words ----
const CAPTIONS = [
  [0.4, 5.6, '早上 8:40，地铁上', '在手机上说一句'],
  [6.3, 9.0, '家里的 Mac 接手', '找到原因，改好代码'],
  [9.3, 11.8, '可它编不了安卓，也没有 Windows', '同一刻，把活派给另外三台'],
  [12.2, 19.6, '三台一起干', 'Studio 编安卓 · Win 台式机打包安装 · 云主机跑测试'],
  [20.0, 22.5, '结果陆续回来', '都回到你在手机上说话的那个对话'],
  [23.0, 31.0, '三端都好了，合吗？', '在手机上点一下'],
];
const TAGS = { laptop: ['家里的 Mac', 'MacBook Pro'], studio: ['Studio', 'Mac Studio'], win: ['Win 台式机', 'Windows 11'], ssh: ['云主机', '在机房 · ssh 连着'] };
const tagEls = {};
for (const [k, [a, b]] of Object.entries(TAGS)) { const el = document.createElement('div'); el.className = 'tag'; el.innerHTML = `<i></i>${a}<span>${b}</span>`; document.getElementById('tags').append(el); tagEls[k] = el; }
const TAG_AT = { laptop: [laptop, V(0, 0.27, -0.12)], studio: [studio, V(0, 0.6, 0)], win: [win, V(0, 0.6, 0)], ssh: [ssh, V(0, 0.23, 0)] };
const cap = document.getElementById('cap'), capH = cap.querySelector('h2'), capP = cap.querySelector('p');
const clockEl = document.getElementById('clock'), clockText = document.getElementById('clockText');
const fade = document.getElementById('fade'), end = document.getElementById('end'), tapEl = document.getElementById('tap');

window.LENGTH = 38;
window.render = async (s) => {
  // What the screens show now.
  const f = Math.floor(s * SCREEN_FPS);
  const waits = [];
  for (const sc of SCREENS) {
    if (sc.key === 'phone') {
      const n = COUNT.phone ?? 1;
      waits.push(show(sc, `frames/phone/${String(Math.min(n - 1, Math.floor((paneMs(s) / 1000) * FPS))).padStart(5, '0')}.jpg`, paneMs(s) > 20000 ? '8:41' : '8:40'));
    } else {
      const n = COUNT[`screen-${sc.key}`] ?? 1;
      waits.push(show(sc, `frames/screen-${sc.key}/${String(Math.min(n - 1, f)).padStart(5, '0')}.jpg`));
    }
  }
  await Promise.all(waits);
  // The machine room's lights; the city going by.
  for (const { led, i, j } of cloud.userData.leds) led.material.color.setHex(Math.floor(s * 9 + i * 5 + j * 3) % 5 === 0 ? 0x15301f : j === 2 ? 0x3aa0ff : 0x2fb36b);
  CITY.offset.x = s * 0.06;
  // The work going out (all at once) and the answers coming back.
  for (const [key, r] of Object.entries(routes)) {
    const back = BACK[key];
    // Bright while something goes along it, faint between.
    const busy = Math.max(1 - clamp(Math.abs(s - (SENT + 0.5)) / 1.0), 1 - clamp(Math.abs(s - (back + 0.55)) / 1.0));
    r.tube.material.opacity = (0.18 + 0.6 * busy) * clamp((s - SENT) / 0.3) * (1 - clamp((s - 22.4) / 0.5));
    const going = s >= SENT && s < SENT + 1.0, coming = s >= back && s < back + 1.1;
    r.pulses.forEach((p, i) => {
      const lag = i * 0.07;
      const t = going ? ease(clamp((s - SENT) / 1.0 - lag)) : coming ? 1 - ease(clamp((s - back) / 1.1 - lag)) : null;
      p.visible = t !== null && t > 0 && t < 1;
      if (p.visible) { p.position.copy(r.curve.getPointAt(t)); p.material.opacity = 1 - i * 0.28; }
    });
  }
  // At the end the phone is on the desk with the rest.
  if (s >= 31.4) { phone.position.set(0.05, DESK_Y + 0.0045, 0.36); phone.rotation.set(-Math.PI / 2, 0, 0.3); }
  else { phone.position.copy(PHONE_AT); phone.rotation.set(0, -0.08, 0); }
  // The camera.
  const c = cameraAt(s);
  camera.position.copy(c.pos); camera.fov = c.fov; camera.updateProjectionMatrix(); camera.lookAt(c.at);
  bokeh.uniforms.focus.value = c.pos.distanceTo(c.at);
  bokeh.uniforms.aperture.value = c.blur;
  composer.render();
  // Over the picture: where each machine is, the words, the clock, a finger on the phone.
  const tagsOn = s >= 10.4 && s < 22.4 ? Math.min(clamp((s - 10.4) / 0.5), clamp((22.4 - s) / 0.4)) : 0;
  for (const [k, [g, off]] of Object.entries(TAG_AT)) {
    const v = off.clone(); g.localToWorld(v); v.project(camera);
    const el = tagEls[k];
    el.style.left = `${(v.x + 1) / 2 * W}px`; el.style.top = `${(1 - v.y) / 2 * H}px`;
    el.style.opacity = String(tagsOn);
  }
  const capNow = CAPTIONS.find(([a, b]) => s >= a && s < b);
  if (capNow) {
    const [a, b, h2, sub] = capNow;
    capH.textContent = h2; capP.textContent = sub;
    const o = Math.min(clamp((s - a) / 0.4), clamp((b - s) / 0.4));
    cap.style.opacity = String(o); cap.style.transform = `translateY(${(1 - o) * -12}px)`;
  } else cap.style.opacity = '0';
  const minutes = s < 9.4 ? 40 : Math.min(53, 41 + Math.floor((s - 9.4) / (22.2 - 9.4) * 12));
  clockText.textContent = `8:${minutes}`;
  clockEl.style.opacity = String(s >= 10.4 && s < 22.4 ? Math.min(clamp((s - 10.4) / 0.4), clamp((22.4 - s) / 0.4)) : 0);
  // A finger's tap, where it lands on the phone's screen.
  const ms = paneMs(s);
  const tap = (s < 6 || (s >= 22.6 && s < 31.4)) ? TAPS.findLast((t) => ms >= t.t && ms < t.t + 450) : null;
  if (tap) {
    const v = V((tap.x / 390 - 0.5) * 0.0672, (0.5 - tap.y / 844) * 0.1455, 0.006); phone.localToWorld(v); v.project(camera);
    tapEl.style.left = `${(v.x + 1) / 2 * W}px`; tapEl.style.top = `${(1 - v.y) / 2 * H}px`;
    const k = (ms - tap.t) / 450; tapEl.style.opacity = String(1 - k); tapEl.style.transform = `scale(${0.8 + 0.4 * k})`;
  } else tapEl.style.opacity = '0';
  // Cuts: a moment of black between places; the end, the line.
  const cut = (at) => 1 - clamp(Math.abs(s - at) / 0.18);
  fade.style.opacity = String(Math.max(cut(6.0), cut(22.6), cut(31.4), 1 - clamp(s / 0.3)));
  const e = clamp((s - 34.0) / 0.9);
  end.style.opacity = String(ease(e) * (1 - clamp((s - 37.2) / 0.8)));
};
await window.render(0);
window.ready = true;
</script>
</body>
</html>
