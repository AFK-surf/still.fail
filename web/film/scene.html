function cameraAt(s) {
  const sc = SCENES.find(([a, b]) => s >= a && s < b) ?? SCENES.at(-1);
  const [a, b, from, to, curve] = sc;
  let t = curve ? curve(s) : ease(span(s, a, b));
  if (sc === SCENES[2]) {
    // Pulled back to the desk, then on towards it, slowly, while the three work.
    const k = ease(span(s, 9.0, 10.6));
    const p = from.pos.clone().lerp(WIDE.pos, k).lerp(WIDE_IN.pos, span(s, 10.6, 22.6) * k);
    const at = from.at.clone().lerp(WIDE.at, k).lerp(WIDE_IN.at, span(s, 10.6, 22.6) * k);
    return { pos: p, at, fov: from.fov + (WIDE.fov - from.fov) * k, blur: from.blur * (1 - k) };
  }
  return { pos: from.pos.clone().lerp(to.pos, t), at: from.at.clone().lerp(to.at, t), fov: from.fov + (to.fov - from.fov) * t, blur: from.blur + (to.blur - from.blur) * t };
}

// ---- Post: focus, then the picture as the screen shows it ----
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const ao = new N8AOPass(scene, camera, W, H);
Object.assign(ao.configuration, { gammaCorrection: false, aoRadius: 0.25, distanceFalloff: 0.6, intensity: 2.2, halfRes: false, aoSamples: 16, denoiseSamples: 8 });
composer.addPass(ao);
const bokeh = new BokehPass(scene, camera, { focus: 0.4, aperture: 0.0, maxblur: 0.01 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());

// ---- Words ----
const CAPTIONS = [
  [0.4, 5.6, '早上 8:40，地铁上', '在手机上说一句'],
  [6.3, 9.0, '家里的 Mac 接手', '找到原因，改好代码'],
  [9.3, 11.8, '可它编不了安卓，也没有 Windows', '同一刻，把活派给另外三台'],
  [12.2, 19.6, '三台一起干', 'Studio 编安卓 · Win 台式机打包安装 · 云主机跑测试'],
  [20.0, 22.5, '结果陆续回来', '都回到你在手机上说话的那个对话'],
  [23.0, 31.0, '三端都好了，合吗？', '在手机上点一下'],
];
const TAGS = { laptop: ['家里的 Mac', 'MacBook Pro'], studio: ['Studio', 'Mac Studio'], win: ['Win 台式机', 'Windows 11'], ssh: ['云主机', '在机房 · ssh 连着'] };
const tagEls = {};
for (const [k, [a, b]] of Object.entries(TAGS)) { const el = document.createElement('div'); el.className = 'tag'; el.innerHTML = `<i></i>${a}<span>${b}</span>`; document.getElementById('tags').append(el); tagEls[k] = el; }
const TAG_AT = { laptop: [laptop, V(0, laptop.userData.size.y + 0.03, -0.1)], studio: [studio, V(0, studio.userData.size.y + 0.03, 0)], win: [win, V(0, win.userData.size.y + 0.03, 0)], ssh: [ssh, V(0, 0.23, 0)] };
const cap = document.getElementById('cap'), capH = cap.querySelector('h2'), capP = cap.querySelector('p');
const clockEl = document.getElementById('clock'), clockText = document.getElementById('clockText');
const fade = document.getElementById('fade'), end = document.getElementById('end'), tapEl = document.getElementById('tap');

/** The moment's camera, and where the phone is; the place's light. */
function pose(s) {
  // At the end the phone is on the desk with the rest.
  if (s >= 31.4) { phone.position.set(0.05, DESK_Y + 0.0045, 0.36); phone.rotation.set(-Math.PI / 2, 0, 0.3); }
  else { phone.position.copy(PHONE_AT); phone.rotation.set(0, -0.08, 0); }
  // The camera; in the station the station's light and its picture, at the desk the room's.
  const onTrain = s < 6.0 || (s >= 22.6 && s < 31.4);
  scene.environment = onTrain ? metroEnv : officeEnv;
  scene.background = onTrain ? metroHdr : null;
  scene.backgroundBlurriness = 0.12; scene.backgroundIntensity = 0.9;
  scene.backgroundRotation.y = 1.2 + s * 0.02;
  const c = cameraAt(s);
  camera.position.copy(c.pos); camera.fov = c.fov; camera.updateProjectionMatrix(); camera.lookAt(c.at);
  bokeh.uniforms.focus.value = c.pos.distanceTo(c.at);
  bokeh.uniforms.aperture.value = c.blur;
  return { ...c, onTrain };
}

/** The lines between the machines, and what goes along them, drawn over the picture (the overlay's). */
function drawLines(s) {
  const g = lines2d.getContext('2d');
  g.clearRect(0, 0, W, H);
  for (const [key, r] of Object.entries(routes)) {
    const back = BACK[key];
    const busy = Math.max(1 - clamp(Math.abs(s - (SENT + 0.5)) / 1.0), 1 - clamp(Math.abs(s - (back + 0.55)) / 1.0));
    const a = (0.25 + 0.6 * busy) * clamp((s - SENT) / 0.3) * (1 - clamp((s - 22.4) / 0.5));
    if (a <= 0.01) continue;
    const px = (p) => { const v = p.clone().project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H, v.z]; };
    g.beginPath();
    for (let i = 0; i <= 80; i++) { const [x, y] = px(r.curve.getPointAt(i / 80)); if (i) g.lineTo(x, y); else g.moveTo(x, y); }
    g.strokeStyle = `rgba(110,235,160,${a})`; g.lineWidth = 2.5; g.setLineDash([3, 9]); g.lineCap = 'round'; g.stroke(); g.setLineDash([]);
    const going = s >= SENT && s < SENT + 1.0, coming = s >= back && s < back + 1.1;
    for (let i = 0; i < 3; i++) {
      const t = going ? ease(clamp((s - SENT) / 1.0 - i * 0.07)) : coming ? 1 - ease(clamp((s - back) / 1.1 - i * 0.07)) : null;
      if (t === null || t <= 0 || t >= 1) continue;
      const [x, y] = px(r.curve.getPointAt(t));
      const glow = g.createRadialGradient(x, y, 0, x, y, 26);
      glow.addColorStop(0, `rgba(170,255,200,${1 - i * 0.28})`); glow.addColorStop(0.3, `rgba(80,225,140,${0.6 - i * 0.15})`); glow.addColorStop(1, 'rgba(47,179,107,0)');
      g.fillStyle = glow; g.beginPath(); g.arc(x, y, 26, 0, Math.PI * 2); g.fill();
    }
  }
}

/** Each frame's camera (its matrix, field of view, focus), the phone's matrix, the place and the screens' pictures, at `fps`. */
window.plan = (fps) => {
  const frames = [];
  for (let f = 0; f < Math.round(window.LENGTH * fps); f++) {
    const s = f / fps;
    const c = pose(s);
    camera.updateMatrixWorld(true); phone.updateMatrixWorld(true);
    const ms = paneMs(s);
    frames.push({
      s, camera: camera.matrixWorld.toArray(), fov: camera.fov, focus: c.pos.distanceTo(c.at), blur: c.blur, phone: phone.matrixWorld.toArray(), train: c.onTrain,
      screens: Object.fromEntries(SCREENS.map((sc) => [sc.key, sc.key === 'phone'
        ? `frames/phone/${String(Math.min((COUNT.phone ?? 1) - 1, Math.floor((ms / 1000) * FPS))).padStart(5, '0')}.jpg`
        : `frames/screen-${sc.key}/${String(Math.min((COUNT[`screen-${sc.key}`] ?? 1) - 1, Math.floor(s * SCREEN_FPS))).padStart(5, '0')}.jpg`])),
      clock: ms > 20000 ? '8:41' : '8:40',
    });
  }
  return frames;
};

/** The room as glTF, for Cycles: the machines, the desk, the room; not the lines, the lights or what is only drawn here. */
window.exportGlb = async () => {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  pose(0);
  const keep = [laptop, studio, mini, win, tower, plant, ssh, phone, desk, wall, floor, ...scene.children.filter((o) => o.isMesh && o.geometry?.type === 'BoxGeometry')];
  const root = new THREE.Scene();
  for (const o of keep) root.add(o.clone());
  // The screens' pictures are Cycles' to put on: empty here.
  root.traverse((o) => { if (o.isMesh && /^screen_/.test(o.material?.name ?? '')) o.material = new THREE.MeshStandardMaterial({ name: o.material.name, color: 0x000000, roughness: 0.3 }); });
  const glb = await new GLTFExporter().parseAsync(root, { binary: true, onlyVisible: true, maxTextureSize: 4096 });
  const bytes = new Uint8Array(glb);
  const CHUNK = 4 << 20;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    let b = ''; const part = bytes.subarray(i, i + CHUNK);
    for (let j = 0; j < part.length; j += 0x8000) b += String.fromCharCode(...part.subarray(j, j + 0x8000));
    await window.saveChunk(btoa(b));
  }
  return bytes.length;
};

/** The phone's picture as it shows with its status bar (a JPEG, as a data URL): for Cycles. */
window.phoneBar = async (src, clock) => {
  const sc = phone.userData.screen;
  delete shown.phone;
  await show(sc, src, clock);
  return phoneCanvas.toDataURL('image/jpeg', 0.92);
};
window.LENGTH = 38;
window.render = async (s) => {
  // What the screens show now.
  const f = Math.floor(s * SCREEN_FPS);
  const waits = [];
  for (const sc of OVERLAY ? [] : SCREENS) {
    if (sc.key === 'phone') {
      const n = COUNT.phone ?? 1;
      waits.push(show(sc, `frames/phone/${String(Math.min(n - 1, Math.floor((paneMs(s) / 1000) * FPS))).padStart(5, '0')}.jpg`, paneMs(s) > 20000 ? '8:41' : '8:40'));
    } else {
      const n = COUNT[`screen-${sc.key}`] ?? 1;
      waits.push(show(sc, `frames/screen-${sc.key}/${String(Math.min(n - 1, f)).padStart(5, '0')}.jpg`));
    }
  }
  await Promise.all(waits);
  // The machine room's lights; the city going by.
  for (const { led, i, j } of cloud.userData.leds) led.material.color.setHex(Math.floor(s * 9 + i * 5 + j * 3) % 5 === 0 ? 0x15301f : j === 2 ? 0x3aa0ff : 0x2fb36b);
  // The work going out (all at once) and the answers coming back.
  for (const [key, r] of Object.entries(routes)) {
    const back = BACK[key];
    // Bright while something goes along it, faint between.
    const busy = Math.max(1 - clamp(Math.abs(s - (SENT + 0.5)) / 1.0), 1 - clamp(Math.abs(s - (back + 0.55)) / 1.0));
    r.tube.material.opacity = (0.18 + 0.6 * busy) * clamp((s - SENT) / 0.3) * (1 - clamp((s - 22.4) / 0.5));
    const going = s >= SENT && s < SENT + 1.0, coming = s >= back && s < back + 1.1;
    r.pulses.forEach((p, i) => {
      const lag = i * 0.07;
      const t = going ? ease(clamp((s - SENT) / 1.0 - lag)) : coming ? 1 - ease(clamp((s - back) / 1.1 - lag)) : null;
      p.visible = t !== null && t > 0 && t < 1;
      if (p.visible) { p.position.copy(r.curve.getPointAt(t)); p.material.opacity = 1 - i * 0.28; }
    });
  }
  const c = pose(s);
  scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);
  if (!OVERLAY) composer.render();
  else drawLines(s);
  // Over the picture: where each machine is, the words, the clock, a finger on the phone.
  const tagsOn = s >= 10.4 && s < 22.4 ? Math.min(clamp((s - 10.4) / 0.5), clamp((22.4 - s) / 0.4)) : 0;
  for (const [k, [g, off]] of Object.entries(TAG_AT)) {
    const v = off.clone(); g.localToWorld(v); v.project(camera);
    const el = tagEls[k];
    el.style.left = `${(v.x + 1) / 2 * W}px`; el.style.top = `${(1 - v.y) / 2 * H}px`;
    el.style.opacity = String(tagsOn);
  }
  const capNow = CAPTIONS.find(([a, b]) => s >= a && s < b);
  if (capNow) {
    const [a, b, h2, sub] = capNow;
    capH.textContent = h2; capP.textContent = sub;
    const o = Math.min(clamp((s - a) / 0.4), clamp((b - s) / 0.4));
    cap.style.opacity = String(o); cap.style.transform = `translateY(${(1 - o) * -12}px)`;
  } else cap.style.opacity = '0';
  const minutes = s < 9.4 ? 40 : Math.min(53, 41 + Math.floor((s - 9.4) / (22.2 - 9.4) * 12));
  clockText.textContent = `8:${minutes}`;
  clockEl.style.opacity = String(s >= 10.4 && s < 22.4 ? Math.min(clamp((s - 10.4) / 0.4), clamp((22.4 - s) / 0.4)) : 0);
  // A finger's tap, where it lands on the phone's screen.
  const ms = paneMs(s);
  const tap = (s < 6 || (s >= 22.6 && s < 31.4)) ? TAPS.findLast((t) => ms >= t.t && ms < t.t + 450) : null;
  if (tap) {
    const v = V((tap.x / 390 - 0.5) * 0.0672, (0.5 - tap.y / 844) * 0.1455, 0.006); phone.localToWorld(v); v.project(camera);
    tapEl.style.left = `${(v.x + 1) / 2 * W}px`; tapEl.style.top = `${(1 - v.y) / 2 * H}px`;
    const k = (ms - tap.t) / 450; tapEl.style.opacity = String(1 - k); tapEl.style.transform = `scale(${0.8 + 0.4 * k})`;
  } else tapEl.style.opacity = '0';
  // Cuts: a moment of black between places; the end, the line.
  const cut = (at) => 1 - clamp(Math.abs(s - at) / 0.18);
  fade.style.opacity = String(Math.max(cut(6.0), cut(22.6), cut(31.4), 1 - clamp(s / 0.3)));
  const e = clamp((s - 34.0) / 0.9);
  end.style.opacity = String(ease(e) * (1 - clamp((s - 37.2) / 0.8)));
};
await window.render(0);
window.ready = true;
</script>
</body>
</html>
