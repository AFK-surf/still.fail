<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- What each machine's screen shows as the film goes (920 × 575, drawn at twice that): ?screen=home|studio|win|cloud,
     then draw(seconds). record.mjs films each into frames/screen-<name>/, which the room puts on the machines' glass.
     Each desktop as its system draws it (macOS's menu bar and windows, Windows 11's taskbar, a tmux over ssh), the
     work in the tools people use for it (an editor, a terminal, the Android emulator, an installer), and still.fail
     itself in a window of its own: the real app, as filmed (frames/<pane>/, record.mjs panes). The three machines work
     at once: the Mac at home sends them their work in one go (9.4 s); each answers when done, the cloud first. -->
<link rel="stylesheet" href="vendor/node_modules/@vscode/codicons/dist/codicon.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 920px; height: 575px; overflow: hidden; background: #000; }
  body { font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; color: #17181b; -webkit-font-smoothing: antialiased; }
  #screen { position: absolute; inset: 0; overflow: hidden; }
  .mono { font-family: "SF Mono", Menlo, monospace; }
  .abs { position: absolute; }
  .wall { position: absolute; inset: 0; background-size: cover; }
  /* macOS */
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; align-items: center; gap: 15px; padding: 0 12px; font-size: 11.5px; color: #fff; background: rgba(30,30,40,.28); backdrop-filter: blur(30px) saturate(1.6); text-shadow: 0 0 1px rgba(0,0,0,.2); }
  .menubar b { font-weight: 700; }
  .menubar .r { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .mwin { position: absolute; border-radius: 9px; overflow: hidden; box-shadow: 0 18px 50px -8px rgba(0,0,0,.55), 0 0 0 .5px rgba(0,0,0,.5), inset 0 0 0 .5px rgba(255,255,255,.18); }
  .lights { display: flex; gap: 7px; }
  .lights i { width: 11px; height: 11px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
  .dock { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); height: 44px; padding: 5px 8px; display: flex; gap: 6px; border-radius: 15px; background: rgba(255,255,255,.22); backdrop-filter: blur(24px) saturate(1.6); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35); }
  .dock i { width: 34px; height: 34px; border-radius: 9px; display: block; }
  /* VS Code */
  .vsc { background: #1f1f1f; color: #cccccc; font-size: 11px; }
  .vsc .title { height: 30px; background: #181818; display: flex; align-items: center; padding: 0 10px; border-bottom: 1px solid #2b2b2b; }
  .vsc .search { margin: 0 auto; width: 260px; height: 20px; border-radius: 5px; background: #2a2a2a; border: 1px solid #3c3c3c; display: flex; align-items: center; justify-content: center; gap: 6px; color: #9d9d9d; font-size: 11px; }
  .vsc .act { position: absolute; left: 0; top: 30px; bottom: 22px; width: 38px; background: #181818; border-right: 1px solid #2b2b2b; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 10px; color: #858585; font-size: 20px; }
  .vsc .act .on { color: #d7d7d7; box-shadow: -10px 0 0 -8px #0078d4; }
  .vsc .side { position: absolute; left: 38px; top: 30px; bottom: 22px; width: 150px; background: #181818; border-right: 1px solid #2b2b2b; font-size: 11px; }
  .vsc .side .h { height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 10px; letter-spacing: .5px; color: #9d9d9d; }
  .vsc .side .row { height: 20px; display: flex; align-items: center; gap: 5px; white-space: pre; color: #cccccc; }
  .vsc .side .row.sel { background: #37373d; }
  .vsc .tabs { position: absolute; left: 188px; right: 0; top: 30px; height: 30px; background: #181818; display: flex; border-bottom: 1px solid #2b2b2b; }
  .vsc .tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 11px; color: #9d9d9d; border-right: 1px solid #2b2b2b; }
  .vsc .tab.on { background: #1f1f1f; color: #fff; box-shadow: inset 0 1px 0 #0078d4; }
  .vsc .crumbs { position: absolute; left: 188px; right: 0; top: 60px; height: 20px; display: flex; align-items: center; gap: 4px; padding-left: 12px; color: #a9a9a9; font-size: 11px; }
  .vsc .code { position: absolute; left: 188px; top: 82px; right: 70px; font-family: "SF Mono", Menlo, monospace; font-size: 12.5px; line-height: 19px; }
  .vsc .ln { display: inline-block; width: 40px; text-align: right; padding-right: 16px; color: #6e7681; }
  .vsc .mini { position: absolute; right: 10px; top: 84px; width: 50px; }
  .vsc .mini i { display: block; height: 2px; margin-bottom: 2px; border-radius: 1px; }
  .vsc .status { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #181818; border-top: 1px solid #2b2b2b; display: flex; align-items: center; gap: 12px; padding: 0 8px; font-size: 11px; color: #cccccc; }
  .vsc .status .remote { background: #0078d4; color: #fff; height: 100%; display: flex; align-items: center; padding: 0 8px; margin-left: -8px; }
  .k { color: #9cdcfe; } .p { color: #d7ba7d; } .v { color: #ce9178; } .n { color: #b5cea8; } .s { color: #ce9178; } .c { color: #6a9955; } .pu { color: #c586c0; } .cl { color: #4ec9b0; }
  .del { background: rgba(255,0,0,.18); } .del .ln { color: #f85149; }
  .add { background: rgba(35,134,54,.28); } .add .ln { color: #3fb950; }
  /* still.fail's own window */
  .sfwin img { display: block; width: 100%; }
  /* Terminal */
  .term { font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; line-height: 17px; color: #e6e6e6; white-space: pre; }
  .term .g { color: #4ec95b; } .term .d { color: #8b8b8b; } .term .y { color: #e5c07b; } .term .c { color: #6cb6ff; } .term .b { font-weight: 700; } .term .r { color: #ff7b72; }
  /* Windows 11 */
  .w11 { position: absolute; border-radius: 8px; overflow: hidden; box-shadow: 0 24px 60px -10px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.35); }
  .w11 .tb { height: 30px; display: flex; align-items: center; font-size: 11.5px; padding-left: 12px; }
  .w11 .ctl { margin-left: auto; display: flex; height: 100%; }
  .w11 .ctl span { width: 42px; display: flex; align-items: center; justify-content: center; font-family: "Segoe Fluent Icons", "SF Pro Text"; font-size: 11px; }
  .task { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: rgba(32,32,36,.82); backdrop-filter: blur(30px) saturate(1.4); border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .task i { width: 30px; height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
  .task .tray { position: absolute; right: 10px; top: 5px; text-align: right; font-size: 10.5px; line-height: 15px; color: #fff; display: flex; gap: 10px; align-items: center; }
  .login { display: flex; flex-direction: column; padding: 20px 16px; border-radius: 14px; }
  .login .lg { width: 30px; height: 30px; border-radius: 9px; background: #5b5bd6; margin-bottom: 12px; }
  .login h4 { font-size: 17px; margin-bottom: 3px; } .login small { font-size: 11px; opacity: .6; margin-bottom: 14px; }
  .login .f { height: 32px; border-radius: 8px; margin-bottom: 8px; font-size: 11px; display: flex; align-items: center; padding: 0 10px; opacity: .8; }
  .login .btn { height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 650; font-size: 13px; margin-top: 8px; }
  .flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
</style>
</head>
<body>
<div id="screen"></div>
<script type="module">
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const span = (s, a, b) => clamp((s - a) / (b - a));
const lines = (list, s) => list.filter(([t]) => s >= t).map(([, l]) => l).join('\n');

/** The film's moments (seconds). */
const T = { done: { cloud: 20.0, studio: 19.6, win: 21.6 } };
/** The clock as the film fast-forwards it: 8:40 as it opens, 8:53 when the last answer is in. */
function clock(s) { const m = s < 9.4 ? 40 + s / 9.4 : 41 + (s - 9.4) / (22.2 - 9.4) * 12; return `8:${String(Math.min(59, Math.floor(m))).padStart(2, '0')}`; }
function took(s, from) { const sec = Math.max(0, Math.round((s - from) * 56)); return `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, '0')}s`; }
/** still.fail's window: the app as filmed for this machine's chat (record.mjs panes), at this moment. */
const LEAD = 0.6, PANE_LAST = 2008;
function sf(pane, s) { const f = Math.min(PANE_LAST, 2 * Math.floor(Math.max(0, (s - LEAD) * 60) / 2)); return `frames/${pane}/${String(f).padStart(5, '0')}.jpg`; }
function loginCard(dark, fixed, w = 230) {
  const bg = dark ? '#1c1d21' : '#fff', fg = dark ? '#eceef2' : '#16181d', line = dark ? '#34353b' : '#dcdfe4';
  const btn = fixed ? 'background:#5b5bd6;color:#fff' : (dark ? 'background:#202124;color:#1a1a1a' : 'background:#e9e9ec;color:#e1e1e4');
  return `<div class="login" style="width:${w}px;background:${bg};color:${fg};box-shadow:0 1px 3px rgba(0,0,0,.1)"><div class="lg"></div><h4>登录 Acme</h4><small>欢迎回来</small>
    <div class="f" style="border:1px solid ${line}">you@acme.dev</div><div class="f" style="border:1px solid ${line}">••••••••••</div><div class="btn" style="${btn}">登录</div></div>`;
}
const MAC_WALL = 'background-image:url(assets/wall-mac.jpg);background-position:50% 55%;background-size:260% auto';
const WIN_WALL = 'background-image:url(assets/wall-win.jpg);background-position:35% 40%;background-size:240% auto';

function menubar(app, items, s, dark = false) {
  return `<div class="menubar"><span style="font-size:13px"></span><b>${app}</b>${items.map((i) => `<span>${i}</span>`).join('')}
    <span class="r"><i class="codicon codicon-radio-tower" style="font-size:12px"></i><i class="codicon codicon-search" style="font-size:12px"></i><span>10月28日 周三 ${clock(s)}</span></span></div>`;
}
const LIGHTS = '<span class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>';
function dock(running) {
  const apps = [['#1e88e5', 'Finder'], ['linear-gradient(#5ac8fa,#007aff)', ''], ['#2d2d2d', 'T'], ['#23a3f1', 'C'], ['#3ddc84', 'A'], ['#f2f2f2', 'S']];
  return `<div class="dock">${apps.map(([c], i) => `<i style="background:${c};${running.includes(i) ? 'box-shadow:0 6px 0 -4px rgba(255,255,255,.9)' : ''}"></i>`).join('')}</div>`;
}
/** still.fail's window on a Mac. */
function sfMac(pane, s, x, y, w) {
  return `<div class="mwin sfwin" style="left:${x}px;top:${y}px;width:${w}px;background:#f6f5f2">
    <div style="height:22px;display:flex;align-items:center;padding:0 9px;background:#f0efec;border-bottom:1px solid #e2e0dc">${LIGHTS}<span style="margin:0 auto;font-size:11px;color:#555;font-weight:600">still.fail</span></div>
    <img src="${sf(pane, s)}"></div>`;
}

// ---- The Mac at home: VS Code with the change, still.fail beside it ----
function home(s) {
  const edited = s >= 8.2, found = s >= 6.7 && s < 8.2;
  const rows = [
    ['<span class="c">/* 登录页 */</span>'],
    ['<span class="p">.login</span> {'],
    ['  <span class="k">display</span>: <span class="v">grid</span>;'],
    ['  <span class="k">gap</span>: <span class="n">12px</span>;'],
    ['}'],
    [''],
    [`<span class="p" style="${found ? 'background:rgba(234,179,8,.35);outline:1px solid #e5b800' : ''}">.submit</span> {`],
    ['  <span class="k">height</span>: <span class="n">46px</span>;'],
    ['  <span class="k">border-radius</span>: <span class="n">10px</span>;'],
    ['  <span class="k">color</span>: <span class="n">#1a1a1a</span>;', edited ? 'del' : ''],
    ['  <span class="k">background</span>: <span class="n">#202124</span>;', edited ? 'del' : ''],
    ...(edited ? [['  <span class="k">color</span>: <span class="cl">var</span>(<span class="k">--on-primary</span>);', 'add'], ['  <span class="k">background</span>: <span class="cl">var</span>(<span class="k">--primary</span>);', 'add']] : []),
    ['  <span class="k">font-weight</span>: <span class="n">600</span>;'],
    ['}'],
    [''],
    ['<span class="pu">@media</span> (<span class="k">prefers-color-scheme</span>: <span class="v">dark</span>) {'],
    ['  <span class="p">.login</span> { <span class="k">background</span>: <span class="n">#121316</span>; }'],
    ['}'],
  ];
  const code = rows.map(([h, cls], i) => `<div class="${cls ?? ''}" style="white-space:pre"><span class="ln">${i + 14}</span>${h}</div>`).join('');
  const mini = rows.map(([, cls], i) => `<i style="width:${20 + ((i * 37) % 28)}px;background:${cls === 'add' ? '#3fb950' : cls === 'del' ? '#f85149' : '#5a5a5a'};opacity:.8"></i>`).join('');
  const tree = [['chevron-down', 'src', 0], ['chevron-down', 'auth', 1], ['file', 'LoginForm.tsx', 2], ['file', 'login.css', 2, true], ['chevron-right', 'pages', 1], ['chevron-right', 'theme', 1], ['file', 'package.json', 0]]
    .map(([ic, n, d, sel]) => `<div class="row ${sel ? 'sel' : ''}" style="padding-left:${8 + d * 10}px"><i class="codicon codicon-${ic}" style="font-size:12px;color:${ic === 'file' ? '#519aba' : '#c5c5c5'}"></i>${n}${sel && edited ? '<span style="margin-left:auto;margin-right:8px;color:#e2c08d">M</span>' : ''}</div>`).join('');
  return `<div class="wall" style="${MAC_WALL}"></div>${menubar('Code', ['文件', '编辑', '选择', '查看', '转到', '运行', '终端', '窗口'], s)}
    <div class="mwin vsc" style="left:10px;top:30px;width:560px;height:488px">
      <div class="title">${LIGHTS}<div class="search"><i class="codicon codicon-search" style="font-size:11px"></i>acme</div></div>
      <div class="act"><i class="codicon codicon-files on"></i><i class="codicon codicon-search"></i><i class="codicon codicon-source-control"></i><i class="codicon codicon-debug-alt"></i><i class="codicon codicon-extensions"></i></div>
      <div class="side"><div class="h">资源管理器</div>${tree}</div>
      <div class="tabs"><div class="tab on"><span style="color:#519aba">#</span>login.css${edited ? ' <span style="color:#e2c08d">●</span>' : ''}</div><div class="tab"><span style="color:#519aba">⚛</span>LoginForm.tsx</div></div>
      <div class="crumbs">src <i class="codicon codicon-chevron-right" style="font-size:10px"></i> auth <i class="codicon codicon-chevron-right" style="font-size:10px"></i> <span style="color:#519aba">#</span> login.css <i class="codicon codicon-chevron-right" style="font-size:10px"></i> .submit</div>
      <div class="code">${code}</div><div class="mini">${mini}</div>
      <div class="status"><span class="remote"><i class="codicon codicon-remote" style="font-size:12px"></i></span><i class="codicon codicon-git-branch" style="font-size:12px"></i>fix/login-button${edited ? '*' : ''}<i class="codicon codicon-sync" style="font-size:12px"></i>
        <span style="margin-left:auto">行 ${edited ? 24 : 20}，列 3</span><span>空格: 2</span><span>UTF-8</span><span>CSS</span><i class="codicon codicon-bell" style="font-size:12px"></i></div></div>
    ${sfMac('home', s, 580, 30, 330)}
`;
}

// ---- Studio: a terminal building the Android app, the emulator, still.fail ----
const STUDIO_TERM = [
  [9.9, '<span class="g">zuo@studio</span> <span class="c">~/acme</span> % git switch fix/login-button'], [10.4, "Switched to branch 'fix/login-button'"],
  [10.8, '<span class="g">zuo@studio</span> <span class="c">~/acme</span> % ./gradlew assembleDebug'], [11.1, '<span class="d">Starting a Gradle Daemon (subsequent builds will be faster)</span>'],
  [11.6, '<span class="d">&gt; Configure project :app</span>'], [12.1, '<span class="d">&gt; Task :app:preBuild UP-TO-DATE</span>'], [12.6, '<span class="d">&gt; Task :app:mergeDebugResources</span>'],
  [13.2, '<span class="d">&gt; Task :app:compileDebugKotlin</span>'], [14.2, '<span class="d">&gt; Task :app:dexBuilderDebug</span>'], [14.9, '<span class="d">&gt; Task :app:packageDebug</span>'],
  [15.4, ''], [15.4, '<span class="g b">BUILD SUCCESSFUL</span> in 3m 12s'], [15.45, '<span class="d">41 actionable tasks: 18 executed, 23 up-to-date</span>'],
  [15.8, '<span class="g">zuo@studio</span> <span class="c">~/acme</span> % adb install -r app/build/outputs/apk/debug/app-debug.apk'], [16.2, 'Performing Streamed Install'], [16.4, '<span class="g">Success</span>'],
  [16.9, '<span class="g">zuo@studio</span> <span class="c">~/acme</span> % adb exec-out screencap -p &gt; login.png'],
];
function studio(s) {
  const fixed = s >= 16.5;
  const building = s >= 10.8 && s < 15.4 ? span(s, 10.8, 15.4) : null;
  const flash = s >= 17.0 && s < 17.35 ? 1 - span(s, 17.0, 17.35) : 0;
  const bar = building !== null ? `\n<span class="y">&lt;${'='.repeat(Math.round(building * 18)).padEnd(18, '-')}&gt; ${Math.round(building * 100)}% EXECUTING [${took(s, 10.8)}]</span>\n<span class="d">&gt; :app:compileDebugKotlin</span>` : '';
  const term = lines(STUDIO_TERM, s).split('\n').slice(-17).join('\n');
  return `<div class="wall" style="${MAC_WALL}"></div>${menubar('终端', ['外壳', '编辑', '显示', '窗口', '帮助'], s)}
    <div class="mwin" style="left:10px;top:30px;width:410px;height:330px;background:#1e1e1e">
      <div style="height:26px;display:flex;align-items:center;padding:0 10px;background:#2b2b2b;border-bottom:1px solid #111">${LIGHTS}<span style="margin:0 auto;font-size:11px;color:#bbb">acme — gradle — 96×28</span></div>
      <div class="term" style="padding:8px 10px">${term}${bar}</div></div>
    <div class="mwin" style="left:430px;top:30px;width:170px;height:330px;background:#2b2d30">
      <div style="height:22px;display:flex;align-items:center;padding:0 8px;background:#2b2d30;color:#bbb;font-size:10px;gap:6px">${LIGHTS}<span style="margin-left:4px">Pixel 9 API 35</span></div>
      <div style="position:absolute;left:10px;top:30px;width:150px;height:292px;border-radius:20px;background:#0c0c0d;padding:6px">
        <div style="position:relative;width:100%;height:100%;border-radius:15px;overflow:hidden;background:#121316;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;top:5px;left:12px;right:12px;display:flex;font-size:8px;color:#ccc"><span>${clock(s)}</span><span style="margin-left:auto">▾▴ 86%</span></div>
          <div style="transform:scale(.6)">${loginCard(true, fixed, 200)}</div>
          <div style="position:absolute;bottom:5px;left:50%;width:56px;height:3px;margin-left:-28px;border-radius:2px;background:#ddd;opacity:.8"></div>
          <div class="flash" style="opacity:${flash}"></div></div></div></div>
    ${sfMac('studio', s, 610, 30, 300)}
`;
}

// ---- The Windows desktop: Windows Terminal building, the installer, the new version; still.fail ----
const WIN_TERM = [
  [9.9, '<span class="c">PS C:\\acme&gt;</span> git pull'], [10.3, 'Already up to date.'], [10.9, '<span class="c">PS C:\\acme&gt;</span> pnpm build:win'], [11.4, '<span class="d">&gt; acme@2.4.0 build:win</span>'],
  [11.8, '<span class="d">vite v7.2.1 building for production...</span>'], [12.9, '<span class="g">✓</span> 1284 modules transformed.'], [13.5, '<span class="d">dist/assets/index-4f2a9c.js</span>  812.41 kB'],
  [14.3, '  • electron-builder  version=26.0.12 os=10.0.26100'], [14.9, '  • packaging       platform=win32 arch=x64'], [15.6, '  • signing         file=dist\\Acme-Setup-2.4.0.exe'],
  [16.1, '  • building        target=nsis file=dist\\Acme-Setup-2.4.0.exe'], [16.3, '<span class="c">PS C:\\acme&gt;</span> .\\dist\\Acme-Setup-2.4.0.exe /S'],
];
function win(s) {
  const installing = s >= 16.4 && s < 17.7, app = s >= 17.8;
  const flash = s >= 18.4 && s < 18.75 ? 1 - span(s, 18.4, 18.75) : 0;
  const pop = app ? ease(span(s, 17.8, 18.1)) : 0;
  const ctl = (c = '#ddd') => `<span class="ctl" style="color:${c}"><span>—</span><span>☐</span><span>✕</span></span>`;
  return `<div class="wall" style="${WIN_WALL}"></div>
    <div class="w11" style="left:12px;top:12px;width:470px;height:400px;background:#0c0c0c">
      <div class="tb" style="background:#202020;color:#ddd;padding-left:0"><span style="height:100%;display:flex;align-items:center;gap:7px;padding:0 12px;background:#0c0c0c;font-size:11px"><i class="codicon codicon-terminal-powershell" style="font-size:12px;color:#5aa9ff"></i>Windows PowerShell</span><span style="padding:0 10px;color:#999">+ ⌄</span>${ctl()}</div>
      <div class="term" style="padding:8px 10px;color:#cccccc">${lines(WIN_TERM, s)}${s >= 10.9 && s < 16.2 ? '\n<span class="y">  • ' + '█'.repeat(Math.round(span(s, 10.9, 16.2) * 22)).padEnd(22, '░') + `</span> ${took(s, 10.9)}` : ''}</div></div>
    ${installing ? `<div class="w11" style="left:150px;top:150px;width:380px;height:170px;background:#f3f3f3">
      <div class="tb" style="background:#f3f3f3;color:#222">Acme 2.4.0 安装${ctl('#555')}</div>
      <div style="padding:10px 20px;font-size:12px;color:#222"><div style="font-weight:650;font-size:14px;margin-bottom:5px">正在安装</div><div style="font-size:11px;color:#666;margin-bottom:16px">正在解压文件到 C:\\Program Files\\Acme…</div>
      <div style="height:5px;border-radius:3px;background:#d6d6d6;overflow:hidden"><div style="height:100%;width:${Math.round(span(s, 16.4, 17.6) * 100)}%;background:#0067c0"></div></div></div></div>` : ''}
    ${app ? `<div class="w11" style="left:110px;top:40px;width:420px;height:400px;background:#f4f5f7;transform:scale(${0.95 + 0.05 * pop});opacity:${pop}">
      <div class="tb" style="background:#fff;color:#333;border-bottom:1px solid #e5e5e5">Acme${ctl('#555')}</div>
      <div style="position:absolute;top:30px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center">${loginCard(false, true, 230)}</div><div class="flash" style="opacity:${flash}"></div></div>` : ''}
    <div class="w11 sfwin" style="left:545px;top:12px;width:365px;background:#f6f5f2">
      <div class="tb" style="background:#f0efec;color:#333;border-bottom:1px solid #e2e0dc;font-weight:600">still.fail${ctl('#555')}</div><img src="${sf('win', s)}"></div>
    <div class="task"><span style="display:grid;grid-template-columns:9px 9px;gap:1.5px;margin-right:10px"><i style="width:9px;height:9px;background:#3aa0ff;border-radius:1px"></i><i style="width:9px;height:9px;background:#3aa0ff;border-radius:1px"></i><i style="width:9px;height:9px;background:#3aa0ff;border-radius:1px"></i><i style="width:9px;height:9px;background:#3aa0ff;border-radius:1px"></i></span>
      <span style="height:28px;width:150px;border-radius:14px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:6px;padding-left:10px;color:#ccc;font-size:11px"><i class="codicon codicon-search" style="font-size:12px"></i>搜索</span>
      <i class="codicon codicon-folder-opened" style="font-size:20px;color:#f6c343"></i><i class="codicon codicon-globe" style="font-size:20px;color:#3aa0ff"></i><i class="codicon codicon-terminal" style="font-size:19px;color:#e8e8e8;box-shadow:0 13px 0 -11px #5aa9ff"></i><i style="font-size:15px;font-weight:800;color:#17181b;background:#f6f5f2;border-radius:6px;width:24px;height:24px;margin:3px;box-shadow:0 10px 0 -8px #5aa9ff">sf</i>
      <span class="tray"><span>中</span><span>${clock(s)}<br>2026/10/28</span></span></div>`;
}

// ---- The cloud machine, over ssh, in tmux: its tests, one by one green; still.fail's agent in the status line ----
const TESTS = ['auth/login.test.ts (18)', 'auth/session.test.ts (24)', 'theme/colors.test.ts (12)', 'orders/export.test.ts (31)', 'orders/list.test.ts (27)',
  'api/client.test.ts (40)', 'pages/home.test.ts (22)', 'pages/settings.test.ts (19)', 'ui/button.test.ts (16)', 'ui/form.test.ts (21)', 'billing/plan.test.ts (33)', 'search/query.test.ts (49)'];
const PROMPT = '<span class="g">ci@cloud-01</span>:<span class="c">~/acme</span>$';
function cloud(s) {
  const out = [[9.9, `${PROMPT} pnpm install --frozen-lockfile`], [10.6, '<span class="d">Lockfile is up to date, resolution step is skipped</span>'], [10.9, 'Packages: <span class="g">+1182</span>'], [11.2, 'Done in 6.2s'], [11.4, `${PROMPT} pnpm test`], [11.6, ''], [11.6, ' <span class="b" style="background:#2b8a3e;color:#fff"> RUN </span> <span class="c">v3.2.4</span> /home/ci/acme'], [11.7, '']];
  const per = (17.4 - 11.8) / TESTS.length;
  TESTS.forEach((t, i) => out.push([11.8 + i * per, ` <span class="g">✓</span> ${t} <span class="d">${(0.4 + ((i * 37) % 23) / 10).toFixed(1)}s</span>`]));
  const done = TESTS.filter((_, i) => s >= 11.8 + i * per).length;
  out.push([17.5, ''], [17.5, ' <span class="d">Test Files</span>  <span class="g b">41 passed</span> (41)'], [17.55, '      <span class="d">Tests</span>  <span class="g b">312 passed</span> (312)'], [17.6, '   <span class="d">Duration</span>  4m 11s'],
    [18.0, `${PROMPT} pnpm e2e login`], [18.6, '<span class="d">Running 24 tests using 4 workers</span>'], [18.8, '  <span class="g b">24 passed</span> (2 browsers)']);
  const text = lines(out, s).split('\n').slice(-25).join('\n');
  const doing = s < 9.6 ? '空闲' : s < 11.4 ? 'pnpm install' : s < 18.0 ? `pnpm test ${Math.round(done / TESTS.length * 312)}/312` : s < 19.0 ? 'pnpm e2e login' : s < T.done.cloud ? '写回复' : '已回复 Acme App';
  return `<div style="position:absolute;inset:0;background:#101216">
    <div class="term" style="padding:8px 12px;font-size:12px;line-height:18px">${text}</div>
    <div class="term" style="position:absolute;left:0;right:0;bottom:0;height:18px;background:#2f9e44;color:#0b1f10;padding:0 8px;display:flex;gap:14px;font-size:11.5px;line-height:18px">
      <span class="b">[acme]</span><span>0:zsh*</span><span style="background:#1b5e2a;color:#e8ffe8;padding:0 6px">still.fail · 跑全部测试 · ${doing}</span><span style="margin-left:auto">cloud-01  ${clock(s)} 28-Oct-26</span></div></div>`;
}

const SCREENS = { home, studio, win, cloud };
const name = new URLSearchParams(location.search).get('screen') ?? 'home';
const el = document.getElementById('screen');
window.draw = async (s) => {
  el.innerHTML = SCREENS[name](s);
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
};
await window.draw(0);
</script>
