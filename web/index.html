<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- The appearance chosen (src/theme.ts) before the first paint: a page that paints light and then turns dark blinks. -->
  <script>try{var a=localStorage.getItem("ember.appearance");if(a==="light"||a==="dark")document.documentElement.dataset.theme=a}catch(e){}</script>
  <!-- In the desktop app (its preload gives emberDesktop) the window has no title bar: the page's top row is it (app.css). -->
  <script>if("emberDesktop"in window)document.documentElement.dataset.desktop="";try{if(localStorage.getItem("ember.sidebar")==="closed")document.documentElement.dataset.sidebar="closed"}catch(e){}</script>
  <title>ember</title>
  <meta name="description" content="ember — 一直在干活的编码 agent">
  <!-- 以 / 开头的 public 文件，Vite 会按 base 补成 /admin/… 或 /… -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F2023" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ember">
  <meta property="og:title" content="ember">
  <meta property="og:description" content="ember — 一直在干活的编码 agent">
  <meta property="og:image" content="https://ember.3720.org/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ember 的 station 小伙伴 — 一直在干活的编码 agent">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <!-- The splash (src/ui.tsx, Splash) as the first paint, before any script: the app replaces it when it draws. -->
  <div id="app"><div class="splash" role="status"><img class="splash-mark" id="splash-mark" src="/mark.svg" width="56" height="56" alt=""></div></div>
  <script>try{var t=document.documentElement.dataset.theme;if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.getElementById("splash-mark").src=document.getElementById("splash-mark").src.replace(/mark\.svg$/,"mark-dark.svg")}catch(e){}</script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
