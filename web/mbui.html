<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>still.fail</title>
  <meta name="description" content="still.fail — 把你的机器连到任何地方">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F2023" media="(prefers-color-scheme: dark)">
  <!-- every page of the app's answers with this one (it is the built index.html: vite.config.ts): a link to any of them
       shown as the app's -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="still.fail">
  <meta property="og:title" content="still.fail">
  <meta property="og:description" content="still.fail — 把你的机器连到任何地方">
  <meta property="og:image" content="https://app.still.fail/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="still.fail · One devices.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- still.fail's app as every device runs it (apps/mbui), drawn by mbui's web host: src/mbui/core.ts -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F5F3EF; }
    @media (prefers-color-scheme: dark) { html, body { background: #1F2023; } }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    /* receives the input method; sits at the caret, invisible */
    #ime { position: fixed; left: 0; top: 0; width: 2px; height: 20px; opacity: 0; padding: 0; border: 0;
           resize: none; overflow: hidden; font-size: 16px; caret-color: transparent; color: transparent;
           background: transparent; outline: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <textarea id="ime" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
  <script type="module" src="/src/mbui/core.ts"></script>
</body>
</html>
