<svg xmlns="http://www.w3.org/2000/svg" width="200" height="144" viewBox="0 0 200 144" fill="none" aria-hidden="true">
  <!-- Files over a chat (ChatPage.tsx): the station's buddy, arms up, about to catch one. Drawn by Astra. -->
  <style>
    .sf-drop-file { animation: sf-drop-hover 3.6s ease-in-out infinite; }
    .sf-drop-eyes { transform-origin: 103px 90px; animation: sf-drop-blink 6.4s linear infinite; }
    @keyframes sf-drop-hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    @keyframes sf-drop-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.12); } }
    @media (prefers-reduced-motion: reduce) { .sf-drop-file, .sf-drop-eyes { animation: none; } }
  </style>
  <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- The arms are a single, wide catching gesture. -->
    <path d="M68 100C51 99 40 82 40 64M135 100C153 97 164 80 164 61"/>
    <path d="M33 60L35 66Q40 73 46 65L49 60M157 58L159 64Q164 71 170 63L173 57"/>
    <path d="M79 120L76 128H88M119 120L123 128H135" stroke-width="3"/>
    <!-- Slightly lopsided shell, inherited from the existing station character. -->
    <path d="M66 88C66 73 78 66 99 66C121 66 135 74 136 89L138 108C139 119 124 124 102 124C80 124 64 119 64 109Z"/>
    <path d="M83 68L80 57"/>
  </g>
  <circle cx="79" cy="54" r="3.5" fill="var(--accent)"/>
  <path d="M74 88C74 79 84 75 100 75C117 75 128 80 128 89V99C128 106 116 110 101 110C85 110 73 106 73 99Z" fill="var(--accent)" fill-opacity=".12" stroke="var(--accent)" stroke-width="2"/>
  <g class="sf-drop-eyes" fill="currentColor">
    <rect x="88" y="85" width="4" height="7" rx="2"/>
    <rect x="112" y="83" width="4" height="7" rx="2"/>
  </g>
  <path d="M98 98Q103 101 108 97M94 117H108" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Held in anticipation: nothing disappears or implies an upload has started. -->
  <g class="sf-drop-file">
    <g transform="rotate(12 113 32)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M98 12H118L130 24V49Q130 52 127 52H98Q95 52 95 49V15Q95 12 98 12Z" stroke="currentColor" stroke-width="2"/>
      <path d="M118 12V24H130" stroke="currentColor" stroke-width="2"/>
      <path d="M105 31L101 35L105 39M119 31L123 35L119 39M114 30L110 40" stroke="var(--accent)" stroke-width="1.8"/>
    </g>
  </g>
  <path d="M59 37L63 42M151 32L147 38" stroke="currentColor" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M83 136H119" stroke="currentColor" stroke-opacity=".12" stroke-width="2" stroke-linecap="round"/>
</svg>
